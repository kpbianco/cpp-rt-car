acceptance:
  - The implementation begins from an initially clean target at exact default-branch commit `2821f90fb09dc86820b879bb47a39d8165ff0e0f`, the merged M21-04 pull request 245. Retained M15 through M21-04 evidence is present and unchanged, governance records M21-04 as merged, and no absent review, physical, RT, replay, release, deployment, or production result is invented.
  - Mixed-rate closure is an additive C++ configuring-only policy copied and frozen before finalization. It has explicit bounded capacities and byte limits for the new action stream and active-replay transcript, a nonzero host policy/schema identity, a closed overflow policy, and an explicit requirement that every replayed device backend report the existing deterministic-mock capability. Observational action capacity may be zero with exact drops; replay capacities are positive whenever active replay is enabled. It contains no dynamic string, raw address, callback, vendor handle, file path, implicit timing source, or unbounded history.
  - Existing checkpoint schema 1, input-log schema 1, rate-action schema 1, global observability schema 2, their constants, magic values, record layouts, parser behavior, C ABI operations, and byte-for-byte legacy artifacts remain unchanged. Existing `Runtime::replay()` retains its non-active behavior and active-plan rejection. M21-05 uses a distinct additive C++ mixed-rate action schema 1 and active-replay artifact schema 1 rather than repurposing reserved bytes or silently changing an existing version.
  - >-
    Each fixed mixed-rate action record carries schema/record size, monotonic record sequence, runtime and host-policy identity, frame, rate domain/phase/release sequence/substep, logical and nominal release, action/reason/stage, optional/late/shed/degradation/watchdog state, backend/batch/timeline/completion generation, terminal status, timestamp-domain/timestamp, payload and sampled-frame content identity, sampled freshness/held/substitution/safety state, and exact before/after shedding state where applicable. Closed numeric tables and zero reserved fields reject future, foreign, partial, contradictory, or uncorrelated records.
  - Action publication is generation safe and follows execution ownership. A device release emits no terminal-success record at submission; exactly one terminal action becomes visible only after correlated completion, timeout/cancel/loss/quarantine, declared skip/hold/shed, or safe-state acknowledgement is settled. Late completion cannot rewrite a terminal record. Sampled payload bytes, raw addresses, application signal values, callback pointers, vendor handles, and wall-clock thread identities are never emitted by default.
  - The new action ring is fixed at finalization and uses direct runtime-bound cursors with exact gap reporting. Capacity zero deterministically drops while reserving sequence; busy slots drop; committed replacement overwrites with exact counters. A slow or malformed reader cannot block, reorder, or change execution. Telemetry loss is explicit and makes a transcript ineligible for replay rather than silently producing incomplete replay evidence.
  - Optional device domains participate in the exact existing M16 shedding/recovery order and hysteresis. A shed or late-skipped device release invokes no provider or backend, claims no execution slot, publishes no payload, and emits one exact action tied to the corresponding rate-action identity. Recovery affects only the next total-order release. Mandatory device releases are never silently skipped, and supported non-CPU records are not rejected merely because their phase is device-owned.
  - Device overload is closed at zero, exact, and one-over backend, Runtime outstanding, phase in-flight, completion-ticket, dispatch-record, sampled-ring, and action-ring capacities. It follows only the declared reject, skip, hold, shed, degrade, timeout, cancel, quarantine, safe-output, or fail behavior. It never spills to heap storage, executes a vendor call on an executor, steals another backend's slot, overwrites owned bytes, converts mandatory work to optional, or depends on completion arrival order.
  - Watchdog and degradation closure records the exact step/release action and before/after level without treating elapsed hosted-CI timing as deterministic input. Normal active replay consumes the recorded logical decision/action transcript and suppresses live watchdog timing as an execution decision; it validates and reproduces the recorded watchdog/degradation transition. Malformed, impossible, out-of-policy, or over-maximum levels reject before state mutation.
  - A conditional quiescent mixed-rate checkpoint state is appended as one ordinary schema-1 checkpoint state record only when the M21-05 policy is enabled. It captures the canonical active cursor, device/sampled publication correlation, next generation/sequence, sampled safety and selected freshness state, shedding streak/mask, degradation state, and replay-action position required to resume without ambiguity. It contains no in-flight vendor ownership, telemetry history, caller cursor, backend-private token, address, or wall-clock observation. Existing checkpoints without M21-05 remain byte exact.
  - Checkpoint export and active replay require a quiescent release boundary with no provider callback, active step, periodic run, submitted ticket, pending safe transition, cleanup-pending owner, or uncertain completion. Complete validation of every application, rate, mixed-rate, sampled, replay, identity, extent, checksum, reserved, and ordering field occurs before any registered state, cross-rate store, safety state, shedding state, or action cursor changes. Failure is transactional and retryable.
  - >-
    The new active-replay artifact is fixed-width little-endian and bounded by copied record/byte capacities and the existing 1 GiB absolute safety ceiling. It binds runtime/build/workload, determinism tier, graph/replay/state schema, M21-05 policy, checkpoint frame, first/last frame, nominal epoch, ordered input payloads, ordered rate/device/sampled/safe/watchdog actions, per-record content checksums, and a whole-artifact checksum. Parsers allocate nothing from encoded lengths, reject truncation/trailing bytes/overflow/gaps/duplicates/foreign identity before restore, and expose allocation-free inspection metadata.
  - Active replay accepts only a compatible quiescent checkpoint, a complete gap-free transcript, and device backends whose frozen existing capabilities report `deterministic_mock == 1`. It restores transactionally, invokes the input callback once per frame, drives the exact recorded nominal release and legal rate/device decisions without consulting completion arrival order or live watchdog time, re-executes the deterministic mock/loopback provider path, and compares every generated action, payload/frame digest, sampled metadata, safety transition, status, and final registered-state hash. The first mismatch fails closed with exact progress; earlier completed replay frames are not rolled back.
  - Non-deterministic or physical backends cannot enter active replay. Their fixed action records and payload/frame digests may be retained as explicitly recorded boundary evidence, but M21-05 does not infer deterministic physical input, regenerate physical samples, replay a vendor driver, or qualify a device. No default telemetry surface stores sampled payload bytes; any application input payload supplied to the bounded replay artifact remains caller-owned explicit replay data under the existing trust boundary.
  - Terminal error, submission rejection, timeout, cancellation, loss, late quarantine, skipped/shed work, sampled stale/underrun/overrun, callback failure, watchdog transition, safe-output failure, stop, and retryable cleanup each have one closed action result. No failed or uncertain action publishes a device input or success, no late completion mutates a recycled generation, and replay reproduces or rejects the same action rather than normalizing it to success.
  - The public loopback remains the portable deterministic backend and gains only bounded hooks needed to reset, inspect, and reproduce its declared logical action sequence. Fault injection identity is copied or explicitly supplied; it cannot depend on sleep timing, process state, a hidden thread, a global singleton, or mutable data shared between Runtime instances. Existing standalone HAL-v2 lifecycle behavior remains unchanged when M21-05 is disabled.
  - One reusable mixed-rate conformance fixture uses only public installed-package surfaces and runs CPU plant, device sensor loopback, CPU controller, and device actuator across at least three distinct harmonic and non-harmonic rates. It covers first cycle, steady state, supercycle/wrap, equal-time ordering, sample-and-hold age, optional device shedding/recovery, backpressure, watchdog/degradation, timeout/cancel/loss/quarantine, stale/under/overrun, safe startup/failure/shutdown, checkpoint, replay, reset/restart, and final state/action/payload identity.
  - The conformance fixture is table-driven and reusable by the repository tests and an installed relocated consumer without private headers or repository-only data. It uses a manual logical clock and bounded deterministic fault script, not network, subprocess, filesystem transport, sleep-based timing, physical hardware, vendor SDKs, or controlled-host thresholds. Every scenario states whether it is static, unit, simulated-protocol, package, sanitizer, or manual evidence.
  - Sequence, generation, action, artifact, and slot exhaustion fail before zero, wrap, or reuse can become ambiguous. Safe-state work remains isolated from active generations. A producer cannot overwrite backend/consumer-owned bytes; retirement occurs only after exact terminal completion and all compiled consumers settle. Two Runtime/loopback/conformance instances share no mutable global state and may execute concurrently under ThreadSanitizer.
  - Action emission, action comparison, replay-decision selection, checkpoint synchronization, sampled selection, payload digesting, slot claim/retirement, watchdog/degradation application, and conformance execution use checked integer arithmetic and bounded direct-index work. Running paths allocate no ordinary heap, take no blocking mutex, perform no file/network I/O, create no thread, scan no full configuring registry, wait for no unbounded operation, retry no unbounded sequence, and invoke no vendor function on executor/host lanes.
  - Failed finalization or startup publishes no partial M21-05 policy, action ring, replay state, device release, sampled payload, or safety claim and remains retryable through existing replacement/cleanup rules. Successful finalization counts policy copies, action controls/slots/counters, replay/checkpoint state, digest staging, conformance/runtime controls, and retention exactly once in existing `MemoryPlan` categories and `planned_bytes`; caller artifacts, borrowed registered buffers, backend-private bytes, and telemetry output buffers are not double-counted.
  - Graph/config/replay identity includes every semantic M21-05 policy version, legal action table, deterministic-backend requirement, checkpoint state shape, transcript format, device/sampled descriptor, safe-state rule, and replay decision rule that can change execution. It excludes action-ring capacity when observational only, caller cursor position, post-configuration payload bytes, raw addresses, callback pointers, wall-clock measurements, thread IDs, completion arrival order, and fault timing. Equivalent registration order canonicalizes as already contracted.
  - Existing reference-only and CPU-only M16 plans, rate-action schema-1 telemetry, ordinary M17/HAL-v2 backends, adapted device-ABI-v1 backends, M21-02 channel-free dispatch, M21-03 non-sampled payloads, M21-04 sampled loopback without closure enabled, checkpoint/input-log schema-1 artifacts, legacy replay, CUDA/XDMA candidates, package consumers, repeated start/checked-stop, and two Runtime instances retain prior behavior and byte-compatible artifacts.
  - M21-05 closes CAP-M21's portable software semantics only. It adds no vendor DAC/DAQ/CAN/IIO adapter, physical trigger/sample-clock or electrical scaling result, external-process CIL transport, benchmark threshold, CUDA physics, transactional live control, hot reload, golden demo, Unreal, support/qualification promotion, signing, publication, release, deployment, or production behavior. M18 remains the sole physical and RT qualification plane.
  - Stable C ABI v8 with exactly 70 exports and frozen fingerprint `0xd0e7a5a14bf35f97`, SONAME 8, device ABI v1, extension ABI v1, HAL core v2 and extension-v1 tables, Runtime status numeric values, runtime-profile schema 7 and 25 keys, checkpoint/input-log/rate-action/observability schemas, release 1.2.1, installed target/header/alias inventory, support matrices, qualification state, and Apache-2.0 remain unchanged. No new installed header is required; additive C++ types remain in the existing runtime/loopback headers.
  - Target governance, current state, handoff, replay/rate/sampled/device/observability documentation, release digest ledger, and retained `docs/evidence/M21-05-<date>.md` state exact implementation and evidence. Focused and full local verification, mandatory hosted CI, and human ownership, replay-transactionality, concurrency, boundedness, compatibility, and claim review pass before merge. M21 and CAP-M21 may be marked software-complete only after this batch merges; physical and RT gates remain explicitly incomplete.
