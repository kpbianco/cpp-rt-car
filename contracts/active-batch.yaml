    - cmake --build build/agent-full --parallel 2
    - ./build/agent-full/tests/simcore_tests --gtest_filter='LiveControlMailbox.*:HostRuntime.*LiveControl*:RateDispatch.*LiveControl*:ActiveMixedRate.*LiveControl*:MemoryPlan.*LiveControl*:Determinism.*LiveControl*:DeterminismReplay.*LiveControl*:MultipleInstances.*LiveControl*:TraceNoAlloc.*LiveControl*:PeriodicRuntime.*LiveControl*'
    - ctest --test-dir build/agent-full --output-on-failure -R 'm22_live_control_mailbox|package_consumer'
    - ./scripts/agent-verify.sh full
    - python3 tools/check_c_abi.py --library build/agent-full/librtfw.so
    - readelf -d build/agent-full/librtfw.so | rg 'SONAME.*librtfw.so.8'
    - git diff --check
    - git diff --name-only 201decf9384220d713ff90f7eb12ac3ecc4ebc49
  focused_tests_to_add:
    - exact host-frame closure before callbacks and exact active CPU/device rate-release closure before dispatch, including zero-record boundaries, future targets, substeps, simultaneous releases, and disabled/no-target regression
    - publication-versus-closure races at every copy/slot/generation state proving one whole accepted commit or one explicit late/missed terminal result without waiting, tearing, next-boundary leakage, or double close
    - canonical cross-mailbox ordering independent of registration, producer scheduling, slot position, addresses, compiler, and operating system, plus exact same-mailbox/update-kind replacement and nonreplacement boundaries
    - atomic inactive-to-active generation publication, stable identity, complete payload visibility, callback-local view extent/lifetime, host/rate view isolation, and no mutation or retention of internal storage
    - bounded terminal-state reclamation at zero, one, exact full, repeated wraparound, future-record holes, replacement, missed, stop, active view, sequence/generation exhaustion, and checked-arithmetic limits without ABA or overwrite
    - commit inspection counters/status/window behavior, unavailable reclaimed history, output preservation, malformed identity rejection, and separation from deferred M22-03 action telemetry
    - callback/device/watchdog failure, stop during boundary ownership, stop during producer copy, repeated lifecycle, failed-finalize correction/retry, and two-Runtime generation/view/counter isolation under ThreadSanitizer
    - graph/config/replay identity sensitivity for frozen commit semantics, exclusion of arrival/payload/current state, and exact MemoryPlan/control-ledger reconciliation including active/inactive storage
    - proof that commit performs no parsing, authentication, authorization callback, producer callback, file/network I/O, vendor call, allocation, thread creation, unbounded retry, rollback, checkpoint, replay, telemetry emission, or support promotion
    - full M16/M17/M21 execution, deterministic replay, package inventory, exact C ABI, artifact-schema, support-matrix, release-contract, static-manifest, and disabled-path regression coverage
  required_ci:
    - Documentation contract workflow including truthful M22-02 boundary-commit-only claims, unchanged stable ABIs/artifact schemas/SDK inventory/support matrices, release contract, and complete static source manifest
    - Linux GCC 11 and Clang 14 Debug and RelWithDebInfo matrix with AddressSanitizer and UndefinedBehaviorSanitizer coverage of boundary closure, ordering, replacement, generation publication, reclamation, lifecycle, identity, accounting, and compatibility
    - Windows Server 2022 MSVC v143 Debug and RelWithDebInfo matrix producing identical fixed layouts, boundary order, generation identity, replacement, missed, reclamation, and installed-consumer results
    - Unified executor GCC ThreadSanitizer job covering producer/publication/closure races, callback views, full/reclamation/stop races, stale handles/views, repeated lifecycle, and two Runtime instances without data races
    - Determinism GCC/Clang FMA-on/off and artifact exchange proving canonical commit order and generation identities for the same accepted record set while all existing replay/checkpoint fixtures and schemas remain unchanged
    - C and C++ embedding, add_subdirectory, installed-package, archive relocation, SDK header self-containment, compatibility aliases, exact 70-export C ABI consumers, and live-control callback-view consumer coverage
    - Clang 14 portable static/fuzz/artifact assurance includes every compiled M22-02 source and malformed boundary/view/state mutations; blocking dependency review, SBOM/provenance, autotune, scaling, and package relocation remain green
    - Existing M7 replay/checkpoint, M16 rate, M17 HAL/device, M21 mixed-rate/payload/sampled/replay, M22-01 staging, no-allocation, sanitizer, watchdog, and multiple-instance gates all pass; no rollback/replay/telemetry, hardware, controlled timing, Unreal, release, or deployment workflow is authorized
  manual:
    - Human review must confirm exact frame/rate closure, the publication race linearization point, canonical total order, replacement key, immutable active/inactive generation switch, bounded reclamation, callback-view lifetime, no producer wait, and exact per-Runtime identity/accounting.
    - The reviewer must confirm M22-02 adds no payload parser/authentication/application callback on an execution lane, no rollback/checkpoint/replay/telemetry schema, no executable or Unreal hot reload, and no physical, HIL, RT1/RT2, support, release, deployment, or production claim.
risk:
  class: high
  hazards:
    - a producer publishing across target closure can create a late update that appears at the next boundary or a torn record at the declared boundary
    - nondeterministic cross-mailbox scan order or ambiguous replacement keys can make callback-visible configuration depend on producer scheduling or container layout
    - reusing a slot while an active generation or callback view references it can expose overwritten payload bytes or an ABA-valid stale view
    - waiting on an off-lane producer, parsing payloads, invoking callbacks, or growing containers at the boundary can violate bounded execution and deadlock stop
    - committing a generation before all survivors and payload identities are complete can expose mixed old/new configuration
    - folding rollback, replay, checkpoint, or telemetry into this batch can freeze an incomplete artifact contract and obscure apply-failure semantics reserved for M22-03
    - exact-boundary portable unit evidence can be mislabeled as controlled latency, physical control, RT1/RT2, executable hot reload, or production qualification
  stop_conditions:
    - the exact target baseline is unavailable, dirty, lacks merged M22-01 evidence, or differs from merged pull request 247
    - implementation requires changing the M22-01 update-record size/meaning, C ABI v8, SONAME 8, device ABI v1, extension ABI v1, HAL tables, Runtime status values, existing artifact/telemetry schemas, installed inventory, support matrices, release version, license, or prior evidence
    - exact boundary closure cannot linearize against concurrent publication without waiting for an off-lane producer, spinning without a fixed bound, dropping a complete eligible record, or letting a late record appear at a later target
    - canonical ordering, replacement, generation publication, and reclamation cannot remain allocation-free, fixed-capacity, instance-local, no-ABA, and exactly accounted
    - callback-visible payload access would require application parsing, borrowed caller storage, a mutable/raw internal address, a lifetime beyond the callback, or an implicit backend/vendor transfer
    - implementation requires M22-03 rollback/checkpoint/replay/telemetry, M22-04 typed SDK/stress closure, M23 benchmarks, M24 CUDA physics, M25 SDK work, M26 golden demo, Unreal, signing, publication, release, deployment, production access, or a support/qualification decision
    - credible validation requires timing sleeps/tolerances, physical CUDA/XDMA/DAC/DAQ/CAN/IIO hardware, privileged or controlled hosts, secrets, signing keys, or manufactured hardware/RT evidence
    - any required source, test, workflow, documentation, governance, or evidence change falls outside allowed paths or enters a forbidden path
    - target contracts at the exact baseline contradict the boundary-commit vertical or repair would require weakening deterministic, sanitizer, no-allocation, compatibility, package, parser, or release gates
rollback:
  strategy: Revert the additive commit policy/view/inspection surface, exact boundary cursors, publication linearization, canonical ordering/replacement, active/inactive immutable generation storage, terminal slot state/reclamation, host/rate callback integration, identity/accounting changes, tests/CI, documentation, governance synchronization, release-contract digest updates, and M22-02 evidence as one batch. Restore merged M22-01 staging-only behavior; no checkpoint/replay/telemetry schema, persistent data, physical state, support matrix, release, or deployment was migrated.
  data_migration: none
  release_action: Do not publish a release, promote a support or qualification tuple, alter hardware/RT records, or mark M22/CAP-M22 complete from this batch.
evidence:
  output:
    - docs/evidence/M22-02-<date>.md
    - exact control and target baselines, changed files, commands, exit codes, focused test counts, required CI run/check identifiers, and human review result
    - public commit policy/view/result/inspection shapes with fixed sizes, closed tables, defaults, target identities, lifetimes, replacement key, terminal states, and deferred behavior
    - exact publication-versus-closure state machine and linearization points for complete, copying, future, late, missed, replaced, stopped, full, reclaimed, exhausted, and unavailable records
    - canonical ordering and generation-identity fixtures across mailbox registration/arrival permutations, compilers, platforms, frame targets, simultaneous rate releases, and repeated capacity reuse
    - atomicity, callback-view lifetime, active/inactive storage, terminal reclamation, no-ABA, two-runtime isolation, stop/failure, retryable finalization, and post-start no-allocation results
    - identity comparisons and MemoryPlan/control-ledger reconciliation for every frozen commit semantic field plus exact exclusion of arrival, payload, current generation, counters, slots, addresses, scheduling, and wall-clock state
    - proof of no payload parsing/authentication/authorization callback, producer wait, file/network/vendor action, rollback, checkpoint, replay, telemetry schema/action emission, or implicit backend transfer
    - exact C ABI v8 70-export fingerprint/SONAME, device ABI v1, HAL/extension contracts, existing artifact/runtime schemas, installed package/header/alias inventory, support/qualification, license, and prior-evidence preservation results
    - residual risks and every unperformed M22-03 rollback/replay/checkpoint/telemetry, M22-04 SDK/stress, executable/Unreal hot reload, physical hardware, controlled timing, HIL, RT1, RT2, signing, publication, release, deployment, and production validation
  claim_boundary: Evidence may establish portable RT0 exact host-frame and active rate-release live-control publication, deterministic ordering/replacement, bounded late/missed/stop behavior, atomic immutable callback-visible generations, fixed-capacity reclamation, deterministic inspection, identity/accounting, package compatibility, and sanitizer/no-allocation behavior only. It does not establish apply-failure rollback, checkpoint/replay/telemetry integration, typed domain SDK semantics, executable or Unreal hot reload, physical control, HIL, controlled latency, RT1, RT2, support promotion, signing, publication, release, deployment, or production readiness.
