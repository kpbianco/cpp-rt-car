acceptance:
  - Finalization preserves M15-01 structural validation and deterministically resolves each thread request against the selected platform without applying policy or creating a thread; a strict request that the platform or ownership boundary cannot support fails before startup mutation.
  - On Linux, non-default policy for runtime-owned executor workers, the optional watchdog, and the optional device-service lane covers CPU affinity, scheduling class and priority, NUMA-constrained CPU resolution, wait strategy, stack and guard creation attributes, and bounded thread names; applied state is read back from the native thread rather than inferred from a successful setter call.
  - Empty CPU sets and inherited fields preserve the effective host defaults, unavailable CPUs or NUMA nodes and platform name or stack limits are represented explicitly in resolution, and strict mode never silently narrows, truncates, or downgrades a request.
  - Every created runtime-owned lane applies and verifies its resolved policy, then publishes exactly one ready or failed result at a startup barrier before Runtime::start can commit running state; no user phase, device-phase provider, periodic observer, or other host callback executes before all required rows are verified.
  - A thread-role report is marked applied or verified as succeeded only when every known instance in that role succeeded; best-effort unsupported, apply-failed, and verify-mismatched outcomes remain observable without being promoted to success, while any strict failure fails start and leaves the report inspectable.
  - The caller-owned frame lane is verify-only and is never mutated; host-adapter workers, XDMA I/O workers, custom vendor roles, and other externally owned threads remain verify-only, and an unobservable external request is reported unsupported rather than assigned invented cardinality or state.
  - The resolved wait strategy controls only the matching runtime-owned service or executor idle loop, preserves the current yield and park defaults, wakes reliably for work and stop, and introduces no emergency, detached, spill, or per-frame thread.
  - A failed creation, apply, or readback transaction stops and joins every created runtime-owned lane in deterministic reverse startup order; if existing device-backend cleanup cannot complete, M14.1 ownership markers and retryable stop semantics are preserved instead of claiming rollback succeeded.
  - Portable non-Linux builds preserve current default behavior; non-default best-effort fields that lack a native implementation report unsupported and continue safely, while strict unsupported fields fail before runtime threads start.
  - Successful default-policy start, step, stop, periodic watchdog behavior, device completion, host-adapter execution, two-runtime isolation, and the post-start allocation boundary remain compatible with release 1.2.1.
  - Stable C ABI v8 with 70 exports and SONAME 8, device ABI v1, runtime configuration schema 7 and its 25 keys, installed SDK headers and targets, support matrices, qualification claims, release version, and Apache-2.0 remain unchanged.
  - Target AGENTS, active-batch, current-state, handoff, roadmap, policy documentation, and retained M15-02 evidence describe the actual baseline and distinguish native functional apply/readback from RT1, RT2, hardware, HIL, field, deployment, and production evidence.
  - Focused tests, full deterministic local verification, mandatory GitHub CI, and human compatibility and concurrency review pass before merge.
validation:
  local:
    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - cmake -S . -B build/agent-full -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_TESTS=ON -DRTFW_BUILD_EXPERIMENTAL=ON -DENABLE_RAPIDCHECK=ON -DSIM_SANITIZERS= -DSIM_WERROR=ON
    - cmake --build build/agent-full --parallel 2
    - ./build/agent-full/tests/simcore_tests --gtest_filter='ThreadPolicy.*:CpuMemoryPolicy.*:MemoryPlan.CpuMemoryPolicyTwoRuntimeReportsAreIsolated'
    - ./scripts/agent-verify.sh full
  focused_tests_to_add:
    - injected native-provider sequencing for every executor-worker instance and optional watchdog and device-service role
    - Linux affinity, ordinary scheduling, native name, stack, and guard apply/readback using only CPUs and privileges already available to the test process
    - deterministic CPU-set and NUMA resolution plus strict rejection of unavailable or silently narrowed requests
    - strict apply failure and readback mismatch at each startup stage with reverse join and zero callback execution
    - best-effort unsupported and failed operations with truthful aggregate report states and successful default fallback
    - caller frame verification and host-adapter, XDMA, and custom-role verify-only behavior with no external mutation or invented worker count
    - spin, yield, and park work arrival and stop wakeups without lost wakeups, detached threads, or allocation after startup
    - default-policy lifecycle, watchdog, device-service, cleanup-pending retry, host-adapter, and two-runtime isolation regressions
  required_ci:
    - Documentation contract workflow including quick-start, release-contract, and frozen C ABI checks
    - Linux GCC 11 and Clang 14 Debug and RelWithDebInfo matrix with AddressSanitizer and UndefinedBehaviorSanitizer coverage
    - Windows Server 2022 MSVC v143 Debug and RelWithDebInfo matrix exercising portable unsupported and default behavior
    - Unified executor GCC ThreadSanitizer job with the focused thread-policy suites included in its filter
    - determinism GCC and Clang FMA-on and FMA-off jobs plus artifact exchange
    - C and C++ embedding, add_subdirectory, installed-package, archive relocation, SDK inventory, and compatibility consumers
  manual:
    - Human review must confirm Linux native-call error handling, startup-barrier ordering, reverse rollback, public C++ source compatibility, and preservation of C ABI v8 and device ABI v1 before merge.
    - Any representative Linux privilege-assisted scheduling inspection must record the exact kernel, process privileges, requested/resolved/applied/read-back values, and command results as functional evidence only; its absence blocks only a stronger native tuple claim, never creates one by documentation.
risk:
  class: high
  hazards:
    - a setter can return success while the kernel applies a different CPU mask, scheduler state, stack, guard, or name
    - startup can expose a partially configured worker or allow callbacks before all role instances are verified
    - failure rollback can deadlock, leak a joinable thread, or erase M14.1 device ownership uncertainty
    - wait-strategy changes can lose work or stop notifications, spin unexpectedly, or add a blocking path to a declared executor lane
    - privileged scheduling and container CPU or NUMA restrictions can make host-specific behavior nondeterministic if they are not resolved and reported explicitly
    - a role-level aggregate can falsely report success when one worker failed or when an external worker was never observable
    - changes to common lifecycle or public report types can drift stable ABI, package, determinism, allocation, or multi-runtime invariants
  stop_conditions:
    - the exact baseline commit is unavailable or M15-01 policy types, evidence, or merged behavior are absent from it
    - a stable C ABI v8, SONAME 8, device ABI v1, runtime-profile schema, support-matrix, or release-version change becomes necessary
    - implementation requires mutating the caller frame thread, host-adapter workers, XDMA workers, vendor threads, host limits, IRQ placement, kernel settings, or machine-wide policy
    - strict success would require claiming state that cannot be read back, inventing opaque external cardinality, or silently narrowing or truncating the request
    - a startup failure cannot leave the runtime finalized with every created runtime-owned thread joined, except for already-governed M14.1 device cleanup that remains explicitly pending and retryable
    - a required source, test, workflow, documentation, or evidence change falls outside allowed paths or enters a forbidden path
    - deterministic Linux functional tests cannot avoid dependence on root privilege, a particular CPU number, a multi-node machine, or timing-only assertions
    - the target repository contracts at the exact baseline contradict this scope or require a new product decision
rollback:
  strategy: Revert the M15-02 implementation, tests, documentation, governance refresh, CI filter, and release-contract digest updates as one batch; native policy is process-local and every runtime-owned thread is joined during normal or failed startup, so no data migration or persistent host rollback is permitted or required.
  data_migration: none
  release_action: Do not publish a release, promote a support tuple, or change a qualification record from this batch.
evidence:
  output:
    - docs/evidence/M15-02-<date>.md
    - exact baseline, changed files, commands, exit codes, focused test counts, and required CI run identifiers
    - per-acceptance implementation mapping and requested, resolved, applied, and read-back report examples for success, best-effort degradation, and strict rollback
    - startup and reverse-rollback ordering, callback non-execution, changed and preserved invariants, and compatibility review result
    - Linux kernel and privilege context for native functional tests, plus every skipped or unavailable native path
    - residual risks and all unperformed hardware, HIL, field, latency, RT1, RT2, signing, release, deployment, and production validation
  claim_boundary: Evidence may establish static, unit, injected, sanitizer, package, portable RT0, and named-host Linux functional policy apply/readback behavior only; it does not establish physical hardware behavior, HIL, field validation, worst-case latency, RT1, RT2, signing, release, deployment, or production readiness.
