acceptance:
  - The existing installed `rt/device.hpp` C++ source API adds a distinct HAL API version 2 core contract without changing the installed header or target inventory. Its public versioned records and nonthrowing function table cover capability discovery, initialization, borrowed host-buffer registration and unregistration, one bounded core submission, bounded completion polling, cancellation, health, reset, and shutdown; the table has `struct_size`, API version 2, a non-null borrowed instance, every required operation, and a zero reserved tail.
  - HAL v2 core records use fixed-width values, explicit sizes/versions where applicable, the existing 64-byte backend identifier, 128-byte inline payload, and eight-reference core limits, and zero reserved fields. Capability data preserves maximum in-flight work, registered-buffer count and bytes, cancellation/reset support, deterministic-mock declaration, and backend control-storage bytes. M17-01 does not add or pretend to discover memory domains, topology, coherency, timestamp correlation, batch/timeline, CUDA Graph, XDMA control/MMIO/event, peer-memory, or factory/plugin capabilities.
  - A copied configuring-only native HAL v2 registration and Runtime registration overload are additive beside the existing `DeviceBackendRegistration` and `register_device_backend` source surface. Both produce the same instance-owned `DeviceBackendHandle`, duplicate-name rules, freeze behavior, capacity limits, device-phase graph behavior, health/reset surface, and borrowed-lifetime obligation; pre-M17-01 positional aggregates and installed C++ consumers retain their meaning.
  - Every device-ABI-v1 registration is copied and wrapped exactly once into a runtime-owned HAL v2 compatibility object before entering the canonical device manager. After registration, initialization, buffer handling, submission, polling, cancellation, health, reset, and shutdown calls from the supported runtime all traverse the canonical HAL v2 operation path; direct device-ABI-v1 calls are confined to the compatibility adapter.
  - The v1 adapter validates the complete frozen v1 function table and capability record exactly as the baseline does, catches any exception before it crosses either boundary, and maps every v1 status without success promotion. It preserves backend ID and all core capacity/support/control-storage facts; requested in-flight and buffer counts; names, borrowed pointers, byte counts and access flags; submission/frame/timeout/opcode/flags/payload/reference fields; completion ID/status/timestamp/value; complete health counters/state; and cancel/reset/shutdown results. It never invents a v2 capability, retries an operation, translates `UNSUPPORTED` to success, or claims ownership release after a failed cleanup.
  - Native HAL v2 core registrations and adapted v1 registrations receive equivalent fail-closed validation. Short or wrong-version records, nonzero reserved bytes, null operations or instances, invalid identifiers/enums/booleans, zero or over-limit capacities, oversized buffers, malformed submissions/completions/health, unknown status values, and callback exceptions fail with the existing stable Runtime status meanings and without publishing a partial backend, handle, completion, health result, or ownership transition.
  - Existing device lifecycle ordering is unchanged. Capability query occurs while configuring; finalization is transactional; start creates the existing runtime-owned device-service lane, initializes backends and registers buffers behind the existing startup barrier; submissions remain bounded and nonblocking on executor workers; only the service lane polls; and checked stop quiesces graph/device work, unregisters buffers in reverse order, and shuts backends down in reverse order with first-error retention and unresolved-only retry.
  - The compatibility adapter preserves the submitting/early-ready causal handshake, runtime-assigned nonzero submission IDs, buffer-token translation, exact range/access validation, completion matching, independent-phase progress, failure propagation, reset gating, and cross-instance isolation. A synchronous or early v1 completion cannot precede its accepted submission record, release the wrong graph token, or be applied twice.
  - Adapter/function-table/context storage is fixed after finalization, remains address-stable despite configuring-time vector growth, is owned by exactly one Runtime, and is represented once in `device_control_bytes`, the M15 logical control ledger, and the existing six-row MemoryPlan equation. Registration/finalization capacity or allocation failure is transactional; steady-state submit, poll, completion, health, reset, checked stop, and full CPU-plus-device frames add no ordinary heap allocation, hidden thread, blocking mutex, unbounded wait/retry, spill path, callback from poll, or file/network I/O.
  - Existing device-ABI-v1 mock, CUDA candidate, and XDMA candidate backends run unchanged through the compatibility path. Permanent tests prove the deterministic mock's success, saturation, delay, timeout, error, loss/reset, early completion, buffer operations, failed initialization/registration/unregistration/shutdown retry, destruction fallback, two-runtime isolation, and no-allocation behavior without modifying those backends. Existing CUDA fake-driver and portable XDMA suites remain required, but no vendor or physical hardware execution is part of M17-01.
  - Native HAL v2 and adapted v1 core backends with equivalent declared behavior produce equivalent Runtime results, phase/dependency order, health values, device trace/metric meanings, cleanup transitions, and observable borrowed-buffer bytes. Backend kind/API version participates in native-v2 compatibility identity, while the adapted v1 path retains the exact pre-M17-01 graph/replay identity and checkpoint/input-log compatibility bytes for otherwise identical configurations.
  - Stable C ABI v8 with exactly 70 exports and its frozen fingerprint, SONAME 8, the complete `rt/include/rt/device_abi.h` version-1 declarations/layout/values, runtime-profile schema 7 and 25 keys, global observability schema 2 with existing trace and metric IDs, checkpoint/input-log schema 1 and codecs, M16 rate-action schema 1, installed target/header inventory and compatibility aliases, release 1.2.1, support matrices, and Apache-2.0 remain unchanged. HAL v2 is a C++ source contract with recompilation required and no C++ binary ABI promise.
  - Target governance, active batch, current state, handoff, roadmap, HAL/device/host/memory/testing contracts, release digest ledger, and retained M17-01 evidence describe only the HAL v2 core and v1 compatibility path. They keep M17 incomplete and do not convert a mock, fake driver, fixture, hosted CI, preflight, or document into heterogeneous-memory, command-batch, timeline, physical hardware, HIL, field, latency, RT1, RT2, signing, release, deployment, or production evidence.
  - Focused tests, clean installed-package consumers, complete deterministic local verification, mandatory GitHub CI, and human public-API, compatibility-map, exception/lifetime, concurrency, accounting, lifecycle, and claim-boundary review pass before merge.
validation:
  local:
    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - cmake -S . -B build/agent-full -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_TESTS=ON -DRTFW_BUILD_EXPERIMENTAL=ON -DENABLE_RAPIDCHECK=ON -DSIM_SANITIZERS= -DSIM_WERROR=ON
    - cmake --build build/agent-full --parallel 2
    - ./build/agent-full/tests/simcore_tests --gtest_filter='HalV2.*:DeviceRuntime.*Hal*:DeviceRuntime.*Compatibility*:DeviceMock.*Hal*:MemoryPlan.*Hal*:DeterminismReplay.*Hal*:TraceNoAlloc.*Hal*'
    - ctest --test-dir build/agent-full --output-on-failure -R 'm17_hal_v2_compatibility|m15_accounting_closure|m15_cross_category_rollback|m16_rate_timeline|m16_rate_dispatch|m16_shedding_telemetry|m16_cross_rate_data|xdma_backend'
    - cmake -S . -B build/m17-package -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTS=OFF -DRTFW_BUILD_EXPERIMENTAL=OFF -DRTFW_BUILD_EXAMPLES=OFF -DRTFW_BUILD_RUNTIME_DEMO=OFF -DSIM_WERROR=ON
    - cmake --build build/m17-package --parallel 2
    - cmake --install build/m17-package --prefix build/m17-install
    - cmake -S tests/package_consumer -B build/m17-package-consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=build/m17-install
    - cmake --build build/m17-package-consumer --parallel 2
    - ctest --test-dir build/m17-package-consumer --output-on-failure
    - ./scripts/agent-verify.sh full
    - python3 tools/check_c_abi.py --library build/agent-full/librtfw.so
    - readelf -d build/agent-full/librtfw.so | rg 'SONAME.*librtfw.so.8'
  focused_tests_to_add:
    - exact HAL v2 numeric version, default constructors, complete record/table layout expectations, required operation presence, zero reserved fields, copied registration, freeze, duplicate, capacity, malformed version/size/enum/boolean/identifier, and two-runtime ownership cases
    - complete field-by-field device-ABI-v1 capability, init, buffer, submission, completion, health, status, cancel, reset, and shutdown translation table including unknown values, callback exceptions, and `UNSUPPORTED` preservation
    - proof that every existing v1 Runtime operation traverses the compatibility adapter exactly once and no supported runtime/device-manager call bypasses the canonical HAL v2 path
    - native HAL v2 versus adapted-v1 behavioral equivalence for success, queue saturation, early completion, delay, timeout, error, loss/reset, cancellation, buffer mutation, dependency release, trace/metrics, and checked stop
    - failed initialize with certain and uncertain ownership, partial buffer registration, unregister failure, shutdown failure, independent reverse cleanup, first-error retention, unresolved-only retry, callback gating, and destructor fail-safe regressions for both registration kinds
    - address stability and exact adapter ownership across configuring-time backend-vector growth, corrected failed finalization, start/stop/restart, destruction, and two concurrent Runtime instances
    - exact adapter/table/context storage reconciliation inside `device_control_bytes`, the M15 control ledger, and six-row MemoryPlan with overflow/capacity rejection before provider/native/thread/device side effects
    - steady-state no-allocation and bounded-call-count coverage for submission, early and polled completion, saturation, health, reset, cleanup retry, and complete graph frames with no callback from poll or new lane/thread
    - unchanged v1 graph/replay identity and artifact compatibility plus native-v2 version/kind identity sensitivity, unchanged observability IDs/meanings, and permanent M16 checkpoint/rate-action regressions
    - preferred and compatibility installed C++ consumers for old v1 aggregate prefixes and the new native v2 registration, plus unchanged C, CUDA-backend, XDMA-backend, header-inventory, warning-isolation, and pure-C consumers
  required_ci:
    - Documentation contract workflow including HAL-v2/v1 compatibility claims, quick-start, release-contract, frozen C ABI/device ABI fingerprint, exact SDK inventory, and permanent M15/M16 gates
    - Linux GCC 11 and Clang 14 Debug and RelWithDebInfo, FMA on/off matrix with AddressSanitizer and UndefinedBehaviorSanitizer coverage of both registration kinds, translations, malformed outputs, early completion, failure/cleanup retry, identity, accounting, and lifecycle
    - Windows Server 2022 MSVC v143 Debug and RelWithDebInfo matrix covering identical HAL version/translation/status results, intentional layout/alignment diagnostics, source compatibility, and installed consumers
    - Unified executor GCC ThreadSanitizer job executing complete HalV2, adapted DeviceRuntime/DeviceMock, early-ready, concurrent submit/poll, cleanup/retry, two-runtime, CUDA fake-driver, portable XDMA, and permanent M15/M16 processes without weakening exclusions or timeouts
    - Determinism GCC and Clang FMA-on and FMA-off jobs plus artifact exchange proving unchanged adapted-v1 legacy/reference/active-rate fixtures and explicit identity separation for a native HAL v2 registration
    - C and C++ embedding, add_subdirectory, installed-package, archive relocation, SDK header self-containment, compatibility aliases, unchanged v1 CUDA/XDMA consumers, exact 70-export C ABI consumers, and existing autotune/scaling smoke jobs
    - Existing no-allocation, bounded-memory/control-ledger, M14.1 device recovery, M15 rollback, M16 timeline/data/dispatch/shedding/telemetry, sanitizer, fuzz-smoke, observability-schema, documentation, release-contract, package, CUDA fake-driver, and XDMA portable gates; no hosted timing or controlled-hardware claim is authorized
  manual:
    - Human public-API and compatibility review must approve the additive C++ HAL v2 core shape, exact v1-to-v2 field/status/capability map, source/identity compatibility, absence of v2-only feature invention, and preservation of C ABI v8, device ABI v1, package, schema, release, support, and license boundaries.
    - Human concurrency, lifetime, and safety review must confirm table/instance borrowing, adapter address stability, exception containment, single traversal, submitting/early-ready ordering, bounded nonblocking executor/service behavior, exact ownership markers, reverse retryable cleanup, MemoryPlan/control-ledger closure, and no post-start allocation or new lane.
    - Promotion review is explicitly deferred. Heterogeneous memory/topology/coherency/timestamp work requires M17-02; batches/timelines and isolated submission lanes require M17-03; CUDA Graph/XDMA controls require M17-04; combined execution requires M17-05; and any physical hardware or RT support claim requires named M18 evidence and separate human approval.
risk:
  class: high
  hazards:
    - a partial v1 translation can silently drop a status, reserved-field violation, access flag, range, timeout, completion timestamp/value, health counter, or ownership failure while happy-path mock tests still pass
    - an adapter context stored inside a reallocating container can leave the canonical function table holding a dangling self pointer after a later backend registration or corrected finalization
    - dual native-v2 and adapted-v1 paths can diverge in validation, error mapping, graph-token release, trace/metric publication, reset gating, or cleanup order and create two device runtimes instead of one canonical path
    - wrapping failed initialization or cleanup can clear or duplicate ownership, call shutdown before registered buffers release, retry already successful work, or let borrowed backend storage die while still reachable
    - a synchronous v1 completion can overtake submission accounting through the new adapter and release a dependency before acceptance is causally published
    - new public C++ tables or records can break positional initialization, installed consumers, warning-clean Windows layout, default SDK inventory, graph/replay identity, or M15 accounting while stable C ABI checks remain green
    - canonical adapter storage can be omitted or double counted in device control, allocate after start, share mutable state across Runtime instances, or introduce unbounded translation/retry work
    - naming a core envelope HAL v2 can be overstated as heterogeneous memory, topology/coherency, batch/timeline, vendor-control, physical accelerator, latency, or qualification evidence
  stop_conditions:
    - the exact baseline commit is unavailable, dirty, or lacks merged M16-04 commit e264278557866acbf3bda1e6b4a436a6e0fd704f and every retained M15/M16 evidence record
    - target contracts at the exact baseline contradict a C++ HAL v2 core with a complete device-ABI-v1 adapter or require a different ownership, status, exception, identity, or compatibility decision
    - implementation requires changing stable C ABI v8, SONAME 8, any declaration/layout/value in device ABI v1, Runtime status values, runtime-profile schema 7/25 keys, observability or artifact schemas/IDs, M16 rate-action schema, installed header/target inventory, support matrices, release version, or license
    - correct v1 compatibility cannot preserve every capability, operation, status, buffer/submission/completion/health field, early-completion order, borrowed lifetime, and retryable ownership transition without guessing or reporting false success
    - the supported runtime cannot use one canonical HAL v2 manager path for both registration kinds, or the adapter cannot remain address-stable, fixed-capacity, instance-isolated, exactly accounted, and allocation-free after start
    - heterogeneous memory/topology/coherency/timestamp semantics, command batching, timeline completions, a new submission/I/O lane, CUDA Graph, XDMA control/MMIO/event, peer memory, plugin/factory loading, or device-rate dispatch becomes necessary to satisfy this batch
    - implementation requires modifying the existing mock, CUDA, or XDMA backend to make v1 compatibility appear to pass instead of adapting the frozen v1 surface unchanged
    - deterministic functional tests require timing sleeps/tolerances, root privilege, fixed topology, physical CUDA or FPGA/XDMA hardware, controlled timing hosts, secrets, signing, release, deployment, or production access
    - a required source, test, workflow, documentation, governance, or evidence change falls outside allowed paths or enters a forbidden path
rollback:
  strategy: Revert the additive HAL v2 C++ records/table/registration, canonical manager conversion, device-ABI-v1 compatibility adapter, adapter identity/accounting integration, tests/CI, documentation/governance, release digests, and retained M17-01 evidence as one batch. Before discarding a running integration, require existing checked stop to quiesce graph work and resolve every backend, registered-buffer, service-lane, stack, control, and selected-region owner; never detach, force-release, or relabel uncertain v1 or v2 ownership. The exact e264278 device-ABI-v1 manager path remains the fallback, with no persistent data, host setting, support promotion, release, or deployment rollback.
  data_migration: none
  release_action: Do not publish a release, promote a CUDA/XDMA/combined/RT tuple, alter support or qualification records, or mark M17/CAP-M17 complete from this core compatibility batch.
evidence:
  output:
    - docs/evidence/M17-01-<date>.md
    - exact baseline, changed files, commands, exit codes, focused test counts, required CI run/check identifiers, and human review result
    - public HAL v2 core record/table/registration definitions with exact version, sizes, defaults, capacities, ownership, exception, freeze, source-compatibility, and rejected-input rules
    - complete device-ABI-v1-to-HAL-v2 capability, lifecycle, buffer, submission, completion, health, status, cancel/reset/shutdown mapping table with malformed, exception, unsupported, and unknown-value results
    - proof that the supported manager has one canonical HAL v2 call path, plus native-v2/adapted-v1 behavioral comparisons for success, saturation, early completion, faults, dependency release, health, reset, and cleanup
    - failed-start and checked-stop ordering, retained ownership markers, first-error behavior, unresolved-only retry, borrowed-object lifetime, destructor fallback, and two-runtime isolation evidence
    - adapter/table/context storage and extent reconciliation inside device control and the six-row MemoryPlan, address-stability results, post-start allocation proof, ThreadSanitizer results, and exact bounded call counts
    - adapted-v1 identity/artifact compatibility, native-v2 version identity, unchanged trace/metric meanings, existing mock/CUDA/XDMA v1 regression results, installed package consumers, and C++/C/device ABI status
    - changed and preserved invariants, rollback path, residual risks, and all unperformed heterogeneous-memory, topology, coherency, timestamp-correlation, batch, timeline, isolated-vendor-lane, CUDA Graph, XDMA control, peer-memory, controlled-performance, privileged-native, physical hardware, HIL, field, latency, thermal, endurance, RT1, RT2, signing, release, staging, deployment, and production validation
  claim_boundary: Evidence may establish static, unit, malformed/failure-injected, mock and fake-driver, sanitizer, package, bounded-memory/no-allocation, lifecycle-recovery, cross-instance, and portable RT0 functional HAL-v2-core/device-ABI-v1 compatibility behavior only. A native core table or compatibility adapter does not establish heterogeneous memory, topology/coherency, timestamp correlation, command batching, timeline completion, isolated blocking-vendor execution, CUDA Graph, XDMA control, peer DMA, physical accelerator behavior, HIL, field performance, worst-case latency, RT1, RT2, signing, release, deployment, or production readiness; mocks, fixtures, hosted CI, preflight, and documentation remain non-physical evidence.
