acceptance:
  - The implementation begins from an initially clean target at exact default-branch commit `d463c3a6896e54d10814f1d4ed3b05d355550900`, the merged M20-PRE-01 pull request 241. Its retained M15 through M20 evidence is present and unchanged, and governance records M20-PRE-01 as merged without inventing an absent physical, RT, Unreal, signing, release, publication, deployment, or production result.
  - The installed additive C++ source API can associate an already registered device command-batch phase with one rate domain and copied bounded device-rate policy metadata. The metadata includes a positive completion budget, a positive bounded per-phase in-flight demand, and an explicit fixed payload-reference role for every pre-registered buffer slice whose identity must survive into later completion/cross-rate work. It introduces no raw address, arbitrary completion-owned dynamic byte array, vendor object, stable-C-ABI field, schema-7 key, or device-ABI-v1 change.
  - One device-rate phase has exactly one immutable phase owner, rate domain, backend, copied command-batch declaration, backend-local wait/signal timeline set, completion budget, in-flight demand, and payload-reference inventory. Runtime derives backend, command count, buffer slices, access/synchronization requirements, and timeline handles from the already copied M17 declaration; a second contradictory command or buffer declaration is forbidden.
  - Device-rate opt-in is limited in this batch to registered HAL-v2 command-batch phases whose backend exposes the copied command/timeline capability snapshot. Legacy device-command phases and unchanged device-ABI-v1 registration remain usable by ordinary frame execution but are rejected from active device-rate admission with a deterministic diagnostic. This support boundary is documented and is not called a device-ABI incompatibility.
  - Reference timeline compilation retains CPU and device records and appends enough immutable inspection data to identify phase kind, backend, declared batch skeleton, completion deadline/budget, per-phase in-flight demand, backend-local timeline set, and payload-reference identities without retaining a caller span or vendor pointer. Exact equal-time ordering remains rate-domain registration order, compiled phase order, and substep ordinal.
  - Mixed-plan finalization validates owner/generation/kind for every phase, rate domain, backend, buffer, memory domain, and timeline reference; rejects foreign, stale, duplicate, rebound, missing, cross-backend, non-command-capable, malformed, zero-budget, overflow, and over-capacity combinations; and publishes no partial plan or changed Runtime state on failure.
  - Admission is a checked integer simulation over the exact reference supercycle. CPU mandatory records retain the existing conservative single-lane declared-budget rule. Each device record consumes one in-flight slot over its declared completion interval. Per-phase overlap may not exceed that phase's declared maximum, per-backend overlap may not exceed backend `max_in_flight_batches`, global device overlap may not exceed Runtime outstanding capacity, and completions sharing an exact poll boundary may not exceed the minimum Runtime/backend completion-batch capacity. CPU and distinct backends may otherwise overlap, and optional records never make a mandatory plan appear feasible.
  - A device record's completion deadline is the earlier of its rate release deadline and checked release-plus-completion-budget. Completion intervals are half-open, release and completion ties have one documented deterministic order, substeps each consume one batch unless the copied declaration explicitly proves otherwise, and supercycle wrap includes outstanding work from the previous cycle. Overflow, a completion beyond the representable repeating horizon, or nonzero work that cannot drain within the bounded cyclic model fails finalization.
  - Admission validates the copied command count, wait/signal count, registered-buffer footprint, backend-local timeline identity, backend capability limits, Runtime queue/outstanding/completion-batch bounds, and timestamp-domain identity required for later completion correlation. It rejects a cyclic same-backend wait graph, an external or cross-backend wait that cannot be proven available, ambiguous timeline progress, or a payload reference not covered exactly by the copied batch declaration.
  - Finalized device admission has an inspectable deterministic report containing per-backend capacity and peak demand, per-device-phase demand and completion budget, every accepted interval, exact constraining capacity, and the first rejected reference identity/diagnostic. The report is Runtime-instance-owned, read-only after finalization, stable across equivalent construction order, and contains no addresses, payload bytes, vendor handles, wall-clock observations, or timing measurements.
  - Rate-plan, graph/replay compatibility identity, logical control-ledger accounting, and MemoryPlan include every new semantic descriptor and configuration-time storage exactly once. A no-device plan and an active CPU-only plan retain their exact pre-M21-01 identity and behavior; device metadata changes invalidate an otherwise incompatible explicit mixed plan without changing checkpoint/input-log or rate-action schema versions in this batch.
  - M21-01 is model, compilation, and admission only. Host-driven `step()` and self-paced execution do not dispatch a rate-triggered device batch, poll a new completion, publish a device payload, create a sampled-I/O channel, alter late/shedding telemetry, or add a Runtime/backend lane. Existing ordinary device phases retain their pre-M21 execution behavior, and any attempted active mixed execution after finalization fails before invoking a device provider or vendor callback until M21-02 supplies dispatch.
  - Construction, replacement, failed finalization, inspection, start rejection, checked stop, and destruction are bounded and isolated per Runtime. All new dynamic storage is acquired only while configuring/finalizing, included once in existing M15 accounting/MemoryPlan rows, and never allocated, resized, mutated, or scanned through an unbounded collection on any post-start path.
  - Default construction, aggregate/source compatibility, the installed C++ consumer, CPU-only M16 reference/admission/dispatch/cross-rate/shedding behavior, M17 device registration and ordinary batch execution, multiple Runtime instances, deterministic replay, no-allocation checks, sanitizers, and checked cleanup remain passing.
  - Stable C ABI v8 with exactly 70 exports and its frozen fingerprint, SONAME 8, device ABI v1, extension ABI v1, HAL core v2 and both extension v1 contracts, runtime-profile schema 7 and 25 keys, observability/checkpoint/input-log/rate-action schemas, Runtime status values, installed target/header/alias inventory, release 1.2.1, support matrices, qualification state, and Apache-2.0 remain unchanged.
  - Target governance, current state, handoff, component contracts, release digest ledger, and retained `docs/evidence/M21-01-<date>.md` state the exact model/admission-only boundary. Focused and full local verification, mandatory hosted CI, and human public-API, admission-arithmetic, ownership, capacity, identity/accounting, compatibility, and claim review pass before merge. M21 and CAP-M21 remain incomplete after this batch.
