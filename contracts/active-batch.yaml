  title: Add CPU GPU FPGA CPU graph sample
  goal: Add one portable, deterministic sample that composes the existing native HAL-v2 CUDA and XDMA candidates in a single Runtime graph, demonstrates CPU preparation, explicit CUDA staged upload/Graph/download, a bounded host-staging handoff, explicit XDMA transfer/control/event/transfer, and CPU validation, while adding no runtime or backend capability and making no physical hardware, peer-DMA, latency, or support claim.
