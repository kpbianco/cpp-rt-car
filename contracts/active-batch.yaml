acceptance:
- Default benchmark-OFF SDK inventory and every M15-M22 implementation/evidence/ABI/schema/support boundary
  remain unchanged.
- Strict closed descriptor/result schemas, explicit size/versioned borrowed provider tables, deterministic
  registration/list/describe/run, bounded fake/real clocks and samples, and exact external consumer semantics.
- Canonical descriptor/raw/result artifacts with SHA-256 binding, create-new atomic publication, no symlink
  following or overwrite, bounded failure diagnostics and offline semantic validation.
- Privacy-bounded source/build/host/workload identity with explicit unavailable facts; no hardware, privilege,
  secret, network, scheduler, Runtime-lane or experimental dependency.
- Only self/provider framework cases; M23-02 through M23-05, M24-M26, hardware, RT, Unreal, signing, release
  and deployment remain outside this batch.
- All canonical focused/full/CI/package/sanitizer/determinism/ABI/release and human review gates pass
  before merge; M23/CAP-M23 remain incomplete.
validation:
  local:
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - cmake -S . -B build/m23-supported -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_TESTS=ON -DRTFW_BUILD_EXPERIMENTAL=OFF
    -DRTFW_BUILD_BENCHMARKS=ON -DSIM_SANITIZERS= -DSIM_WERROR=ON
  - cmake --build build/m23-supported --parallel 2
  - ctest --test-dir build/m23-supported --output-on-failure -R 'm23_benchmark|benchmark_package_consumer'
  - ./scripts/agent-verify.sh full
  - python3 tools/check_c_abi.py --library build/m23-supported/librtfw.so
  - git diff --check
  required_ci:
  - Existing GCC11/Clang14 Debug/RelWithDebInfo sanitizer matrices and MSVC v143 matrices
  - GCC ThreadSanitizer, deterministic artifact exchange, portable assurance and dependency review
  - Default and optional installed/archive/add-subdirectory consumers, ABI, docs, release hashes, scaling
    and autotune
  manual:
  - Human schema/API/borrowed-lifetime review
  - Human portability, artifact, privacy/security review
  - Human package/compatibility and claim review
risk:
  class: high
  stop_conditions:
  - Any canonical stop condition applies unchanged.
  - No forbidden path, Runtime lane/ABI/schema/support change, incomplete publication, manufactured evidence
    or weakened gate.
rollback:
  strategy: Revert the complete optional component, tests, package/CI integration and documentation/governance
    as a bounded batch. No runtime artifact migration.
  data_migration: none
  release_action: No release, deployment, signing, threshold approval, hardware support promotion or repository
    settings change.
evidence:
  output:
  - docs/evidence/M23-01-2026-09-06.md
  claim_boundary: Candidate portable host-side framework evidence only; no complete M23/CAP-M23 claim
    and no controlled-host, physical, RT, Unreal, signing or release claim.
