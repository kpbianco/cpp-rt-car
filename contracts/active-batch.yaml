acceptance:
  - The existing reference-only behavior remains the default. An additive configuring-only C++ rate-execution policy explicitly enables active dispatch, bounds total executed reference records per step, and appends source-compatible late-policy fields to rate-domain declarations; pre-M16-03 aggregate initialization and an explicit M16-01/M16-02 plan without the execution policy retain exact complete-graph once-per-frame dispatch and identity.
  - Active finalization accepts only CPU phases, mandatory domains, positive budget/WCET and relative-deadline values, relative deadlines no greater than their periods, same-domain graph dependencies, and D0 unspecified determinism. Device phases remain reference-only, cross-domain graph dependencies must use declared M16-02 channels, optional-domain shedding/recovery remains M16-04, and active D1 plus active input-log replay are rejected explicitly rather than silently weakened.
  - Admission simulates every mandatory reference record across one complete supercycle in the existing total order on one conservative serialized release lane. For each record, declared finish is max(previous declared finish, release time) plus its checked positive budget; finalization rejects any finish after that record's checked deadline, any non-idle supercycle boundary, arithmetic/capacity overflow, or a zero/ambiguous input before provider, native-policy, thread, device, callback, or snapshot side effects. Worker count or incidental graph parallelism never multiplies admitted capacity, and admission is labeled a declared-budget screen rather than measured WCET or deadline proof.
  - Active host-driven steps use a copied optional nominal release timestamp appended to HostFrameContext. The first step establishes the wall-clock mapping for logical epoch zero; later calls must match the checked contiguous logical cursor and nominal release mapping. Each step covers the half-open logical interval [cursor, cursor + delta), while run_periodic supplies its existing absolute release as the nominal timestamp. Host-driven execution never sleeps, periodic releases never shift, and zero/overflow/noncontiguous active windows fail before callback dispatch.
  - Due work repeats the exact immutable reference vector by checked supercycle arithmetic and executes equal-time domain releases by domain registration order, then compiled phase order, then substep ordinal. One domain release is the atomic late-decision unit; its phase/substep records execute serially through the existing executor boundary, while nested work retains the selected executor policy. The dispatcher neither creates another worker pool nor invokes experimental SimCore, scheduler, fiber, or plugin paths.
  - Before a domain release begins, the runtime compares its checked absolute deadline with the injected/runtime clock and applies exactly its configured action. skip consumes the release without callbacks and is rejected at finalization for a domain that produces a cross-rate channel; bounded_catch_up executes at most its positive per-step cap and returns capacity_exceeded with exact rejected counts when the cap is exhausted; hold consumes the release without callbacks and explicitly aliases each outgoing channel to its last committed or initial sample; degrade increments the existing capped degradation level once and executes the release with that committed level; fail executes none of that release or later work, reports the exact release, and gates further steps until checked stop. No action retries without a bound, grows backlog, substitutes a newer sample, or silently omits a mandatory release.
  - A global positive maximum-dispatch count is checked before and during each step. Large deltas and many elapsed supercycles are counted with checked arithmetic and handled by aggregate skip/hold/fail decisions without iterating once per omitted cycle; any work that would exceed the configured callback bound returns a typed existing status and exact StepResult counts, advances no ambiguous partial cursor, and cannot spill, allocate, block, or create a helper lane.
  - CallbackContext gains an additive nullable rate-release view only during active CPU rate callbacks. It exposes the exact domain, phase, supercycle cycle, domain release sequence, substep, logical/nominal release, deadline, declared budget, late action, and degradation level. A producer must publish one exact-size payload for every outgoing channel before returning success; a consumer may copy only its compiled initial, produced, or explicit-hold generation and receives distinct provenance, age, held, fresh/stale, not-ready, and size results. Missing or duplicate publication fails the release, and no read searches for or silently substitutes a different generation.
  - Active publication/copy uses the existing two-slot exact-generation SPSC stores with bounded single-attempt ownership and complete-before-visible ordering. Runtime control at release boundaries retires a generation only after its last compiled consumer lifetime or explicit skipped/held disposition, handles supercycle wrap without generation collision, and fails closed at finite generation exhaustion. Two runtimes share no cursor, epoch, alias, payload, action, or fault state, and the complete active path is covered by ThreadSanitizer.
  - StepResult and periodic result tails expose bounded C++ summaries for due, executed, on-time, late, caught-up, skipped, held, degraded, rejected, stale, and failed releases plus the first failing domain/sequence/substep. These are functional return records, not observability schema 3. Existing trace IDs 1-14, metric IDs 0-31, observability schema 2, and their meanings remain unchanged; versioned per-release telemetry, optional-work shedding, recovery, and policy-version signals remain M16-04.
  - The active dispatcher state is allocated only during finalization and counted once inside rate_plan_bytes, the M15 runtime-control logical extent, and the existing six-row MemoryPlan equation. It includes the logical cursor, epoch mapping, per-domain catch-up/action state, generation/alias state, and canonical committed channel payload bytes; step, publish, copy, skip, hold, catch-up, degrade, fail, result inspection, and stop perform no ordinary heap allocation or unbounded wait.
  - Checkpoint schema 1 remains byte-compatible. For an active plan, the runtime contributes one bounded reserved canonical state record through the existing generic checkpoint record mechanism, hashes it into state/replay identity, and transactionally saves/restores the logical cursor, fault/action state, generation aliases, and committed channel bytes before rebuilding live stores. Reference-only and legacy checkpoints remain byte-for-byte unchanged. Because schema-1 input-log records cannot encode nominal releases or late actions, write_input_log and replay reject active rate execution in M16-03; they remain unchanged for legacy/reference-only plans, and action-log/replay evolution requires the M16-04 versioned-telemetry decision.
  - Failed admission, state allocation, provider ordering, active-state restore, or corrected configuration publishes no partial execution plan or mutable store state. Callback failure or missing publication cancels later work using existing executor semantics; stop remains checked and retryable, clears no unresolved M14.1/M15 owner, and resets no externally borrowed state dishonestly.
  - Stable C ABI v8 with exactly 70 exports and its frozen fingerprint, SONAME 8, device ABI v1, runtime-profile schema 7 and its 25 keys, checkpoint/input-log schema numbers, default installed header/target inventory, compatibility aliases, release 1.2.1, support matrices, and Apache-2.0 remain unchanged. The C ABI cannot configure active rates and retains its exact legacy step/periodic behavior.
  - Target governance, current-state, handoff, roadmap, component contracts, release digest ledger, and retained M16-03 evidence describe only portable RT0 functional admission/dispatch/late-policy results. No declared budget, fake clock, callback fixture, mock, hosted CI, preflight, or documentation is physical hardware, HIL, field, worst-case latency, RT1, RT2, signing, release, deployment, or production evidence; M16 and CAP-M16 remain incomplete until M16-04 shedding/recovery and versioned telemetry pass.
  - Focused tests, complete deterministic local verification, mandatory GitHub CI, and human public-API, admission arithmetic, scheduling, cross-rate lifetime, checkpoint-state, concurrency, allocation, compatibility, and claim-boundary review pass before merge.
validation:
  local:
    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - cmake -S . -B build/agent-full -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_TESTS=ON -DRTFW_BUILD_EXPERIMENTAL=ON -DENABLE_RAPIDCHECK=ON -DSIM_SANITIZERS= -DSIM_WERROR=ON
    - cmake --build build/agent-full --parallel 2
    - ./build/agent-full/tests/simcore_tests --gtest_filter='RateDispatch.*:RateTimeline.*Admission*:CrossRateData.*Active*:HostRuntime.*RateDispatch*:PeriodicRuntime.*RateDispatch*:UnifiedExecutor.*RateDispatch*:MemoryPlan.*RateDispatch*:DeterminismReplay.*RateDispatch*:TraceNoAlloc.*RateDispatch*'
    - ctest --test-dir build/agent-full --output-on-failure -R 'm16_rate_dispatch|m16_rate_timeline|m16_cross_rate_data'
    - ./scripts/agent-verify.sh full
  focused_tests_to_add:
    - opt-in policy copy, freeze, default inactive compatibility, source-compatible aggregate tails, malformed enum/cap rejection, and identity sensitivity for every execution and late-policy field
    - exact conservative one-supercycle admission agreement with an independent integer simulator, including harmonic/non-harmonic, simultaneous, phase/substep multiplication, deadline boundary, idle gaps, final-boundary, zero, overflow, and infeasible mandatory cases
    - active rejection of device phases, optional domains, D1, cross-domain graph dependencies, missing positive budget/deadline, deadline greater than period, skip producers, and active input-log/replay without changing reference-only acceptance
    - exact half-open logical windows, first release at epoch zero, multi-supercycle wrap, contiguous nominal timestamps, zero delta, large-delta aggregate handling, arithmetic overflow, periodic absolute epoch, and no host-driven sleep
    - reference-order callback dispatch and context fields for harmonic, co-prime, simultaneous, multi-phase, and multi-substep plans with nested executor work and no hidden lane
    - on-time and pre-dispatch-late skip, bounded-catch-up, hold, degrade, and fail behavior using a fake clock, including cap exhaustion, exact summary counts, fail gating, no silent mandatory omission, and no unbounded backlog
    - active cross-rate initial/read/publish, exact generation, same-time, held alias, stale/not-ready, missing/duplicate/wrong-owner/wrong-size publication, lifetime retirement, store wrap, and no newer-sample substitution
    - active dispatcher and store concurrency under ThreadSanitizer, callback failure cancellation, two-runtime isolation, finite generation exhaustion, and checked stop/restart boundaries
    - exact active-state and store storage reconciliation inside rate_plan/runtime-control bytes and the six-row MemoryPlan, capacity failure before provider callbacks, and zero ordinary heap allocation across on-time, catch-up, hold, degrade, and failure frames
    - active checkpoint reserved-state round trip and transactional corruption/identity/size rejection, plus exact legacy/reference-only checkpoint and input-log bytes and explicit active input-log/replay rejection
    - permanent M14.1/M15/M16-01/M16-02 lifecycle, cleanup, reference, selector, snapshot-store, determinism, package, and compatibility regressions
  required_ci:
    - Documentation contract workflow including quick-start, release-contract, frozen C ABI, exact SDK inventory, permanent M16-01/M16-02 gates, and truthful M16-03 claim checks
    - Linux GCC 11 and Clang 14 Debug and RelWithDebInfo, FMA on/off matrix with AddressSanitizer and UndefinedBehaviorSanitizer coverage of admission, dispatch, late actions, active stores, state restore, and lifecycle
    - Windows Server 2022 MSVC v143 Debug and RelWithDebInfo matrix covering identical integer admission/order, active policy results, source compatibility, and installed consumers
    - Unified executor GCC ThreadSanitizer job executing the complete RateDispatch and active CrossRateData suites, two-runtime isolation, host-adapter nested work, failure/stop, and permanent M15/M16 regression processes
    - Determinism GCC and Clang FMA-on and FMA-off jobs plus artifact exchange proving unchanged legacy/reference-only fixtures and explicit rejection of unsupported active D1/replay combinations
    - C and C++ embedding, add_subdirectory, installed-package, archive relocation, SDK header self-containment, compatibility aliases, exact 70-export C ABI consumers, and existing autotune/scaling smoke jobs
    - Existing no-allocation, bounded-memory-plan/control-ledger, M14.1 recovery, M15 rollback, M16 timeline/selection/store, sanitizer, fuzz-smoke, documentation, release-contract, and package gates; no hosted timing or controlled-hardware claim is authorized
  manual:
    - Human review must approve the additive C++ policy/context/result shape, conservative serialized admission model, logical-to-nominal time mapping, every late action, cross-domain dependency rule, generation lifetime, active checkpoint record, active replay rejection, and preservation of C ABI v8/device ABI v1/schema/package boundaries.
    - Human concurrency and safety review must confirm bounded executor/store operations, no callback after fail gating, no skipped producer under skip, exact hold aliasing, cancellation and stop ownership, post-start allocation freedom, and that M16-04 remains the only owner of optional shedding/recovery and versioned telemetry.
    - Performance review is limited to deterministic work/capacity counts and existing hosted smoke jobs. Any measured latency threshold, RT1/RT2 promotion, or controlled-hardware regression gate requires a separately approved named tuple and retained raw evidence.
risk:
  class: high
  hazards:
    - an optimistic admission formula can accept more declared work than the fixed reference order can complete, while an unchecked hyperperiod can overflow planning time or storage
    - host logical time, nominal wall time, periodic release time, per-domain deadline, and measured callback time can be conflated and produce drift or nondeterministic late actions
    - a skipped or held producer can expose an absent, overwritten, partial, newer, or wrongly aged channel generation to a consumer
    - catch-up can grow an unbounded backlog or callback burst when a large delta spans many supercycles
    - filtered/repeated phase execution can violate graph dependencies, resource ordering, device-token lifetime, nested-work ownership, or executor cancellation semantics
    - time-driven degrade or fail behavior can be mistaken for D1 determinism, optional shedding/recovery, or portable deadline evidence
    - active cursor, alias, payload, and fault state can be omitted from checkpoint identity/accounting or restored partially after malformed input
    - additions to aggregate C++ declarations can break 1.x source consumers even when stable C ABI tests remain green
    - common lifecycle and executor edits can regress M14.1 cleanup, M15 rollback, M16 reference/selection behavior, allocation bounds, sanitizers, package isolation, or legacy dispatch
  stop_conditions:
    - the exact baseline commit is unavailable, dirty, or lacks merged M16-02 commit 34f0752596d84ef1f98a8a0d544861bda4935f3f and all retained M15/M16 evidence
    - target contracts at the exact baseline contradict opt-in CPU-only serialized active dispatch, conservative declared-budget admission, time mapping, late actions, or the M16-04 boundary and require a different product decision
    - implementation requires changing stable C ABI v8, SONAME 8, device ABI v1, runtime-profile schema 7/25 keys, observability schema 2, checkpoint/input-log schema numbers or codecs, installed header/target inventory, support matrices, release version, or license
    - active correctness requires device completion-payload semantics, cross-domain ordinary graph dependencies, optional shedding/recovery, per-release telemetry schema evolution, or active D1/input-log action replay in this batch
    - exact admission or due-count arithmetic cannot remain finite, checked, conservative, and bounded by the existing supercycle plus explicit per-step limits
    - skip, catch-up, hold, degrade, or fail cannot remain explicit and bounded without silent mandatory omission, newer-sample substitution, unbounded retry/backlog, callback preemption, or ambiguous cursor advancement
    - active cross-rate transfer cannot preserve exact-size complete-before-visible publication, compiled generation selection, finite retention, two-runtime isolation, and ThreadSanitizer race freedom
    - active state cannot fit one bounded canonical checkpoint record and exact runtime-control accounting without changing schema-1 encoding or breaking transactional restore
    - implementation requires ordinary heap allocation, blocking mutexes, file I/O, hidden threads, spill execution, or unbounded waits after successful start
    - deterministic functional tests require timing sleeps/tolerances, root privilege, fixed topology, physical CUDA or FPGA/XDMA hardware, controlled timing hosts, secrets, signing, release, deployment, or production access
    - a required source, test, workflow, documentation, governance, or evidence change falls outside allowed paths or enters a forbidden path
rollback:
  strategy: Revert the opt-in execution/late-policy C++ API, admission and dispatch compiler/state, executor filtering, active cross-rate transfer and canonical checkpoint state, tests/CI, documentation/governance, release digests, and retained M16-03 evidence as one batch. Before discarding a running integration, require existing checked stop to quiesce callbacks and device/lane/stack/memory owners. The default and explicit reference-only M16-01/M16-02 paths then retain their exact pre-batch complete-graph behavior; no data migration, host setting, support promotion, release, or deployment rollback is authorized.
  data_migration: none
  release_action: Do not publish a release, promote a support/qualification tuple, alter hardware or RT records, or mark M16/CAP-M16 complete from this batch.
evidence:
  output:
    - docs/evidence/M16-03-<date>.md
    - exact baseline, changed files, commands, exit codes, focused test counts, required CI run/check identifiers, and human review result
    - public execution/late-policy model with defaults, bounds, active restrictions, source compatibility, identity, and every rejected configuration
    - complete admitted and infeasible schedule inputs, per-record declared start/finish/deadline output, independent-simulator digest, and checked arithmetic/capacity results
    - host and periodic logical/nominal windows plus every on-time, skip, catch-up, hold, degrade, fail, cap-exhaustion, callback-failure, and cursor/fault result
    - active cross-rate publication/copy/alias/generation lifetime proof, exact initial/produced/held/stale bytes, concurrency/ThreadSanitizer results, and two-runtime isolation
    - active-state checkpoint layout/round trip/rejection evidence, unchanged schema numbers and legacy/reference-only artifact bytes, and explicit active D1/input-log/replay boundary
    - dispatcher/store state storage reconciliation inside rate-plan/runtime-control bytes and MemoryPlan, post-start allocation proof, executor/lifecycle/cleanup results, and unchanged observability schema proof
    - C++ source, C ABI/device ABI/package/profile/schema/support/release/license compatibility status plus changed and preserved invariants
    - residual risks and all unperformed M16-04 shedding/recovery/versioned telemetry/action replay, controlled performance, privileged native, physical hardware, CUDA, FPGA/XDMA, HIL, field, latency, thermal, endurance, RT1, RT2, signing, release, staging, deployment, and production validation
  claim_boundary: Evidence may establish static, unit, independent integer admission/reference, fake-clock late-action, synthetic active-store concurrency, sanitizer, checkpoint-state, package, bounded-memory/no-allocation, and portable RT0 functional dispatch behavior only. Declared budget/WCET values are untrusted inputs, not measurements or deadline guarantees; mocks, fixtures, hosted CI, preflight, and documentation do not establish physical hardware, HIL, field performance, worst-case latency, RT1, RT2, signing, release, deployment, or production readiness.
