schema_version: 1
batch:
  id: M15-03
  title: Create and verify policy-backed runtime memory regions transactionally
  goal: Add an injectable/native memory-region provider, create the runtime's contiguous scratch, trace, and owned-stack regions through it, apply and verify supported residency policy before callbacks, and reverse partial commitments without absorbing M15-04 accounting closure or changing stable ABIs.
