  focused_tests_to_add:
    - additive device-rate registration/default construction and pre-M21 positional aggregate/source compatibility in direct, preferred installed, and compatibility installed C++ consumers
    - mixed CPU/HAL-v2 command-batch timeline compilation with exact backend, copied batch skeleton, completion budget, in-flight demand, buffer-slice/payload role, timeline, phase, domain, release, and substep inspection
    - independent checked-integer cyclic admission oracle agreement for harmonic, non-harmonic, simultaneous, co-prime, substep, half-open tie, previous-cycle wrap, distinct-backend overlap, and exact-capacity plans
    - boundary cases for Runtime outstanding, backend in-flight, command, wait, signal, timeline, registered-buffer, payload-reference, completion-poll, release-count, supercycle, completion-budget, and integer capacities
    - transactional rejection of zero/overflowed budgets, foreign/stale/wrong-kind handles, duplicate/rebound ownership, legacy or non-command-capable device phases, cross-backend buffers/timelines, unsupported timestamp domains, cyclic/unprovable waits, ambiguous signals, and declaration/payload mismatch
    - per-backend peak-demand and per-reference interval report agreement, stable first-failure diagnostics, deterministic equivalent-plan output, and absence of address/payload/vendor/wall-clock data
    - exact graph/replay identity sensitivity and control-ledger/MemoryPlan reconciliation for every device-rate semantic field, with unchanged no-device and CPU-only identity fixtures
    - proof that model admission performs no device provider, submit, poll, cancel, vendor, timeline, payload-publication, telemetry-schema, sampled-I/O, or new-thread action and that active mixed execution fails before callback until M21-02
    - failed-finalize correction/retry, repeated lifecycle, two-runtime handle/storage/report isolation, checked cleanup, no post-start ordinary allocation, and unchanged ordinary device-batch execution
    - full CPU-only M16, M17 HAL/device-ABI-v1, extension ABI, deterministic replay, package inventory, exact C ABI, and release-contract regression coverage
  required_ci:
    - Documentation contract workflow including truthful M21 model/admission-only claims, quick-start, release contract, frozen C ABI, exact SDK inventory, and support-matrix checks
    - Linux GCC 11 and Clang 14 Debug and RelWithDebInfo, FMA on/off matrix with AddressSanitizer and UndefinedBehaviorSanitizer coverage of mixed-plan validation, cyclic admission, overflow, identity, accounting, inspection, retry, and lifecycle
    - Windows Server 2022 MSVC v143 Debug and RelWithDebInfo matrix producing identical integer admission/order/report results and passing installed consumers
    - Unified executor GCC ThreadSanitizer job covering two-runtime configuration/finalization/inspection/start-rejection/ordinary-device regressions while proving M21-01 adds no active device lane
    - Determinism GCC/Clang FMA-on/off and artifact exchange proving unchanged no-device/CPU-only fixtures plus equivalent mixed-plan identity and report results
    - C and C++ embedding, add_subdirectory, installed-package, archive relocation, SDK header self-containment, compatibility aliases, exact 70-export C ABI consumers, and existing portable assurance/autotune/scaling smoke jobs
    - Existing M16 no-allocation/rate/replay gates, M17 v1/HAL-v2/batch/timeline/vendor gates, M15 accounting/rollback gates, and M20 portable assurance lane; no device-rate execution, hardware, controlled timing, or performance threshold is authorized
  manual:
    - Human review must confirm the additive C++ descriptor/query shape, single source of truth from the copied M17 command-batch declaration, half-open cyclic admission semantics, conservative capacity rule, exact ownership/timestamp/timeline validation, identity/accounting preservation, deterministic diagnostics, and M21-02 dispatch boundary.
    - The reviewer must confirm that declared completion budgets and backend capabilities are admission inputs rather than measured WCET or support evidence, and that no fake driver, hosted runner, or compiled report is described as physical CUDA, XDMA, DAC/DAQ, HIL, RT1, or RT2 validation.
risk:
  class: high
  hazards:
    - a naive interval model can accept a plan that exceeds backend in-flight or completion-poll capacity across simultaneous releases or supercycle wrap
    - duplicating the M17 batch/buffer/timeline declaration in a second rate API can permit contradictory ownership or payload identity
    - ambiguous completion-budget, deadline, tie, substep, optional-record, or cyclic-wait semantics can make independent admission implementations disagree
    - a device phase can retain a foreign, stale, cross-backend, wrong-kind, or unsupported command/timestamp/timeline reference while still producing a plausible plan
    - admitting device records can accidentally route them through the CPU dispatcher or ordinary frame path before M21-02 supplies bounded submission/completion semantics
    - new configuration/report storage can escape M15 accounting, mutate after finalization, allocate after start, leak across runtimes, or perturb no-device identity
    - public aggregate edits can break 1.x C++ source consumers even when stable C and device ABIs remain unchanged
    - a static compiled plan can be mislabeled as measured device performance, active device-rate execution, physical HIL, or RT qualification
  stop_conditions:
    - the exact target baseline is unavailable, dirty, or does not contain merged M20-PRE-01 evidence and the preserved M16/M17 implementation surfaces
    - implementation requires changing C ABI v8, SONAME 8, device ABI v1, extension ABI v1, HAL version contracts, Runtime statuses, artifact/runtime schemas, installed inventory, support matrices, qualification state, release version, license, or prior evidence
    - the same copied M17 command-batch declaration cannot remain the sole source for backend, commands, buffers, synchronization, and timeline identity
    - exact bounded cyclic admission cannot model simultaneous releases and previous-cycle outstanding work with checked integer arithmetic and deterministic tie rules
    - accepting a mixed plan would require active device submit/poll/cancel, payload publication, sampled-I/O semantics, late/shedding telemetry changes, a new lane/thread, or any M21-02 through M21-05 behavior
    - configuration/report storage cannot remain bounded, Runtime-instance-owned, exactly accounted, immutable after finalization, and allocation-free after successful start
    - credible validation requires timing sleeps/tolerances, a physical CUDA/XDMA/DAC/DAQ device, privileged or controlled host, Unreal, secrets, signing, release, deployment, or production access
    - any required source, test, workflow, documentation, governance, or evidence change falls outside allowed paths or enters a forbidden path
    - target contracts at the exact baseline contradict this model/admission-only vertical or require a new product decision about payload bytes, sampled-I/O, dispatch, completion, late actions, or qualification
rollback:
  strategy: Revert the additive device-rate policy and inspection API, mixed-plan compiler/admission/report storage, identity/accounting integration, tests/CI, documentation, governance synchronization, release-contract digest updates, and M21-01 evidence as one batch. No active device-rate batch, payload, sampled-I/O state, persistent data migration, host setting, support promotion, release, or deployment is created by M21-01; preserve the existing checked stop path for any ordinary running Runtime before discarding it.
  data_migration: none
  release_action: Do not publish a release, promote a support or qualification tuple, alter hardware/RT records, or mark M21/CAP-M21 complete from this batch.
evidence:
  output:
    - docs/evidence/M21-01-<date>.md
    - exact control and target baselines, changed files, commands, exit codes, focused test counts, required CI run/check identifiers, and human review result
    - public device-rate descriptor and report shapes with defaults, capacities, ownership, lifetime, copied/derived fields, completion-budget semantics, payload-reference roles, and deferred behavior
    - independent-oracle mixed-plan inputs and exact ordered intervals, backend peak demand, constraining capacities, wrap/tie/substep outcomes, and every rejected arithmetic/topology/capacity case
    - graph/replay identity comparisons and control-ledger/MemoryPlan reconciliation for every new semantic field, plus unchanged no-device and CPU-only identity/schema results
    - proof of zero device provider/vendor/submit/poll/cancel/payload/sampled-I/O action, deterministic pre-callback active-mixed rejection, unchanged ordinary device execution, two-runtime isolation, retryable failure, and post-start allocation results
    - exact C ABI v8 70-export fingerprint/SONAME, device ABI v1, HAL/extension contracts, schema/version, installed package/header/alias, support/qualification, license, and prior-evidence preservation results
    - residual risks and every unperformed M21-02 dispatch/completion, M21-03 cross-rate payload, M21-04 sampled-I/O, M21-05 replay/conformance, controlled performance, physical CUDA/XDMA/DAC/DAQ, HIL, field, latency, thermal, endurance, RT1, RT2, Unreal, signing, publication, release, deployment, and production validation
  claim_boundary: Evidence may establish additive C++ device-rate descriptors, immutable mixed CPU/device reference-plan compilation, deterministic checked-integer conservative admission, exact ownership/capacity/timeline/payload-reference validation, bounded configuration/report storage, identity/accounting integration, package compatibility, and portable RT0 static/unit/property/sanitizer behavior only. It does not establish active device-rate dispatch or completion, CPU/device payload transfer, sampled I/O, device WCET, controlled performance, physical CUDA/XDMA/DAC/DAQ behavior, HIL, electrical correctness, field evidence, latency, RT1, RT2, Unreal integration, support promotion, signing, publication, release, deployment, or production readiness.
