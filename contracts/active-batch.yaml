    - git diff --name-only 2c7ab323cfe5f00b68a71467889ca1dc5507365a
  focused_tests_to_add:
    - exact start-gate transition from M21-01 rejection to accepted mixed execution, with rejection before callback for stale, legacy, non-command-capable, unadmitted, or declaration-mismatched phases
    - materialized batch/provider context agreement for domain, phase, cycle, sequence, substep, logical/nominal release, absolute deadline, budget, late action, degradation, fixed command skeleton, buffer identities, and monotonic wait/signal values
    - precomputed release/dispatch/frontier/slot slices with exact MemoryPlan and logical control-ledger reconciliation and no per-release full-plan, graph, backend, buffer, timeline, or channel scan
    - independent backend and dependency-frontier overlap proving more than one admitted release can be outstanding, plus enforced CPU/device, same-domain, graph, and backend-timeline completion barriers
    - exact-capacity and one-over-capacity cases for per-phase, backend, Runtime outstanding, completion batch, provider materialization, dispatch queue, early completion, and terminal ledger slots
    - callback failure, malformed materialization, queue full, submit rejection, synchronous early completion, normal completion, batch error, malformed completion, unknown/duplicate/stale completion, device loss, and decreasing/wrong signal identity
    - checked completion-budget/deadline timeout arithmetic, equal-time ordering, one-shot cancellation, unsupported/rejected cancel, late completion quarantine, cleanup-pending retry, and no slot reuse before terminal ownership
    - deterministic existing skip, hold, bounded catch-up, degrade, fail, optional shedding/recovery, first-failure identity, StepResult counters, device metrics, trace, rate-action, and watchdog reconciliation for device releases
    - concurrent checked stop during provider, queued, submitting, submitted, early-complete, completion-ready, cancel, timeout, and terminal states; repeated stop, failed-stop retry, destruction, and start/stop/restart
    - no device provider for omitted work, no vendor call on executor/host lanes, no new thread, no post-start allocation, bounded scans/waits, two-runtime isolation, and unchanged ordinary device-batch behavior
    - default construction, positional aggregate/source compatibility, installed C++ consumer, CPU-only M16 execution, M17 v1/HAL-v2 behavior, exact ABI/package inventory, sanitizers, determinism, and prior evidence regressions
  required_ci:
    - Documentation contract workflow including truthful M21-02 simulated dispatch/completion-only claims, quick-start, release contract, frozen C ABI, exact SDK inventory, and unchanged support matrices
    - Linux GCC 11 and Clang 14 Debug and RelWithDebInfo, FMA on/off matrix with AddressSanitizer and UndefinedBehaviorSanitizer coverage of provider materialization, overlap, dependency barriers, early/late completion, timeout/cancel, stop/retry, and lifecycle
    - Windows Server 2022 MSVC v143 Debug and RelWithDebInfo matrix producing identical ordering, capacity, timeout-state, first-failure, and cleanup results and passing installed consumers
    - Unified executor GCC ThreadSanitizer job covering simultaneous backend completions, early completion, stop versus dispatch/poll/cancel, slot generation/reuse, and two Runtime instances without races or duplicate terminal settlement
    - Determinism GCC/Clang FMA-on/off and artifact exchange proving unchanged no-device/CPU-only fixtures plus equivalent mixed-plan release, terminal status, trace identity, and action results for deterministic fake backends
    - C and C++ embedding, add_subdirectory, installed-package, archive relocation, SDK header self-containment, compatibility aliases, exact 70-export C ABI consumers, and existing portable assurance/autotune/scaling smoke jobs
    - Existing M16 no-allocation/rate/replay gates, M17 v1/HAL-v2/batch/timeline/vendor gates, M15 accounting/rollback gates, and M20 portable assurance lane; no payload, sampled-I/O, physical-device, controlled-timing, or performance threshold is authorized
  manual:
    - Human review must confirm that the execution design permits admitted independent in-flight overlap, preserves every dependency/completion barrier, invokes vendor operations only on existing backend lanes, uses one finite atomic slot lifecycle, and cannot confuse a late completion with a reused generation.
    - The reviewer must confirm exact timeout/deadline/cancellation/stop ownership, no-allocation and bounded-scan arguments, additive C++ source compatibility, unchanged schema/ABI/package boundaries, and that fake-driver or hosted timing is not described as physical CUDA, XDMA, DAC/DAQ, HIL, RT1, or RT2 evidence.
risk:
  class: high
  hazards:
    - simply removing the M21-01 start guard can serialize every device release, violate admitted overlap, run a dependent CPU phase early, or reuse executor phase state while an earlier release is still outstanding
    - callback, submission-lane, poll-lane, timeout, cancellation, and stop actors can race to settle or recycle one slot and allow duplicate completion or use-after-free
    - a provider can mutate the copied declaration, inject a foreign buffer/timeline, choose an unbounded timeout, or publish non-monotonic timeline progress after finalization
    - an early, duplicate, stale-generation, malformed, cross-backend, or late completion can be attributed to the wrong domain release or advance a timeline incorrectly
    - timeout without proven provider terminal ownership can lead to premature slot reuse, backend teardown, or indefinite checked stop
    - per-release searches, dynamic storage, hidden waits, or vendor calls can enter executor/host active paths and invalidate the boundedness and no-allocation claims
    - device failures can be counted inconsistently across StepResult, rate actions, metrics, traces, watchdog state, and checked error identity
    - portable fake-driver concurrency or timing can be mislabeled as physical hardware performance, CUDA/XDMA support, HIL, RT1, or RT2 qualification
  stop_conditions:
    - the exact target baseline is unavailable, dirty, or does not contain merged M21-01 evidence and the immutable admitted device-rate plan
    - implementation requires changing C ABI v8, SONAME 8, device ABI v1, extension ABI v1, HAL version contracts, Runtime statuses, artifact/runtime schemas, installed inventory, support matrices, qualification state, release version, license, or prior evidence
    - active device execution cannot preserve the copied M17 declaration as the sole source for backend, commands, buffers, synchronization, and timeline identity
    - independent admitted releases cannot remain concurrently in flight without unbounded state, a new lane/thread, executor-phase corruption, dependency violation, or ordinary allocation after start
    - a finite timeout/cancel/late-completion/stop state machine cannot prevent reuse before terminal provider ownership or cannot provide retryable cleanup
    - implementation requires CPU/device payload publication, device cross-rate stores, sampled-I/O semantics, telemetry/schema changes, replay/checkpoint changes, M21-03 or later behavior, or a product decision not fixed by this contract
    - credible validation requires timing sleeps/tolerances, a physical CUDA/XDMA/DAC/DAQ device, privileged or controlled host, Unreal, secrets, signing, release, deployment, or production access
    - any required source, test, workflow, documentation, governance, or evidence change falls outside allowed paths or enters a forbidden path
    - target contracts at the exact baseline contradict this dispatch/completion-only vertical or require weakening a deterministic, sanitizer, no-allocation, compatibility, or release gate
rollback:
  strategy: Revert the additive device release context, immutable dispatch/frontier/ledger storage, active provider scheduling, DeviceManager rate identity and terminal state machine, timeout/cancel/stop integration, tests/CI, documentation, governance synchronization, release-contract digest updates, and M21-02 evidence as one batch. Restore the exact M21-01 pre-callback mixed-start rejection while preserving ordinary M17 command-batch execution and the M21-01 compiled admission model.
  data_migration: none
  release_action: Do not publish a release, promote a support or qualification tuple, alter hardware/RT records, or mark M21/CAP-M21 complete from this batch.
evidence:
  output:
    - docs/evidence/M21-02-<date>.md
    - exact control and target baselines, changed files, commands, exit codes, focused test counts, required CI run/check identifiers, and human review result
    - public additive release-context/inspection shapes, immutable dispatch/frontier/slot layout, ownership diagram, capacities, defaults, lifetime, timeout/deadline rule, and deferred behavior
    - deterministic due-release inputs and exact provider, enqueue, submission, completion, dependency-barrier, terminal, late-action, and StepResult order across normal, overlap, wrap, saturation, timeout, cancellation, failure, and stop cases
    - slot-state transition and generation proof for early, duplicate, unknown, malformed, stale, late, canceled, lost, and terminal completions with exact timeline publication results
    - no-allocation/bounded-scan evidence, exact MemoryPlan/control-ledger accounting, existing-lane inventory, provider/vendor thread provenance, two-runtime isolation, retryable cleanup, and unchanged ordinary device execution
    - exact C ABI v8 70-export fingerprint/SONAME, device ABI v1, HAL/extension contracts, schema/version, installed package/header/alias, support/qualification, license, and prior-evidence preservation results
    - residual risks and every unperformed M21-03 payload, M21-04 sampled-I/O, M21-05 replay/conformance, controlled performance, physical CUDA/XDMA/DAC/DAQ, HIL, field, latency, thermal, endurance, RT1, RT2, Unreal, signing, publication, release, deployment, and production validation
  claim_boundary: Evidence may establish bounded active release/provider dispatch, independent in-flight overlap, dependency barriers, existing-lane HAL-v2 command-batch submission, poll-only completion, deterministic timeout/cancel/late/stop behavior, exact release identity, fixed-capacity slot ownership, package compatibility, and portable RT0 fake-driver static/unit/property/sanitizer behavior only. It does not establish CPU/device payload transfer, sampled I/O, replay closure, device WCET, controlled performance, physical CUDA/XDMA/DAC/DAQ behavior, HIL, electrical correctness, field evidence, latency, RT1, RT2, Unreal integration, support promotion, signing, publication, release, deployment, or production readiness.
