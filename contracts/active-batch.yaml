schema_version: 1
batch:
  id: M15-01
  title: Add the CPU and memory policy model and exact runtime resource inventory
  goal: Add an additive C++ policy and report model for all required thread roles and memory-region classes, integrate portable no-op resolution and strict finalization validation, and expose exact inventory/accounting identities without applying native OS policy yet.
