    - python3 tests/test_release_tools.py -k PortableAssurance
    - CC=clang-14 CXX=clang++-14 cmake -S . -B build/m20-pre-01-static -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_TESTS=OFF -DRTFW_BUILD_EXPERIMENTAL=OFF -DRTFW_BUILD_EXAMPLES=OFF -DRTFW_BUILD_RUNTIME_DEMO=OFF -DSIM_DOWNLOAD_GTEST=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DSIM_WERROR=ON
    - python3 tools/check_static_analysis.py --compile-commands build/m20-pre-01-static/compile_commands.json --source-manifest tools/static_analysis_sources.txt --clang-tidy clang-tidy-14
    - CC=clang-14 CXX=clang++-14 cmake -S . -B build/m20-pre-01-fuzz -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_TESTS=ON -DRTFW_BUILD_EXPERIMENTAL=ON -DENABLE_RAPIDCHECK=OFF -DSIM_BUILD_FUZZERS=ON -DSIM_DOWNLOAD_GTEST=OFF -DSIM_SANITIZERS= -DSIM_WERROR=ON
