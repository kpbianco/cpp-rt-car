batch:
  id: M20-PRE-01
  title: Expand portable fuzz static security and provenance verification
  goal: Add one deterministic, fail-closed portable assurance lane that expands bounded fuzzing, analyzes the complete default first-party build surface, locks and checks build dependencies, generates and verifies a versioned artifact SBOM, verifies artifact manifests and provenance statements offline, and exercises offline cryptographic attestation verification from public fixture material without signing, publishing, releasing, or changing runtime behavior.
