  title: Close accounting rollback and compatibility
  goal: Close M15 with an exact, non-overlapping logical ledger for fragmented runtime, executor, and device control storage, runtime-owned stacks, and declared external/backend resources; make runtime-stack policy and cross-category cleanup fail-closed and retryable; and preserve every 1.2.1 ABI, package, determinism, allocation, and portable-default invariant without extending the existing three-region memory-provider acquisition boundary.
