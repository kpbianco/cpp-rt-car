acceptance:
  - The existing installed `rt/device.hpp` C++ source API adds a distinct size/versioned HAL-v2 memory/topology extension version 1 without adding an installed header or target and without changing the M17-01 core table or its API version. Fixed-width records and stable handles cover backend-scoped memory domains, topology nodes and directed links, completion timestamp domains and correlation capabilities, heterogeneous memory registrations, and synchronization requirements. Public fixed bounds are 16 domains, 32 topology nodes, 64 topology links, eight timestamp domains, and 64 opaque-handle bytes per backend; over-capacity discovery fails without truncation.
  - The public domain kind set represents host, pinned-host, CUDA-device, imported, DMA-mapped, and peer memory explicitly. Every domain reports a stable backend-local identity, supported ownership modes, positive byte/alignment/offset granularities, maximum bytes, host/device access, coherency model, required flush/invalidate/copy behavior, topology attachment, and timestamp/synchronization domain. Unknown enums, duplicate identities, zero or non-power-of-two granularities, inconsistent access/coherency/ownership flags, overflow, nonzero reserved fields, and over-capacity discovery fail transactionally.
  - Topology discovery uses bounded caller-provided storage and represents stable nodes and directed links without pointer values, buffer addresses, throughput, or latency claims. Every referenced node/domain exists exactly once in the same backend snapshot; malformed endpoints, self-links unless explicitly permitted by the link kind, duplicate links, impossible peer claims, and cross-backend handles fail before finalization commits.
  - Completion timestamps are never treated as runtime-monotonic time merely because `HalV2Completion::device_timestamp_ns` is populated. Each native extension declares the completion timestamp domain, tick unit/wrap/monotonic properties, and whether bounded correlation is supported. A correlation sample carries explicit source/destination domains, generation, sampled values, and uncertainty; unsupported or malformed correlation remains observable and is never invented, extrapolated across reset, or used as latency/RT evidence.
  - A configuring-only native HAL-v2 memory/topology extension is copied beside `HalV2BackendRegistration`. Discovery callbacks and outputs are borrowed only for the call, exceptions are contained, results are completely validated before publication, and the immutable copied snapshot and instance-owned handles remain inspectable before start, while running, and after stop without allocation or mutation.
  - Existing `DeviceBufferRegistration` and pre-M17-02 positional aggregate prefixes retain their source meaning as a borrowed, host-addressable legacy buffer. Internally they map to one canonical memory-object representation. An additive heterogeneous registration can use a copied host span or a bounded opaque backend/import handle, explicit bytes/domain/ownership/access/coherency/synchronization metadata, and returns the existing instance-owned `DeviceBufferHandle`; foreign domains, mismatched backends, null/empty backing, overlap where host ranges are comparable, alignment/range/capability violations, and unsupported peer paths reject before publication.
  - Native heterogeneous objects use the extension's register/unregister operations, while adapted device-ABI-v1 and native HAL-v2 registrations with no memory extension retain the exact M17-01 core host-buffer operation path. The device-ABI-v1 adapter synthesizes only the truthful implicit borrowed-host domain needed to preserve existing behavior; it never invents pinned, CUDA, imported, DMA-mapped, peer, topology, coherency, correlation, or synchronization support.
  - Startup registers legacy and heterogeneous memory in deterministic registration order behind the existing startup gate. Failure rolls back successful registrations in reverse order, retains any nonzero or otherwise uncertain backend token, publishes no false ownership release, prevents callbacks, and remains retryable. Checked stop unregisters all memory in reverse order before backend shutdown, preserves the first error while continuing independent cleanup, and retries only unresolved objects; borrowed host spans and opaque handles remain live until checked cleanup succeeds.
  - Submission buffer references continue to use the existing bounded logical `DeviceBufferHandle` and range/access validation. Legacy host-coherent/no-op synchronization references remain usable. A heterogeneous reference whose declared contract requires a flush, invalidate, staged copy, timeline operation, or other synchronization action that M17-02 cannot execute is rejected explicitly rather than submitted incoherently. M17-02 does not execute a command batch, timeline wait/signal, cross-device migration, flush/invalidate/copy command, CUDA Graph, XDMA MMIO/event operation, direct peer DMA, or potentially blocking vendor call on an executor worker.
  - Fixed copied extension tables, domain/topology/timestamp snapshots, heterogeneous registration descriptors, native tokens, and validation state are Runtime-owned and counted exactly once in `device_control_bytes`, the M15 logical device-control extents, and the existing six-row MemoryPlan equation. Borrowed host payload, opaque/imported/device storage, mapped apertures, and backend-private bytes remain excluded from owned planned bytes and are reported only with their truthful logical/declaration exactness; no seventh plan row or fourth provider region is added.
  - A native HAL-v2 backend without the optional memory/topology extension and every adapted-v1 configuration retain their exact M17-01 graph/replay identity and artifact compatibility. When the extension or an explicit heterogeneous registration is present, all semantic domain, topology, ownership, alignment, coherency, synchronization, timestamp, correlation-capability, and registration fields participate in compatibility identity; runtime addresses, callback pointers, native tokens, correlation samples, and mutable health do not. Checkpoint/input-log schemas and codecs remain version 1.
  - Configuration/finalization failure publishes no partial snapshot, handle, memory object, identity, or plan and permits correction. Two Runtime instances cannot share handles, mutable registration state, native tokens, discovery snapshots, or cleanup ownership. After successful start, inspection, reference translation, submission/poll/completion, health/reset, failure, and checked cleanup use fixed storage and add no ordinary heap allocation, hidden thread, blocking mutex, unbounded wait/retry, spill, host callback from poll, or file/network I/O.
  - The unchanged deterministic mock, CUDA candidate, and XDMA candidate remain device-ABI-v1 backends and pass through the M17-01 adapter with only the implicit legacy host domain. Portable injected native-extension tests may validate all six domain kinds and synthetic topology/coherency/timestamp failures, but neither those tests nor existing CUDA fake-driver/XDMA fixture suites establish physical pinning, device memory, DMA mapping, peer access, topology discovery, timestamp accuracy, HIL, hardware, latency, RT1, or RT2 behavior.
  - Stable C ABI v8 with exactly 70 exports and its frozen fingerprint, SONAME 8, every device-ABI-v1 declaration/layout/value, M17-01 HAL core version 2 and source behavior, Runtime status values, runtime-profile schema 7 and 25 keys, global observability schema 2 and existing IDs, rate-action schema 1, installed target/header inventory and compatibility aliases, release 1.2.1, support matrices, and Apache-2.0 remain unchanged. The extension is a C++ source contract with recompilation required and no C++ binary ABI promise.
  - Target governance, active batch, current state, handoff, roadmap, HAL/device/heterogeneous-memory/host/executor/memory/testing contracts, release digest ledger, and retained M17-02 evidence describe the implemented contract and keep M17/CAP-M17 incomplete. Focused tests, clean installed-package consumers, complete deterministic local verification, mandatory GitHub CI, and human public-API, topology/coherency/timestamp, compatibility, lifetime, accounting, concurrency, security, and claim-boundary review pass before merge.
validation:
