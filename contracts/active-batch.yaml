  focused_tests_to_add:
    - Runtime command/timeline discovery gives callbacks the exact initialized size/version input prefix and zero semantic/reserved fields, then rejects untouched, partial-malformed, header-corrupting, over-capacity, reserved, error, and exceptional outputs transactionally before accepting a corrected complete record.
    - Both actual native CUDA and XDMA candidates with injected version-2 drivers register together through `Runtime::register_device_backend(HalV2BackendRegistration, ...)`; the regression fails on the M17-05 implementation and passes only through the repaired canonical discovery path.
    - Default portable build and CTest execution of the combined sample on a host with no CUDA toolkit, GPU, XDMA device node, driver, firmware, bitstream, privilege, network, or secret.
    - Exact CPU prepare, CUDA upload/Graph/download, CPU host bridge, XDMA H2C/control-write/event-wait/C2H, and CPU validate dependency/call order with deterministic final values for at least two frames.
    - Distinct backend-local timeline ownership, accepted/completed monotonic values, whole-completion publication, and explicit proof that no CUDA timeline handle appears in XDMA waits/signals or vice versa.
    - Disjoint CUDA/XDMA host registrations, exact fixed bridge extent, stable Graph/control/event identifiers and opcodes, and absence of peer memory, dual registration, implicit synchronization, or pointer-derived identity.
    - Provider/executor, Runtime submission/service, and XDMA fixed-worker thread identities proving no injected vendor callback runs on an executor worker and no new worker or lane exists.
    - Complete-frame post-start zero-allocation coverage, exact fixed storage and operation counts, deterministic repeat execution, and no wall-clock performance threshold or latency claim.
    - Two independent Runtime/backend/sample fixtures with isolated handles, Graph IDs, device/card/event storage, buffers, timelines, traces, failure flags, stop state, and reverse cleanup.
    - CUDA Graph failure and XDMA event/C2H failure with stage-accurate downstream suppression, no later-backend submission after upstream failure, no timeline advancement from synthesized failure, exact error propagation, quarantine/checked-stop behavior, unresolved-only retry where applicable, and fresh-run recovery.
    - Stable sample success text and retained evidence labels explicitly stating simulated protocol, no physical hardware, and no direct peer DMA.
    - Permanent M14.1/M15/M16/M17-01 through M17-04/M19-01 lifecycle, ABI, compatibility, accounting, determinism, package, no-allocation, sanitizer, and claim-boundary regressions.
  required_ci:
    - Documentation contract workflow validates the repaired in/out discovery rule, exact graph/staging/timeline topology, simulated-evidence labels, current state/handoff/roadmap, release digests, frozen C/device/extension ABIs, exact SDK inventory, and all permanent M15/M16/M17/M19 gates.
    - Linux GCC 11 and Clang 14 Debug and RelWithDebInfo FMA-on/off matrix builds and runs the new discovery integration, sample success/failure/isolation tests, and executable with AddressSanitizer and UndefinedBehaviorSanitizer enabled on Debug tuples and no sanitizer finding.
    - Windows Server 2022 MSVC v143 Debug and RelWithDebInfo matrix builds and runs the same portable tests/executable with exact graph order, opcodes, fixed outputs, evidence labels, source compatibility, and no Linux, CUDA-toolkit, or device-node dependency.
    - Unified executor GCC 11 ThreadSanitizer job executes the discovery, sample success/failure/isolation, complete VendorHalV2, CUDA Graph, XDMA control/event, CommandBatch, HeterogeneousMemory, HAL-v2/v1-adapter, blocked-stop, and permanent M15/M16/M19 selections without a report, weaker filter, disabled test, or relaxed timeout.
    - Determinism GCC/Clang FMA-on/FMA-off jobs and artifact exchange remain byte exact for existing fixtures; the sample produces the same integer outputs, frame counts, and normalized stage trace on every portable tuple without being relabeled as hardware or controlled-timing evidence.
    - Host-independent performance-regression gate proves compile-time/finalization-time fixed storage, zero ordinary allocations across complete post-start frames, exact bounded command/callback/poll/driver counts, and no capacity growth; it uses no elapsed-time threshold or RT1/RT2 claim.
    - C/C++ embedding and add_subdirectory jobs build and run the default non-installed sample beside existing examples on GCC and Clang without a toolkit or device node, while installed-package, archive relocation, non-default include, header self-containment, aliases, and exact 70-export C ABI gates prove no installed-surface change.
    - Existing CUDA-toolkit compile/install/consumer and node-free XDMA compile/install/consumer jobs remain mandatory compile/package evidence only; neither job executes hardware or upgrades a support/qualification claim.
    - Existing warnings-as-errors/static contract checks, bounded fuzz smoke, dependency review, SBOM, autotune, scaling, observability schema, no-allocation, M14.1 recovery, M15 rollback, M16 multi-rate, all M17 core/memory/command/vendor, M19 extension, release-contract, package, CUDA fake-driver, and XDMA portable gates remain green.
  manual:
    - Human API, architecture, and compatibility review confirms the repair is the exact caller-seeded command-capability protocol already used by the surrounding versioned HAL records, preserves fail-closed output validation, changes only `rt/src/command_batch.cpp`, and adds no public/vendor/ABI/schema/status/package/support capability.
    - Human concurrency, lifetime, and safety review confirms exact dependency order, disjoint host ownership, bounded bridge, backend-local timelines, thread ownership, accepted-before-complete and whole-completion rules, fixed storage, failure suppression, quarantine, reverse retryable cleanup, no detached work, and no allocation in measured frames.
    - Human test and claim review confirms the behavioral regression traverses both actual native candidate registrations, failure tests would catch bypasses, and GPU/FPGA/Graph/DMA/MMIO/event wording denotes injected simulated protocol roles only.
    - A maintainer must explicitly approve any protected-branch merge after every required CI check and review passes. M17-06 does not authorize an agent to commit, push, open or merge a pull request, release, deploy, change settings, or waive a gate.
    - Physical combined execution is neither required nor authorized. Any later physical run requires a separately approved M18 plan with exact GPU/FPGA/driver/firmware/bitstream/BDF/topology/workload identity, pre-retained thresholds where timing is measured, raw evidence, and human promotion review.
risk:
  class: high
  hazards:
    - Initializing the input header can accidentally make an untouched or partially malformed callback look valid if zero-capacity and reserved-tail validation is weakened.
    - Repairing a vendor callback or public record instead of the canonical Runtime discovery site would preserve the mismatch for other conforming backends or change an already published source contract.
    - An ordinary graph dependency can be mistaken for a cross-backend hardware fence even though correctness depends on completed CUDA download, CPU bridge completion, and later XDMA upload.
    - Overlapping or dual-registered host storage can obscure ownership, race two backends, or falsely imply peer access or coherent shared memory.
    - Fake CUDA Graph and XDMA control/event callbacks can mutate data synchronously or on the wrong thread and hide accepted-before-complete, staging, timeout, quarantine, or lane-ownership defects.
    - Sample state can allocate after start, use dynamic logs, race submission/service/XDMA workers, share globals across Runtime instances, or outlive checked cleanup.
    - A Runtime-generated failure can still advance a timeline or release downstream graph work if assertions observe only the final output instead of every phase and driver call.
    - Default sample wiring can leak toolkit, Linux-driver, feature-macro, warning, dependency, installed-target, or package requirements into portable builds.
    - Success wording, GPU/FPGA names, sanitizer results, hosted CI, or deterministic counts can be overstated as physical execution, peer DMA, bounded latency, hardware qualification, RT1, or RT2.
  stop_conditions:
