acceptance:
  - An additive C++ memory-region provider boundary exposes immutable capabilities and bounded allocate, verify, and release operations with opaque ownership handles; Runtime borrows an injected provider without changing runtime-config schema 7, stable C ABI v8, SONAME 8, or device ABI v1.
  - Phase scratch, task scratch, trace storage, and non-default runtime-owned thread stacks are created through the selected provider with checked alignment, page rounding, before/after guards, prefault, lock, pin, huge-page preference/requirement and fallback, NUMA binding, first touch, residency verification, and rollback resolved only where provider capabilities support them.
  - Existing logical runtime, executor, and device control aggregates remain exactly accounted and retain their 1.2.1 allocation topology; non-default creation-only policy on those aggregates falls back for best effort and fails closed when required rather than claiming provider ownership that does not exist.
  - Host-owned registered state and device buffers plus backend-owned storage remain verify-only and are never allocated, guarded, locked, pinned, rebound, first-touched, or released by the runtime.
  - Linux native memory creation uses checked page geometry and retains native system errors and actual huge-page fallback; unsupported platform, permission, NUMA, lock, pin, or residency operations never become qualification claims.
  - Runtime-owned custom stacks are created only through a provider/platform path that can bind the supplied stack before thread entry; external frame, host-adapter, and backend/vendor stacks are never replaced or released by the runtime.
  - Provider-created finalization regions commit only after every required application and verification succeeds; a partial failure releases allocations in deterministic reverse order and leaves Runtime configuring with inspectable failure reports and no leaked provider handles.
  - Startup stack creation joins every started lane before releasing stack storage; a required stack apply or verification failure aborts before callbacks and reverses device/backend startup through existing checked cleanup, retaining failed and rolled-back report state.
  - Best-effort failures retain requested, resolved, applied, verified, fallback, residency, native-error, and rollback state while portable defaults preserve the 1.2.1 aligned-new storage and implementation-owned thread-stack behavior.
  - Repeated failed finalization/start and later success plus two concurrent runtimes do not retain stale handles, reports, stack storage, provider state, or cross-runtime memory policy state.
  - Runtime callbacks and steady-state RT lanes add no allocation, file I/O, hidden thread creation, blocking mutex, unbounded wait, or spill execution.
  - Documentation states that injected/native provider tests and unprivileged Linux inspection do not establish RT1, RT2, NUMA, huge-page, locked-memory, CUDA, XDMA, or combined-hardware qualification.
  - Focused tests, full local verification, and required GitHub CI pass.
validation:
  local:
    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - ./scripts/agent-verify.sh full
  focused_tests_to_add:
    - injected provider allocation, verification, and deterministic reverse release for scratch, trace, and owned stacks
    - required allocation/apply/verification failure before callbacks with retry and no leaked handles
    - best-effort unsupported and native failure fallback with retained requested, applied, verified, and system-error state
    - checked alignment, page rounding, guard, and footprint overflow boundaries
    - huge-page fallback versus require semantics and residency mismatch
    - NUMA, first-touch, lock, pin, prefault, and residency capability resolution without privilege-dependent assertions
    - external registered-state, device-buffer, backend-storage, host-adapter, frame-stack, and vendor-stack verify-only behavior
    - runtime-owned custom-stack startup/abort/join/release ordering where supported
    - repeated failure retry, two-runtime isolation, and no-allocation steady-state regression
  required_ci:
    - Linux GCC and Clang Debug/RelWithDebInfo
    - Windows MSVC Debug/RelWithDebInfo portable fallback
    - AddressSanitizer, UndefinedBehaviorSanitizer, and ThreadSanitizer
    - determinism artifact exchange
    - installed package and compatibility consumers
    - documentation, release, and exact C ABI contracts
  manual:
    - Review the additive provider/allocation-handle C++ source compatibility before merge.
    - Inspect representative Linux mapping, guard, residency, lock, huge-page fallback, and NUMA results without treating them as RT or hardware qualification.
risk:
  class: high
  hazards:
    - mismatched allocation/release callback or release before the last thread leaves a custom stack
    - guard and page-rounding arithmetic exposing or protecting the wrong pages
    - best-effort fallback being reported as applied or verified
    - partial finalization or startup leaking locked, pinned, NUMA-bound, or provider-owned mappings
    - permission-dependent Linux behavior causing nondeterministic portable tests
    - custom-stack thread creation diverging from existing lifecycle and cleanup ordering
    - cross-platform or cross-runtime provider state leakage
  stop_conditions:
    - stable C ABI v8, SONAME 8, device ABI v1, status codes, package inventory, or license changes become necessary
    - existing control aggregates must be re-arena-allocated or M15-04 exact accounting must be absorbed to make a truthful claim
    - a provider cannot return an ownership handle sufficient for exact reverse release
    - an external host/vendor allocation or thread stack would need runtime mutation
    - deterministic tests require privilege, hardware, weakened assertions, timing-only synchronization, or the experimental NUMA/SimCore path
    - source changes outside allowed paths are required
    - current repository contracts contradict this batch
rollback:
  strategy: Revert the M15-03 implementation and active-batch commit; M15-02 thread policy remains the baseline and all runtime storage returns to aligned-new and implementation-owned default stacks.
  data_migration: none
  release_action: Do not publish a release from this batch unless separately approved.
evidence:
  output:
    - docs/evidence/M15-03-<date>.md
    - exact commands and exit results
    - acceptance mapping and provider capability matrix
    - allocation, apply, verify, commit, and reverse-release ordering
    - changed and preserved invariants
    - native system errors and portable fallback coverage
    - residual risks and unperformed privileged, hardware, NUMA, huge-page, locked-memory, and RT validation
  claim_boundary: Evidence is static, unit, injected-provider, unprivileged local Linux where available, package-contract, and portable RT0 only; it does not qualify RT1, RT2, NUMA placement, locked memory, huge pages, CUDA, XDMA, or combined hardware.
