acceptance:
  - The implementation begins from an initially clean target at exact default-branch commit `46a69204ecccd17e7c1da76e30d4e23bde6eb9ef`, the merged M21-03 pull request 244. Retained M15 through M21-03 evidence is present and unchanged, and governance records M21-03 as merged without inventing sampled-I/O loopback, replay, physical, RT, Unreal, signing, release, publication, deployment, or production results.
  - Sampled-I/O registration is an additive C++ surface copied and frozen before finalization. Each descriptor has an explicit direction, nonzero channel identity, closed fixed-width sample encoding, checked channel/element/frame extents and strides, rational or otherwise exactly representable scaling metadata, units identity, calibration identity, sample period/rate identity, timestamp domain, clock domain, trigger mode and trigger identity, bounded ring capacity, initial sequence, maximum age, and explicit stale, overrun, underrun, startup-safe, failure-safe, and shutdown-safe policies. Raw addresses, dynamic strings, callbacks, vendor handles, implicit defaults for safety behavior, and unbounded payloads are forbidden.
  - Every sampled input or output resolves to one exact admitted M21-03 device payload endpoint and copied pre-registered host-visible coherent buffer envelope. Direction, access, sample encoding, checked byte geometry, alignment, execution-slot stride, ring-slot stride, maximum in-flight count, rate domain, backend, command reference, and clock/timestamp identities must agree. Foreign, stale, ambiguous, inaccessible, incoherent, overlapping, undersized, zero-capacity, overflowed, or declaration-mismatched registrations fail transactionally before start.
  - Finalization compiles immutable direct sampled-channel, release, execution-slot, and ring-slot records plus fixed ownership and retirement state. It derives all backend, buffer, range, rate, trigger, clock, timestamp, and capacity identities from copied declarations and does not scan every channel, phase, buffer, command, or graph edge on each sample, release, completion, or safe-state transition.
  - >-
    Sample frames have one fixed header and exact payload extent: channel identity, monotonically checked nonzero sequence, release/batch generation, sample count, timestamp domain, first-sample timestamp, fixed sample interval where applicable, trigger identity/sequence, status, calibration identity, and payload checksum or equivalent deterministic content identity. A backend cannot publish an uncorrelated frame, change the frozen format or calibration identity, or supply completion-owned dynamic metadata.
  - Input capture publishes only after exact correlated terminal success and complete frame validation. Sequence, release, completion status, timestamp/clock/trigger domains, timestamps, sample count, encoding, extent, checksum, and execution/ring slot must match the compiled declaration before the frame becomes selectable by a CPU consumer. Submission acceptance, partial capture, malformed completion, error, timeout, cancellation, loss, quarantine, skipped or shed release, and late completion publish no new input frame.
  - Output materialization selects one exact committed CPU-produced generation by immutable release-time rules, applies the declared deterministic encoding/scaling contract into the Runtime-selected execution/ring slot, and completes the copy before provider invocation and lane publication. The backend may not choose a different range, format, calibration, sequence, safe value, or trigger identity. Failed or stale selection follows only the declared output policy and never silently reuses arbitrary bytes.
  - Stale, underrun, and overrun behavior is closed and deterministic. Input may fail the release, hold the last frame only within its inclusive maximum age, or substitute an explicitly copied initial/safe frame. Output may fail the release or substitute the explicitly copied safe frame. Ring-full behavior either rejects the new frame or fails the release; it never overwrites a slot still owned by an in-flight release or selectable consumer. Every result is inspectable through fixed-size additive C++ status/sequence counters without changing the versioned observability or rate-action schemas.
  - >-
    Safe output is a copied exact-size frame per output channel and cannot be inferred from zeroed memory. Startup drives the declared startup-safe frame and requires correlated terminal acknowledgement before active output admission. Stop/failure order is fixed: close new release admission, settle or cancel owned work within existing finite budgets, enqueue each required safe frame through the existing backend lane, correlate terminal acknowledgement, then stop/detach the backend. Timeout, loss, malformed acknowledgement, or cancellation leaves checked stop non-successful and safety state explicitly unknown; software never claims an unacknowledged physical safe state.
  - The public loopback backend implements the unchanged HAL-v2 registration/start/submit/poll/cancel/reset/stop contract with caller-provided or Runtime-accounted fixed storage, no hidden thread, no heap allocation after start, and no vendor dependency. It accepts only the sampled descriptors registered for its exact backend, transfers complete frames between paired input/output channels, provides deterministic timestamp/trigger/completion identity from injected logical inputs, supports bounded injected stale/overrun/underrun/error/timeout/loss cases, and exposes acknowledged safe frames for test inspection.
  - One installed-package-tested loopback scenario executes plant output to sensor encoding to controller input to actuator output across at least three distinct rate domains. It proves normal first-cycle and steady-state data, scaling/calibration identity, sample/hold age, external/software trigger identity, wraparound, backpressure, safe startup, injected stale/overrun/underrun/failure, and ordered checked shutdown without network, process, sleep-based timing, hardware, or vendor-specific code.
  - Ring and execution-slot ownership is generation safe. A producer cannot overwrite bytes readable by the backend or consumer; a late completion cannot publish into a recycled slot; sequence wrap/exhaustion fails before ambiguity; safe-state work has distinct ownership from active output; and retirement occurs only after exact completion plus all compiled consumers settle. Multiple Runtime and loopback instances share no mutable global state.
  - Sample capture, selection, encoding, copying, ring claim/retirement, and safe-frame materialization perform bounded direct-index work with checked integer arithmetic. They allocate no ordinary heap, take no blocking mutex, perform no file/network I/O, start no thread, invoke no vendor code on executor/host lanes, wait for no device operation, and do not retry, scan, or spill to another slot.
  - Failed finalization or startup publishes no partial sampled plan, ring ownership, active release, or safety claim and remains retryable through existing replacement/cleanup rules. Successful finalization counts descriptor copies, initial/safe frames, ring metadata, controls, staging, loopback state, and retention exactly once in existing `MemoryPlan` categories and `planned_bytes`; borrowed registered-buffer bytes are not counted as Runtime-owned storage.
  - Graph/config identity includes every copied sampled descriptor, encoding/extent/stride, scale, units/calibration, rate/clock/trigger/timestamp, policy, initial/safe frame, derived range/ring layout, and loopback pairing identity that can change execution. It excludes raw addresses, pointer/callback values, wall-clock measurements, post-configuration payloads, completion arrival order, and injected fault timing. Equivalent registration order canonicalizes to the same identity.
  - Existing CPU-only M16 channels, ordinary M17/HAL-v2 backends, M21-02 channel-free dispatch, M21-03 non-sampled payloads, checkpoint schema-1 artifacts, replay inputs, rate-action and observability schemas, CUDA/XDMA candidates, package consumers, two Runtime instances, and repeated start/checked-stop retain prior behavior. M21-04 does not retrofit sampled frames into checkpoint/replay or device-action telemetry; M21-05 owns overload, replay, telemetry, watchdog, and reusable conformance closure.
  - M21-04 adds portable sampled-I/O and loopback semantics only. It does not add a DAC/DAQ/CAN/IIO/XDMA/CUDA vendor adapter, physical trigger or sample-clock measurement, electrical scaling/calibration correctness, external-process CIL, performance thresholds, CUDA physics, hot reload, a golden demo, Unreal, or a support/qualification promotion.
  - Stable C ABI v8 with exactly 70 exports and frozen fingerprint `0xd0e7a5a14bf35f97`, SONAME 8, device ABI v1, extension ABI v1, HAL core v2 and extension v1 contracts, runtime-profile schema 7 and 25 keys, observability/checkpoint/input-log/rate-action schemas, Runtime status values, release 1.2.1, installed target/alias inventory, support matrices, qualification state, and Apache-2.0 remain unchanged. The additive loopback header is the only intended installed-header inventory addition and is covered by relocation/self-containment checks.
  - Target governance, current state, handoff, sampled-I/O/HAL documentation, release digest ledger, and retained `docs/evidence/M21-04-<date>.md` state the exact portable RT0 loopback boundary. Focused and full local verification, mandatory hosted CI, and human ownership, safety-ordering, boundedness, compatibility, and claim review pass before merge. M21 and CAP-M21 remain incomplete until M21-05.
