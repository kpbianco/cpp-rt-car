batch:
  id: M22-02
  title: Commit live controls at exact frame and rate-release boundaries
  goal: Consume the merged M22-01 per-Runtime mailboxes without parsing payloads on execution lanes, close each host-frame or active rate-release target exactly once, publish one immutable generation atomically before the target callbacks observe it, define deterministic cross-mailbox ordering plus late, missed, replacement, overflow, and stop behavior, reclaim bounded staging capacity safely, and expose fixed-size commit inspection. Preserve every stable ABI and existing artifact schema while deferring rollback, checkpoint, replay, telemetry, typed SDK helpers, and milestone closure to M22-03 and M22-04.
