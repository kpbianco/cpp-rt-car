acceptance:
  - The implementation starts from exact clean default-branch baseline `dbedb8ba9779b0a39676576326d689702659872f`. M19-01 is present through merged target pull request 224 at `d5224e670e3ca5ebbe3d2aec5fda7d21213499a8`; later target changes through the baseline are portfolio-harness synchronization and the bounded aggregate-test timeout repair. Every retained M15 through M19-01 evidence record is present. M17-05 remains blocked, and M19-02 does not repair or bypass it or mark M17, M18, M19, CAP-M17, CAP-M18, or CAP-M19 complete.
  - One source-distributed opt-in Unreal plugin contains a runtime adapter module and an automation-test module using only documented public Unreal headers and APIs from one explicitly approved engine version and host tuple. The module links a separately built relocated `rtfw_runtime` from the exact target revision with a compatible compiler, C++ runtime, configuration, architecture, and exception model; it does not compile RTFW sources into the module, expose a cross-compiler C++ binary boundary, depend on the experimental plugin manager, or become a default CMake target or installed SDK header.
  - >-
    The runtime module is passive: loading it constructs no `rt::Runtime`, registers no world, engine, tick, or hot-reload delegate, starts no worker, and owns no process-global mutable Runtime registry. M19-02 exposes configuring-time job, allocator, clock, and frame-context adapter objects only. World-to-Runtime ownership, start/step/stop orchestration, concurrent world instances, module shutdown, extension detach, operating-system unload, hot reload, and the complete sample remain exclusively M19-03 and M19-04 work.
  - The Unreal job adapter reserves an explicit power-of-two capacity and all adapter-owned job/task/control storage before `Runtime::start()`, exposes an exact `rt::HostExecutorAdapter` with matching worker and total-queue capacities, copies each accepted `HostExecutorJob`, and submits it through a public Unreal task facility. Its submit operation is bounded and nonblocking, performs no adapter-owned allocation, retry, wait, spill, inline fallback, or new thread creation, and returns `queue_full` only when the job was neither accepted nor invoked.
  - Every accepted engine job invokes the unchanged RTFW execute pointer exactly once with the copied contexts/token/scratch and a logical worker index below the declared count. Slot state prevents concurrent reuse until both RTFW execution and the engine scheduler have released the task node. Saturation, launch rejection, stop admission closure, late engine dispatch, stale/duplicate invocation, task-node reuse, and generation wrap fail closed without executing a later job, releasing live scratch, or losing an accepted completion.
  - The required one-job help callback attempts at most one already accepted adapter job using a documented public nonblocking engine task operation and returns immediately. It never waits for arbitrary engine work, recursively drains the engine scheduler, executes an unaccepted job, or enters a private Unreal task header. Nested RTFW range/reduction work on engine task workers completes without deadlock under full declared capacity, while unrelated engine tasks and the game thread remain outside RTFW ownership.
  - Engine worker threads, scheduler queues, internal task bookkeeping, thread IDs, affinity, priority, stacks, and any engine-internal allocation remain externally owned and verify-only. The adapter reports only its exact preallocated slots and declared logical capacity. A logical RTFW worker index is not presented as a physical Unreal worker identity or scheduling/affinity observation, and any engine-internal allocation discovered during accepted submit/help is recorded and blocks a no-allocation or RT claim rather than being hidden.
  - The Unreal allocator adapter supplies the existing copied memory-provider version-1 table and borrows only an explicitly owned adapter context through checked Runtime stop. It allocates exactly the three existing active phase-scratch, task-scratch, and trace regions through `FMemory` with the requested checked size and alignment, returns nonoverlapping exact extents/tokens, independently verifies the allocator-reported extent before claiming observation, and releases only successfully owned tokens once in reverse Runtime order.
  - Allocator apply, observe, rollback, and release are nonthrowing, nonreentrant, status-preserving, and retry-safe. The adapter advertises only capabilities it actually implements. It never describes `FMemory` allocation or allocator-size observation as guard pages, huge pages, prefault, residency, locking, device/DMA pinning, NUMA placement, physical commitment, or independent OS readback; strict requests for unsupported facts fail before callbacks, and best-effort reports remain explicitly unsupported, incomplete, or zero as appropriate.
  - >-
    The Unreal clock adapter is Runtime-instance-borrowed and returns monotonically nondecreasing nanoseconds from one documented engine monotonic clock without a process-global epoch or floating accumulation. Conversion to nanoseconds is checked for finite input, sign, precision/range, and overflow. It does not claim or implement engine-owned sleeping: `supports_absolute_sleep()` is false and `sleep_until_ns()` returns `clock_failure`, so the adapter supports host-driven `step()` only and cannot be passed off as qualified `run_periodic()` pacing.
  - A frame-context helper maps an explicit engine frame sequence, positive finite simulation delta, and optional engine-clock deadline/nominal release into `HostFrameContext` with documented rounding and overflow behavior. It never derives simulation delta from the monotonic clock, sleeps, invents a frame counter, changes active-rate logical-time semantics, or silently mixes engine world time, real time, audio time, network time, and the Runtime clock domain.
  - Real approved-engine automation exercises the actual runtime module, public task facility, `FMemory`, and engine monotonic clock in both an editor target and a non-editor game target. It proves exact accepted/executed job counts, capacity rejection without acceptance, nested helping, scratch/token preservation, allocator acquisition/rollback/release, unsupported-policy truth, monotonic/overflow/rounding behavior, Runtime host-driven start/step/checked-stop integration, and two independent adapter/Runtime objects. Portable fake seams may supplement these tests but never replace or relabel the engine run.
  - Adapter configuration, job storage, allocator ownership, and clock state remain instance-owned and bounded. After successful Runtime start, RTFW and adapter-owned work adds no ordinary heap allocation, hidden thread, file/network I/O, blocking mutex, unbounded wait/retry, or spill path. Any allocation or synchronization internal to the approved Unreal task system is measured and reported separately as host behavior and prevents an RT1/RT2 or worst-case claim until the complete engine tuple is qualified.
  - The approved Unreal tuple records a preselected, non-flaky functional performance-regression budget for adapter submit/help overhead, sustained bounded-capacity job completion, and allocator setup/teardown outside the steady-state frame. Results are compared only on the same retained engine/host/build tuple, never used as a portable or worst-case latency claim, and a regression blocks merge rather than changing thresholds after measurement.
  - Stable C ABI v8 remains exactly 70 exports with frozen fingerprint and SONAME 8; device ABI v1, extension ABI v1, HAL core v2, memory/topology extension v1, command/timeline extension v1, Runtime status numeric values, runtime-profile schema 7/25 keys, observability/rate/checkpoint/input-log schemas and IDs, the default installed target/header inventory and aliases, release 1.2.1, support matrices, qualification schemas/workflows, and Apache-2.0 remain unchanged.
  - Documentation and retained evidence identify the exact Unreal version/distribution, engine commit or build identifier, UBT/UAT, compiler/SDK/runtime, host OS/architecture, RTFW library configuration and digest, plugin staging path, public engine APIs used, commands, test reports, allocation observations, and changed/preserved invariants. A plugin manifest, UBT compile, editor automation run, fixture project, mock seam, hosted CI, preflight, or documentation does not by itself establish packaged-game behavior, world lifecycle, unload/hot reload, physical hardware, HIL, field, latency, RT1/RT2, signing, release, deployment, or production readiness.
  - Focused approved-engine automation, default target verification, relocated SDK linkage, editor and non-editor UBT builds, complete deterministic local verification, mandatory standard and Unreal CI, and human engine-API, concurrency/lifetime, allocator/accounting, time/determinism, package/compatibility, security, and claim-boundary reviews pass before merge. M19 and CAP-M19 remain incomplete after M19-02.
validation:
  local:
    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - ./scripts/agent-verify.sh full
    - cmake -S . -B build/m19-02-sdk -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTS=OFF -DRTFW_BUILD_EXPERIMENTAL=OFF -DRTFW_BUILD_EXAMPLES=OFF -DRTFW_BUILD_RUNTIME_DEMO=OFF -DSIM_WERROR=ON
    - cmake --build build/m19-02-sdk --parallel 2
    - cmake --install build/m19-02-sdk --prefix "$PWD/build/m19-02-sdk-install"
    - cmake -S tests/package_consumer -B build/m19-02-package-consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/build/m19-02-sdk-install"
    - cmake --build build/m19-02-package-consumer --parallel 2
    - ctest --test-dir build/m19-02-package-consumer --output-on-failure
    - bash scripts/verify-unreal.sh --engine-root "$RTFW_UNREAL_ENGINE_ROOT" --sdk-root "$PWD/build/m19-02-sdk-install" --configuration Development
    - bash scripts/verify-unreal.sh --engine-root "$RTFW_UNREAL_ENGINE_ROOT" --sdk-root "$PWD/build/m19-02-sdk-install" --configuration Shipping --build-only
    - python3 tools/check_c_abi.py --library build/agent-full/librtfw.so
    - readelf -d build/agent-full/librtfw.so | rg 'SONAME.*librtfw.so.8'
  focused_tests_to_add:
    - approved-engine module load with zero Runtime, delegate, worker, allocation owner, or global mutable registry side effects
    - exact adapter capacity reservation and matching Runtime worker/queue configuration, including zero, non-power-of-two, overflow, mismatch, double-attach, freeze, and two-instance rejection cases
    - actual public-engine task submission with exact-once execution, valid logical worker indexes, scratch/token preservation, launch rejection without acceptance, full-capacity queue rejection, late and duplicate dispatch, slot reuse, and stop-admission closure
    - one-job nonblocking helping and nested parallel-for/reduce completion at saturation without arbitrary scheduler drain, hidden threads, blocking waits, retry loops, or private engine task APIs
    - adapter-owned allocation instrumentation covering construction, reservation, submit, help, execution, stop, and destruction, with separate truthful recording of any engine-internal task-system allocation
    - actual `FMemory` allocation for each active provider row with size/alignment/extent checks, nonaliasing across rows and Runtime instances, partial-acquisition failure, apply/observe failure, reverse rollback/release, unresolved retry, and no double free
    - exact capability-bit and observation truth tests proving allocator extent observation while rejecting or leaving unsupported guard, huge-page, prefault, residency, lock, pin, NUMA, physical commitment, and strict overclaim cases
    - actual engine monotonic-clock nondecrease, checked nanosecond conversion, epoch isolation, precision/range/overflow boundaries, unsupported absolute sleep, and proof that large simulation delta never paces the caller
    - frame conversion for finite positive delta, rounding boundaries, optional deadline and nominal release in one clock domain, invalid frame/delta/range rejection, and unchanged active-rate logical-time expectations
    - approved-engine host-driven Runtime lifecycle with root and nested jobs, queue pressure, provider-backed scratch/trace, callback failure, checked stop, stale completion rejection, and two isolated adapter/Runtime pairs
    - editor Development automation plus non-editor Development and Shipping compilation from a relocated exact-revision SDK, with no editor-only dependency in the runtime module and no default CMake package/header/target delta
    - standard RTFW host-adapter, memory-provider, clock, no-allocation, extension-lifecycle, M15/M16/M17, ABI, package, determinism, and sanitizer regressions
  required_ci:
    - Documentation contract workflow checking exact Unreal tuple/evidence tokens, public-API-only boundary, default package invariants, release digests, and truthful M17/M18/M19 claims
    - Existing Linux GCC 11 and Clang 14 Debug and RelWithDebInfo FMA on/off matrix with AddressSanitizer and UndefinedBehaviorSanitizer plus all permanent host-adapter, provider, clock, M15, M16, M17, and M19-01 tests
    - Existing Windows Server 2022 MSVC v143 Debug and RelWithDebInfo matrix proving the exact baseline Runtime, package, C ABI, and M19-01 compatibility surfaces remain unchanged
    - Existing unified-executor GCC ThreadSanitizer job retaining host-adapter saturation/help/stale-completion, memory-provider lifecycle, two-Runtime, no-allocation, and permanent M15/M16/M17/M19-01 gates
    - Approved Debian 12 x86_64 Unreal runner bound to source tag `5.8.1-release`, exact engine commit `71fe36aac5a8df5ccd66c763ffc902b29b6a9c43`, and bundled `v26_clang-20.1.8-rockylinux8` Clang/libc++/lld SDK; build the relocated RTFW SDK with that compatible tuple, stage the source plugin into the fixture project, build Development Editor and Development plus Shipping game targets, and archive complete UBT manifests/logs
    - Approved Unreal editor-commandlet automation run for every `RTFW.M19_02` job, allocator, clock, lifecycle, saturation, failure, allocation-observation, and two-instance test with machine-readable report export and exact engine/plugin/SDK identities
    - Unreal module warnings-as-errors and available engine-supported address/undefined sanitizer or static-analysis run; any unavailable sanitizer is recorded as unperformed and cannot be replaced by standard RTFW TSan or by a fixture
    - Approved-engine performance-regression job on the retained tuple using thresholds selected before measurement for submit/help overhead, sustained bounded-capacity completion, and allocator setup/teardown; hosted noise, a changed tuple, or a post-selected threshold cannot produce a pass
    - Relocated default SDK and clean consumer matrix, archive relocation, non-default include layout, exact installed header/target/alias inventory, exact 70-export C ABI and SONAME, dependency/SBOM, determinism artifact exchange, fuzz smoke, autotune, scaling, and release-contract gates
  manual:
    - A human must approve and record the exact Unreal version/distribution and license access, engine commit or build identifier, supported host platform, UBT/UAT, compiler/SDK/C++ runtime, runner custody, and commands before implementation evidence is accepted; a bare environment flag is not an engine tuple.
    - Human engine-API and concurrency review must confirm that only public version-supported task/time/memory APIs are used, every task node is pre-reserved and safely reusable, submit/help are bounded and nonblocking, accepted work cannot outlive adapter ownership, logical worker indexes are not physical claims, and no world/module lifecycle or unload proof is implied.
    - Human allocator/accounting and time/determinism review must confirm exact `FMemory` ownership and extent observation, truthful unsupported policy fields, reverse retryable cleanup, no false residency/pinning/NUMA claim, monotonic checked conversion, explicit delta rounding, no engine-owned sleep, and two-instance isolation.
    - Human package, compatibility, security, and claim review must confirm exact-revision/toolchain linkage, no default SDK target/header change, no experimental loader dependency, frozen C/device/extension ABI and schemas, retained prior evidence, and no implication of packaged sample, world lifecycle, hot reload, hardware/HIL, latency, RT1/RT2, release, deployment, or production readiness.
risk:
  class: high
  hazards:
    - a public Unreal task wrapper may allocate or block during launch, retain an embedded task node after RTFW completion, or offer no bounded one-job helping operation compatible with the existing HostExecutorAdapter contract
    - engine scheduling may execute a copied job after Runtime stop or adapter destruction, execute it twice through launch/help races, or reuse a slot while the scheduler still holds internal references
    - a logical worker index may be confused with a physical Unreal worker identity, allowing unsafe assumptions about affinity, stack, priority, concurrency, or deterministic completion order
    - FMemory allocation-size metadata may be mislabeled as committed physical memory, independent OS residency, locking, pinning, huge pages, NUMA placement, or allocator overhead exactness
    - a partial allocator failure or failed rollback can double-free, release an overlapping token, erase ownership needed for retry, or let Runtime storage outlive the engine allocator/module
    - floating engine delta or cycle conversion can round inconsistently, overflow, regress, mix clock domains, or make host-driven time accidentally pace or invent an epoch
    - linking a separately built C++ static library into an Unreal module can cross incompatible compiler, CRT, iterator-debug, exception, architecture, or build-configuration boundaries
    - plugin module startup can accidentally acquire Runtime/world/delegate ownership and make M19-02 appear unload-safe even though M19-03 lifecycle and detach orchestration are absent
    - an editor automation fixture or UBT build can be overstated as packaged-game, hot-reload, long-run, hardware, HIL, field, timing, RT, release, deployment, or production evidence
    - broad build/checker changes can drift the exact default SDK inventory, stable ABI, experimental-loader isolation, M17-05 blocker, support matrices, release version, or prior retained evidence
  stop_conditions:
    - the exact baseline is unavailable, dirty, lacks merged M19-01 commit `d5224e670e3ca5ebbe3d2aec5fda7d21213499a8`, lacks any retained M15 through M19-01 evidence record, or no longer records the actual M17-05 blocker truthfully
    - no approved, locally or CI-resolvable Unreal Engine root and exact version/build, host platform, UBT/UAT, compiler/SDK/runtime, license/access approval, and retained command path are available; `UNREAL_ENGINE_APPROVED` without that tuple is insufficient to implement or validate this environment batch
    - the selected supported public Unreal task API cannot provide pre-reserved reusable task storage, bounded nonblocking accept/reject, exact-once execution, safe engine-reference retirement, and at-most-one-job helping without per-submit adapter allocation, private headers, blocking wait, unbounded retry, hidden threads, or arbitrary scheduler drain
    - accepted Unreal work can outlive checked Runtime stop or adapter ownership and correcting that fact requires world/module lifecycle, forced cancellation, detach, hot reload, or unload orchestration assigned to M19-03
    - the Unreal allocator cannot meet the existing five-callback provider validation and truthful independent extent-observation rules without claiming unobserved residency, lock, pin, NUMA, guard, huge-page, physical, or ownership facts
    - correct engine-clock integration requires changing RuntimeClock, HostFrameContext, active-rate logical time, Runtime status values, periodic pacing, or an accepted ADR instead of adapting the existing host-driven surface
    - implementation requires changing any `rt/include/rt` or `rt/src` file, stable C ABI v8 export/fingerprint/SONAME, device ABI v1, extension ABI v1, HAL semantics, Runtime status, runtime-profile or observability/artifact schema, default installed target/header/alias inventory, release version, support matrix, qualification schema/workflow, or license
    - implementation requires using the experimental plugin loader, a private/experimental Unreal header, a cross-toolchain C++ binary contract, direct inclusion of RTFW implementation sources in the plugin, or a module-owned global Runtime registry
    - deterministic acceptance requires physical CUDA/FPGA/XDMA hardware, device nodes, root privilege, controlled latency hardware, secrets, signing, release, deployment, production access, or relabeling a fixture/mock/preflight/document as actual engine evidence
    - required focused engine automation, editor and non-editor UBT builds, standard full verification, package/ABI gates, mandatory CI, or human reviews must be skipped, weakened, or relabeled successful
    - a required source, fixture, script, workflow, documentation, governance, checker, digest, or evidence change falls outside allowed paths or enters a forbidden path
rollback:
  strategy: Revert the Unreal plugin runtime/test modules, fixture project, verification scripts/workflow, opt-in staging or build plumbing, documentation/governance, release digests, and retained M19-02 evidence as one coherent batch. Before removing or replacing the adapter in an integration, require the host to stop every Runtime successfully and prove every accepted engine job and provider token is quiescent/released; M19-02 supplies no world/module unload path, so do not unload or destroy the plugin while any adapter owner is live. Remove staged plugin and test-build outputs from the fixture or runner only after that check. No repository data, engine project content, host setting, support record, release, or deployment migration is authorized.
  data_migration: none
  release_action: Do not publish a release or engine plugin, claim packaged-game/world/unload support, promote a hardware/RT/engine support tuple, sign an artifact, deploy, change settings, or mark M17/M18/M19 complete from this batch.
evidence:
  output:
    - docs/evidence/M19-02-<date>.md
    - exact target baseline and M19-01 ancestry, initial worktree state, retained-evidence inventory, changed-file allowlist, commands, exit codes, focused test counts, required standard and Unreal CI run/job identifiers, and human review results
    - exact Unreal distribution/version/build or source commit, host OS/architecture, UBT/UAT, compiler/SDK/CRT, RTFW library configuration/commit/digest, plugin manifest/module identities, public engine headers/APIs, and relocated staging paths
    - job adapter capacity/layout/state machine, engine task-node lifetime and reuse proof, accepted/rejected/executed/helped/stale counts, logical worker-index rules, saturation/late/duplicate/stop traces, nested-work result, and adapter-owned plus engine-internal allocation observations
    - allocator capability table, per-region request/allocation/extent/apply/observe/rollback/release records, exact alignment/nonaliasing/call order, injected failure and unresolved-retry results, and explicit unsupported residency/lock/pin/NUMA/guard/huge-page facts
