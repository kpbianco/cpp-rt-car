  product: products/cpp-rt-car/product.yaml
  requirements:
    - products/cpp-rt-car/PRD.md#cap-m15--cpu-and-memory-policy
    - products/cpp-rt-car/acceptance.yaml#CAP-M15
  milestone: products/cpp-rt-car/milestones/M15.md
  target_contracts:
    - docs/product_contract.md
    - docs/architecture.md
    - docs/roadmap.md
    - docs/memory_plan.md
    - docs/time_platform.md
    - docs/c_abi.md
  baseline_commit: c5220de1ccfceca4d1584c3df5e0ddb17da171eb
  control_plane_repository: kpbianco/portfolio-control
  control_plane_path: products/cpp-rt-car/batches/M15-01.yaml
  control_plane_revision: c1b89ea4820e9cd1c6ea638fffa794b11ccfd7ed
