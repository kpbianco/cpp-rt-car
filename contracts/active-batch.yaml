  title: Add heterogeneous memory and topology contracts
  goal: Add a bounded additive C++ HAL-v2 memory/topology extension and Runtime registration/inspection path for host, pinned-host, CUDA-device, imported, DMA-mapped, and peer-memory domains, with explicit ownership, alignment, coherency, synchronization, topology, and timestamp-domain semantics, while preserving the M17-01 core/v1 compatibility path and deferring vendor adapters, command batches, timeline lanes, and physical qualification.
