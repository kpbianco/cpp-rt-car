acceptance:
  - The installed C++ source API adds bounded rate-domain, phase-binding, compiled-domain, and reference-release types in the existing SDK header inventory. The model covers a stable domain identity and name, a positive integral-nanosecond period, phase ownership, positive bounded substeps, relative deadline, non-binding budget/WCET estimate, criticality, and optionality; it is separate from runtime-profile schema 7 and stable C ABI v8.
  - While configuring, the host can copy/register a bounded set of rate domains and bind each valid CPU or device phase to exactly one domain. Domain and binding identities are Runtime-instance-owned, configuration freezes at finalization, and malformed names/enums, zero periods or substeps, duplicate domains, duplicate/rebound phases, foreign or stale handles, missing ownership in an enabled rate model, capacity excess, and inconsistent references fail deterministically without a partial finalized plan.
  - Finalization compiles positive integral-nanosecond domain periods using only checked integer gcd/lcm, multiplication, addition, and count arithmetic. The immutable reference interval starts at relative epoch zero, ends before the least common multiple supercycle boundary, and contains every due release exactly once; overflow, an unrepresentable supercycle, or a release count above the explicit bounded capacity fails before start.
  - Reference-release inspection exposes relative release time, domain identity, domain release sequence, owned phase identity, substep ordinal/count, relative deadline, budget/WCET metadata, criticality, and optionality. Equal-time entries are ordered deterministically by domain registration order, compiled phase order, and substep ordinal, with no dependence on floating point, wall-clock timing, thread scheduling, pointer values, or unordered-container iteration.
  - Harmonic and non-harmonic examples and a separately implemented reference generator produce byte-for-byte equivalent compiled timeline fields for the complete supercycle. Period ratios are reduced and compared exactly; no approximation, drift, timing sleep, or tolerance-based assertion is used.
  - "M16-01 is model-and-reference-plan only: host-driven step and self-paced run_periodic continue to execute the existing complete compiled graph once per host frame, and no domain release changes callback dispatch. Cross-rate sample/hold or freshness storage, admission feasibility, late skip/catch-up/hold/degrade/fail behavior, optional-work shedding/recovery, and new trace/metric schema fields remain deferred to M16-02 through M16-04 and are not implied by reference-plan presence."
  - The compiled rate model and phase bindings participate in the finalized graph/replay compatibility identity so checkpoints or input logs cannot be accepted against a semantically different explicit rate plan. A runtime with no explicit rate model retains the exact pre-M16-01 graph/replay identity and behavior.
  - Rate-plan construction and inspection remain bounded and Runtime-instance-owned. Any dynamic storage is acquired only during configuration/finalization, represented exactly once in the M15 logical control ledger and MemoryPlan, and never allocated, resized, or mutated by post-start reference inspection; two runtimes cannot share handles, mutable plan state, or release storage.
  - Failed rate compilation leaves the runtime configuring and replaceable without publishing a partial plan, starting threads, acquiring device ownership, applying native policy, or invoking callbacks. Existing M14.1 and M15 checked cleanup, provider-token, live-stack, accounting, and retry invariants remain unchanged because this batch adds no start/stop resource owner.
  - Default and explicit-reference-plan configurations preserve current lifecycle, compiled dependency/resource order, host-adapter behavior, periodic absolute cadence, watchdog, mock-device operation, deterministic replay, zero ordinary heap allocation after successful start, and source compatibility for pre-M16-01 aggregate initialization and installed consumers.
  - Stable C ABI v8 with exactly 70 exports and its frozen fingerprint, SONAME 8, device ABI v1, runtime configuration schema 7 and its 25 keys, observability/checkpoint/input-log schemas, installed target/header inventory, compatibility aliases, release 1.2.1, support matrices, and Apache-2.0 remain unchanged.
  - Target governance, active-batch, current-state, handoff, roadmap, architecture/component contracts, release digest ledger, and retained M16-01 evidence describe the exact implemented model/reference boundary and do not present a compiled timeline, mock, hosted runner, deterministic replay, preflight, or documentation as latency, physical hardware, HIL, field, RT1, RT2, signing, release, deployment, or production evidence.
  - Focused tests, complete deterministic local verification, mandatory GitHub CI, and human public-API, integer-arithmetic, identity, memory-accounting, determinism, lifecycle, and compatibility review pass before merge; M16 and CAP-M16 remain incomplete after this batch.
validation:
  local:
    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - cmake -S . -B build/agent-full -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_TESTS=ON -DRTFW_BUILD_EXPERIMENTAL=ON -DENABLE_RAPIDCHECK=ON -DSIM_SANITIZERS= -DSIM_WERROR=ON
    - cmake --build build/agent-full --parallel 2
    - ./build/agent-full/tests/simcore_tests --gtest_filter='RateTimeline.*:CompiledGraph.*Rate*:HostRuntime.*Rate*:MemoryPlan.*Rate*:DeterminismReplay.*Rate*:TraceNoAlloc.*Rate*'
    - ctest --test-dir build/agent-full --output-on-failure -R 'm16_rate_timeline'
    - ./scripts/agent-verify.sh full
  focused_tests_to_add:
    - additive default construction and pre-M16-01 positional aggregate/source compatibility in direct, preferred installed, and compatibility installed C++ consumers
    - bounded rate-domain copy and phase binding for CPU and mock-device phases, including freeze, duplicate, missing, rebound, foreign-handle, malformed enum/name, zero, capacity, and two-runtime isolation cases
    - checked gcd/lcm supercycle and release-count compilation at zero, unit, maximum valid, overflow, unrepresentable, and configured-capacity boundaries
    - exact harmonic and non-harmonic full-supercycle agreement with an independent reference generator, including simultaneous-release ordering, co-prime periods, domain registration order, compiled phase order, and substep ordinals
    - exact inspection of release time, domain and phase identities, release sequence, substeps, deadline, budget/WCET metadata, criticality, and optionality before start, while running, and after stop without mutation or allocation
    - transactional failed finalization with absent partial plan, configuring-state replacement, zero callbacks, zero thread/native/device/provider mutation, and successful corrected retry
    - unchanged no-plan graph/replay identity plus explicit rate-plan identity sensitivity to each semantic domain and binding field
    - proof that explicit reference plans do not yet filter, repeat, skip, catch up, hold, degrade, shed, or reorder callbacks in host-driven or self-paced execution
    - exact rate-plan storage reconciliation in the M15 logical control ledger and MemoryPlan, two-runtime storage isolation, and no ordinary heap allocation during post-start inspection and complete CPU or mock-device frames
    - regression coverage for graph dependency/resource ordering, periodic absolute epoch, watchdog, host adapter, mock device, checkpoint/replay, failed-start/checked-stop retry, and all frozen compatibility boundaries
  required_ci:
    - Documentation contract workflow including quick-start, release-contract, frozen C ABI, exact SDK inventory, and truthful M16 claim checks
    - Linux GCC 11 and Clang 14 Debug and RelWithDebInfo, FMA on/off matrix with AddressSanitizer and UndefinedBehaviorSanitizer coverage of rate validation, checked arithmetic, finalization, inspection, identity, and lifecycle
    - Windows Server 2022 MSVC v143 Debug and RelWithDebInfo matrix covering identical integer timeline/order results, source compatibility, and installed consumers
    - Unified executor GCC ThreadSanitizer job retaining M15 cleanup gates and executing rate-plan two-runtime, finalization, inspection, host-driven, periodic, and mock-device regressions even though M16-01 adds no new lane
    - Determinism GCC and Clang FMA-on and FMA-off jobs plus artifact exchange proving the unchanged no-plan fixture and explicit rate-plan identity tests
    - C and C++ embedding, add_subdirectory, installed-package, archive relocation, SDK header self-containment, compatibility aliases, exact 70-export C ABI consumers, and existing autotune/scaling smoke jobs
    - Existing no-allocation, bounded-memory-plan/control-ledger, M14.1 device recovery, M15 rollback, sanitizer, documentation, release-contract, and package gates; no controlled-hardware performance or timing claim is authorized
  manual:
    - Human review must confirm the additive C++ model and query shape, exact epoch/supercycle and tie-order semantics, checked arithmetic/capacity, phase ownership/freeze behavior, graph/replay identity boundary, M15 accounting preservation, deferred execution semantics, and frozen C/device ABI/package/schema boundaries before merge.
    - The reviewer must confirm that budget/WCET values are untrusted planning inputs only and that reference-timeline agreement is functional deterministic evidence, not a feasibility, worst-case latency, RT1, or RT2 result.
risk:
  class: high
  hazards:
    - lcm or release-count growth can overflow or turn a small domain set into unbounded finalization time or memory
    - ambiguous epoch, interval-end, simultaneous-release, or substep ordering can make independent implementations disagree while simple harmonic examples still pass
    - a phase can be omitted, multiply owned, or associated through a foreign/stale handle, yielding a plausible but incomplete plan
    - adding rate fields to graph/replay identity can reject legacy artifacts unintentionally, while omitting a semantic field can accept an incompatible artifact
    - reference-only types can be mistaken for active multi-rate dispatch, deadline admission, freshness, overload, shedding, or RT qualification
    - new finalization storage can escape the exact M15 control ledger, double count MemoryPlan bytes, allocate after start, or leak mutable state across Runtime instances
    - public aggregate edits or a new installed header/target can break 1.x C++ source consumers or the exact package inventory despite leaving the C ABI unchanged
    - changes in common graph/finalization paths can regress dependencies, host/periodic execution, watchdog, device cleanup, provider ownership, no-allocation, determinism, sanitizers, or package behavior
  stop_conditions:
    - the exact baseline commit is unavailable, not cleanly inspectable, or does not contain merged M15-04 commit ddf3f879b20e72975b81274541a7c6cf1925d9c5 and the retained M15 evidence
    - implementing the model requires changing stable C ABI v8, SONAME 8, device ABI v1, runtime-profile schema 7/25 keys, observability or replay artifact schemas, default installed header/target inventory, support matrices, release version, or license
    - an exact finite supercycle and release count cannot be bounded with checked integer arithmetic for the approved integral-nanosecond period model
    - a product decision is required to define a different clock unit, fractional-nanosecond release, absolute epoch, dispatch, cross-rate data, admission, late, catch-up, shedding, recovery, or telemetry semantic outside this reference-only batch
    - explicit rate metadata cannot participate in graph/replay compatibility identity while preserving the exact no-plan identity and existing checkpoint/input-log formats
    - rate storage cannot remain configuration/finalization-only, exact in the M15 ledger/MemoryPlan, isolated per Runtime, and allocation-free after successful start
    - deterministic tests require timing sleeps/tolerances, root privilege, a fixed topology, physical CUDA or FPGA/XDMA hardware, controlled performance hosts, secrets, signing, release, deployment, or production access
    - any required source, test, workflow, documentation, governance, or evidence change falls outside allowed paths or enters a forbidden path
    - target repository contracts at the exact baseline contradict the reference-only vertical boundary or require an incompatible public architecture decision
rollback:
  strategy: Revert the additive rate-domain and phase-binding API, reference timeline compiler and storage, identity/accounting integration, tests/CI, documentation, governance refresh, release-contract digests, and retained M16-01 evidence as one batch. Explicit rate plans create no persistent data migration, host setting, thread, device ownership, deployed state, or active dispatch behavior; preserve and use the existing checked stop path for any running integration before discarding its Runtime instance.
  data_migration: none
  release_action: Do not publish a release, promote a support/qualification tuple, alter hardware or RT records, or mark M16/CAP-M16 complete from this batch.
evidence:
  output:
    - docs/evidence/M16-01-<date>.md
    - exact baseline, changed files, commands, exit codes, focused test counts, required CI run/check identifiers, and human review result
    - public rate-domain and phase-binding model with all bounds, units, defaults, ownership, freeze, deadline, budget/WCET, criticality, optionality, and deferred-semantics decisions
    - harmonic and non-harmonic input domains, exact reduced relationships, supercycle, release count, full ordered reference output digest, independent-generator comparison, and every rejected overflow/capacity case
    - graph/replay identity comparisons for no-plan compatibility and every explicit semantic field, plus unchanged checkpoint/input-log schema status
    - timeline storage and M15 control-ledger/MemoryPlan reconciliation, two-runtime isolation, post-start allocation results, and proof that current host/periodic dispatch remains unchanged
    - default and explicit-plan lifecycle, graph, host-adapter, watchdog, mock-device, determinism/replay, failed-finalize retry, checked cleanup, C++ source, C ABI/device ABI/package/schema compatibility, and changed/preserved invariants
    - residual risks and all unperformed cross-rate freshness, admission, late/catch-up, shedding/recovery, versioned telemetry, controlled performance, privileged native, physical hardware, CUDA, FPGA/XDMA, HIL, field, latency, thermal, endurance, RT1, RT2, signing, release, staging, deployment, and production validation
  claim_boundary: Evidence may establish static, unit, property/reference-generator, sanitizer, package, portable RT0, exact integer timeline-compilation, identity, bounded-memory, and unchanged-dispatch behavior only. The compiled reference plan does not establish active multi-rate execution, cross-rate freshness, admission feasibility, overload behavior, optional-work shedding/recovery, worst-case timing, physical accelerator behavior, HIL, field performance, RT1, RT2, signing, release, deployment, or production readiness.
