acceptance:
  - An additive C++ thread-policy provider boundary supports deterministic injection and a production provider without changing runtime-config schema 7, stable C ABI v8, SONAME 8, or device ABI v1.
  - Linux applies and reads back supported current-thread CPU affinity, normal/FIFO/round-robin scheduling class and priority, and bounded thread names; platform or permission failures remain explicit and never become qualification claims.
  - Unsupported NUMA-node, custom stack/guard, and unavailable wait-policy requests fall back for best-effort policy and fail closed for required policy; M15-03 retains ownership of stack and memory-provider work.
  - The frame lane is externally owned and verify-only; borrowed host-adapter workers and declared backend/vendor lanes are never mutated or falsely reported as runtime-owned.
  - Executor, watchdog, and device-service threads reach an allocation-free startup barrier, apply and verify their resolved policy on their own thread, and cannot execute callbacks or service work before the whole thread-policy transaction commits.
  - A required apply or verification failure aborts start before callbacks, joins every created runtime thread, reverses device/backend startup through existing checked cleanup, retains inspectable failed and rolled-back report state, and leaves the runtime finalized unless existing device cleanup remains pending.
  - Best-effort native failures retain the observed/applied fallback and system error in the report while portable defaults preserve the 1.2.1 yield/wait, stack, scheduling, affinity, and naming behavior.
  - Repeated failed start and later successful start do not retain stale barriers, report state, thread ownership, or cross-runtime policy state.
  - Runtime callbacks and steady-state RT lanes add no allocation, file I/O, hidden thread creation, blocking mutex, unbounded wait, or spill execution.
  - Documentation states that native policy application and portable/injected tests do not establish RT1 or RT2.
  - Focused tests, full local verification, and required GitHub CI pass.
validation:
  local:
    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - ./scripts/agent-verify.sh full
  focused_tests_to_add:
    - injected provider success for every runtime-owned thread role behind the startup barrier
    - required apply failure and required verification mismatch with deterministic reverse rollback
    - best-effort apply fallback with retained native error and observed policy
    - frame, host-adapter, and backend-owned verify-only behavior
    - Linux unprivileged affinity and bounded-name apply/readback where supported
    - repeated failed-start retry and two-runtime isolation
    - callback exclusion until transaction commit and no-allocation steady-state regression
  required_ci:
    - Linux GCC and Clang Debug/RelWithDebInfo
    - Windows MSVC Debug/RelWithDebInfo portable fallback
    - ThreadSanitizer
    - determinism artifact exchange
    - installed package and compatibility consumers
    - documentation, release, and exact C ABI contracts
  manual:
    - Review additive C++ provider and report-state source compatibility before merge.
    - Inspect representative Linux affinity, scheduler, and thread-name state without treating the result as RT qualification.
risk:
  class: high
  hazards:
    - a startup barrier deadlock or missed wake during apply failure
    - callbacks or device service work escaping before policy commit
    - partial native mutation being reported as fully verified
    - permission-dependent scheduling behavior causing nondeterministic tests
    - rollback interfering with recoverable device teardown
    - cross-platform or cross-runtime state leakage
  stop_conditions:
    - stable C ABI v8, SONAME 8, device ABI v1, or status-code changes become necessary
    - custom pthread stack ownership or memory-provider behavior is required
    - a supported native operation cannot be verified by readback
    - a vendor-owned thread would need runtime mutation or an unowned native handle
    - source changes outside allowed paths are required
    - deterministic tests require privilege, hardware, weakened assertions, or timing-only synchronization
    - current repository contracts contradict this batch
rollback:
  strategy: Revert the M15-02 implementation and active-batch commit; M15-01 portable policy modeling remains the baseline and native thread mutation is removed.
  data_migration: none
  release_action: Do not publish a release from this batch unless separately approved.
evidence:
  output:
    - docs/evidence/M15-02-<date>.md
    - exact commands and exit results
    - acceptance mapping and startup/rollback ordering
    - changed and preserved invariants
    - native system errors and portable fallback coverage
    - residual risks and unperformed privileged, hardware, and RT validation
  claim_boundary: Evidence is static, unit, injected-native, unprivileged local Linux where available, package-contract, and portable RT0 only; it does not qualify RT1, RT2, CUDA, XDMA, or combined hardware.
