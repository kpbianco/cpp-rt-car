acceptance:
  - The implementation begins from an initially clean target at exact default-branch commit `201decf9384220d713ff90f7eb12ac3ecc4ebc49`, merged target pull request 247. The retained M22-01 evidence and its fixed schema, copied payload, ownership, capacity, identity, accounting, and staging-only claim remain present and unchanged; no absent final control-plane, physical, RT, Unreal, signing, release, deployment, or production result is invented.
  - M22-02 consumes only complete M22-01 records and their Runtime-owned canonical payload bytes. It may add fixed-width additive C++ commit policy, immutable boundary-view, result, and inspection types, but it does not change the existing 128-byte update record, reinterpret reserved bytes, retain caller storage, accept executable code, or add application payload parsing, authentication, authorization, filesystem/network I/O, vendor calls, or unbounded callbacks to an execution lane.
  - Every enabled Runtime closes each host-frame target exactly once immediately before any callback for that frame, and closes each active compiled rate-release target exactly once immediately before the first callback or device dispatch belonging to that release. The boundary cursor is monotonic, generation-bound, and independent per Runtime; disabled live controls preserve the exact pre-M22 execution order and identity.
  - Boundary eligibility has one race-complete rule. A record published with release ordering before the boundary owner atomically closes its exact target is eligible; a producer still copying or publishing after closure cannot become visible at that boundary and receives or records an explicit late/missed result without a partial slot. The frame owner never waits for, spins on, locks against, or executes producer work.
  - The boundary owner performs one bounded scan over finalization-time storage, validates only frozen structural identity, and constructs the complete candidate set in preallocated Runtime-owned memory. It allocates no memory, creates no thread, parses no payload, performs no I/O, invokes no producer or application callback, calls no backend/vendor operation, and uses no unbounded mutex, retry, queue, or container growth.
  - Eligible records at one boundary use a documented platform-independent total order of target kind and exact compiled target identity, then mailbox identity ascending, then mailbox sequence ascending. Arrival timing, producer thread identity, slot reuse, addresses, hash-table order, and operating-system scheduling cannot break ties or change the committed order.
  - Replacement is closed and local. At one exact boundary, later records in the canonical order replace earlier records only when mailbox identity and update kind are both equal; replaced records never appear in the published generation. Different mailboxes or update kinds remain distinct ordered members. Replacement neither mutates an already published earlier generation nor crosses a Runtime, configuration generation, frame, or rate release.
  - Publication is atomic and complete-before-visible. The frame owner prepares one immutable generation in inactive preallocated storage, copies or indexes only Runtime-owned immutable records, computes a stable nonzero generation identity over exact target plus ordered surviving record identities and payload digests, then releases one generation pointer/index. A callback observes either the entire previous generation or the entire new generation, never a torn descriptor, mixed payload, half replacement, or partially advanced count.
  - Host-frame callbacks receive the newly published host-frame generation through one bounded read-only callback-local view. Active CPU/device rate callbacks and device batch construction receive the generation for their exact release without changing backend ownership or moving payload bytes to a backend implicitly. Views expose fixed record metadata and exact bounded payload spans only for the callback lifetime, cannot mutate Runtime storage, and cannot be retained safely after the callback returns.
  - A boundary with no surviving record still closes deterministically and leaves the prior committed data generation unchanged while advancing only the boundary cursor and bounded result accounting. A record for a future target remains staged and cannot leak into an earlier callback. A record discovered after its target is past is rejected as missed and never applied at the next frame or release.
  - Staging capacity is reusable only after a slot has reached a terminal committed, replaced, missed, or stopped state and no published generation or active callback view references it. Reclamation uses fixed-capacity generation/slot state with no ABA reuse, overwrite of a live payload, sequence reset, dynamic allocation, or unbounded scan. Full continues to reject new admission until safely reclaimable capacity exists.
  - Commit inspection is Runtime-instance-bound, fixed-size, and read-only. It reports the latest published generation identity, target, ordered survivor count, committed/replaced/missed/stopped counters, staged occupancy, and exact terminal status for records still retained by the bounded inspection window. It returns no raw internal address, does not advance a cursor, and documents that reclaimed per-record history belongs to M22-03 action telemetry rather than an unbounded in-memory ledger.
  - Stop atomically closes future boundaries and new admission before cleanup. A boundary already owned by an active `step()` either publishes one whole generation under the existing step/stop ownership rule or the stop attempt returns the existing retryable state; no stop path applies a future record, blocks on a producer, reopens a closed target, or carries committed/staged state into another Runtime generation.
  - Existing callback failure semantics remain unchanged. M22-02 does not roll back a generation after a callback, device submission, watchdog, or later phase failure and does not claim transactional recovery; it preserves enough bounded immutable identity for M22-03 to add explicit apply-failure rollback, canonical action records, checkpoint, replay, and telemetry without guessing ordering.
  - Host-frame and active rate-release commit behavior is deterministic for the same canonical admitted records and target identities. Graph/config/replay compatibility identity includes frozen commit policy, ordering, replacement, late/missed, reclamation, and view layout semantics, but excludes runtime arrivals, payload contents, current generation, counters, slot state, callback addresses, thread scheduling, and wall-clock time.
  - Successful finalization accounts exactly once for inactive/active generation storage, ordered candidate indexes, slot terminal state, boundary cursors, commit counters, and inspection state in existing `MemoryPlan` categories and `planned_bytes`. Checked size/alignment arithmetic rejects before allocation or partial publication; failed finalization remains retryable and the M22-01 disabled identity/accounting path remains byte-for-byte unchanged.
  - Multiple Runtime instances and repeated construction/destruction remain isolated. Identical logical targets, mailbox/update identities, generations, and payloads in two instances cannot share boundary cursors, slot ownership, views, counters, or committed storage, and a stale view or handle cannot resolve into a new Runtime/configuration generation.
  - Default construction and positional aggregate/source compatibility, CPU-only and M21 mixed-rate dispatch, deterministic mock/loopback behavior, sampled safe outputs, ordinary M17/HAL-v2 backends, device-ABI-v1 adaptation, checkpoint/replay artifacts, observability, watchdog, no-allocation checks, package relocation, and legacy artifacts retain their exact behavior when live controls are disabled or no record targets the current boundary.
  - Stable C ABI v8 with exactly 70 exports and fingerprint `0xd0e7a5a14bf35f97`, SONAME 8, device ABI v1, extension ABI v1, HAL tables, Runtime status values, runtime-profile schema 7/25 keys, checkpoint/input-log/rate-action/mixed-rate-action/active-replay/observability schemas, release 1.2.1, installed target/header/alias inventory, support matrices, qualification state, Apache-2.0 license, and prior retained evidence remain unchanged.
  - Target governance, current state, handoff, component contracts, release digest ledger, static-analysis manifest, and retained `docs/evidence/M22-02-<date>.md` state the exact boundary-commit-only claim. Focused and full local verification, mandatory hosted CI, and human API, ordering, race, atomicity, lifetime, accounting, compatibility, and claim review pass before merge. M22 and CAP-M22 remain incomplete after this batch.
