batch:
  id: M21-02
  title: Add device release dispatch and completion
  goal: Activate admitted M21-01 HAL-v2 command-batch phases in the existing multi-rate executor by precomputing bounded release/dispatch/completion state, invoking each due command provider exactly once, submitting only through the existing isolated backend lanes, resolving poll-only terminal completion with exact release identity, and applying deterministic timeout, cancellation, dependency, late, stop, and retryable-cleanup semantics without adding payload publication, sampled I/O, a vendor call on an executor worker, or a new runtime lane.
