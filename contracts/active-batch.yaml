acceptance:
  - The implementation begins from an initially clean target at exact default-branch commit `0311064cc44d6ec0add7f88e0789d7437e72e819`, merged target pull request 248. Retained M22-01 and M22-02 evidence and their fixed update envelope, exact boundary order, immutable generation, callback-view, terminal-reclamation, identity, accounting, and boundary-commit-only claims remain present and unchanged; no absent physical, RT, Unreal, signing, release, deployment, or production result is invented.
  - M22-03 adds one copied configuring-only `LiveControlClosurePolicy` with a positive semantic policy identity, a closed step-transaction rollback rule, fixed action capacity, fixed retained-generation capacity, fixed retained record/payload limits, bounded artifact record/byte limits, and explicit replay enable. An all-zero policy disables closure without changing the merged M22-02 identity, execution, memory, checkpoint, telemetry, or package path. It contains no dynamic string, raw address, callback, vendor handle, file path, executable code, implicit clock, or unbounded history.
  - Existing checkpoint schema 1, input-log schema 1, rate-action schema 1, mixed-rate-action schema 1, active-replay schema 1, global observability schema 2, their constants, magic values, fixed layouts, parser behavior, C ABI operations, and byte-for-byte legacy artifacts remain unchanged. M22-03 uses a distinct additive C++ live-control action schema 1, a conditional ordinary checkpoint state record, and a distinct additive live-control replay artifact schema 1 rather than repurposing reserved bytes or changing an existing version.
  - The `LiveControlActionRecord` is fixed at 256 bytes with exact size/alignment assertions and closed numeric action, stage, reason, and result tables. Each record carries one monotonic action sequence, Runtime/configuration/policy identity, exact boundary target, mailbox/producer/mailbox-sequence identity when applicable, update kind, payload digest and byte count but no payload bytes, generation and prior-generation identities, survivor/replaced counts, admission or terminal status, and exact checkpoint/replay correlation fields. Reserved fields are zero and malformed, partial, future, contradictory, foreign, or uncorrelated records fail closed.
  - The action stream records one bounded attempt for every admission outcome and canonical records for boundary empty, provisional publication, committed, replaced, missed, stopped, rolled back, checkpointed, and replay-verified outcomes. Rejected admission records contain only sanitized fixed metadata and outcome; they never copy malformed caller bytes into telemetry. Boundary and per-record terminal actions follow exact canonical mailbox/update order, and late completion or later inspection cannot rewrite a terminal action.
  - Action publication is fixed at finalization and uses one nonblocking direct-index attempt. Capacity zero drops while reserving sequence; busy slots drop; committed reuse overwrites with exact counters; runtime-bound cursors report exact gaps and never affect admission, boundary close, rollback, or execution. Any loss, gap, sequence exhaustion, retained-generation gap, or payload-retention overwrite makes the affected range replay-ineligible rather than silently producing incomplete evidence.
  - Payload bytes remain absent from default telemetry. When replay retention is enabled, a separate fixed-capacity Runtime-owned generation journal copies only the exact ordered survivor records and payload bytes already published by M22-02, keyed to action and generation identity. Journal capacity and total record/payload storage are frozen, checked, exactly accounted, and independent from the mailbox slots and callback generations. Overwrite or contention is explicit and never blocks a boundary; it may preserve execution while disqualifying replay.
  - At `step()` entry Runtime captures the currently active immutable live-control generation into one preallocated rollback generation and opens one bounded step transaction. Exact host-frame and active rate-release closures may publish complete provisional generations for callbacks exactly as M22-02 defines, but their source slots remain nonreclaimable and their final terminal status remains pending until the owning step settles. No later producer may overwrite a pending slot or rollback generation.
  - A successful step settles every provisional boundary in exact boundary/action order, terminalizes source records as committed or replaced, releases reclaimable slots, appends complete action/journal entries, and retains the latest generation. A callback/provider error, malformed submission, terminal device failure, timeout, cancellation, loss, dispatch failure, or other existing non-success execution result after a provisional publication atomically release-restores the step-entry Runtime generation before `step()` returns, marks every provisional generation and record from that step rolled back, and emits one closed rollback sequence. The rollback path performs no allocation, application parsing, callback, vendor operation, wait, retry loop, or fallible copy.
  - Runtime rollback covers only the Runtime-owned immutable generation and its mailbox/action/checkpoint state. It cannot undo arbitrary application-owned side effects already performed by a user callback, backend, external process, or physical device. Applications that mutate their own state from a live-control view remain responsible for prevalidated canonical data and their own transactional registered-state/application rollback. Documentation and evidence must not describe the Runtime pointer/index rollback as automatic reversal of arbitrary application or hardware state.
  - The step transaction is exact for zero, one, and multiple host/rate boundary publications in one step, including simultaneous releases, independent callbacks, device completion after provider return, and failure after an earlier successful release. The rollback generation cannot be overwritten by later same-step publications; successful earlier callbacks may have observed whole provisional generations, never torn bytes. A nested or concurrent step, periodic loop, replay, checkpoint, restore, stop, or second transaction cannot share or steal this ownership.
  - The conditional `rtfw.live-control` ordinary checkpoint state record uses existing checkpoint schema 1 and has a fixed finalization-time extent. It captures the exact active generation descriptor, ordered records and payload bytes, boundary cursors, staged complete mailbox records and payloads, mailbox/producer next sequences, terminal/pending state needed for unambiguous reuse, and next action/journal positions. It stores no caller cursor, telemetry history, raw address, producer thread identity, callback pointer, backend token, wall-clock observation, or in-flight application/vendor ownership.
  - Checkpoint export and restore require a quiescent step/replay/periodic/stop state and claim every mailbox plus the closure control in one bounded all-or-nothing attempt. A concurrent producer receives the existing bounded `busy` result; the host operation never waits for it. Complete schema, identity, extent, count, sequence, target, digest, payload, cursor, state, and checksum validation occurs before any active generation, mailbox, producer sequence, action position, or registered application byte changes. Failure leaves the complete prior Runtime state unchanged and retryable.
  - Checkpoint restore rebuilds active and staged Runtime-owned live-control state for the current compatible Runtime/configuration while retiring artifact-local Runtime IDs. It never revives a stale producer handle, imports an internal address, carries state across an incompatible graph/policy/generation, or treats telemetry history as canonical state. A restored producer is obtained only through the current Runtime handle inspector and continues from the validated restored producer sequence.
  - Existing checkpoints remain byte-identical when closure is disabled. Closure-enabled checkpoint bytes are deterministic for the same canonical state and append exactly one ordinary state record without changing checkpoint codec/version. Finalization rejects if the complete fixed live-control state record cannot fit the copied snapshot bound or exact MemoryPlan; no lazy checkpoint allocation or artifact-sized allocation is permitted.
  - The new live-control replay artifact is fixed-width little-endian and bounded by copied record/byte capacities and the existing 1 GiB absolute safety ceiling. It embeds one unchanged compatible checkpoint, exactly one unchanged execution artifact kind (schema-1 input log for ordinary replay or schema-1 active-replay artifact for M21 deterministic active replay), a complete gap-free live-control action range, ordered retained generation descriptors, exact survivor records and explicit payload bytes, per-section checksums, and a whole-artifact checksum.
  - Artifact construction requires a checkpoint-correlated retained action/generation window with no drop, overwrite, gap, active transaction, producer reservation, uncertain device owner, cleanup-pending owner, or mismatched execution extent. Output is caller-owned; a short buffer reports exact required bytes and writes nothing. Payload bytes appear only in this explicit caller-requested replay artifact under the existing artifact trust boundary, never in action telemetry, trace, metrics, default JSON export, or background transport.
  - Live-control replay fully validates artifact bounds, magic/version, nested artifact, identities, action order, target monotonicity, terminal transitions, generation chain, record replacement/order, payload digests, checksums, and trailing extent before checkpoint restore. Parsing and inspection allocate nothing from encoded lengths and reject truncation, overflow, duplicate/gapped actions, foreign targets, stale generations, malformed records, mismatched payload identity, impossible rollback, lossy retention, or unsupported nested artifact kind before state mutation.
  - Replay restores the compatible checkpoint once, bypasses external producer timing, and injects only the artifact's validated immutable generations at their exact host-frame or compiled rate-release boundaries. It then executes the unchanged nested ordinary or active replay path, compares every generated publication/commit/rollback identity and terminal action plus final registered-state hash, and fails on the first mismatch with exact frame, boundary, action, and generation progress. Rejected admission actions are validated historical metadata and are not re-submitted as malformed producer calls.
  - Any device backend used during live-control replay must already satisfy the existing deterministic-mock requirement; physical or nondeterministic backends may produce bounded action metadata but cannot be re-executed by this replay mode. M21 active replay keeps its exact schema and deterministic decision rules. Live completion timing, external producer scheduling, wall-clock time, physical input arrival, and telemetry transport are never inferred as deterministic replay input.
  - A replayed step failure follows the same bounded Runtime-generation rollback rule and must match the recorded rollback action. Successful earlier replay frames are not rolled back after a later mismatch; retry uses the original artifact/checkpoint. Replay does not invoke producer callbacks, parse application payloads, authenticate artifacts, reproduce arbitrary application side effects, regenerate physical samples, or replay a vendor driver.
  - Stop first closes admission and new closure/checkpoint/replay claims. A step transaction already owned either settles wholly before checked stop succeeds or the stop attempt returns the existing retryable state. Quiescent stop terminalizes staged records and emits exact stopped actions; it cannot publish a future generation, discard an unresolved rollback owner, reopen an action range, or carry checkpoint/journal state into another Runtime instance.
  - Sequence, action, journal, generation, mailbox, producer, artifact, record, payload, and checkpoint-size exhaustion fail before zero, wrap, alias, or reuse becomes ambiguous. Two Runtime instances and repeated construction/destruction share no cursor, generation, rollback store, action slot, retained payload, checkpoint state, or replay progress. A stale view, handle, cursor, checkpoint, or artifact cannot resolve into a new Runtime/configuration generation.
  - Running admission emission, boundary action creation, journal copy, transaction settlement, rollback publication, payload digesting, replay generation injection, and comparison use checked arithmetic and bounded direct-index work. They allocate no ordinary heap, take no blocking mutex, perform no file/network I/O, create no thread, invoke no producer/application callback beyond the unchanged graph callbacks, call no vendor operation outside existing lanes, scan no unbounded registry, and retry no unbounded sequence.
  - Successful finalization accounts exactly once for the closure policy, action controls/slots/counters, retained-generation descriptors/records/payloads, third rollback generation, provisional transaction state, checkpoint bytes, replay parser/control state, and inspection metadata inside existing `MemoryPlan` categories and `planned_bytes`. Caller artifacts, registered application storage, backend-private bytes, and telemetry output buffers remain borrowed/excluded. Checked arithmetic rejects before allocation or partial publication and failed finalization remains correctable and retryable.
  - Graph/config/replay identity includes every semantic closure-policy version, rollback trigger/result rule, action numeric table, checkpoint state shape, replay artifact format, nested-artifact rule, generation injection/comparison rule, and payload-retention identity that can change execution. It excludes observational action/journal capacity when replay is disabled, caller cursor positions, runtime arrivals, raw addresses, callback pointers, wall-clock measurements, thread IDs, completion arrival order, current counters, and telemetry loss. The merged M22-02 identity path remains byte-exact when closure is disabled.
  - Default construction and positional aggregate/source compatibility, disabled/no-target live control, CPU-only and M21 mixed-rate dispatch, deterministic mock/loopback behavior, sampled safe outputs, ordinary M17/HAL-v2 backends, device-ABI-v1 adaptation, existing checkpoint/input-log/rate-action/mixed-rate-action/active-replay artifacts, observability, watchdog, no-allocation checks, package relocation, and legacy artifacts retain their exact behavior when M22-03 closure is disabled.
  - Stable C ABI v8 with exactly 70 exports and fingerprint `0xd0e7a5a14bf35f97`, SONAME 8, device ABI v1, extension ABI v1, HAL tables, Runtime status values, runtime-profile schema 7/25 keys, every existing artifact/telemetry schema, release 1.2.1, installed target/header/alias inventory, support matrices, qualification state, Apache-2.0 license, and prior retained evidence remain unchanged. Additive C++ types remain in the existing installed `rt/runtime.hpp`; no new installed header or package component is authorized.
  - Target governance, current state, handoff, live-control/replay/observability contracts, release digest ledger, static-analysis manifest, and retained `docs/evidence/M22-03-<date>.md` state exact implementation and evidence. Focused and full local verification, mandatory hosted CI, and human API, rollback-boundary, checkpoint-transactionality, replay, privacy, concurrency, boundedness, compatibility, and claim review pass before merge. M22 and CAP-M22 remain incomplete until M22-04 typed SDK/stress closure passes.
