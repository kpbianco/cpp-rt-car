acceptance:
  - The implementation begins from an initially clean target at exact default-branch commit `00cc6e48eb11c334a5e04ebd0719899f52d5581b`, the merged M21-05 pull request 246. Retained M15 through M21-05 evidence is present and unchanged, M21/CAP-M21 portable software closure is recorded truthfully, and no absent physical, RT, Unreal, signing, release, deployment, or production result is invented.
  - An additive C++ live-control policy is copied only while configuring and frozen at finalization. It declares positive bounded mailbox, producer, record, per-record payload, and total payload-storage capacities when enabled; a nonzero schema/policy identity; one closed admission policy for this batch (`reject_new`); and explicit absolute byte ceilings with checked multiplication. Capacity zero disables the complete surface and preserves pre-M22 identity, accounting, artifacts, and behavior.
  - Public descriptors use fixed-width fields and closed numeric tables for schema/version, record size, mailbox and producer identity, runtime/configuration generation, target kind, target frame or rate-domain/phase/release sequence, update kind, producer sequence, canonical payload size/digest, policy flags, and zero reserved fields. They contain no dynamic string, raw address, callback, function pointer, vendor handle, file path, authentication secret, wall-clock source, or borrowed payload span after admission.
  - M22-01 supports exact target identities for a host frame or one already compiled active rate release. Structural validation rejects zero, overflowed, future, foreign, stale, wrong-kind, noncanonical, contradictory, or out-of-plan targets before reserving a slot. It does not decide missed-target, late-acceptance, replacement, or boundary ordering semantics; those remain M22-02 work and no update is described as scheduled or committed in this batch.
  - Producers are pre-registered while configuring and receive Runtime-instance-bound generation-safe handles after successful finalization. A producer belongs to exactly one mailbox and has one positive bounded identity and monotonic sequence domain. Foreign Runtime handles, stale finalization/restart generations, duplicate identities, exhausted sequences, and cross-mailbox submissions fail without changing mailbox state.
  - Every admitted update copies its canonical payload bytes into one preallocated Runtime-owned slot before publication. The payload length and digest cover exactly the copied bytes; unused slot bytes are zeroed or never observable; caller mutation after return cannot change the record; and no accepted record retains a borrowed pointer. Zero-byte payloads are legal only for explicitly declared update kinds whose structural contract permits them.
  - Structural validation is complete before slot publication and includes descriptor size/version/reserved fields, closed enums and flags, producer ownership/generation/sequence, exact target identity, payload extent, alignment where declared, canonical byte-order requirements, digest agreement, and checked offsets. M22-01 performs no application-specific parsing, semantic controller/calibration validation, signature verification, authorization callback, filesystem/network I/O, or executable-code loading.
  - Mailbox admission is a bounded nonblocking multi-producer operation over finalization-time storage. One successful reservation assigns an exact monotonic mailbox sequence; publication becomes visible only after the complete descriptor and payload copy; a consumer or inspector never observes a partially published slot. Contention returns an explicit bounded `busy` result rather than taking a blocking mutex, spinning without a fixed bound, allocating, or falling back to an unbounded queue.
  - Exact zero, one, full, one-over, busy-reservation, producer-capacity, record-capacity, payload-capacity, total-byte, sequence, generation, and checked-arithmetic boundaries are closed. A full mailbox deterministically rejects the new record in this batch; it does not overwrite, replace, coalesce, evict, or mutate an already published record. Accepted, invalid, full, busy, stale, stopped, and exhausted outcomes are distinct and inspectable.
  - Runtime exposes bounded read-only mailbox and record inspection sufficient to prove copied identities, payload digest, sequence, occupancy, rejects, and storage accounting. Inspection is Runtime-instance-bound, cannot mutate ownership or advance execution, reports unpublished/busy slots as unavailable, and does not return raw internal storage addresses or default payload contents. Any explicit payload-copy inspection requires a caller-sized destination and exact extent checks.
  - M22-01 adds no running consumer and applies no update to scenario, controller, calibration, fault, sampled-I/O, rate, graph, callback, device, state registry, or backend behavior. `step()`, periodic execution, active mixed-rate dispatch, checkpoint, replay, telemetry, watchdog, stop, and restart do not drain, interpret, publish, roll back, or emit an action for staged records. M22-02 owns boundary consumption and ordering; M22-03 owns rollback, checkpoint, replay, and telemetry.
  - Admission is permitted only through the explicit non-RT producer API and never from executor workers, backend lanes, the host frame owner, watchdog, completion poller, or telemetry drain. It performs bounded validation and copy work, creates no thread, invokes no callback or vendor function, and does not claim to be safe for signal handlers, interrupt context, or an unbounded number of concurrent producers.
  - Stop begins a generation transition that rejects new reservations, waits only through the existing bounded ownership rules, and leaves no partially published slot. Restart/finalization invalidates old producer handles and resets mailbox sequence/storage/counters according to one documented rule; M22-01 never silently reuses a stale slot or carries a staged update into a different runtime/configuration generation.
  - Configuration, finalization, replacement, failed finalization, producer registration, admission, inspection, stop, restart, and destruction are isolated per Runtime. Two Runtime instances may use identical logical producer/mailbox/update identities without sharing mutable global state, accepting each other's handles, payload slots, counters, or generations.
  - Sequence and generation exhaustion fail before zero, wrap, ABA reuse, or ambiguous ordering. Reservation tickets cannot make a failed copy appear published, and a producer failure cannot permanently consume capacity without an explicit bounded rejected/tombstone state that inspection and later M22 consumption can distinguish.
  - Successful finalization accounts for copied policy and producer declarations, mailbox controls, slot descriptors, payload storage, atomics/counters, and inspection state exactly once in existing `MemoryPlan` categories and `planned_bytes`. Caller source bytes and output buffers are excluded. Checked size/alignment arithmetic rejects before allocation or partial policy publication, and failed finalization remains retryable.
  - Graph/config/replay compatibility identity includes every frozen M22-01 policy, capacity, schema, legal update/target table, producer/mailbox declaration, admission rule, and reset rule that can change compatibility. It excludes post-finalization payload bytes, arrival order, current occupancy/counters, caller addresses, thread identity, wall-clock timing, and inspector cursor position. Individual updates do not change the finalized graph identity merely by being staged.
  - The existing standalone `core::ConfigHotReloader`, experimental SimCore seqlock, filesystem polling tests, extension loader, and any Unreal hot-reload mechanism are not reused, promoted, or modified. The supported M22 path is Runtime-integrated, data-only, fixed-capacity, instance-local, and free of repository-private filesystem state.
  - Default construction and positional aggregate/source compatibility, CPU-only and mixed-rate M16/M21 execution, deterministic mock/loopback replay, sampled safe outputs, ordinary M17/HAL-v2 backends, device-ABI-v1 adaptation, multiple Runtime instances, no-allocation checks, checked cleanup, package relocation, and legacy artifacts retain their exact pre-M22 behavior when the policy is disabled.
  - Stable C ABI v8 with exactly 70 exports and fingerprint `0xd0e7a5a14bf35f97`, SONAME 8, device ABI v1, extension ABI v1, HAL tables, Runtime status values, runtime-profile schema 7/25 keys, checkpoint/input-log/rate-action/mixed-rate-action/active-replay/observability schemas, release 1.2.1, installed target/header/alias inventory, support matrices, qualification state, Apache-2.0 license, and prior retained evidence remain unchanged.
  - Target governance, current state, handoff, component contracts, release digest ledger, static-analysis manifest, and retained `docs/evidence/M22-01-<date>.md` state the exact schema/mailbox-only boundary. Focused and full local verification, mandatory hosted CI, and human API, ownership, concurrency, capacity, identity/accounting, compatibility, and claim review pass before merge. M22 and CAP-M22 remain incomplete after this batch.
