acceptance:
  - The implementation starts from an initially clean target at exact default-branch commit `875c486570ed84df939b8b9e75c01e7c3d43b28b`. Target history proves M17-04 (`bdc97d0122effbad07dbf6d4981e1bf0de729437`), the retained failed M17-05 review (`e5f10cc572fa9ba3d4dd488781c310dafb34dfd2`), M18-01 (`5eb8f101f692b2aff85f82f4a1660630db750706`), and M19-01 (`d5224e670e3ca5ebbe3d2aec5fda7d21213499a8`) are ancestors. Later default-branch changes are governance/schema synchronization and a bounded aggregate-test timeout change; they contain no combined sample and do not repair the discovery mismatch. Governance, current-state, handoff, roadmap, and traceable evidence are reconciled to those facts without rewriting retained evidence or inventing CI or review results.
  - >-
    The sole Runtime production repair is in `rt/src/command_batch.cpp`:
    `discover_command_timeline_extension()` supplies a value-initialized
    `HalV2CommandTimelineCapabilities` whose caller-owned input prefix is
    exactly `sizeof(HalV2CommandTimelineCapabilities)` and
    `hal_v2_command_timeline_extension_version`, whose semantic fields and
    reserved tail begin zero, and whose complete returned record is still
    validated before any `CommandTimelineExtensionState` is published. It no
    longer poisons the required input header. No public declaration, table
    layout, numeric value, callback signature, vendor callback, or other
    Runtime path changes.
  - Focused discovery tests observe the exact incoming size/version and zero semantic/reserved state inside a callback, prove a valid output publishes once, and prove null/throwing/error/unsupported, untouched, short-size, wrong-version, zero/excess capacity, and nonzero-reserved outputs publish nothing and return the existing fail-closed status. A corrected registration succeeds after each rejected attempt. The repair must not weaken whole-record validation merely to make the two candidates pass.
  - A positive behavioral integration test constructs the actual `CudaDeviceBackend` and `XdmaDeviceBackend` classes with complete bounded version-2 injected driver tables and registers both native `hal_v2_registration()` results in one real `rt::Runtime`. It reaches configuring/finalize/start/step/checked-stop through the canonical Runtime discovery path; direct calls to the capability callback, the device-ABI-v1 `api()` route, a generic substitute backend, a wrapper that rewrites the record, and a disabled or expected-failure test are insufficient.
  - A top-level default build adds exactly one non-installed `sample_cpu_gpu_fpga_cpu` executable and one focused test executable/CTest gate. They use only existing installed/public Runtime, CUDA-candidate, and XDMA-candidate C++ headers and the existing `rtfw_runtime`, `rtfw_cuda_backend`, and `rtfw_xdma_backend` targets. They configure, build, and run without `RTFW_BUILD_EXPERIMENTAL`, a CUDA toolkit, GPU, XDMA node, kernel driver, root privilege, firmware, bitstream, network access, or secrets.
  - The compiled graph is exactly `CPU prepare -> simulated CUDA batch -> CPU host-stage bridge -> simulated XDMA batch -> CPU validate`, expressed with ordinary Runtime phase dependencies. The CUDA and XDMA phases each own one distinct backend-local timeline; no handle, wait, signal, or completion value crosses a backend. Cross-backend order is established only by valid completion of the CUDA download, the completed bounded CPU bridge, and the later XDMA upload. No hardware fence, coherent shared allocation, or direct peer path is declared or implied.
  - CPU preparation writes a fixed deterministic input into a CUDA-owned host staging object discovered and registered through the existing heterogeneous staged-memory contract. The declared CUDA batch/provider emits, in exact order, one `copy_to_device`, one stable-ID caller-owned pre-registered CUDA Graph dispatch with exact ordered bindings, and one `copy_from_device`, plus one finite timeout and one monotonically increasing same-CUDA-timeline signal. The injected version-2 CUDA driver owns fixed opaque simulated device storage and performs a deterministic integer transform; it remains fake protocol behavior.
  - Only after a whole successful CUDA batch completion, the CPU bridge copies the exact downloaded bytes from the CUDA-owned host region to a separate XDMA-owned borrowed-host staging region. Both spans have fixed extent, are disjoint, are never dual-registered, and have explicit access. The bridge performs no ordinary allocation, vendor call, hidden wait, pointer-derived identity, implicit coherency operation, peer-memory operation, or timeline publication.
  - The declared XDMA batch/provider emits, in exact order, one existing H2C command, one bounded aligned 32-bit little-endian control-write trigger, one finite user-event wait, and one existing C2H command, plus one finite timeout and one monotonically increasing same-XDMA-timeline signal. Its injected version-2 driver owns fixed simulated card/control/event/output state, verifies exact opcodes/ranges/access/payloads, and applies a deterministic integer transform without opening or touching a user BAR, event node, PCI function, kernel driver, firmware, bitstream, or physical FPGA.
  - At least two consecutive frames complete with deterministic frame-specific input/output, exact graph and injected-driver call order, one accepted-before-complete result per device phase per frame, one CUDA Graph launch and one XDMA trigger/event per frame, and strictly monotonic accepted and completed values on each backend-local timeline. The final CPU callback verifies every output element and count. The executable returns nonzero on any mismatch and prints one stable concise success line containing `evidence=simulated_protocol`, `physical_hardware=false`, `direct_peer_dma=false`, and the completed frame count.
  - All sample payloads, graph bindings, device/card regions, control/event values, provider declarations, timeline records, call traces, failure switches, and per-frame observations use compile-time-bounded or initialization-time-fixed storage. The measured interval begins after successful `Runtime::start()` and covers complete `Runtime::step()` calls; it reports zero ordinary heap allocations. Host-independent regression evidence uses exact storage, callback, command, poll, and driver-call counts rather than elapsed-time thresholds.
  - Thread-identity assertions prove ordinary CPU providers run only on executor workers; CUDA injected driver calls run through the matching Runtime submission/service ownership; XDMA transfer/control/event callbacks run only on its pre-existing fixed worker team; and no injected vendor callback runs on an executor worker. The sample adds no thread, lane, queue, retry loop, spill path, detached task, file/network I/O, blocking executor callback, or unbounded wait.
  - Two independently constructed Runtime/CUDA/XDMA/sample fixtures prove isolation of Runtime handles, native registration state, Graph IDs, simulated device/card/control/event storage, host buffers, timelines, call traces, stop flags, failures, and cleanup ownership. Foreign handles are rejected and one fixture cannot advance, fail, stop, or mutate the other.
  - Failure coverage is stage-specific and deterministic. An injected CUDA Graph failure after valid upload publishes no CUDA timeline completion, suppresses CUDA download, the CPU bridge, all XDMA submission, and CPU validation, and leaves only the existing bounded quarantine/cleanup ownership. An injected XDMA event-wait or C2H failure after successful CPU preparation, CUDA completion, bridge, and preceding XDMA operations publishes no XDMA timeline completion and suppresses the remaining XDMA work and final CPU validation. Tests assert exact first error, phase/callback/driver counts, no fabricated completion, checked-stop resolution or unresolved-only retry, and a fresh independent all-success run.
  - Startup, success, injected failure, correction, and checked stop preserve M17-01 through M17-04 and M19-01 exception containment, accepted-before-complete causality, whole-completion publication, timeout/cancel behavior, first-error retention, reverse cleanup, uncertain-owner quarantine, unresolved-only retry, caller-owned Graph/buffer lifetime, extension readiness, and no detached work. The one discovery repair and sample add no Runtime/backend-owned storage, MemoryPlan row, provider region, status, schema, installed header/target, or support record.
  - Stable C ABI v8 remains exactly 70 exports with fingerprint `0xd0e7a5a14bf35f97` and SONAME 8. Device ABI v1 declarations/layout/values and both candidate `api()` behaviors, HAL core v2, memory/topology v1, command/timeline v1, extension ABI v1, Runtime status values, runtime-profile schema 7/25 keys, observability/rate/checkpoint/input-log/qualification schemas and IDs, installed SDK inventory and aliases, release 1.2.1, support matrices, qualification workflows, and Apache-2.0 are byte or behavior unchanged as applicable.
  - Target governance, current state, handoff, roadmap, architecture/device/vendor/testing/readiness contracts, README, deterministic documentation/release checks, and retained `docs/evidence/M17-06-<date>.md` describe only portable RT0 simulated-protocol composition. M17/CAP-M17 may be marked functionally complete only after focused and full local validation, all mandatory CI including executable sanitizers, and required human gates pass. M18 hardware qualification and M19 Unreal work remain separate; no physical, timing, support, release, deployment, or production state changes.
