acceptance:
  - The exact baseline contains merged M17-03 target PR 219 at `0d1c95a4e859c9136b28b912735610cd58016e95`; baseline `122f9919674b5f09e321deb8ba6701f78b2993ce` changes only portfolio-harness metadata after that merge. Target governance is refreshed to M17-04 without rewriting retained M17-03 evidence or inventing an absent final CI run, check count, or separate human-review object.
  - The existing installed CUDA and XDMA headers add source-compatible `hal_v2_registration(std::string_view name) noexcept` accessors over their existing candidate objects. Each accessor returns one `HalV2BackendRegistration` supplying unchanged HAL core API version 2, memory/topology extension version 1, and command/timeline extension version 1 tables and remains borrowed through checked cleanup. Existing `api()` methods continue to return the exact device-ABI-v1 candidate tables and behavior; a host chooses one registration path for an object and Runtime rejects duplicate use or invalid lifetimes rather than wrapping or advertising both simultaneously.
  - Vendor driver callback tables evolve additively with their complete version-1 positional prefixes preserved, explicit version-1 and version-2 constants, and the existing default remaining version 1. A version-1 table is validated through the frozen prefix and ignores an all-zero appended tail; a version-2 table requires the full exact size and zero reserved fields. Version-1 CUDA/XDMA injected drivers and installed consumers retain every current transfer, kernel, event, worker, timeout, health, reset, and cleanup behavior and expose no invented Graph/MMIO/event capability. Version 2 adds `graph_launch` for CUDA and `control_read32`, `control_write32`, `wait_user_event`, and `request_stop` for XDMA; a capability is published only when every callback and configured bound it requires is present.
  - The CUDA native-v2 snapshot exposes only truthful host/staged CUDA memory, topology, and host-monotonic completion timestamp semantics implemented by the candidate. A legacy coherent borrowed-host domain remains available only for the preserved core path. The explicit staged domain uses copied registration metadata, fixed name/token storage, the existing host-registration/device-mirror or pre-bound device-address rules, and `copy_to_device`/`copy_from_device` synchronization obligations. Injected discovery or CUDA API success is not physical pinning, device-memory, topology, clock, or coherency evidence.
  - CUDA Graph support is limited to at most 16 caller-created and caller-instantiated `CUgraphExec`-compatible objects registered before backend initialization under a caller-selected unique identifier in `[1, 65535]` and up to eight copied stable buffer-name/access bindings. Runtime/backend never captures, instantiates, clones, updates, uploads, destroys, or owns a graph. Graph objects, functions, modules, contexts, streams, external allocations, and borrowed host spans remain caller-owned until checked shutdown succeeds.
  - Each CUDA graph identifier is encoded as `cuda_device_opcode_graph_base | graph_id`, where the public base is exactly `0x4347'0000u`, so the M17-03 batch declaration and compatibility identity distinguish graph selection without hashing a pointer or mutable payload. A graph dispatch has zero inline payload and exactly its registered buffer bindings in declared order. The backend rejects unknown/duplicate IDs, bits outside the 16-bit identifier field, binding/name/access/token mismatch, registry or binding overflow, post-initialize registration, malformed commands, and use of legacy or foreign buffers before any CUDA call.
  - "One native CUDA batch executes in declared command order on exactly one configured command stream: explicit staged copies use the generic M17-03 copy commands, registered kernel/graph operations use vendor dispatch commands, and one precreated completion event is recorded only after every accepted operation is enqueued. Same-backend batches and timeline signals preserve Runtime submission order on that stream. Partial enqueue failure, event-record/query failure, timeout, context loss, reset, stop, and shutdown quarantine every possibly referenced graph, stream, buffer, event, and batch until physical readiness, successful drain, or explicit final host context reclamation; Runtime never fabricates a timeline completion."
  - The XDMA native-v2 snapshot truthfully describes borrowed host staging, the configured AXI-MM endpoint topology, and host-monotonic completion timestamps only. It does not declare pinned or DMA-mapped host pages, generic FPGA memory, peer access, interrupt latency, or driver cancellation. Existing H2C/C2H transfer commands remain supported through their stable opcodes on the fixed backend I/O team.
  - XDMA adds exact vendor dispatch operations for 32-bit little-endian control read, 32-bit little-endian control write, and one user-event wait. Read is `0x5848'0000u | (offset / 4)`, write is `0x5849'0000u | (offset / 4)`, and event wait is `0x584A'0000u | event_index`. The configured control aperture is four-byte aligned, nonzero when enabled, and at most 262144 bytes, making offsets `0..262140` exactly representable; the configured event count is at most 16 and event indexes are `0..15`. Read and wait results use one exactly sized writable borrowed-host reference; write uses one fixed four-byte payload. Unknown opcodes, high/foreign bits, out-of-range offsets/indexes, access/range/payload mismatch, overflow, nonzero reserved data, or unavailable callbacks fail before driver entry.
  - The Linux XDMA adapter copies optional user-BAR and event-device paths, opens only configured endpoints during initialization with close-on-exec and the required nonblocking/event-wakeup behavior, and performs MMIO/event operations only on the existing fixed backend I/O team. Event wait uses the batch's checked finite remaining timeout and is interruptible by an idempotent nonblocking stop request. Data-transfer calls that the kernel driver cannot cancel retain their existing quarantine and checked-shutdown ownership; no thread is detached and no buffer, file descriptor, or event owner is cleared while a call may still reference it.
  - CUDA and XDMA batch submission, polling, and stop integrate only through the existing M17-03 Runtime submission/service lanes and tables. No vendor callback executes in the ordinary batch provider or executor worker. Backends add no Runtime-owned lane, cross-backend timeline, implicit command, spill queue, unbounded retry, per-command thread, host callback, or file/network I/O on executor workers. Backend-private Graph, registry, control, event, queue, and worker storage is fixed at construction/initialization, reported through existing capability byte fields, and remains excluded or truthfully declared rather than added to Runtime-owned `device_control_bytes`.
  - Native-v2 capability, domain/topology/timestamp, stable graph opcode/bindings, XDMA control offset/event opcode, command order, logical references, waits, and signals participate through the existing M17-02/M17-03 conditional identity rules. Driver pointers, native handles/file descriptors, graph executables, host addresses, mutable queue/event state, observed timestamps/counters, and health do not. Configurations using the device-ABI-v1 path retain exact M17-03 identity, thread inventory, accounting, and artifact bytes.
  - Construction, registration, initialization, submit, poll, timeout, reset, stop, and destruction preserve exception containment, checked arithmetic, fixed capacities, Runtime-instance isolation, accepted-before-complete causality, whole-completion publication, exact-once graph release, first-error retention, reverse cleanup, and unresolved-only retry. Complete CUDA Graph and XDMA control/event frames plus cleanup add no ordinary heap allocation after successful start.
  - Stable C ABI v8 with exactly 70 exports and its frozen fingerprint, SONAME 8, every device-ABI-v1 declaration/layout/value, HAL core v2, memory/topology extension v1, command/timeline extension v1, Runtime status values, runtime-profile schema 7 and 25 keys, observability/rate/checkpoint/input-log schemas and IDs, installed header/target inventory and aliases, release 1.2.1, support matrices, and Apache-2.0 remain unchanged. Vendor additions are C++ source contracts requiring recompilation and make no C++ binary ABI promise.
  - Target governance, current state, handoff, architecture, HAL/vendor/memory/policy/accounting/determinism/observability/testing/safety contracts, release digest ledger, and retained M17-04 evidence describe actual portable and injected behavior. M17 and CAP-M17 remain incomplete; the CPU-GPU-FPGA-CPU sample, device-rate execution, cross-backend timelines, direct peer DMA, support promotion, and physical qualification remain outside this batch.
  - Focused malformed/success/failure/lifecycle tests, clean default and opt-in installed-package consumers, complete deterministic local verification, mandatory GitHub CI, and human API, compatibility, CUDA/XDMA ownership, concurrency, MMIO safety, lifecycle, accounting, security, and claim-boundary review pass before merge.
