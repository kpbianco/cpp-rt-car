batch:
  id: M16-02
  title: Add deterministic cross-rate data semantics
  goal: Add a bounded additive C++ cross-rate channel model for explicit M16 rate plans, compile an immutable sample-and-hold and freshness-selection plan over the exact reference supercycle, and provide preallocated race-free snapshot storage primitives without yet changing host-driven or periodic callback dispatch, admission, late behavior, shedding, recovery, or telemetry schemas.
