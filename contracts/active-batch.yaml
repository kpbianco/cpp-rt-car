batch:
  id: M22-03
  title: Close live-control rollback, checkpoint, replay, and telemetry
  goal: Add a bounded additive C++ live-control closure over the merged M22-01 staging and M22-02 exact-boundary publication path. Retain a step-entry immutable generation, settle every boundary generation as committed or rolled back after execution ownership resolves, emit canonical accepted/rejected/publication/rollback action records without payload bytes, checkpoint all execution-relevant mailbox and generation state, and reproduce exact boundary generations through a distinct bounded replay artifact. Preserve every stable ABI and existing artifact schema, keep application parsing and arbitrary user-state rollback outside Runtime ownership, and defer typed domain helpers, examples, stress closure, and CAP-M22 completion to M22-04.
