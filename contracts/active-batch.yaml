acceptance:
  - The existing installed `rt/device.hpp` adds a separately size/versioned optional command/timeline extension version 1 beside unchanged HAL core API version 2 and memory/topology extension version 1. It adds no installed header or target. Public fixed-width records and zeroed reserved tails define exactly 16 commands per batch, eight wait points, eight signal points, 16 timelines per backend, the existing 128-byte inline payload and eight buffer references per command, and explicit dispatch, copy, and memory-synchronization command kinds.
  - The existing `HalV2BackendRegistration` retains the M17-02 positional prefix and may append one borrowed command/timeline-extension pointer that Runtime copies before publication. The extension declares fixed capacities and required submit, bounded nonblocking completion-poll, cancel, and nonblocking stop-request operations. Runtime rejects small/unknown sizes or versions, null required callbacks, impossible/zero capacities, nonzero reserved data, incompatible capability combinations, callback exceptions, partial outputs, and values above Runtime or backend bounds transactionally.
  - A configuring-only Runtime API registers at most 16 stable named timeline handles per opted-in backend with an initial value, and a distinct batch-device phase whose provider fills one caller-borrowed fixed `DeviceCommandBatch` per invocation. Handles are Runtime-instance and backend bound; foreign, stale, duplicate, empty, over-capacity, or post-finalization registrations fail without publishing partial state. Existing `register_device_phase` and single `DeviceSubmission` behavior remain exact.
  - Every batch has a nonzero finite timeout, one to 16 commands, zero to eight waits, and one to eight signals. Wait and signal points reference only timelines owned by the same Runtime and backend; waits may target only values already accepted for signal, and each new signal value is strictly greater than the last accepted value for that timeline. Zero values, duplicate points, wait/signal contradictions, unchecked arithmetic, cycles created within one batch, and cross-backend or peer inference are rejected before backend entry.
  - Dispatch commands preserve the existing opcode, flags, payload, logical-buffer, range, access, and translation rules. Copy and memory-synchronization commands use explicit source/destination or target logical buffers and discharge only the M17-02 `copy_to_device`, `copy_from_device`, `flush`, or `invalidate` requirement they name. Runtime validates a deterministic per-batch memory-state walk so every device read is preceded by its required flush/copy and every host-visible completion follows its required invalidate/copy; it never inserts hidden work or treats registration, `mlock`, pin declarations, or a timeline point as coherence proof.
  - The batch provider executes as the ordinary graph CPU phase, but it calls no backend function. A successfully validated batch is copied into fixed Runtime-owned storage and enqueued with a bounded attempt budget to exactly one precreated submission lane for its opted-in backend. Full or contended storage returns `device_queue_full` without acceptance, retry, spill, inline vendor execution, allocation, hidden worker creation, or a partially reserved timeline value.
  - Each opted-in backend has exactly one Runtime-owned submission thread using the additive stable `thread_role_device_submission` role with numeric value 6. Its instance count equals the number of opted-in backends; default policy is portable, a configured strict policy applies and reads back through the M15 startup barrier, and report/accounting rows distinguish it from the existing device-service poll lane. Core-only HAL-v2, memory-only HAL-v2, and adapted-v1 backends create no submission lane and retain their exact M17-02 thread inventory and behavior.
  - Only the matching submission lane calls the potentially blocking extension submit callback. The existing device-service lane alone calls the extension completion poll and publishes graph completion; neither lane invokes application callbacks. Submit exceptions/errors become one terminal batch result, stop requests are nonblocking and idempotent, accepted queue entries and in-call ownership remain explicit, and a blocked injected backend is released by stop-request/cancel without detaching a thread or falsely claiming cleanup.
  - A batch is accepted before a synchronous or early completion can be applied. Completion records carry the batch ID, exact declared signal points, status, and the already declared M17-02 timestamp-domain value. Runtime validates whole completion batches, rejects unknown/duplicate IDs, undeclared/regressive/oversized timeline data, wrong backend, malformed status/timestamp fields, and completion before acceptance, and publishes no partial timeline advancement. A valid terminal completion advances each timeline monotonically by maximum completed value and releases the graph token exactly once.
  - Timeout, cancel, queue failure, backend loss/reset, malformed completion, and stop quiescence terminate or retain every batch deterministically. Reset is rejected while queued, submitting, or outstanding batch ownership exists. Stop first closes admission, requests backend stop, wakes submission lanes, cancels/fails accepted work, quiesces and joins submission lanes in reverse backend order, then stops the completion lane and performs existing reverse memory/backend cleanup. First-error retention and unresolved-only retry remain exact; borrowed backend/extension/memory instances remain live until checked cleanup succeeds.
  - All extension tables, timeline descriptors/state, copied batches, queue slots, completion scratch, lane controls, and validation state are Runtime-owned, fixed after finalization, instance isolated, and counted once in `device_control_bytes` and the existing M15 logical device extent. Submission-thread stacks are reported once through M15 runtime-stack accounting. The six-row MemoryPlan equation and three provider regions do not change; backend-private queue/event/vendor storage remains excluded or truthfully declared, never invented.
  - Command/timeline extension capabilities, registered timeline semantics, batch-phase declarations, command order, memory operations, and timeline waits/signals participate conditionally in graph/replay compatibility identity. Runtime addresses, callback pointers, mutable queue indices, batch IDs, observed completions, timestamps, and health do not. Configurations without the extension or batch phases retain exact M17-02 identity and artifact bytes; checkpoint/input-log schema 1, rate-action schema 1, and global observability schema 2 remain unchanged.
  - After successful start, provider validation, batch copy/enqueue, submission-lane dequeue/call, completion polling/validation, timeline inspection, health/reset rejection, and checked cleanup add no ordinary heap allocation, file/network I/O, blocking mutex, unbounded retry, or spill. The submission callback may block only on its isolated non-executor lane and remains subject to the declared finite timeout and stop-request contract; no portable test result is a vendor latency or bounded-driver guarantee.
  - Adapted device-ABI-v1, core-only native-v2, and memory-only native-v2 registrations expose no invented batch/timeline capability and retain every M17-01/M17-02 capability, call, status, completion, identity, accounting, and cleanup result. The unchanged mock, CUDA candidate, and XDMA candidate remain device-ABI-v1 backends; native CUDA/XDMA-v2 adapters, CUDA Graph, XDMA control/MMIO/events, device-rate execution, plugin/factory loading, cross-backend timelines, combined execution, and direct peer DMA remain outside M17-03.
  - Stable C ABI v8 with exactly 70 exports and its frozen fingerprint, SONAME 8, every device-ABI-v1 declaration/layout/value, HAL-v2 core version/table semantics, memory/topology extension version 1, Runtime status values, runtime-profile schema 7 and 25 keys, existing observability/rate/artifact schemas and IDs, installed target/header inventory and aliases, release 1.2.1, support matrices, and Apache-2.0 remain unchanged. The additions are C++ source contracts requiring recompilation and do not promise a stable C++ binary ABI.
  - Target governance, active batch, current state, handoff, roadmap, HAL/device/memory/host/executor/policy/accounting/determinism/observability/testing contracts, release digest ledger, and retained M17-03 evidence describe actual behavior and keep M17/CAP-M17 incomplete. Focused tests, clean installed-package consumers, complete deterministic local verification, mandatory GitHub CI, and human API, compatibility, lifecycle, concurrency, memory-ordering, accounting, security, and claim-boundary review pass before merge.
validation:
  local:
    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - cmake -S . -B build/agent-full -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_TESTS=ON -DRTFW_BUILD_EXPERIMENTAL=ON -DENABLE_RAPIDCHECK=ON -DSIM_SANITIZERS= -DSIM_WERROR=ON
    - cmake --build build/agent-full --parallel 2
    - ./build/agent-full/tests/simcore_tests --gtest_filter='CommandBatch.*:HalV2.*Batch*:DeviceRuntime.*Batch*:HeterogeneousMemory.*Batch*:ThreadPolicy.*DeviceSubmission*:CpuMemoryPolicy.*DeviceSubmission*:MemoryPlan.*Batch*:DeterminismReplay.*Batch*:TraceNoAlloc.*Batch*'
    - ctest --test-dir build/agent-full --output-on-failure -R 'm17_command_batch_timeline|m17_heterogeneous_memory_topology|m17_hal_v2_compatibility|m15_accounting_closure|m15_stack_lifecycle|m15_cross_category_rollback|m16_rate_timeline|m16_rate_dispatch|m16_shedding_telemetry|m16_cross_rate_data|xdma_backend'
    - cmake -S . -B build/m17-03-package -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTS=OFF -DRTFW_BUILD_EXPERIMENTAL=OFF -DRTFW_BUILD_EXAMPLES=OFF -DRTFW_BUILD_RUNTIME_DEMO=OFF -DSIM_WERROR=ON
    - cmake --build build/m17-03-package --parallel 2
    - cmake --install build/m17-03-package --prefix "$PWD/build/m17-03-install"
    - cmake -S tests/package_consumer -B build/m17-03-package-consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/build/m17-03-install"
    - cmake --build build/m17-03-package-consumer --parallel 2
    - ctest --test-dir build/m17-03-package-consumer --output-on-failure
    - ./scripts/agent-verify.sh full
    - python3 tools/check_c_abi.py --library build/agent-full/librtfw.so
    - readelf -d build/agent-full/librtfw.so | rg 'SONAME.*librtfw.so.8'
  focused_tests_to_add:
    - exact version, enum, constant, default, reserved-tail, and LP64/LLP64 layout diagnostics for extension capabilities/table, commands, batches, timeline points/handles/info, and completions, plus M17-02 positional aggregate-prefix consumers
    - transactional extension registration rejection for malformed sizes/versions/capacities/callbacks/reserved data, callback exceptions, partial writes, duplicate extensions, and excess configured timelines or batch phases
    - timeline registration, freeze, inspection, foreign/stale/cross-backend rejection, strictly increasing accepted signals, prior-accepted waits, duplicate/zero/overflow/cycle rejection, completion monotonicity, and two-runtime isolation
    - exhaustive batch bounds and ordered dispatch/copy/flush/invalidate validation, including logical-buffer access/range/alignment, heterogeneous synchronization discharge, missing or wrong-order synchronization, opaque-device memory, and proof that no hidden command is inserted
    - bounded queue acceptance and saturation with an accepted prefix only, deterministic queue-full behavior, no retry/spill/inline callback, exact batch copy lifetime, producer return before backend entry, and one submission lane per opted-in backend
    - injected blocked, throwing, erroring, early-completing, malformed-completing, out-of-order, duplicate, timed-out, canceled, reset-required, and lost backend behavior with exact terminal graph result and no application callback on submission/completion lanes
    - startup policy apply/readback for every conditional submission-lane instance, strict failure before callbacks, reverse partial-start rollback, stop-request unblocking, reverse join, first-error retention, cleanup retry, destructor fail-safe, and no detached or leaked lane
    - exact completion acceptance handshake, whole-poll-batch validation, signal-set equality, max-completed timeline publication, exact-once graph release, timestamp-domain preservation, and rejection without partial timeline state
    - exact command/timeline/lane storage and stack reconciliation in device control, the M15 logical ledger, and the unchanged six-row plan, with backend-private bytes excluded and no provider-region expansion
    - conditional identity sensitivity to extension/timeline/batch/memory-order semantics and byte-exact M17-02 identity/artifact preservation when unused, with unchanged checkpoint/input-log/rate-action/observability schemas
    - complete frames and stop under allocation instrumentation plus concurrent enqueue/poll, blocked-backend, cleanup, and two-runtime ThreadSanitizer coverage with bounded callback counts and no executor-worker backend call
    - installed preferred and compatibility C++ consumers for batch/timeline additions and old aggregate prefixes, plus unchanged C, device-v1 CUDA/XDMA, header-inventory, warning-isolation, and pure-C consumers
  required_ci:
    - Documentation contract workflow covering exact command/timeline/lane semantics and claim limits, quick-start, release contract, frozen C ABI/device ABI, SDK inventory, and permanent M15/M16/M17-01/M17-02 gates
    - Linux GCC 11 and Clang 14 Debug and RelWithDebInfo FMA on/off matrix with AddressSanitizer and UndefinedBehaviorSanitizer coverage of malformed batches, memory ordering, timeline completion, saturation, blocked/error lifecycle, identity, accounting, and recovery
    - Windows Server 2022 MSVC v143 Debug and RelWithDebInfo matrix covering identical constants/defaults/validation, intentional size/alignment diagnostics, native thread startup/stop portability, source compatibility, and installed consumers
    - Unified executor GCC ThreadSanitizer job executing the complete CommandBatch, HeterogeneousMemory, HAL-v2/v1-adapter, submission/completion-lane, blocked-stop, mixed cleanup, two-runtime, CUDA fake-driver, portable XDMA, and permanent M15/M16 processes without weaker exclusions or timeouts
    - Determinism GCC and Clang FMA-on and FMA-off jobs plus artifact exchange proving byte-exact M17-02 identity when unused and explicit batch/timeline identity separation when configured
    - C and C++ embedding, add_subdirectory, installed-package, archive relocation, SDK header self-containment, compatibility aliases, unchanged v1 CUDA/XDMA consumers, exact 70-export C ABI consumers, dependency review, SBOM, and existing autotune/scaling smoke jobs
    - Existing no-allocation, bounded-memory/control-ledger, thread-policy/stack cleanup, M14.1 device recovery, M15 rollback, M16 timeline/data/dispatch/shedding/telemetry, M17-01 compatibility, M17-02 memory/topology, sanitizer, fuzz-smoke, observability-schema, documentation, release-contract, package, CUDA fake-driver, and XDMA portable gates; no hosted vendor, timing, or hardware claim is authorized
  manual:
    - Human public-API and compatibility review must approve the additive extension/table/record/handle shape, exact capacities and command vocabulary, M17-02 positional source compatibility, conditional identity boundary, and preservation of C ABI v8, device ABI v1, HAL core v2, memory extension v1, Runtime status, package, schema, release, support, and license boundaries.
    - Human concurrency, lifetime, memory-ordering, and safety review must confirm bounded enqueue, accepted-before-complete publication, one backend caller lane, queue and timeline atomic ordering, explicit synchronization discharge, no executor-worker backend calls, nonblocking stop request, reverse join/cleanup, uncertain ownership retention, exact accounting, and absence of post-start allocation or detached work.
    - Promotion review is deferred. Native CUDA/XDMA v2 and vendor controls remain M17-04, combined staged execution remains M17-05, and every vendor latency, physical memory/topology/timestamp, hardware, HIL, RT1, or RT2 claim requires later named retained evidence and separate human approval.
risk:
  class: high
  hazards:
    - accepting a timeline signal before queue ownership commits can leave an unreachable wait value or allow a synchronous completion to release the wrong graph token
    - malformed, duplicate, regressive, or cross-backend completion points can corrupt monotonic timeline state or publish only part of a multi-signal completion
    - a missing or misordered flush, invalidate, or staged-copy command can expose stale or incoherent memory even though registration and range validation pass
    - a full multi-producer queue, ABA-prone slot generation, or weak publication ordering can overwrite an accepted batch, execute it twice, or race completion and cancellation
    - a backend callback that blocks, ignores timeout/stop, throws, or completes during submission can deadlock shutdown, strand ownership, or run vendor work on an executor lane
    - adding a conditional runtime-owned thread role can undercount stacks, aggregate policy success incorrectly, start callbacks before verification, or break reverse cleanup
    - new fixed batch/timeline storage can overflow arithmetic, be omitted or double-counted, allocate after start, or leak across Runtime instances
    - appending C++ aggregates can break positional source consumers or warning-clean MSVC builds while stable C ABI checks remain green
    - hashing mutable batch IDs, timeline progress, callbacks, or addresses can make compatible configurations nondeterministic; failing to hash semantic declarations can accept incompatible artifacts
    - portable injected lanes and fake completions can be overstated as bounded vendor latency, real CUDA/XDMA synchronization, physical hardware, HIL, or RT qualification
  stop_conditions:
    - the exact baseline commit is unavailable, dirty, or lacks merged M17-02 commit ee1ddd21c483687c4237f3b53ec8d15029d20ff2 and all retained M15/M16/M17-01/M17-02 evidence
    - target contracts or actual M17-02 code contradict the additive extension, same-backend timeline, explicit synchronization, conditional-lane, identity, or ownership model and require a new product/architecture decision
    - implementation requires changing stable C ABI v8, SONAME 8, any device-ABI-v1 declaration/layout/value, HAL-v2 core version/table semantics, memory/topology extension version/semantics, Runtime status values, runtime-profile schema 7/25 keys, observability/rate/artifact schemas or IDs, installed header/target inventory, support matrices, release version, or license
    - correct behavior requires more than the fixed public capacities, silent truncation, hidden synchronization, a cross-backend timeline, direct peer DMA, or treating an unverified memory/topology/timestamp fact as established
    - an opted-in backend cannot keep every potentially blocking submit callback off executor workers or cannot provide a nonblocking idempotent stop request and finite-time callback-return contract without detaching a thread or clearing uncertain ownership
    - accepted-before-complete, exact-once graph release, monotonic multi-signal publication, queue cancellation, reset exclusion, or reverse retryable cleanup cannot be made race-free with bounded preallocated storage
    - adapted-v1, core-only-v2, or M17-02 memory-only behavior and identity cannot remain exact when the batch extension is absent, or the conditional submission role cannot be represented and accounted without changing a protected schema
    - native CUDA/XDMA v2 adapter code, CUDA Graph, XDMA control/MMIO/event code, device-rate dispatch, plugin/factory loading, combined-device execution, direct peer DMA, or support-matrix promotion becomes necessary to satisfy acceptance
    - deterministic functional tests require timing sleeps/tolerances, a fixed CPU/NUMA/PCI topology, root privilege, physical CUDA or FPGA/XDMA hardware, controlled timing hosts, secrets, signing, release, deployment, or production access
    - a required source, test, workflow, documentation, governance, or evidence change falls outside allowed paths or enters a forbidden path
rollback:
  strategy: Revert the optional command/timeline extension and Runtime phase/timeline API, fixed batch queues and validation, conditional per-backend submission lanes and thread-role/accounting integration, manager completion/timeline state, identity/accounting changes, tests/CI, documentation/governance, release digests, and retained M17-03 evidence as one batch. Before discarding a running integration, close batch admission, issue the nonblocking backend stop request, resolve or retain every queued/submitting/outstanding batch, join submission lanes in reverse backend order, quiesce the completion lane, and complete existing reverse memory/backend/thread/region cleanup; never detach a blocked lane, invent a completion, regress a timeline, or clear uncertain backend/memory ownership. Exact ee1ddd M17-02 single-submit and heterogeneous-memory behavior is the fallback, with no data migration, persistent host setting, support promotion, release, or deployment rollback.
  data_migration: none
  release_action: Do not publish a release, promote CUDA/XDMA/peer/combined/RT support, alter qualification records, or mark M17/CAP-M17 complete from this batch.
