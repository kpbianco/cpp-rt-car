    - The reviewer must confirm every accepted/rejected/published/terminal/rollback action is closed and correlated, payload bytes stay out of telemetry, replay retention loss fails closed, checkpoint claims are race-complete, complete artifact/state validation precedes restore, and stale Runtime/producer identities are not revived.
    - The reviewer must confirm nested ordinary/active replay artifacts remain byte exact, live replay injects only validated immutable generations at exact targets, deterministic backend restrictions are preserved, all running operations remain bounded, and no portable rollback/action/checkpoint/replay result is described as physical control, HIL, RT1, RT2, executable hot reload, support promotion, release, deployment, or production evidence.
risk:
  class: high
  hazards:
    - overwriting the step-entry or provisional generation before execution settles can make rollback publish torn, stale, or wrong-target bytes
    - treating Runtime generation rollback as application-state rollback can hide irreversible callback, backend, external-process, or physical side effects
    - an action emitted before admission/publication/terminal ownership settles can report a wrong result or make an incomplete range appear replayable
    - extending an existing checkpoint, input-log, mixed-rate, active-replay, rate-action, or observability schema in place can silently break legacy consumers
    - checkpointing while a producer publishes or a boundary settles can mix mailbox sequence, payload, cursor, and generation state from different linearization points
    - replaying from arrival timing or an incomplete/lossy action/journal range can diverge while preserving a misleading generation digest
    - storing payloads in default telemetry or export can disclose configuration or secret material outside the explicit artifact trust boundary
    - portable deterministic mock/loopback replay can be mislabeled as physical apply, device rollback, HIL, controlled timing, RT1, or RT2 evidence
  stop_conditions:
    - the exact target baseline is unavailable, dirty, lacks merged M22-02 evidence, or differs from merged pull request 248
