    - git diff --name-only ff143eede097885c1535ed7b335b709e1cec44bd
  focused_tests_to_add:
    - transactional endpoint validation for exact phase/backend/reference ordinal, direction/role/access, host visibility, coherency, envelope, positive aligned stride, exact slot subranges, checked size arithmetic, timestamp domain, overlap, topology, and correction/retry
    - immutable direct channel/phase slices, registration-order canonicalization, graph identity sensitivity, exact MemoryPlan accounting, and no active full-registry scans
    - CPU producer to device consumer first-cycle, same-cycle, prior-cycle wrap, equal-time tie, maximum-age boundary, held/fresh/stale, skipped producer, and generation-exhaustion selection
    - device producer terminal success to CPU consumer publication with exact release, batch generation, completion status, timestamp-domain, timestamp, age, provenance, freshness, held, and payload agreement
    - proof that submit success, timeout, cancel, reject, error, malformed completion, loss, quarantine, skip, shed, and provider failure do not publish device output or overwrite the last committed generation
    - synchronous early completion and asynchronous completion ordering before dependency release, with a dependent CPU callback unable to observe uncommitted or partially copied output
    - exact-capacity and one-over-capacity store, staging, retention, channel, selection, in-flight range, and generation cases with stale/duplicate/foreign completion rejection
    - disjoint per-in-flight execution-slot subranges plus rejection of undersized envelopes, misaligned or overlapping strides, provider-selected offsets, implicit references, device-to-device edges, shared-store fan-in/fan-out, and unregistered-memory topology
    - no post-start allocation, no blocking mutex or spin, one bounded claim/copy, no new thread, no executor/host vendor call, ThreadSanitizer publication/copy coverage, and two-runtime isolation
    - unchanged CPU-to-CPU M16 channels, M17 batch/timeline execution, M21-02 channel-free execution, checkpoint/replay schemas and fixtures, default/positional aggregate construction, installed C++ consumer, ABI/package inventory, and prior evidence
  required_ci:
    - Documentation contract workflow including truthful M21-03 CPU/device payload-only claims, quick-start, release contract, frozen C ABI, exact SDK inventory, and unchanged support matrices
    - Linux GCC 11 and Clang 14 Debug and RelWithDebInfo, FMA on/off matrix with AddressSanitizer and UndefinedBehaviorSanitizer coverage of endpoint admission, wrap selection, publication ordering, completion failures, capacity, lifecycle, and compatibility
    - Windows Server 2022 MSVC v143 Debug and RelWithDebInfo matrix producing identical selection, generation, timestamp/status, freshness, failure, and accounting results and passing installed consumers
    - Unified executor GCC ThreadSanitizer job covering CPU publish versus device input copy, backend completion versus device output publication, dependent CPU reads, slot retirement/reuse, concurrent stop, late completion, and two Runtime instances without races
    - Determinism GCC/Clang FMA-on/off and artifact exchange proving unchanged CPU-only fixtures plus equivalent CPU/device payload generations, selected source identity, status, timestamp domain, freshness, held state, and payload checksums for deterministic fake backends
    - C and C++ embedding, add_subdirectory, installed-package, archive relocation, SDK header self-containment, compatibility aliases, exact 70-export C ABI consumers, and existing portable assurance/autotune/scaling smoke jobs
    - Existing M16 cross-rate/no-allocation/rate/replay gates, M17 memory/batch/timeline/vendor gates, M21-01 admission and M21-02 dispatch/completion gates; no sampled-I/O, physical-device, controlled-timing, or performance threshold is authorized
  manual:
    - Human review must confirm that each device endpoint resolves one exact copied pre-registered host-visible range, potentially overlapping releases cannot alias writable bytes, terminal success is the sole device-output publication point, and immutable selection rather than completion arrival order chooses data.
    - The reviewer must confirm finite store ownership and retirement, no-allocation/bounded-copy arguments, additive C++ source compatibility, unchanged ABI/schema/package/support boundaries, and that fake-driver payload evidence is not described as physical CUDA, XDMA, DAC/DAQ, CAN, IIO, HIL, RT1, or RT2 evidence.
risk:
  class: high
  hazards:
    - mapping a channel implicitly to the first device reference can route bytes to the wrong buffer, direction, backend, command, execution slot, or release
    - unchecked envelope/stride arithmetic or one static writable subrange reused by overlapping releases can corrupt input before submission or output before terminal capture
    - publishing at submit or poll arrival instead of correlated terminal success can expose partial, failed, stale, or wrong-generation device data
    - callback, backend completion, dependency release, stop, and slot retirement actors can race and permit a consumer to read while bytes are changing
    - host-inaccessible or incoherent memory can be dereferenced on a Runtime lane, causing undefined behavior or inventing portability the HAL does not provide
    - completion timestamps from an unrelated or uncorrelatable domain can produce fabricated freshness and selection age
    - new staging/store bytes can be omitted, double-counted, dynamically allocated, or confused with borrowed registered-buffer payloads
    - portable fake-driver byte movement can be mislabeled as physical CUDA/XDMA/DAC/DAQ behavior, electrical correctness, HIL, or RT qualification
  stop_conditions:
    - the exact target baseline is unavailable, dirty, or lacks merged M21-02 evidence and the bounded release/completion state machine
    - implementation requires changing C ABI v8, SONAME 8, device ABI v1, extension ABI v1, HAL version contracts, Runtime statuses, artifact/runtime schemas, installed inventory, support matrices, qualification state, release version, license, or prior evidence
    - an endpoint cannot be resolved to one exact copied M17/M21 payload-reference envelope and CPU-accessible/coherent pre-registered storage without raw pointers or implicit matching
    - the M21-02 execution-slot ordinal cannot deterministically select a disjoint aligned subrange within that envelope while keeping the provider unable to choose arbitrary offsets
    - exact generation, release sequence, terminal status, timestamp domain, timestamp, freshness, and sample/hold selection cannot be established without completion-arrival-order dependence or unbounded history
    - implementation requires device-to-device channels, sampled-I/O clock/trigger/calibration/safe-state semantics, overrun/underrun rings, replay/checkpoint schema changes, telemetry schema changes, vendor adapters, M21-04 or later behavior, or another unfixed product decision
    - credible validation requires timing sleeps/tolerances, a physical CUDA/XDMA/DAC/DAQ/CAN/IIO device, privileged or controlled host, Unreal, secrets, signing, release, deployment, or production access
    - any required source, test, workflow, documentation, governance, or evidence change falls outside allowed paths or enters a forbidden path
    - target contracts at the exact baseline contradict this payload-only vertical or require weakening a deterministic, sanitizer, no-allocation, compatibility, or release gate
rollback:
  strategy: Revert the additive device endpoint selectors/strides and read metadata, compiled endpoint/channel/subrange slices, Runtime-owned active-batch subrange materialization, preallocated staging and retention state, CPU-to-device materialization, device-terminal-to-CPU publication, tests/CI, documentation, governance synchronization, release-contract digest updates, and M21-03 evidence as one batch. Restore the M21-02 rule that cross-rate compilation rejects every device endpoint and active batches require exact declared ranges while preserving CPU-to-CPU channels and active device dispatch/completion.
evidence:
  output:
    - docs/evidence/M21-03-<date>.md
    - exact control and target baselines, changed files, commands, exit codes, focused test counts, required CI run/check identifiers, and human review result
    - public additive endpoint/read shapes, copied-reference envelope and slot-stride mapping, memory accessibility/coherency rules, immutable channel/phase/subrange slices, capacities, defaults, lifetime, and deferred sampled-I/O/replay behavior
    - deterministic CPU publication, device input materialization, terminal output capture, dependency release, consumer selection, retention, and retirement order across first-cycle, repeating-cycle, wrap, overlap, failure, timeout, cancellation, loss, and stop cases
    - generation/release/batch/status/timestamp-domain/timestamp/freshness proof for stale, duplicate, foreign, malformed, late, canceled, skipped, shed, failed, and terminal completions with exact publication results
    - no-allocation/bounded-copy evidence, exact MemoryPlan reconciliation, pre-registered range ownership, two-runtime isolation, retryable correction/cleanup, and unchanged CPU-only/channel-free execution
    - exact C ABI v8 70-export fingerprint/SONAME, device ABI v1, HAL/extension contracts, schema/version, installed package/header/alias, support/qualification, license, and prior-evidence preservation results
    - residual risks and every unperformed M21-04 sampled-I/O/loopback, M21-05 overload/replay/conformance, controlled performance, physical CUDA/XDMA/DAC/DAQ/CAN/IIO, HIL, field, latency, electrical, thermal, endurance, RT1, RT2, Unreal, signing, publication, release, deployment, and production validation
  claim_boundary: Evidence may establish bounded CPU-to-device and device-to-CPU payload publication over exact Runtime-selected disjoint subranges of copied pre-registered host-visible envelopes, terminal-success ordering, immutable generation/release/status/timestamp-domain/freshness selection, fixed-capacity ownership, package compatibility, and portable RT0 fake-driver static/unit/property/sanitizer behavior only. It does not establish sampled-I/O clocks, triggers, scaling, calibration, safe outputs, overrun/underrun handling, replay closure, physical CUDA/XDMA/DAC/DAQ/CAN/IIO behavior, electrical correctness, HIL, field evidence, latency, RT1, RT2, Unreal integration, support promotion, signing, publication, release, deployment, or production readiness.
