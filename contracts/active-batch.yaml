acceptance:
  - The report retains the twelve stable M15-01 memory identities and their accounting keys, adds only append-only C++ source-compatible closure metadata, and classifies each row and aggregate total as exact, declared-only, partial, unknown, or not applicable instead of representing an estimate or opaque resource as exact.
  - Finalization builds a checked, non-overlapping logical extent ledger from the actual persistent runtime, executor, and device-manager objects and capacities after their construction; the three control-row totals equal the existing MemoryPlan control terms, the six planned rows still sum exactly to planned_bytes, and any missing, duplicate, overlapping, overflowing, or estimate-versus-construction mismatch fails before the report is published or callbacks can run.
  - The configured MemoryProvider remains copied and used for acquisition only by active phase-scratch, task-scratch, and trace-storage rows. Fragmented controls and stacks that existed or are created outside that acquisition transaction are never called provider-backed, pinned, huge-page-backed, guarded, locked, resident, or independently verified unless the corresponding operation and observation actually occurred.
  - A bounded additive C++ configuring-time declaration mechanism can supply cardinality and byte totals for externally owned host-executor, XDMA/vendor stack, backend-private, or other opaque resources. Declarations are copied, keyed to existing stable identities, checked for duplicates, capacity, ownership, arithmetic, and contradictions with device-ABI-v1 control_storage_bytes, and affect accounting completeness only; they never authorize mutation or qualify the declared resource.
  - Without declarations, the caller frame, host-adapter workers, XDMA/vendor workers, borrowed registered state/device buffers, and backend-owned storage retain truthful known, partial, or unknown cardinality and byte states. A strict request for exact closure fails before native mutation when any required external/backend fact is absent, while portable defaults and best effort remain usable with explicit incomplete accounting.
  - Each runtime-owned executor, watchdog, and device-service thread publishes its actual native stack and guard commitment after creation, and the aggregate runtime-thread-stack row uses the known finalized cardinality and checked exact-once byte totals. Linux residency is sampled only from live observed stack mappings; mlock success is not independent lock readback or device/DMA pinning, and non-Linux or otherwise unobservable facts remain unsupported rather than inferred.
  - Strict runtime-stack locking or residency requirements participate in the M15-02 startup barrier. No host callback executes until every required live stack observation succeeds; best-effort failure remains visible; and no stack provider call, custom host stack substitution, privileged host mutation, fixed CPU/node assumption, or timing-only assertion is introduced.
  - Stack-policy cleanup is a status-bearing, retryable operation completed on the owning lane before its native stack can disappear. A cleanup failure keeps that quiescent lane and its ownership explicit, makes start or checked stop fail, retries only unresolved cleanup, and prevents selected-region rollback or provider-token release until every device, thread, and stack obligation that can still reference those regions is resolved.
  - "Startup failure and checked stop preserve one observable reverse ownership order: device/backend cleanup as governed by M14.1, device-service then executor workers in reverse instance order then watchdog joins with stack cleanup complete, followed by reverse control-policy cleanup and M15-03 trace/task/phase rollback and release. The first error is retained while independent cleanup continues, no token or byte is cleared on failed cleanup, and retry reaches an idempotent stopped state."
  - Fragmented control residency verification is limited to the validated logical extents and safe process-local observation available at the baseline. Operations that would touch, lock, guard, remap, move, or unlock allocator-shared pages, configuring-state Runtime::Impl storage, borrowed memory, or backend-owned memory are rejected in strict mode and reported as unsupported or incomplete in best effort.
  - Default construction and aggregate initialization that compiled before M15-04 still compile and preserve meaning; all additions to CpuMemoryPolicy, MemoryPolicyReport, CpuMemoryPolicyReport, or related installed C++ declarations are appended or otherwise source-compatible, and copied declarations and reports remain isolated across two Runtime instances.
  - Default and fully declared configurations preserve release 1.2.1 lifecycle, callbacks, host-adapter behavior, nested work, watchdog, device completion and retryable cleanup, trace wrap/loss, deterministic replay, and zero ordinary heap allocation after successful start.
  - Stable C ABI v8 with 70 exports and its frozen fingerprint, SONAME 8, device ABI v1 including the existing capabilities table, runtime configuration schema 7 and its 25 keys, observability and artifact schemas, installed target/header inventory, compatibility aliases, support matrices, release version, and Apache-2.0 remain unchanged.
  - Target AGENTS, active-batch, current-state, handoff, roadmap, component contracts, readiness checklist, release digest ledger, and retained M15-04 evidence describe the exact implemented boundary and do not convert a declaration, mock, injected provider, hosted CI, preflight, documentation, or named-host functional observation into physical hardware, HIL, field, latency, RT1, RT2, signing, release, deployment, or production evidence.
  - Focused tests, complete deterministic local verification, mandatory GitHub CI, and human accounting, public-API, lifetime/concurrency, native-call, rollback, and compatibility review pass before merge; M15 and CAP-M15 are marked complete only after that evidence is retained.
validation:
  local:
    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - cmake -S . -B build/agent-full -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_TESTS=ON -DRTFW_BUILD_EXPERIMENTAL=ON -DENABLE_RAPIDCHECK=ON -DSIM_SANITIZERS= -DSIM_WERROR=ON
    - cmake --build build/agent-full --parallel 2
    - ./build/agent-full/tests/simcore_tests --gtest_filter='CpuMemoryPolicy.*:MemoryPolicy.*:ThreadPolicy.*:MemoryPlan.*:DeviceRuntime.*Rollback*:TraceNoAlloc.CompleteCpuFramesDoNotAllocate:TraceNoAlloc.StaticCompleteCpuFramesDoNotAllocate:TraceNoAlloc.CompleteDeviceFramesDoNotAllocate'
    - ctest --test-dir build/agent-full --output-on-failure -R 'thread_policy_rollback|thread_policy_recovery'
    - ./scripts/agent-verify.sh full
  focused_tests_to_add:
    - exact runtime, executor, and device control extent inventory with checked equality to each MemoryPlan term and rejection of missing, duplicate, overlapping, overflowing, or construction-mismatched extents
    - planned, informational, excluded, declared-only, partial, and unknown cross-category totals with stable keys and no double counting of page rounding, guards, allocator overhead, borrowed payload, backend bytes, or provider storage
    - bounded external/backend declaration copy, duplicate and contradiction rejection, missing-declaration strict failure, truthful best-effort incompleteness, and device-ABI-v1 control_storage_bytes reconciliation
    - actual executor, watchdog, and device-service stack and guard aggregation across default and requested sizes, inactive roles, host-adapter ownership, unavailable observation, and two-runtime isolation
    - strict and best-effort live-stack residency and locking apply/observation with injected failure, mismatch, rollback failure, unresolved-only retry, and zero callback execution
    - device cleanup, reverse thread join and stack cleanup, fragmented-control cleanup, and trace/task/phase rollback ordering after every injected startup and stop failure, including M14.1 cleanup-pending preservation
    - strict rejection of control or external operations that would mutate allocator-shared, pre-provider, borrowed, or backend-owned storage and proof that the MemoryProvider is still invoked only for phase scratch, task scratch, and trace storage
    - pre-M15-04 positional aggregate initialization plus preferred and compatibility installed C++ consumers using default and fully declared accounting
    - default and declared lifecycle, host-adapter, nested-work, watchdog, mock-device, trace, deterministic replay, failed-start retry, checked-stop retry, and two-runtime regressions
    - complete CPU and mock-device steady-state frames with closed reports and zero ordinary heap allocation after successful start
  required_ci:
    - Documentation contract workflow including quick-start, release-contract, frozen C ABI, and exact SDK inventory checks
    - Linux GCC 11 and Clang 14 Debug and RelWithDebInfo matrix with AddressSanitizer and UndefinedBehaviorSanitizer coverage of extent validation, stack observation, cleanup, and lifecycle
    - Windows Server 2022 MSVC v143 Debug and RelWithDebInfo matrix exercising unchanged defaults, source compatibility, and truthful unsupported or declared accounting
    - Unified executor GCC ThreadSanitizer job with accounting publication, stack startup/cleanup, failed-start, checked-stop retry, and combined device/thread/memory rollback scenarios executed in bounded fresh processes where the existing harness requires them
    - determinism GCC and Clang FMA-on and FMA-off jobs plus artifact exchange
    - C and C++ embedding, add_subdirectory, installed-package, archive relocation, SDK header self-containment, compatibility aliases, and exact 70-export C ABI consumers
    - Existing no-allocation, bounded-memory-plan, cross-instance device-isolation, mock-device recovery, documentation, and release-contract gates; no controlled-hardware performance or residency claim is authorized
  manual:
    - Human review must confirm the append-only C++ API shape, exact ledger boundaries, external declaration trust model, native stack lifetime, unresolved-cleanup ownership, cross-category reverse ordering, and preservation of C ABI v8 and device ABI v1 before merge.
    - Any named-host Linux stack/control inspection must record the exact kernel, libc, page size, process limits/capabilities, requested/resolved/applied/observed values, commands, errors, and unsupported paths; absence of such an observation blocks only that stronger host-functional statement and never creates hardware or RT evidence.
risk:
  class: high
  hazards:
    - a logical estimate can be mislabeled as allocator commitment or physical residency, or page overlap can double count an observed physical fact
    - control objects can move, reallocate, or be destroyed after their extents are inventoried, leaving a stale ledger or unsafe observation range
    - a runtime stack can disappear before cleanup or observation completes, and failed cleanup can deadlock stop or lose ownership needed for retry
    - concurrent lane exit can violate reverse cleanup ordering or release phase, task, or trace backing while a callback, service lane, backend, or stack still references it
    - external/backend declarations are trusted host metadata and can be complete syntactically while false operationally
    - adding closure fields or configuring-time declarations can break positional C++ aggregate initialization, package consumers, runtime-instance isolation, or copied-lifetime rules
    - common lifecycle changes can regress M14.1 device recovery, M15-02 wake/start barriers, M15-03 provider token ownership, allocation bounds, determinism, or sanitizer behavior
    - hosted CI or named-host mincore/mlock observations can be overstated as independent lock verification, device pinning, physical hardware, latency, RT1, or RT2 evidence
  stop_conditions:
    - the exact baseline commit is unavailable or M15-01 through M15-03 implementation, retained evidence, and the post-merge live-guard stabilization are absent
    - a stable C ABI v8, SONAME 8, device ABI v1, runtime-profile schema, observability/artifact schema, support-matrix, release-version, license, or default installed-header/target change becomes necessary
    - exact accounting would require treating allocator estimates, rounded pages, backend declarations, or unknown thread cardinality as independently measured facts
    - safe control policy would require remapping Runtime::Impl, mutating allocator-shared pages, calling the configured provider for a pre-existing allocation, or touching borrowed/backend-owned storage
    - runtime-stack cleanup cannot remain status-bearing, retryable, and ownership-preserving without detaching, canceling, abandoning, or unmapping a live thread
    - any failure path can release provider tokens or clear device/thread/memory ownership while callbacks or cleanup may still reference the resource, or cannot preserve the first error and retry only unresolved work
    - implementation requires privileged or machine-wide mutation, physical CUDA or FPGA/XDMA hardware, a fixed CPU/NUMA topology, configured huge pages, controlled timing hardware, secrets, signing, release, deployment, or production access
    - deterministic functional tests require root privilege, timing-only assertions, weakening an existing sanitizer/compatibility gate, or converting a mock, fixture, hosted runner, preflight, or document into stronger evidence
    - a required source, test, workflow, documentation, governance, or evidence change falls outside allowed paths or enters a forbidden path
    - target repository contracts at the exact baseline contradict this truthful accounting/rollback closure or require an incompatible public architecture decision
rollback:
  strategy: Revert the M15-04 closure metadata and declarations, exact control/stack ledger, stack cleanup transaction, cross-category rollback coordination, tests/CI, documentation, governance refresh, and release-contract digest changes as one batch. Before discarding a live integration, require checked stop to resolve device ownership, quiesce and clean every runtime-owned lane, reverse control and selected-region effects, and release provider tokens; unresolved cleanup remains owned and must not be forced, detached, or relabeled successful. The batch permits no migration, persistent host setting, support promotion, release, or deployment action.
  data_migration: none
  release_action: Do not publish a release, promote a support or qualification tuple, alter a hardware/RT record, or mark M15 complete until all required evidence and human gates pass.
evidence:
  output:
    - docs/evidence/M15-04-<date>.md
    - exact baseline, changed files, commands, exit codes, focused test counts, required CI run identifiers, and human review result
    - per-row and aggregate logical/accounted, committed, resident, locked, pinned, guard, fallback, completeness, provenance, and error examples with explicit exact, declared, partial, unknown, or not-applicable classification
    - actual runtime/executor/device control extent reconciliation against MemoryPlan and every rejected overlap, mismatch, overflow, or stale-extent case
    - external/backend declaration inventory and trust boundary, runtime-owned stack cardinality and observations, and every unavailable or unsupported fact
    - startup and checked-stop device/thread/stack/control/selected-region rollback ordering, first-error retention, unresolved ownership, retry, callback non-execution, and idempotence results
    - default and declared behavior, two-runtime isolation, no-allocation, determinism, C++ source compatibility, C ABI/device ABI/package status, and changed and preserved invariants
    - residual risks and all unperformed privileged native, physical hardware, CUDA, FPGA/XDMA, HIL, field, latency, thermal, endurance, RT1, RT2, signing, release, staging, deployment, and production validation
  claim_boundary: Evidence may establish static, unit, injected-provider/declaration/failure, sanitizer, package, portable RT0, and explicitly named-host functional accounting plus OS-observed live stack/control residency behavior only. Declared bytes are not independent observation; mlock is not lock readback or device/DMA pinning; and mocks, fixtures, hosted CI, preflight, documentation, or one host observation do not establish physical accelerator behavior, HIL, field performance, worst-case latency, RT1, RT2, signing, release, deployment, or production readiness.
