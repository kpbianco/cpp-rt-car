    - active-replay artifact construction, allocation-free inspection, exact nominal/action transcript, checksums, bounds, truncation/trailing/overflow/gap/duplicate/foreign identity rejection, short-output reporting, and deterministic artifact bytes
    - active replay from a quiescent checkpoint through deterministic mock and loopback backends across normal, late, shed/recover, watchdog/degrade, timeout/cancel/loss, stale/under/overrun, and safe transitions with exact action/payload/final-state equality
    - rejection of non-deterministic/physical backends, incomplete or lossy telemetry, in-flight or cleanup-pending checkpoints, impossible actions, mismatched payload digests, live watchdog dependence, and replay reentrancy without partial restore
    - post-restore failure semantics for input callback, provider callback, backend result, action mismatch, and final-state mismatch, preserving exact processed-frame reporting and retry from the original checkpoint
    - reusable harmonic/non-harmonic three-rate plant-sensor-controller-actuator conformance table covering supercycle/wrap, equal time, freshness, backpressure, faults, reset/restart, safe lifecycle, checkpoint/replay, and multiple instances
    - no ordinary allocation, blocking mutex, hidden thread, file/network I/O, unbounded wait/retry/scan, or executor-lane vendor call during action emission, active dispatch, checkpoint synchronization, and replay execution
    - ThreadSanitizer coverage of action publication/reading, optional device shed/recover versus completion, safe transition versus active completion, timeout/cancel/late completion, checkpoint/replay exclusion, stop/retry, and two Runtime/loopback instances
    - unchanged checkpoint/input-log schema-1 bytes and inspectors, legacy replay, CPU-only M16, ordinary M17/HAL-v2, M21-02 channel-free, M21-03 payload-only, M21-04 closure-disabled loopback, CUDA/XDMA candidates, C ABI/package inventory, and prior evidence
  required_ci:
    - Documentation contract workflow including truthful M21-05 portable deterministic-mock replay/conformance claims, frozen existing artifact schemas and C ABI, unchanged installed inventory/support matrices, release contract, and exact static source manifest
    - Linux GCC 11 and Clang 14 Debug and RelWithDebInfo matrix with AddressSanitizer and UndefinedBehaviorSanitizer coverage of mixed-rate action admission, overload, checkpoint, active replay parsing/execution, sampled safety, watchdog/degradation, conformance, capacity, and compatibility
    - Windows Server 2022 MSVC v143 Debug and RelWithDebInfo matrix producing identical action/artifact/checkpoint/conformance results and passing installed mixed-rate consumers
    - Unified executor GCC ThreadSanitizer job covering device action publication, shedding/recovery, completion/timeout/cancel/quarantine, sampled ownership, safe transition, checkpoint/replay exclusion, concurrent stop, late completion, cursors, and two Runtime instances without races
    - Determinism GCC/Clang FMA-on/off and artifact exchange proving unchanged prior checkpoint/input-log fixtures plus byte-identical mixed-rate replay artifacts, ordered action digests, selected generations, payload checksums, sampled metadata, shed/recover, watchdog/degradation, safety state, and final state for the integer loopback fixture
    - C and C++ embedding, add_subdirectory, installed-package, archive relocation, SDK header self-containment, compatibility aliases, exact 70-export C ABI consumers, loopback and mixed-rate conformance consumers, and unchanged default installed inventory
    - Clang 14 portable static/fuzz/artifact assurance includes every compiled new runtime source and bounded malformed mixed-rate artifact mutations; blocking dependency review, candidate SBOM/provenance, autotune, scaling, and existing package relocation remain green
    - Existing M7 replay/checkpoint, M16 rate/action/cross-rate/no-allocation, M17 memory/batch/timeline/vendor, and M21-01 through M21-04 gates all pass; no physical-device, controlled-timing, electrical, performance-threshold, Unreal, release, or deployment workflow is authorized
  manual:
    - Human review must confirm the new schemas are distinct and versioned, existing artifact bytes and legacy replay remain exact, every action is correlated once to immutable release/completion identity, optional device shedding cannot omit mandatory work, and overload cannot overwrite an owned slot or depend on arrival order.
    - The reviewer must confirm complete artifact/checkpoint validation precedes mutation, active replay accepts only deterministic mock/loopback backends and a gap-free transcript, watchdog/degradation is transcript-driven rather than live-time inferred, sampled/safe state restores without a false acknowledgement, and post-start failures report exact partial progress.
    - The reviewer must confirm the conformance suite is reusable through installed public surfaces, all running operations remain bounded and allocation-free where contracted, and no simulated action, payload digest, replay, hosted timing, or loopback result is described as physical DAC/DAQ/CAN/IIO/XDMA/CUDA, HIL, RT1, or RT2 evidence.
risk:
  class: high
  hazards:
    - an action record published before terminal ownership settles can make a failed, stale, late, or wrong-generation device result appear successful or replayable
    - extending an existing artifact or telemetry schema in place can silently corrupt legacy compatibility or cause old consumers to reinterpret reserved bytes
    - optional shedding, device completion, safe output, watchdog, and stop can race and produce arrival-order-dependent actions or recycle an owned slot
    - replaying from live wall-clock or completion timing can diverge across hosts while appearing deterministic
    - restoring sampled metadata, safety state, generation, or action position incompletely can publish stale bytes, duplicate work, or claim an unacknowledged safe state
    - lossy telemetry can be mistaken for a complete replay transcript unless gaps and drops fail closed
    - deterministic fake-driver success or recorded physical boundary metadata can be mislabeled as physical timing, electrical correctness, vendor compatibility, HIL, or RT qualification
  stop_conditions:
    - the exact target baseline is unavailable, dirty, or lacks merged M21-04 evidence, terminal-only sampled publication, and acknowledged safe-output behavior
    - implementation requires changing stable C ABI v8, SONAME 8, device ABI v1, extension ABI v1, HAL versions, Runtime status values, runtime-profile schema 7, existing checkpoint/input-log/rate-action/observability layouts, release version, license, installed inventory, support matrices, qualification state, or prior evidence
    - a complete distinct bounded action/replay schema cannot represent nominal release, device terminal outcome, sampled content identity, shedding/recovery, watchdog/degradation, safe state, and exact gaps without arrival-order or live-time dependence
