    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - cmake -S . -B build/agent-full -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_TESTS=ON -DRTFW_BUILD_EXPERIMENTAL=ON -DENABLE_RAPIDCHECK=ON -DSIM_SANITIZERS= -DSIM_WERROR=ON
    - cmake --build build/agent-full --parallel 2
    - ./build/agent-full/tests/simcore_tests --gtest_filter='ExtensionAbi.*:ExtensionRegistration.*:ExtensionLifecycle.*:MemoryPlan.*Extension*:DeterminismReplay.*Extension*:TraceNoAlloc.*Extension*'
    - ctest --test-dir build/agent-full --output-on-failure -R 'm19_extension_registration|m17_command_batch_timeline|m17_heterogeneous_memory_topology|m17_hal_v2_compatibility|m15_accounting_closure|m15_stack_lifecycle|m15_cross_category_rollback|m16_rate_timeline|m16_rate_dispatch|m16_shedding_telemetry|m16_cross_rate_data'
    - cmake -S . -B build/m19-01-package -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTS=OFF -DRTFW_BUILD_EXPERIMENTAL=OFF -DRTFW_BUILD_EXAMPLES=OFF -DRTFW_BUILD_RUNTIME_DEMO=OFF -DSIM_WERROR=ON
    - cmake --build build/m19-01-package --parallel 2
    - cmake --install build/m19-01-package --prefix "$PWD/build/m19-01-install"
    - cmake -S tests/package_consumer -B build/m19-01-package-consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/build/m19-01-install"
    - cmake --build build/m19-01-package-consumer --parallel 2
    - ctest --test-dir build/m19-01-package-consumer --output-on-failure
    - ./scripts/agent-verify.sh full
    - python3 tools/check_c_abi.py --library build/agent-full/librtfw.so
    - readelf -d build/agent-full/librtfw.so | rg 'SONAME.*librtfw.so.8'
    - if nm -u build/agent-full/librtfw_runtime.a | rg '(^|[^A-Za-z])(dlopen|dlsym|dlclose|LoadLibrary|GetProcAddress|FreeLibrary)(A|W)?$'; then exit 1; fi
  focused_tests_to_add:
    - C11 and C++20 header self-containment plus exact version-1 constants, required-prefix offsets, record sizes/alignment on LP64 and LLP64, fixed-width fields, calling conventions, zero defaults/reserved tails, and documented direct/static entry symbol
    - negotiation overlap and exact selection with current/minimum boundaries, short and larger records, unsupported/inconsistent versions, null functions/instances, partial writes, nonzero reserved data, malformed names/enums/booleans, checked size/count overflow, and callback exception containment
    - all-or-nothing staging and publication after every entry, phase, backend, service, relationship, duplicate-name, capacity, allocation, and existing-Runtime conflict failure, followed by corrected successful registration without leaked provisional or committed handles
    - CPU phase callback context/scratch/task equivalence to stable C ABI v8, ordinary graph/dependency execution, callback error propagation, zero post-start allocation, and proof that registration/entry callbacks never execute on a runtime lane
    - device-ABI-v1 backend registration through the canonical HAL-v2 compatibility adapter with success, saturation, early completion, loss/reset, failed initialization/unregister/shutdown, reverse retry, and explicit absence of native HAL-v2 command/topology capability or M17-05 bypass
    - service initialize, request-stop, quiesce, shutdown, and status ordering across success, startup failure, active callback/job, service failure, backend cleanup failure, first-error retention, unresolved-only retry, idempotence, and zero service execution on executor/device/watchdog lanes
    - owner/kind/slot/generation validation for zero, foreign, cross-kind, never-issued, detached, reused-slot, and prior-generation handles with transactional output and proof that stale rejection never enters extension code
    - detach-readiness rejection before successful stop or while any callback/job/backend/service owner remains, pointer clearing and generation retirement on success, direct/static fixture unload after readiness, and no supported-runtime module-loading or path-search dependency
    - exact extension/control/device storage accounting, overflow and capacity rejection before side effects, conditional semantic identity, unchanged identity when no extension is registered, and two-Runtime isolation of every handle/state/callback/backend/service/cleanup field
    - default and relocated installed-package C/C++ consumers for the new header and Runtime surface, exact one-header inventory delta, unchanged target/alias inventory, frozen 70-export C ABI/SONAME, and byte-unchanged legacy experimental plugin paths
    - ThreadSanitizer coverage of phase execution, status inspection, stop/retry/detach, stale calls, concurrent independent runtimes, and backend/service completion without weakening permanent M15/M16/M17 gates
  required_ci:
    - Documentation contract workflow validating the extension ABI layout/version/state-machine tokens, release digest ledger, exact one-header package delta, frozen C ABI/device ABI/plugin boundary, and truthful M17/M18/M19 claims
    - Linux GCC 11 and Clang 14 Debug and RelWithDebInfo FMA on/off matrix with AddressSanitizer and UndefinedBehaviorSanitizer coverage of negotiation, transactional registration, phase/backend/service execution, malformed tables, stop/retry/detach, stale handles, identity, accounting, and two-Runtime isolation
    - Windows Server 2022 MSVC v143 Debug and RelWithDebInfo matrix proving the same C ABI record prefixes/layout diagnostics, version negotiation, calling convention, DLL fixture symbol, lifecycle, stale-handle, source compatibility, and installed C/C++ consumer behavior
    - Unified executor GCC ThreadSanitizer job running the complete ExtensionAbi, ExtensionRegistration, ExtensionLifecycle, no-allocation, mock-device compatibility, cleanup/retry, and two-Runtime suites plus every permanent M15/M16/M17 fresh-process gate without weaker filters or timeouts
    - Determinism GCC and Clang FMA-on/FMA-off jobs and artifact exchange proving unchanged no-extension artifacts and explicit deterministic identity separation for extension semantic descriptors without hashing pointers or mutable lifecycle state
    - C/C++ embedding, add_subdirectory, installed package, archive relocation, non-default include layout, exact SDK header self-containment/inventory, compatibility aliases, exact 70-export C ABI and SONAME, dependency review, SBOM, autotune, scaling, fuzz-smoke, and release-contract gates
    - Existing CUDA-toolkit compile/package and node-free XDMA compile/package jobs plus all M14.1/M15/M16/M17 core/memory/command/vendor gates remain mandatory portable build or simulated evidence only; no hardware or qualification workflow is required or sufficient for M19-01
  manual:
    - Human extension-ABI and public-API review must approve every version-1 C prefix/layout/calling convention, forward-size rule, negotiation result, provisional/committed handle model, transaction boundary, additive C++ surface, evolution policy, and preservation of stable C ABI v8, device ABI v1, Runtime status, package-target, schema, release, support, and license boundaries.
    - Human concurrency, lifetime, and security review must confirm entry reentrancy rejection, callback/thread rules, copied-versus-borrowed ownership, service/backend stop ordering, quiescence proof, first-error and retry semantics, generation retirement, pointer clearing before unload readiness, Runtime-instance isolation, bounded accounting, and no post-start allocation, hidden lane, unbounded wait, or runtime loader dependency.
    - Human package, compatibility, and claim review must confirm the exact one-header default inventory delta, byte-unchanged experimental loader and M15-M18 evidence, no M17-05 workaround, and no implication of sandboxing, authentication, Unreal integration, physical hardware, HIL, latency, RT1/RT2, signing, release, deployment, or production readiness.
risk:
  class: high
  hazards:
    - a size/version check can read beyond a short record, accept an incompatible prefix, interpret an unknown suffix as capability, or diverge between LP64 and LLP64 layouts
    - sequential phase/backend/service registration can leak a visible prefix when a later record fails unless the complete extension transaction is staged and committed atomically
    - a copied descriptor can still retain a borrowed string, table, callback, instance, or user-data pointer whose module or owner is released before checked detach
    - a stale, foreign, cross-kind, or reused-slot handle can reach newly loaded code or another Runtime if owner and generation checks are incomplete
    - service stop or backend cleanup can deadlock, run on an RT lane, clear ownership after uncertain failure, or report unload readiness while a callback, nested job, submission, completion, or status call remains active
    - a C++ exception can cross a C callback boundary, or in-process extension code can corrupt the host despite version validation because the ABI is not a sandbox or trust boundary
    - extension metadata, provisional handles, or callback addresses can enter graph/replay identity nondeterministically or escape exact M15 accounting and post-start allocation limits
    - reusing the experimental loader can leak `dl`, SimCore, scheduler, feature macros, research headers, or an unsupported package target into the supported runtime
    - exposing native HAL-v2 tables through the version-1 extension ABI can silently bypass the blocked M17-05 path or duplicate device lifecycle and validation semantics
    - a fixture DLL/shared object, hosted CI, mock backend, successful stop, or stale-handle test can be overstated as safe arbitrary-code execution, Unreal hot reload, physical integration, RT, or production evidence
  stop_conditions:
    - the exact baseline is unavailable, dirty, lacks M17-04 ancestry or M18-01 commit `5eb8f101f692b2aff85f82f4a1660630db750706`, lacks any retained M15/M16/M17/M18-01 evidence record, or no longer records the actual M17-05 blocker truthfully
    - target contracts or actual code require the supported registration ABI to reuse the experimental plugin manager, introduce a loader dependency into `rtfw_runtime`, or expose a C++ binary layout across the extension boundary
    - complete transactional registration cannot be achieved without leaving a phase, backend, service, relationship, handle, identity, accounting row, or borrowed owner visible after failure
    - correct quiescence and detach readiness cannot be proven without unloading code while it may be executing, detaching/canceling a lane, inventing completion, clearing uncertain backend/service ownership, or adding an unbounded wait/retry
    - implementation requires changing stable C ABI v8 exports/fingerprint/SONAME, `rt/c_api.h`, any device-ABI-v1 declaration/layout/value, HAL-v2 core or extension semantics, Runtime status numeric values, runtime-profile schema 7/25 keys, observability/rate/artifact schema or IDs, existing package targets/aliases, release version, support matrix, qualification schema/workflow, or license
    - satisfying backend registration requires native HAL-v2 command/topology exposure, repairing or bypassing M17-05, changing CUDA/XDMA code, adding cross-backend synchronization, or claiming a combined or peer path
    - a service needs an implicit worker, executor-lane blocking, file/network I/O on an RT lane, post-start heap allocation, shared process-global registry, or callback after generation retirement
    - deterministic tests require Unreal Engine, physical CUDA/FPGA/XDMA hardware, device nodes, root privilege, a controlled timing host, secrets, signing, network access, release, deployment, or production access
    - mandatory focused, contract, package, full, CI, sanitizer, or human review must be skipped, weakened, or relabeled successful
    - a required source, test, workflow, documentation, governance, checker, digest, or evidence change falls outside allowed paths or enters a forbidden path
rollback:
  strategy: Revert the extension-ABI-v1 header and Runtime registration/inspection/detach surface, transactional registry and service lifecycle integration, accounting/identity changes, tests/fixtures/CI, one-header package inventory update, documentation/governance, release digests, and retained M19-01 evidence as one coherent batch. Before removing the feature from a running integration, require checked Runtime stop and checked extension detach to resolve every callback, job, backend, service, and borrowed owner; never unload code or release extension state while readiness is false. No repository data, host setting, support record, release, or deployment is migrated. If an external extension was built against ABI version 1, retain the matching header/runtime revision or mark that artifact explicitly unsupported rather than silently reusing version 1 for incompatible semantics.
  data_migration: none
  release_action: Do not publish a release, load or unload an operator module outside tests, promote a support/qualification tuple, mark M17/M18/M19 complete, sign an artifact, deploy, or change production state from this batch.
evidence:
  output:
    - docs/evidence/M19-01-<date>.md
    - exact baseline and M17-04/M18-01 ancestry, initial worktree state, changed-file allowlist, commands, exit codes, focused test counts, required CI run/check identifiers, and human review result
