    - cmake --build build/agent-full --parallel 2
    - ./build/agent-full/tests/simcore_tests --gtest_filter='RateDispatch.*DeviceExecution*:HostRuntime.*DeviceRateExecution*:DeviceRuntime.*Rate*:CommandBatch.*Rate*:VendorHalV2.*Rate*:Executor.*DeviceRate*:MemoryPlan.*DeviceRate*:PeriodicRuntime.*DeviceRate*:TraceNoAlloc.*DeviceRate*:MultipleInstances.*DeviceRate*'
    - ctest --test-dir build/agent-full --output-on-failure -R 'm21_device_rate_execution|package_consumer'
