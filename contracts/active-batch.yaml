acceptance:
  - The implementation begins from an initially clean target at exact default-branch commit `0bf54966be63817969468c69c5cd183ad66ab358`, merged target pull request 249. M22-01 through M22-03 code and retained evidence remain present. The M22-03 Runtime-generation rollback, payload-free action, conditional checkpoint, exact replay, stable ABI, package, and claim boundaries are preserved; no absent physical, RT, Unreal, signing, release, deployment, or production result is invented.
  - M22-04 adds one optional installed header-only C++ source API in `rt/live_control.hpp`. It depends only on supported public SDK headers, introduces no compiled symbol or binary ABI, exports no project warning/feature policy, and keeps every raw `Runtime` live-control operation directly usable. The default installed inventory changes only by this explicitly reviewed header and corresponding source/package contract records.
  - The typed layer defines one fixed canonical little-endian payload envelope with an exact magic, envelope version, complete encoded byte count, positive application type identity, positive application schema version, closed `LiveControlUpdateKind`, and zero reserved fields. This envelope is application payload content, not a Runtime checkpoint, replay, action, telemetry, profile, C ABI, device ABI, extension ABI, or HAL schema; none of those existing formats or numeric tables changes.
  - Type customization is compile-time and bounded. A type supplies positive fixed encoded extent within the M22 per-record ceiling, positive type/schema identities, one closed update kind, and `noexcept` fixed-span validation/encode/decode operations. Variable-size containers, allocation, exceptions across the boundary, raw pointers, borrowed string views, file paths, vendor handles, callbacks, implicit clocks, and unbounded parsing are not accepted by the helper contract.
  - Typed construction uses caller-owned fixed storage, validates semantic input before publication, writes one complete canonical envelope/body, fills the existing raw `LiveControlUpdateRecord` from the exact producer handle, producer sequence, host-frame or compiled-rate target, byte count, alignment, flags, and digest, and publishes nothing on failure. The helper never retries admission, hides or remaps `LiveControlAdmissionResult`, selects a later target, advances a producer sequence, calls a Runtime implicitly from a destructor, or changes raw mailbox ownership.
  - Typed decoding verifies the raw update kind, exact extent, envelope identity/version/reserved fields, and payload digest before committing the caller's output. It is fixed-work and allocation-free. Documentation distinguishes this bounded canonical decode/copy from off-lane semantic validation and forbids variable-length text/config parsing, authentication, filesystem/network I/O, allocation, logging, or vendor calls in Runtime callbacks.
  - One supported sample defines four application-owned fixed payload types and exercises scenario parameters, controller gains, sensor calibration, fault configuration, and clear-fault behavior through the installed public API. The sample stages at least one exact host-frame update and one exact compiled rate-release update, observes whole typed values in callbacks, records committed/replaced/rolled-back outcomes, checks action metadata, and performs checked stop without repository-private headers, experimental SimCore, or implicit backend transfer.
  - Stress coverage uses deterministic operation-count assertions rather than timing sleeps or tolerances. It covers 64 mailbox declarations, 256 producer declarations, the 65,536-record absolute configuration boundary or an equivalent exact bounded finalization proof plus representative full-occupancy execution, maximum legal per-record extent, capacity-zero/exact/one-over validation, concurrent producers, same-boundary replacement, action/journal loss, replay eligibility, callback rollback, watchdog/degradation interaction, stopped admission, stale handles, sequence exhaustion, and correction/retry.
  - Repeated lifecycle stress constructs, finalizes, starts, exercises, stops, and destroys fresh Runtime instances across a finite deterministic loop. Concurrent multiple-Runtime stress uses disjoint handles, payloads, generations, actions, checkpoints, and replay artifacts. No Runtime restart after terminal stop, stale-handle revival, shared global registry, cross-instance cursor, or leaked application payload is permitted.
  - The SDK header is self-contained and builds warnings-as-errors under supported GCC, Clang, and MSVC consumers. Source-tree, add-subdirectory, installed, archive-relocated, and non-default-prefix consumers exercise custom type specialization, host/rate construction, raw admission-result preservation, bounded decode, action inspection, and checked teardown without private headers or C++ binary ABI assumptions.
  - No ordinary heap allocation, blocking mutex, hidden thread, file/network I/O, unbounded wait/retry/scan, variable-length parser, producer callback, implicit vendor operation, or telemetry payload copy is added to live-control admission, boundary publication, settlement, rollback, action, checkpoint, replay, typed construction, or typed decode paths. The SDK adds no Runtime lane, memory-plan row, provider region, hidden storage, or destructor-driven control operation.
  - Stable C ABI v8 remains exactly 70 exports with fingerprint `0xd0e7a5a14bf35f97` and SONAME 8. Device ABI v1, extension ABI v1, HAL tables, Runtime status and live-control numeric values, runtime-profile schema 7/25 keys, every checkpoint/input-log/action/replay/observability schema, release 1.2.1, support and qualification matrices, Apache-2.0, and prior evidence remain unchanged.
  - Target governance, current state, handoff, architecture, product, roadmap, live-control/SDK, memory, replay, testing, release digest ledger, and retained `docs/evidence/M22-04-<date>.md` state exact implementation and evidence. Focused and full local verification, mandatory hosted CI, and human SDK, canonical-format, callback, concurrency, lifecycle, compatibility, privacy, and claim review pass before merge. Only after those gates may M22 and CAP-M22 be marked portable-software complete.
