acceptance:
  - An additive C++ memory-accounting snapshot is available after policy reports exist and contains checked exact-once totals derived from the stable accounting-key inventory; no runtime-config schema, stable C ABI v8, SONAME 8, device ABI v1, status, package component, installed-header, or license change occurs.
  - The six runtime-plan regions still partition MemoryPlan::planned_bytes exactly once and the configured memory budget retains its M4 requested-byte meaning; M15-04 does not arena-migrate logical runtime, executor, or device control aggregates.
  - Live runtime committed bytes count logical non-provider control storage once, replace phase/task/trace requested payload with provider committed bytes once, and add only currently committed runtime-owned custom stacks once; provider rounding, guards, and fallback allocations are neither omitted nor double counted.
  - Host-owned registered state/device-buffer spans, host-owned stacks, backend-reported storage, and backend/vendor stacks are totaled separately by ownership from their unique logical registrations and remain informational verify-only resources that are never allocated, mutated, rebound, released, or promoted into the runtime memory budget.
  - Provider-reported resident, locked, pinned, and fallback payload totals plus region counts are computed from each report at most once with documented payload semantics; a region that fell back in resolution, allocation, or huge-page selection contributes to one fallback region/contribution rather than one per fallback flag.
  - "Accounting is lifecycle truthful: finalization reports persistent regions, successful start adds live custom stacks before callbacks, stop removes released stacks, failed start/finalization retains inspectable rollback/failure reports without counting released commitments, and two runtimes remain isolated."
  - Provider-supplied sizes and every aggregate use checked arithmetic; an overflow or inconsistent exact-once invariant fails closed before callbacks and reverses any started lanes/provider allocations through existing cleanup rather than saturating, wrapping, or weakening validation.
  - Portable defaults retain 1.2.1 behavior, allocation topology, no-allocation steady-state paths, deterministic behavior, and source compatibility for existing C++ callers; the installed runtime and compatibility consumers compile and execute the additive accounting surface.
  - Exact C ABI v8 export/fingerprint, SONAME 8, device ABI v1, default SDK inventory, compatibility aliases, package relocation, release-contract, no-allocation, determinism, sanitizer, and documentation gates pass without claim promotion.
  - Documentation marks M15 complete only at portable RT0 and states that accounting and policy tests do not establish physical RSS, NUMA placement, locked-memory, huge-page, CUDA, XDMA, RT1, RT2, latency, thermal, or hardware qualification.
  - Focused tests and full local verification pass; required GitHub compiler/OS, sanitizer, determinism, package, archive, compatibility, documentation, release, and ABI gates remain mandatory before merge.
validation:
  local:
    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - ./scripts/agent-verify.sh full
  focused_tests_to_add:
    - exact accounting-key uniqueness and six-key planned-byte partition under portable defaults
    - provider rounding and guards replace requested scratch/trace payload with committed bytes without double counting
    - live custom-stack commitment appears after start and disappears after stop or failed startup rollback
    - host registered state/device buffers and backend storage/stacks total separately by ownership and never enter the runtime budget
    - resident, locked, pinned, resolution fallback, allocation fallback, and huge-page fallback count each region and payload once
    - zero-byte regions and aliasing logical registrations have documented exact-once behavior
    - malicious provider committed-byte overflow fails before callbacks and releases all resources in reverse order
    - repeated retry and two-runtime summaries do not retain stale or cross-instance totals
    - installed C++ runtime consumer compiles and exercises the additive accounting snapshot while compatibility aliases remain intact
    - complete no-allocation and determinism regression remains unchanged
  required_ci:
    - Linux GCC and Clang Debug/RelWithDebInfo
    - Windows MSVC Debug/RelWithDebInfo portable fallback
    - AddressSanitizer, UndefinedBehaviorSanitizer, and ThreadSanitizer
    - determinism artifact exchange and no-allocation gates
    - installed package, archive, relocation, preferred-target, and compatibility-target consumers
    - documentation, release, exact C ABI v8, SONAME 8, and device ABI v1 contracts
risk:
  class: high
  hazards:
    - double counting requested payload and provider-rounded commitment for the same region
    - treating an external logical registration as runtime-owned or physical-RSS deduplication
    - stale live-stack totals after abort, stop, retry, or partial device cleanup
    - adding totals that overflow only after provider allocation or stack creation
    - fallback flags contributing multiple times or implying verified requested policy
    - source/package compatibility drift while extending the C++ reporting surface
    - documentation promoting portable accounting into memory-residency or RT qualification
  stop_conditions:
    - stable C ABI v8, SONAME 8, device ABI v1, status codes, package inventory, installed-header set, license, or support claims must change
    - truthful closure requires provider migration or arena allocation of existing logical control aggregates
    - exact physical RSS, external-span deduplication, or backend-private allocation inspection is required
    - provider release semantics must broaden beyond the approved M15-03 ownership contract
    - deterministic tests require privilege, physical hardware, weakened assertions, timing-only synchronization, or experimental SimCore/NUMA paths
    - source changes outside allowed paths are required
    - current repository contracts contradict this batch
rollback:
  strategy: Revert the M15-04 implementation and active-batch commit; M15-03 provider-backed regions remain the baseline and its per-region reports remain available without aggregate closure.
evidence:
  output:
    - docs/evidence/M15-04-<date>.md
    - exact commands and exit results
    - acceptance mapping and exact-once accounting equations
    - finalization/start/stop/rollback accounting transitions
    - stable ABI, package, source-compatibility, no-allocation, determinism, and sanitizer status
    - changed and preserved invariants
    - residual risks and unperformed privileged, physical-RSS, NUMA, huge-page, locked-memory, hardware, and RT validation
  claim_boundary: Evidence is static, unit, injected-provider, unprivileged local Linux where available, package-contract, sanitizer, determinism, and portable RT0 only; it does not qualify physical RSS, NUMA placement, locked memory, huge pages, CUDA, XDMA, combined hardware, RT1, or RT2.
