acceptance:
  - The implementation starts from the exact clean default-branch baseline `5eb8f101f692b2aff85f82f4a1660630db750706`, target pull request 223. Every retained M15 through M18-01 evidence record is present. M17-05 remains blocked by the native command-capability discovery mismatch, and M19-01 neither repairs or bypasses that mismatch nor marks M17, M18, CAP-M17, or CAP-M18 complete.
  - A new installed C11-compatible `rt/extension_abi.h` defines extension ABI version 1 independently of stable C ABI v8 and device ABI v1. Every boundary record and callback table uses fixed-width C types, an exact known version-1 required prefix, `struct_size`, ABI/current-minimum compatibility fields where negotiation applies, explicit counts/capacities, and zero known reserved fields; it contains no C++ type, STL layout, compiler-native exception, ownership-ambiguous string, or persisted process pointer.
  - Version negotiation is deterministic and fail-closed. The host supplies only the size and version range it implements; an extension declares its current and minimum compatible versions. A common version-1 prefix is selected only when both ranges overlap and every required prefix is present. Short required prefixes, unsupported versions, inconsistent minimum/current values, overflowed sizes/counts, malformed enum/boolean/name data, null required callbacks or instances, nonzero known reserved data, and partial output reject before any Runtime registration becomes visible. Known version-1 prefixes of larger forward records may be copied while unknown suffix bytes are ignored and never interpreted as capabilities.
  - The host receives an already-resolved extension entry-function pointer and invokes it only while the Runtime is configuring. Runtime never calls `dlopen`, `dlsym`, `LoadLibrary`, `GetProcAddress`, `dlclose`, or `FreeLibrary`, never searches a path, and never owns a module handle. Symbol discovery, trust/provenance checks, and physical library unload remain host responsibilities; the documented version-1 entry symbol and direct/static entry path are covered by C and C++ fixtures without linking `rtfw_runtime` to the experimental plugin target or a platform loader library.
  - One additive C++ configuring-time Runtime operation stages one complete extension registration transaction and returns an instance-local generation-bearing extension handle only after success. The extension entry call may stage bounded CPU phases, device-ABI-v1 backends, control-lane services, and their local relationships through copied version-1 records and provisional handles. The Runtime validates the complete staged set, existing capacities/names/ownership, and checked storage arithmetic before publishing any phase, backend, service, relationship, extension handle, identity, or inspector row; any entry error, callback exception, malformed late record, duplicate, capacity failure, or existing-runtime conflict leaves the Runtime configuring and correctable with no partial extension state.
  - Version-1 CPU-phase registration reuses the exact stable C-ABI-v8 callback result and callback-context semantics without adding a C ABI export. Names and descriptors are copied; callback code and user data are borrowed until checked detach. Successful phases enter the ordinary compiled graph, preserve fixed scratch and nested-task semantics, execute only under existing Runtime dispatch and overload rules, and can participate in copied extension-local dependency/resource declarations. No extension registration callback executes from a frame, executor, device-submission, completion, watchdog, or other post-start lane.
  - Version-1 backend registration carries only the existing complete `rtfw_device_backend_api` version-1 table and is translated through the existing Runtime device-ABI-v1 compatibility path. It preserves backend capacity, borrowed instance/table lifetime, initialization, buffer/submission/completion, health/reset, reverse retryable shutdown, and no-executor-vendor-call rules. It exposes no HAL-v2 memory/topology or command/timeline table, CUDA Graph, XDMA control/event, cross-backend timeline, peer-memory, or combined-path capability and therefore cannot work around the M17-05 blocker.
  - "Version-1 service registration defines a bounded named interface/version plus nonthrowing initialize, request-stop, quiesce, shutdown, and optional status hooks. Service callbacks execute only on the single host control path: initialize runs in registration order before extension backend/lane startup and before phase callbacks are admitted; request-stop is bounded, nonblocking, and idempotent; quiesce and shutdown run in reverse registration order only after frame callbacks, nested jobs, submissions/completions, and extension backend cleanup can no longer enter extension code. A service is never scheduled as an executor phase, never creates an implicit Runtime lane, never reenters Runtime control operations, and never performs registration after finalization."
  - Ownership and state are explicit and inspectable. Runtime copies all names, table prefixes, semantic descriptors, and relationships, borrows extension code/instances/user data until checked detach succeeds, tracks registration generation and active phase/service/backend ownership, and reports configuring, registered, running, stop-requested, quiescent, cleanup-pending, detached, or failed state without exposing addresses. Handles encode Runtime ownership, kind, slot, and generation; zero, foreign-Runtime, wrong-kind, never-issued, detached, and prior-generation handles fail deterministically without invoking extension code or mutating output.
  - Checked stop closes extension admission first, requests service and backend stop without waiting on an executor worker, quiesces Runtime phase/job/device work, completes the existing reverse extension-backend cleanup, and only then quiesces and shuts down services in reverse registration order before retiring extension registrations. The first error is retained while independent cleanup continues; unresolved backend ownership keeps every enclosing service it may reference alive. A failure preserves the exact unresolved owner and callback/table lifetime, keeps detach/unload readiness false, and retries only unresolved work. Destruction is a best-effort fallback and cannot relabel uncertain ownership as released.
  - Checked detach is permitted only after Runtime stop has succeeded, every extension callback/job/backend/service reference is quiescent, and all registered ownership is released. It invalidates the generation and clears copied callable pointers before reporting unload readiness. M19-01 performs no operating-system unload and no hot reload; M19-03 remains responsible for Unreal world/module lifecycle, concurrent world-instance teardown, actual host unload orchestration, and long-run reload coverage.
  - Extension descriptors, provisional/committed handle maps, copied phase/backend/service records, lifecycle state, and cleanup bookkeeping are fixed-capacity, Runtime-instance-owned, and represented exactly once in runtime/device control bytes and the existing M15 logical ledger without adding a MemoryPlan row or provider region. Configuration may allocate only within existing pre-start rules; registration, start, phase execution, service status, stop, retry, detach inspection, and stale-handle rejection add no ordinary post-start heap allocation, hidden thread, file/network I/O, blocking mutex on an RT lane, unbounded wait/retry, spill path, or cross-instance mutable global state.
  - Extension name/version, negotiated ABI version, phase/backend/service semantic descriptors, relationships, and service interface versions participate in explicit configuration/graph/replay identity. Callback addresses, module handles, user-data pointers, provisional handles, mutable lifecycle state, and observed counters do not. Two Runtime instances using the same entry function receive distinct owners/generations and cannot share handles, service state, callbacks, backend ownership, status rows, cleanup state, or detach readiness.
  - The supported default package adds only the reviewed `rt/extension_abi.h` header and additive Runtime C++ source surface needed by M19-01; it adds no default target, transitive loader dependency, experimental header, or experimental target. The old `rt/plugin_api.h`, `rt/plugin_manager.hpp`, `plugin_manager.cpp`, sample plugins, and plugin tests remain byte unchanged, experimental, default-uninstalled, and explicitly not a compatibility path for extension ABI version 1.
  - Stable C ABI v8 remains exactly 70 exports with frozen fingerprint and SONAME 8; `rt/c_api.h`, every device-ABI-v1 declaration/layout/value, HAL core v2, memory/topology extension v1, command/timeline extension v1, Runtime status numeric values, runtime-profile schema 7/25 keys, observability/rate/checkpoint/input-log schemas and IDs, existing installed targets and compatibility aliases, release 1.2.1, all support matrices and qualification schemas/workflows, and Apache-2.0 remain unchanged. The extension ABI is a separately versioned registration boundary, not a silent C-ABI-v8 revision or a C++ binary ABI promise.
  - Documentation and retained evidence define the exact ABI layouts and minimum prefixes, version negotiation, registration state machine, callback/thread rules, capacities, ownership matrix, stop/quiesce/detach order, retry and stale-handle behavior, package delta, threat model, and evolution/rollback policy. They state that in-process extensions are trusted native code, M19-01 does not sandbox or authenticate them, and no fixture, shared-library smoke, hosted CI, documentation, preflight, mock backend, or successful unload-readiness check is Unreal, physical hardware, HIL, field, RT1/RT2, signing, release, deployment, or production evidence.
  - Focused C/C++ ABI, transaction, phase, backend, service, lifecycle, stale-handle, two-Runtime, no-allocation, package, and loader-isolation tests; complete deterministic local verification; mandatory GitHub CI; and human ABI/API, concurrency/lifetime, security, package/compatibility, and claim-boundary review pass before merge. M19 and CAP-M19 remain incomplete after M19-01.
