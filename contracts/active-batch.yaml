acceptance:
  - The implementation begins from an initially clean target at exact default-branch commit `2c7ab323cfe5f00b68a71467889ca1dc5507365a`, the merged M21-01 pull request 242. Its retained M15 through M21-01 evidence is present and unchanged, and governance records M21-01 as merged without inventing an absent payload, sampled-I/O, physical, RT, Unreal, signing, release, publication, deployment, or production result.
  - Active execution accepts a mixed CPU/device plan only when every device release belongs to an immutable admitted M21-01 HAL-v2 command-batch phase. Legacy command phases, device-ABI-v1 phases without the command/timeline extension, ordinary unbound device phases, stale plans, and a device phase whose current copied declaration or capability identity differs from finalization fail before any callback or lane start.
  - Finalization extends the immutable active plan with bounded device dispatch records, dependency/frontier information, per-phase and per-backend slot slices, and completion-ledger capacity derived from the already compiled M21-01 plan. The active path indexes those records directly and does not repeatedly scan all phases, buffers, timelines, channels, backends, or graph edges for each release or completion.
  - One due device reference invokes its registered command-batch provider exactly once with the exact domain, phase, supercycle cycle, release sequence, substep, logical release, nominal release, absolute deadline, declared budget, late action, and degradation level. Any additive C++ context field is appended with a source-compatible default; no caller span or context pointer may be retained after the callback.
  - The provider may supply only invocation values permitted by the copied M17 declaration, including fixed command parameters, pre-registered buffer contents, strictly increasing values for the declared wait/signal handles, and a finite timeout. Runtime validates the complete materialized batch against the copied declaration and M21-01 identity, clamps or replaces its device timeout with the earlier checked completion-budget/deadline remainder, and rejects zero, expired, overflowed, contradictory, or foreign invocation data before queue publication.
  - Successful device-rate dispatch copies the complete fixed-capacity materialized batch and exact release identity into Runtime-owned preallocated storage, assigns a nonzero generation-safe batch identity, and enqueues it through the existing per-backend submission lane. No executor worker or host step thread invokes submit, poll, cancel, health, reset, CUDA, XDMA, driver, or vendor code directly, and M21-02 creates no additional runtime, backend, polling, timeout, or cancellation thread.
  - Independent admitted device references may remain in flight concurrently up to the exact per-phase, per-backend, Runtime-outstanding, and completion-batch capacities proved by M21-01. An implementation that serializes all device releases behind each individual completion does not satisfy this batch. Same-domain order, graph dependencies, backend-local waits, and CPU/device completion barriers are preserved; a dependent CPU or device reference cannot run before the prerequisite terminal success, while independent backends and dependency frontiers may overlap.
  - Every queued, submitting, submitted, early-completed, completion-ready, cancel-requested, timed-out, terminal, and reusable slot transition has one documented atomic owner and finite transition set. A slot is not reused until its exact batch identity reaches one terminal outcome, late or duplicate completions cannot complete a newer generation, and malformed, foreign-backend, wrong-phase, wrong-timestamp-domain, wrong-signal, decreasing-signal, duplicate, or unknown completions fail closed without publishing timeline progress.
  - Completion remains poll-only on the existing bounded service/submission infrastructure. Each accepted completion is correlated to backend, phase, rate domain, supercycle cycle, release sequence, substep, logical release, nominal release, absolute deadline, completion budget, batch identity, timestamp-domain identity, and declared signal set before the release becomes terminal. Provider and vendor pointers, addresses, payload bytes, wall-clock samples, and unbounded histories are not retained in the immutable plan or public inspection.
  - Completion-budget expiry and release-deadline expiry have one checked monotonic-host-clock rule and deterministic equal-time ordering. Runtime issues at most one bounded cancellation request when the copied backend capability supports it, maps cancel success, cancel rejection, unsupported cancellation, late terminal completion, device loss, and malformed completion to explicit existing Runtime statuses, and never converts a timeout or cancel into success merely because a completion arrives later.
  - A timed-out or canceled batch whose provider has not established terminal ownership is quarantined from slot reuse. If bounded cleanup cannot prove terminal release, active admission closes, the current step fails with the first exact release identity, and checked `stop()` remains retryable instead of detaching storage, freeing provider-owned memory, spinning without bound, or claiming cleanup succeeded.
  - Queue saturation, provider failure, submission rejection, timeout, cancellation, completion error, and device loss settle the exact affected release once and propagate through existing active-rate failure/late handling. Existing skip, hold, bounded catch-up, degrade, fail, optional shedding, and recovery decisions remain deterministic; omitted or shed device releases invoke neither the command provider nor backend, and mandatory work is never silently dropped.
  - A successful active step does not return until every mandatory device reference due in its logical interval is either terminally successful or has produced its documented failure result. The step summary counts a device reference as executed once, reports the first failing domain/sequence/substep exactly, and existing device metrics, trace events, rate actions, watchdog/degradation state, and checked error text reconcile without changing any telemetry, trace, rate-action, checkpoint, input-log, or observability schema in this batch.
  - Runtime `start()` removes the M21-01 mixed-plan rejection only after preflight, memory policy, executor, device manager, and all existing submission/service lanes pass their ordinary transactional startup gates. Any partial startup rolls back in reverse ownership order; retry follows existing finalized/cleanup-pending rules and no provider callback occurs before all required lanes are ready.
  - Runtime `stop()` first closes device-rate admission, then prevents new provider invocations, requests bounded cancellation/cleanup through existing backend lanes, waits only through existing checked finite ownership transitions, and tears down executor, device, watchdog, extension, and memory ownership in the documented order. Concurrent stop during a step requests quiescence and returns retryable `invalid_state`; callback reentrancy, repeated stop, failed-stop retry, destruction, and start/stop/restart do not leak or double-complete work.
  - All device-rate execution storage is allocated and exactly accounted during configuration/finalization/startup only. Provider invocation, batch materialization, dispatch, completion, timeout, cancellation, late action, stop request, metric/trace emission, and slot recycling perform no ordinary heap allocation, file/network I/O, blocking mutex acquisition, hidden thread creation, unbounded wait, or unbounded collection scan.
  - M21-02 activates dispatch and completion only. It does not publish CPU/device payload data, add or reinterpret cross-rate channels for device endpoints, create sampled input/output descriptors, add a loopback adapter, change replay/checkpoint content, integrate device shedding beyond existing release decisions, add a new benchmark schema, alter CUDA physics content, add a golden demo, or implement configuration/code/Unreal hot reload; those remain M21-03 through M26.
  - Ordinary frame execution for CPU, legacy device command, and HAL-v2 command-batch phases retains its pre-M21 behavior. CPU-only M16 active execution, M17 ordinary batch/timeline execution, no-device identity, two Runtime instances, package consumers, deterministic fixtures, and checked teardown remain unchanged except for additive source-compatible C++ inspection/context fields explicitly authorized here.
  - Stable C ABI v8 with exactly 70 exports and frozen fingerprint `0xd0e7a5a14bf35f97`, SONAME 8, device ABI v1, extension ABI v1, HAL core v2 and extension v1 contracts, runtime-profile schema 7 and 25 keys, observability/checkpoint/input-log/rate-action schemas, Runtime status values, installed target/header/alias inventory, release 1.2.1, support matrices, qualification state, and Apache-2.0 remain unchanged.
  - Target governance, current state, handoff, component contracts, release digest ledger, and retained `docs/evidence/M21-02-<date>.md` state the exact portable simulated dispatch/completion boundary. Focused and full local verification, mandatory hosted CI, and human execution-state, dependency, timeout/cancel, ownership, allocation, compatibility, and claim review pass before merge. M21 and CAP-M21 remain incomplete after this batch.
