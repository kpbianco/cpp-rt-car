  focused_tests_to_add:
    - immutable seed replay and fixed-seed bounded ASan/UBSan mutation runs for snapshot/checkpoint-input-log, runtime-profile, and experimental job-queue harnesses, with exact corpus/dictionary digests and failure-artifact isolation
    - runtime-profile fuzz transactionality over empty, malformed, invalid UTF-8, duplicate/unknown key, incompatible version, length, trailing, nesting, and maximum-size inputs without partial output mutation or exception escape
    - exact compilation-database-to-source-manifest equality, repository containment, duplicate/omission/addition rejection, exact Clang 14 policy, warnings-as-errors, and explicit exclusion enforcement
    - missing, dirty, extra, mutable, abbreviated, hashless, mismatched, and policy-unlisted submodule, FetchContent, vcpkg, and workflow-action dependency rejection with recovery on correction
    - canonical SPDX 2.3 schema validation, byte-repeat generation, exact shipped-versus-build/test relationship checks, and mutation rejection for paths, symlinks, duplicate keys, namespace/version/source, component inventory, lengths, digests, and volatile host metadata
    - release-manifest expected-source enforcement plus bounded strict JSON, exact final artifact inventory, path/symlink/alias/self-reference, size/digest, version/source, missing/unlisted, and nonmutation tests
    - canonical unsigned in-toto Statement v1 generation and offline subject/predicate/source/tree/build/tool/dependency verification, including byte-repeat output and explicit authentication-false result
    - offline cryptographic verification of one retained public-material signed fixture plus artifact, payload, signature/bundle, trust-root, repository, source digest/ref, workflow, issuer, and predicate negative mutations; no signing/private-key/network path exists
    - two-root isolation, failed-output cleanup, cancellation recovery, input immutability, bounded document/file/count/byte limits, and diagnostics that disclose paths/reasons but not artifact contents or credentials
    - default package archive, staged candidate, SBOM, unsigned statement, final manifest, extraction, relocated consumer, exact installed inventory, frozen ABI/SONAME, and no-release/no-signing workflow-permission assertions
  required_ci:
    - A required Ubuntu 22.04 Clang 14 portable-assurance job runs the exact dependency, static, all-three-fuzzer, SBOM, manifest, unsigned-statement, offline signed-fixture, and mutation gates with pinned tools, fixed inputs/counts, read-only repository permissions, no credentials, and retained machine-readable reports/failure artifacts.
    - The snapshot and runtime-profile fuzzers execute with libFuzzer plus AddressSanitizer and UndefinedBehaviorSanitizer; job-queue fuzzing remains explicitly experimental. A crash, sanitizer finding, timeout, oom, corpus mutation, missing report, or skipped harness fails the required job.
    - Static analysis covers the exact default first-party compilation manifest under Clang 14 and fails on any diagnostic, coverage drift, unapproved exclusion, missing tool, version drift, or partial result. Existing GCC/Clang/MSVC warnings-as-errors remain required independently.
    - Pull-request dependency review is required and blocking with no `continue-on-error`; the deterministic repository dependency/pin check runs on push and pull request so a skipped hosted comparison is never the sole dependency-security evidence.
    - A default Release package candidate is built without experimental or vendor-device requirements, then staged, given two independently generated byte-identical SPDX SBOMs, bound by an unsigned provenance statement and expected-source manifest, verified offline, extracted, and consumed. Candidate outputs may be retained as CI evidence only and are never attached to a tag or GitHub Release.
    - Workflow-policy checks fail if the M20-PRE-01 path gains `id-token`, attestation, package, or content write permission; invokes a signing/attestation-create/release/publish command; touches the release workflow; downloads an attestation or trust root during the offline phase; or contains a private key/signing secret.
    - Existing Linux GCC 11 and Clang 14 Debug and RelWithDebInfo FMA on/off builds with AddressSanitizer/UndefinedBehaviorSanitizer, Windows Server 2022 MSVC v143 Debug and RelWithDebInfo, unified-executor ThreadSanitizer, determinism artifact exchange, embedding/add-subdirectory, installed package/archive/relocation/non-default-layout, exact C ABI/SONAME, vendor compile-only, documentation/release-contract, autotune, and scaling gates remain required and green.
    - >-
      The assurance-profile performance-regression disposition is explicit: no
      production/runtime source changes are permitted, deterministic
      operation/file/source counts and existing scaling gates must not regress,
      and no elapsed-time, controlled-host, worst-case, RT1, or RT2 threshold is
      introduced or waived by this batch.
  manual:
    - Human fuzz/analyzer review must approve the supported-versus-experimental harness labels, seed/dictionary coverage, fixed bounds, complete default source manifest, exact Clang 14 checks, every named exclusion, absence of broad suppressions, and the distinction between a bounded smoke and continuous fuzzing or vulnerability absence.
    - Human security and supply-chain review must approve all immutable dependency/action/tool/schema pins, the blocking dependency-review severity policy, parser/file/resource bounds, path/symlink/TOCTOU handling, diagnostics, fixture source/license, verifier distribution digest, public trust snapshot, signed-fixture identity policy, and proof that no private key, credential, signing, online lookup, or publication path exists.
    - Human SBOM/provenance review must confirm exact artifact/component relationships, shipped-versus-build/test classification, source/tree/build/tool/dependency binding, canonical deterministic fields, final manifest coverage, and the explicit separation between unsigned target content verification and cryptographic verification of a non-target fixture. Neither result may be called authenticated target provenance, SLSA level, reproducible build, signed release, or current revocation proof.
    - Human package, compatibility, and claim review must confirm unchanged production source, installed SDK, stable C ABI v8/70 exports/fingerprint/SONAME 8, device/extension ABI, schemas, version, license, support and qualification matrices, release workflow, retained prior evidence, and no implication of Unreal, physical hardware, HIL, field, controlled timing, RT1/RT2, release, deployment, or production readiness.
    - A maintainer must separately authorize any commit, push, pull request, protected-branch merge, release, deployment, setting change, or external publication. This contract-generation request authorizes none of those actions and no agent may waive a failed gate.
risk:
  class: high
  hazards:
    - fixed-run fuzz smoke and hand-selected corpora can miss deep parser states, platform-specific undefined behavior, concurrency faults, or newly added unregistered input surfaces while appearing comprehensive
    - a writable source corpus, time-based fuzz budget, unpinned compiler, nondeterministic seed, or swallowed sanitizer exit can make failures irreproducible or falsely green
    - compilation-database drift, excluded translation units, external/generated warning suppression, broad NOLINT use, analyzer version drift, or public-layout padding noise can either hide defects or pressure an out-of-scope ABI change
    - a pinned dependency or action can still be vulnerable, malicious, withdrawn, license-incompatible, or compromised; identity and immutability are not security clearance
    - an SBOM can be schema-valid yet omit a build input, mislabel a test dependency as shipped, describe the source tree rather than the staged package, or contain volatile identifiers that defeat deterministic comparison
    - manifest and provenance cycles, arbitrary full source commits, dirty-tree ambiguity, path aliases, symlinks, duplicate JSON keys, file replacement between validation and hashing, or unbounded trees can bind the wrong bytes
    - an unsigned in-toto statement can be mistaken for authenticated provenance, a signed third-party fixture can be mistaken for a signed RTFW artifact, and an offline trust-root snapshot cannot reveal later revocation
    - fixture generation or verifier bootstrap can accidentally retain a private key, invoke OIDC/signing, depend on online lookup during verification, or grant workflow write permissions
    - CI evidence upload can be mislabeled as public release publication, and candidate archives/SBOMs/statements can be mistaken for released, reproducible, supported, or production artifacts
    - broad checker, release-digest, CMake, or documentation edits can drift the default package, ABI, existing verification commands, M17-05 retained failure, support matrices, qualification boundaries, or release workflow
  stop_conditions:
    - the exact baseline is unavailable or initially dirty, commit `c846cc427c93018175a69c7372c130f00c0b713b` is not the default-branch M17-06 pull request 240 result, any named retained evidence is missing/modified, or target history no longer supports the stated M17-06/M17-05 distinction
    - credible fuzz or static closure requires changing production C/C++ code, a public header/layout, ABI/schema/status, installed package inventory, support matrix, qualification path, release version, or license instead of a separately approved remediation batch
    - the complete default first-party compilation surface cannot be enumerated and analyzed with one pinned available toolchain, or a required diagnostic can pass only through a broad suppression, baseline waiver, omitted source, timeout, or warnings-not-errors policy
    - any FetchContent/submodule/vcpkg/workflow/tool/schema input required by the gate cannot be identified by a reviewed immutable commit or digest and reconciled to its source and license
    - the staged artifact set and shipped-versus-build/test dependency relationships cannot be represented and verified deterministically in the selected versioned SPDX format without omitting or guessing a component
    - the manifest, SBOM, or provenance verifier cannot bind exact regular-file bytes, expected source identity, safe relative paths, bounded inventory, and deterministic canonical fields without following symlinks, trusting volatile host data, or accepting an arbitrary source commit
    - no suitably licensed and provenance-documented pre-generated signed fixture plus public trust material and pinned verifier can perform real cryptographic verification and required negative mutations offline, or content verification cannot be distinguished from signer authentication and trust freshness
    - implementation or validation requires a private key, signing secret, OIDC token, credential, network lookup during artifact/attestation verification, write permission, attestation creation, tag, release workflow, publication, release, deployment, production access, Unreal tree, physical device, privileged host mutation, or controlled timing runner
    - any required focused, full, package, ABI, analyzer, sanitizer/fuzz, dependency, SBOM, provenance, offline-fixture, CI, or human review gate genuinely fails and cannot be repaired within allowed paths without weakening, skipping, or relabeling it
    - a required source, tool, fixture, schema, policy, test, workflow, documentation, governance, checker, digest, or evidence change falls outside allowed paths or enters a forbidden path
rollback:
  strategy: Revert the fuzz harness/corpora, static policy/manifest/runner, dependency pins and policy, SBOM/provenance/manifest tooling and public-only fixtures, portable-assurance script/CI wiring, documentation/governance, release-contract digests, and M20-PRE-01 evidence as one coherent batch. Remove only generated M20-PRE-01 build/CI candidate outputs after confirming they were never tagged, published, installed system-wide, or used for support/qualification. Restore the prior verification surface without modifying runtime data, ABI, package version, support matrices, prior evidence, secrets, releases, or deployments; a security finding discovered by the batch remains a release blocker even if the tooling is rolled back.
  data_migration: none
  release_action: Do not sign, attest through a signing service, publish, tag, release, deploy, change support or qualification state, alter repository settings, or claim reproducible/authenticated target provenance. Any later signing ceremony, release promotion, controlled performance run, soak, hardware/RT campaign, or production action requires a separately approved batch and human gate.
evidence:
  output:
    - docs/evidence/M20-PRE-01-<date>.md
    - exact baseline/default-branch identity, initial worktree state, M17-06 pull-request ancestry, retained-evidence inventory, changed-file allowlist/forbidden-path audit, commands, exit codes, required CI run/job identifiers, and human review outcomes without inferring absent records
    - exact fuzz compiler/libFuzzer/sanitizer versions and flags, harness classification, source corpus/dictionary paths and SHA-256 values, seed replay and mutation counts, maximum input/resource ceilings, fixed seed, result, and crash/timeout/oom artifact inventory
    - exact Clang 14 policy/check list and exclusions with rationale, compile-database and first-party source-manifest digests, translation-unit/header counts, coverage reconciliation, diagnostics, exit status, and proof that no broad suppression or production-source edit was used
    - complete dependency/action/tool/schema inventory with source, purpose, version/full commit/digest/license, resolution mode, dirty/missing/extra checks, blocking hosted dependency-review result, and explicit identity-not-vulnerability-clearance limit
    - canonical SPDX version/schema/validator identity, package/source/dependency/artifact relationships, artifact sizes/digests, two-generation byte comparison and SBOM SHA-256, negative mutation results, and explicit shipped-versus-build/test classification
    - staged archive/checksum/SBOM/unsigned-statement/final-manifest inventory and SHA-256 values, exact expected source commit and deterministic source-tree/dirty-state identity, build/compiler/CMake/flags, offline content-verification report, extraction/relocated-consumer result, and authentication false state
    - signed fixture source/license, artifact/bundle/public-root/policy/verifier versions and SHA-256 values, expected repository/source/ref/workflow/issuer/predicate identity, offline positive result, every negative mutation result, trust-root capture age/limitation, and proof that no private key/signing/network path was used
    - workflow permission and command audit proving no signing, OIDC, attestation creation/download during verification, tag, release, publication, deployment, setting mutation, or support/qualification update
    - unchanged production source/public surface, C ABI v8 70-export fingerprint and SONAME 8, device/extension ABI, installed SDK inventory, schemas, release 1.2.1, support matrices, qualification state, license and prior evidence; changed/preserved invariants, rollback path, residual risks, and all unperformed validation
  claim_boundary: Evidence may establish deterministic bounded Clang 14 fuzz smoke for two supported parsers and one explicitly experimental queue, complete-manifest Clang 14 static-analyzer execution, immutable dependency identity checks, a versioned deterministic SPDX candidate SBOM, exact candidate artifact/manifest/source binding, offline content verification of an unsigned in-toto Statement, cryptographic offline verification and mutation rejection for one retained non-target public-material fixture, default-package compatibility, and portable RT0 verification behavior only. It does not establish continuous fuzzing, vulnerability absence, legal or license clearance, complete transitive runtime provenance beyond the declared policy, bit-for-bit reproducible builds, authenticated or signed RTFW provenance, current trust-root or revocation state, SLSA level, signed release, controlled performance, soak/endurance, physical CUDA/XDMA/combined behavior, HIL, field evidence, latency, RT1, RT2, Unreal integration, support promotion, publication, release, deployment, or production readiness.
