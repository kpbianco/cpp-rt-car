    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - cmake -S . -B build/agent-full -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_TESTS=ON -DRTFW_BUILD_EXPERIMENTAL=ON -DENABLE_RAPIDCHECK=ON -DSIM_SANITIZERS= -DSIM_WERROR=ON
    - cmake --build build/agent-full --parallel 2
    - ./build/agent-full/tests/simcore_tests --gtest_filter='HeterogeneousMemory.*:HalV2.*Memory*:DeviceRuntime.*Memory*:MemoryPlan.*Heterogeneous*:DeterminismReplay.*Heterogeneous*:TraceNoAlloc.*Heterogeneous*'
    - ctest --test-dir build/agent-full --output-on-failure -R 'm17_heterogeneous_memory_topology|m17_hal_v2_compatibility|m15_accounting_closure|m15_cross_category_rollback|m16_rate_timeline|m16_rate_dispatch|m16_shedding_telemetry|m16_cross_rate_data|xdma_backend'
    - cmake -S . -B build/m17-02-package -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTS=OFF -DRTFW_BUILD_EXPERIMENTAL=OFF -DRTFW_BUILD_EXAMPLES=OFF -DRTFW_BUILD_RUNTIME_DEMO=OFF -DSIM_WERROR=ON
    - cmake --build build/m17-02-package --parallel 2
    - cmake --install build/m17-02-package --prefix "$PWD/build/m17-02-install"
    - cmake -S tests/package_consumer -B build/m17-02-package-consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/build/m17-02-install"
    - cmake --build build/m17-02-package-consumer --parallel 2
    - ctest --test-dir build/m17-02-package-consumer --output-on-failure
    - ./scripts/agent-verify.sh full
    - python3 tools/check_c_abi.py --library build/agent-full/librtfw.so
    - readelf -d build/agent-full/librtfw.so | rg 'SONAME.*librtfw.so.8'
  focused_tests_to_add:
    - exact numeric/default/layout checks for every memory-domain, ownership, coherency, synchronization, topology-node/link, timestamp-domain, correlation, extension-table, registration, and handle record, including zero reserved tails and pre-M17-02 positional aggregate compatibility
    - bounded native extension discovery for all six domain kinds with complete copied snapshots, stable ordering, inspectors in finalized/running/stopped states, freeze behavior, callback exception containment, and two-runtime handle/snapshot isolation
    - transactional rejection of malformed sizes/versions/enums/booleans/identifiers, duplicate or dangling domain/node/link IDs, invalid topology edges, zero/non-power-of-two granularities, overflow, unsupported peer relations, inconsistent coherency/access/ownership, oversized results, and partial callback writes
    - timestamp-domain unit/wrap/monotonic and reset-generation validation, supported and unsupported fixed-output non-RT correlation queries, active-frame rejection, uncertainty/overflow rejection, and proof that device timestamps are never silently interpreted as host time or latency
    - legacy `DeviceBufferRegistration` equivalence through adapted-v1 and native-v2 core-only backends, plus explicit proof that the v1 adapter exposes only an implicit borrowed-host domain and preserves every M17-01 field, call count, identity byte, status, exception, and cleanup behavior
    - heterogeneous host-span and opaque/imported registration success plus wrong-backend/foreign-handle, null/empty, range, alignment, access, overlap, capability, ownership, coherency, synchronization, and unsupported-peer rejection before publication
    - deterministic forward registration and reverse rollback/stop across mixed legacy and heterogeneous objects, uncertain token retention after failed or exceptional registration/unregistration, first-error retention, unresolved-only retry, backend-shutdown gating, destruction fallback, and zero callback execution on failed start
    - exact runtime-owned descriptor/table/snapshot/token storage reconciliation in `device_control_bytes`, the M15 logical device extent, and six-row MemoryPlan, while borrowed/opaque/device/backend bytes remain excluded or truthfully declared without a new provider region
    - conditional identity sensitivity to every semantic memory/topology/timestamp field and exact M17-01 identity preservation for adapted-v1 and core-only native-v2 configurations, with unchanged checkpoint/input-log schema and transactional incompatible-artifact rejection
    - steady-state no-allocation and bounded-call-count coverage for inspectors, coherent logical reference translation, explicit rejection of references needing unimplemented synchronization, health/reset, cleanup retry, and complete frames, with no discovery/synchronization callback, new lane, or host callback from poll on executor workers
    - preferred and compatibility installed C++ consumers for the additive extension and old aggregate prefixes, plus unchanged C, CUDA v1, XDMA v1, header-inventory, warning-isolation, and pure-C consumers
  required_ci:
    - Documentation contract workflow covering the M17-02 taxonomy, v1 implicit-host boundary, topology/coherency/timestamp claim limits, quick-start, release contract, frozen C ABI/device ABI, exact SDK inventory, and permanent M15/M16/M17-01 gates
    - Linux GCC 11 and Clang 14 Debug and RelWithDebInfo FMA on/off matrix with AddressSanitizer and UndefinedBehaviorSanitizer coverage of discovery, malformed snapshots, six-domain registration, topology/correlation validation, rollback/retry, identity, accounting, and lifecycle
    - Windows Server 2022 MSVC v143 Debug and RelWithDebInfo matrix covering identical enum/default/validation results, intentional size/alignment diagnostics, source compatibility, and installed consumers
    - Unified executor GCC ThreadSanitizer job executing complete HeterogeneousMemory, HAL-v2/v1-adapter, mixed registration/cleanup, two-runtime, CUDA fake-driver, portable XDMA, and permanent M15/M16 processes without weakening exclusions or timeouts
    - Determinism GCC and Clang FMA-on and FMA-off jobs plus artifact exchange proving unchanged adapted-v1/core-only identity and explicit heterogeneous-memory identity separation
    - C and C++ embedding, add_subdirectory, installed-package, archive relocation, SDK header self-containment, compatibility aliases, unchanged v1 CUDA/XDMA consumers, exact 70-export C ABI consumers, and existing autotune/scaling smoke jobs
    - Existing no-allocation, bounded-memory/control-ledger, M14.1 device recovery, M15 rollback, M16 timeline/data/dispatch/shedding/telemetry, M17-01 compatibility, sanitizer, fuzz-smoke, observability-schema, documentation, release-contract, package, CUDA fake-driver, and XDMA portable gates; no hosted topology, pinning, DMA, peer, timestamp-accuracy, timing, or hardware claim is authorized
  manual:
    - Human public-API and compatibility review must approve the additive extension/table/record/handle shape, exact six-domain taxonomy, default legacy mapping, positional source compatibility, identity boundary, and preservation of C ABI v8, device ABI v1, HAL core v2, Runtime status, package, schema, release, support, and license boundaries.
    - Human topology, coherency, timestamp, lifetime, concurrency, and safety review must confirm bounded discovery, complete validation before publication, no address disclosure, domain/link integrity, correlation uncertainty/reset semantics, registration-token ownership, reverse retryable cleanup, exact accounting, and absence of executor-worker vendor calls or post-start allocation.
    - Promotion review is deferred. Native CUDA/XDMA v2 adapters and vendor controls remain M17-04, batches/timelines and isolated submission lanes remain M17-03, the combined staged sample remains M17-05, and every physical memory/topology/timestamp or RT support claim requires named M18 evidence and separate human approval.
risk:
  class: high
  hazards:
    - a malformed or partially written discovery snapshot can publish dangling domain/topology references, contradictory access/coherency facts, or an invented peer route that later code trusts
    - appending C++ records or registration fields can break positional source consumers, warning-clean MSVC layout, installed headers, or M17-01 core/v1 behavior even while the stable C ABI gate remains green
    - a borrowed host pointer, imported handle, mapped aperture, or backend token can outlive its owner, be released twice, overlap another object, or be cleared after uncertain cleanup
    - alignment, byte, offset, granularity, topology, or timestamp conversion arithmetic can overflow and turn a rejected range or correlation into a plausible accepted result
    - host coherence, mlock, provider-confirmed pinning, CUDA pinning, DMA mapping, imported ownership, and peer visibility can be conflated despite requiring different authorities and synchronization
    - topology identifiers or callback outputs can leak process addresses or be mistaken for measured bandwidth, distance, latency, IOMMU reachability, or a qualified physical route
    - device timestamps can be mislabeled as host monotonic time, correlated across reset/wrap without a valid generation, or used to claim latency beyond their declared uncertainty
    - descriptor, snapshot, registration, and token storage can be omitted or double-counted, mutate after finalization, allocate after start, or escape Runtime-instance isolation
    - a memory extension callback can block or execute from an executor worker, introduce a second manager path, or weaken M17-01 reverse cleanup and early-completion invariants
    - portable fake discovery can be overstated as physical CUDA memory, pinned memory, DMA mapping, peer access, topology, timestamp accuracy, HIL, latency, or RT qualification
  stop_conditions:
    - the exact baseline commit is unavailable, dirty, or lacks merged M17-01 commit 25ea1950d993bf7fcc170ccaafa32181d734ce4e and every retained M15/M16/M17-01 evidence record
    - target contracts at the exact baseline contradict the additive extension, implicit legacy-host mapping, borrowed-lifetime model, identity boundary, or six-domain taxonomy and require a new product/architecture decision
    - implementation requires changing stable C ABI v8, SONAME 8, any device-ABI-v1 declaration/layout/value, M17-01 HAL core API version/table semantics, Runtime status values, runtime-profile schema 7/25 keys, observability/rate/artifact schemas or IDs, installed header/target inventory, support matrices, release version, or license
    - a fixed bounded discovery result cannot completely represent and validate the required domains, topology, ownership, alignment, coherency, synchronization, and timestamp semantics without guessing, exposing addresses, or silently accepting partial data
    - adapted-v1/core-only native-v2 behavior or identity cannot remain exact while heterogeneous registrations use one canonical memory-object path, or ownership cannot remain address-stable, instance-isolated, exactly accounted, and retryable
    - strict correctness would require claiming host/device pinning, DMA mapping, peer reachability, topology, timestamp correlation, or coherent visibility that an injected callback or portable host cannot independently establish
    - command batches, timeline waits/signals/completions, another submission/I/O lane, CUDA Graph, XDMA control/MMIO/event, native CUDA/XDMA v2 backend changes, plugin/factory loading, device-rate dispatch, direct peer DMA, or combined-device execution becomes necessary to satisfy this batch
    - deterministic functional tests require timing sleeps/tolerances, fixed CPU/NUMA/PCI topology, root privilege, physical CUDA or FPGA/XDMA hardware, controlled timing hosts, secrets, signing, release, deployment, or production access
    - a required source, test, workflow, documentation, governance, or evidence change falls outside allowed paths or enters a forbidden path
rollback:
  strategy: Revert the additive HAL-v2 memory/topology extension records and callbacks, native discovery and copied snapshot, canonical legacy/heterogeneous memory-object registration, inspectors, identity/accounting integration, tests/CI, documentation/governance, release digests, and retained M17-02 evidence as one batch. Before discarding a running integration, require checked stop to quiesce graph/device work and resolve every memory registration, backend, buffer, service-lane, stack, control, and selected-region owner; never force-unmap, force-unpin, clear an opaque token, or release borrowed storage while ownership is uncertain. The exact bea813f M17-01 core/adapter host-buffer path remains the fallback, with no data migration, persistent host setting, support promotion, release, or deployment rollback.
  data_migration: none
  release_action: Do not publish a release, promote CUDA/XDMA/peer/combined/RT support, alter a support or qualification record, or mark M17/CAP-M17 complete from this contract batch.
evidence:
  output:
    - docs/evidence/M17-02-<date>.md
    - exact baseline, changed files, commands, exit codes, focused test counts, required CI run/check identifiers, and human review result
    - public extension record/table/handle definitions with exact versions, sizes, defaults, capacities, enum values, ownership/lifetime, source-compatibility, exception, and rejected-input rules
    - complete six-domain capability matrix plus copied domain, topology-node/link, timestamp-domain, correlation-capability, and synchronization snapshots with all validation/failure results
    - legacy borrowed-host versus heterogeneous host/opaque registration maps, native tokens, access/range/alignment/coherency checks, forward startup, reverse rollback/stop, uncertain ownership, first-error behavior, unresolved-only retry, and two-runtime isolation evidence
    - proof that adapted-v1 and core-only native-v2 backends retain exact M17-01 behavior/identity and expose no invented heterogeneous capability, plus unchanged mock/CUDA/XDMA v1 regression results
    - extension/snapshot/registration/token storage reconciliation inside device control and the six-row MemoryPlan, borrowed/opaque/backend byte exclusions, no-allocation and ThreadSanitizer results, and exact bounded callback counts/lanes
    - semantic identity comparisons, unchanged checkpoint/input-log/observability/rate schemas, installed package consumers, and C++ source/C ABI/device ABI/HAL-core compatibility status
    - changed and preserved invariants, rollback path, residual risks, and all unperformed physical pinning, CUDA-device, imported-handle, DMA-map, peer-access, topology, timestamp-accuracy/correlation, batch, timeline, isolated-vendor-lane, CUDA Graph, XDMA control, combined-device, controlled-performance, privileged-native, hardware, HIL, field, latency, thermal, endurance, RT1, RT2, signing, release, staging, deployment, and production validation
  claim_boundary: Evidence may establish static, unit, malformed/failure-injected, synthetic six-domain/topology/coherency/timestamp, mock/fake-driver, sanitizer, package, bounded-memory/no-allocation, lifecycle-recovery, cross-instance, and portable RT0 functional contract behavior only. A descriptor, opaque handle, injected discovery table, fixture, hosted CI run, preflight, or document does not establish physical pinning, CUDA device memory, import interoperability, DMA mapping, peer reachability, real topology, timestamp accuracy or correlation, hardware behavior, HIL, field performance, latency, RT1, RT2, signing, release, deployment, or production readiness; all such claims require later implementation and named retained qualification evidence.
