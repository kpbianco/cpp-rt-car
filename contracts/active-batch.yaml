acceptance:
  - The implementation begins from an initially clean target at exact default-branch commit `c846cc427c93018175a69c7372c130f00c0b713b`, the merged M17-06 pull request 240. All retained M15-01 through M19-01 evidence named above is present and unchanged. Governance and current-state documents record that M17-06 is merged and the portable M17 software path exists, while retaining M17-05 as failed review evidence and not inventing an absent final CI check count, separate human-review object, physical CUDA/XDMA result, CAP-M17 manual smoke, or qualification result.
  - The batch changes verification, build/test wiring, dependency pins, CI, documentation, and retained M20-PRE-01 evidence only. It changes no production C/C++ source or public header, stable C ABI v8 export/fingerprint/SONAME, device ABI v1, extension ABI v1, HAL contract, Runtime status, runtime or artifact schema already owned by another milestone, installed target/header/alias inventory, release version, support matrix, qualification schema/workflow, license, or prior evidence.
  - One documented noninteractive `scripts/verify-portable-assurance.sh` entry point exposes independently runnable `dependencies`, `static`, `fuzz`, `artifacts`, and cumulative `all` modes. It accepts only repository and explicit build/output paths, writes only below an explicit build/output directory, uses no credential, device, privileged host operation, Unreal tree, timing threshold, network service during artifact/attestation verification, tag, release, or publication API, and returns nonzero on every failed subgate without converting a missing tool or skipped check into a pass.
  - The Clang 14 libFuzzer build contains the existing supported snapshot/checkpoint-input-log parser harness, a new supported runtime-profile parser harness, and the existing experimental bounded-job-queue harness. Each harness has a small reviewed immutable seed corpus; snapshot and profile dictionaries cover their version, magic, required-key, length, and malformed-boundary tokens. The runner first replays every named seed, then copies the corpus to the build tree and performs a fixed-seed, fixed-run-count, fixed-max-input ASan/UBSan mutation run with source corpora read-only and crash/timeout/oom artifacts confined to the explicit output directory.
  - Snapshot and runtime-profile fuzz inputs are bounded at their public 64 KiB ceilings and each receives at least 20,000 mutation executions; the experimental job-queue input is bounded at 4 KiB and receives at least 10,000. Per-input timeout and memory limits are safety ceilings, not performance acceptance. Every nonempty, empty, truncated, maximum-size, invalid-UTF-8, duplicate/unknown-key, incompatible-version, checksum/length, trailing-data, and excessive-nesting seed replays without sanitizer finding, unbounded allocation from encoded lengths, exception escape, process hang, or partial profile-output publication. Job-queue results are labeled experimental and establish no supported Runtime parser claim.
  - Fuzzer tool version, compile/link flags, seed/dictionary SHA-256 values, replay count, mutation count, maximum length, random seed, exit status, and produced failure-artifact inventory are machine-recorded. A bounded deterministic smoke is not called continuous fuzzing, proof of vulnerability absence, or coverage of every parser; external long-running fuzz service integration remains later work.
  - A checked-in static-analysis policy and exact sorted source manifest cover every first-party translation unit emitted by a clean default non-experimental, tests-off, examples-off, demo-off Clang 14 compilation database, including the 1.x compatibility archive. The checker fails if the compile database adds, removes, duplicates, redirects, or omits a first-party translation unit, if an entry resolves outside the repository, or if generated/external code is treated as first-party evidence.
  - Static analysis runs deterministic Clang 14 analyzer core, C++, dead-code, security, Unix, and variadic-list checks with warnings treated as errors over that complete manifest and project headers. Any excluded check is named and justified in policy; the known padding-optimization diagnostic may be excluded because reordering frozen/public compatibility records is outside scope, but there is no blanket warning baseline, wildcard `NOLINT`, unchecked generated suppression, analyzer timeout-as-pass, or silent partial-source success. Compiler warnings-as-errors and include-what-you-use remain separate signals and are not relabeled as this analyzer result.
  - Build inputs fail closed on mutable or incompletely identified dependencies. RapidCheck uses a reviewed full 40-character commit rather than `master`; the GoogleTest fallback archive has a reviewed SHA-256; the checked-out GoogleTest submodule, vcpkg baseline, FetchContent declarations, and every workflow action are reconciled against an exact versioned policy. Missing, uninitialized, dirty, extra, mismatched, mutable-ref, hashless-download, abbreviated-commit, or policy-unlisted dependencies fail. This pinning establishes input identity, not vulnerability absence or legal approval.
  - Pull-request dependency review becomes blocking at the documented severity threshold and may not use `continue-on-error`, a success-for-skipped fallback, or write permissions. It supplements the deterministic repository dependency check; because it depends on hosted GitHub comparison data, it is not represented as an offline or local scan.
  - >-
    `tools/sbom.py` produces and verifies a canonical versioned SPDX 2.3 JSON
    SBOM for an explicitly staged default package candidate and its exact
    source/dependency inputs. The selected official schema or validator
    version, source, license, and SHA-256 are pinned for offline use. The
    document identifies RTFW/version/source commit, each staged payload
    artifact with byte length and SHA-256, the exact resolved
    GoogleTest/RapidCheck/vcpkg build inputs, and relationships that distinguish
    shipped content from build/test-only dependencies; it does not claim that
    test dependencies ship in the SDK.
  - SBOM creation is sorted and byte-deterministic for identical inputs. It contains no hostname, workspace/build absolute path, runner identifier, random UUID, wall-clock observation, credential, or uncontrolled timestamp; any required creation time is deterministically derived from the supplied source identity and documented. Two independent output directories produce byte-identical SBOMs. Verification rejects malformed/duplicate-key/trailing JSON, schema or namespace drift, duplicate/unsafe/noncanonical paths, symlinks, missing/unlisted components or artifacts, wrong package/version/source/dependency relationship, absolute paths, size/digest mutation, and extra files outside the explicit policy.
  - >-
    `tools/release_manifest.py` verification gains an explicit
    expected-source-commit input and fail-closed bounded JSON/inventory
    handling. A merely well-formed arbitrary 40-character commit is
    insufficient. The staged archive, checksum sidecar, SBOM, and provenance
    statement are all regular, non-symlink files covered by the final manifest;
    missing, extra, duplicate, reordered, escaping, aliased, size-mutated,
    digest-mutated, self-listed, wrong-version, or wrong-source inputs fail
    before extraction or consumer use.
  - >-
    `tools/provenance.py` creates a canonical unsigned in-toto Statement v1
    verification record for the local candidate, using a versioned documented
    predicate. Its exact subjects bind the staged package payload/checksum and
    SBOM bytes; its predicate binds project, package version, complete source
    commit, deterministic source-tree identity including dirty-state
    classification, build type/configuration, compiler/CMake/tool identities,
    and resolved dependency inputs. Same inputs yield byte-identical
    statements; volatile host/time/path data is absent. The file is visibly
    labeled unsigned and verification-only, is not a DSSE envelope, and cannot
    be reported as authenticated provenance or any SLSA build level.
  - Offline statement verification uses only the supplied artifact directory, manifest, SBOM, statement, policy, and pinned local schema material. It recomputes every subject/manifest digest and enforces exact project, version, source commit/tree state, builder-policy, build parameters, dependency identities, predicate type, canonical encoding, and inventory. Artifact, SBOM, subject, predicate, source, builder, dependency, path, duplicate-key, unknown-critical-field, and canonical-byte mutations each fail without network access or output mutation.
  - Offline cryptographic-attestation verification is exercised against at least one small, pre-generated, provenance-documented in-toto/DSSE or Sigstore bundle fixture with its exact artifact, public trust material, expected repository/source/workflow/predicate policy, fixture source/license, and file SHA-256 values retained. The verifier executable/version and distribution digest are pinned. No private key, signing token, OIDC request, signing operation, attestation upload/download, trust-root refresh, or network lookup occurs in the verification phase. Artifact, payload, signature/bundle, public root, repository, source digest/ref, workflow identity, issuer, and predicate mutations fail.
  - Fixture verification proves only that the pinned offline verifier rejects/accepts the retained fixture under the retained public trust snapshot. It does not authenticate this batch's unsigned candidate, prove current revocation state, authorize the fixture producer, or establish RTFW release provenance. Documentation and machine output distinguish content/digest verification, cryptographic fixture verification, signer identity policy, trust-root age, and the unperformed target signing step.
  - >-
    The canonical SPDX SBOM, unsigned provenance statement, manifest, analyzer
    report, dependency report, and fuzz report are generated only as candidate
    verification outputs below build/CI evidence storage. They are not checked
    in as a release, attached to a tag, uploaded to a public release, signed,
    published, installed system-wide, or used to change support or
    qualification state. CI workflow permissions remain `contents: read` with
    no `id-token: write`, `attestations: write`, `packages: write`, or
    `contents: write` in the M20-PRE-01 path.
  - Focused tool tests cover deterministic generation and every malformed, bounded-resource, path, symlink, inventory, dependency, SBOM, manifest, unsigned-statement, signed-fixture-policy, and mutation rejection above, including recovery after failure and two independent temporary roots. Tests use only disposable directories, never overwrite inputs, never follow a symlink, never log artifact contents or credentials, and clean partial outputs after failure/cancellation.
  - The default Release package is built, archived, staged, SBOM/provenance/manifest checked, extracted, relocated, and consumed without experimental code, CUDA toolkit, GPU, XDMA node, Unreal, controlled timing, signing secret, or publication. The exact default installed target/header/alias inventory, C ABI v8 70-export fingerprint and SONAME 8, device/extension ABI declarations, release 1.2.1, support matrices, qualification state, and Apache-2.0 remain unchanged.
  - Target governance, current state, handoff, architecture, roadmap, build/testing/sanitizer/security/threat/release documentation, deterministic documentation/release checks, and retained `docs/evidence/M20-PRE-01-<date>.md` describe the exact implemented gates and their limits. Complete focused and full local validation, mandatory CI, and human security/supply-chain, analyzer/fuzz, package/compatibility, and evidence-claim review pass before merge. M20-PRE-01 does not complete CAP-M20; controlled performance, continuous service fuzzing, target signing/authenticated provenance, soak, release approval, Unreal, and hardware/RT qualification remain separate.
