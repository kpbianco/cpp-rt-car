batch:
  id: M15-02
  title: Apply and verify per-role thread policy
  goal: Apply and read back the finalized per-role thread policy for each runtime-owned thread through a fail-closed startup transaction, retain truthful best-effort and external verify-only results, and roll back every created lane before any host callback can execute when a strict requirement fails.
