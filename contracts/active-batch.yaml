acceptance:
  - The implementation starts from the exact clean default-branch baseline `e5f10cc572fa9ba3d4dd488781c310dafb34dfd2`. That baseline records M17-05 as blocked by the native command-capability discovery mismatch and contains no combined sample; M18-01 neither repairs that defect nor marks M17/CAP-M17 complete. Offline schema/tool work may proceed from the completed M17-04 foundation, but no combined qualification or promotion may rely on the absent M17-05 behavior.
  - Four draft-2020-12 JSON schemas with independent schema version 1 define a campaign plan, qualification record, promotion review, and generated promotion proposal. Each top-level and security-sensitive nested object is closed to unknown properties, uses bounded strings and arrays, rejects duplicate identities, requires canonical lowercase SHA-256 and complete 40-character source commits, and distinguishes `nvidia`, `xdma`, `combined`, `rt1`, and `rt2` scopes without changing any runtime, ABI, package, observability, checkpoint, input-log, rate-action, or release schema.
  - A campaign plan is a separately retained pre-run object. It names one immutable campaign and tuple, runtime source/build identity, product version, CPU, motherboard, BIOS/firmware, memory, operating system, kernel/configuration/boot parameters, compiler, resolved runtime/thread/memory/time policy, workload and input identity, warm-up and duration/sample bounds, topology/NUMA/IOMMU/IRQ/power policy, applicable accelerator/driver/firmware/bitstream facts, required functional/endurance/thermal/saturation/loss/reset-rebind/shutdown trials, and every pass/fail threshold with exact metric, unit, population, statistic, comparison, bound, and miss/error allowance.
  - "Scope-specific validation fails closed when required tuple or trial facts are absent: NVIDIA requires exact GPU/PCIe/CUDA driver/toolkit/power-clock identity; XDMA requires exact FPGA part/BDF/link/driver/module/firmware-or-bitstream/IP/memory-map identity; combined requires both identities and the declared host-staging path without implying peer DMA; RT1 requires a named measured host policy and latency/deadline populations; RT2 additionally requires PREEMPT_RT kernel/config/boot/isolation/IRQ/scheduling/locking evidence. RT2 remains optional and cannot be inferred from RT1 or preflight success."
  - A qualification record is immutable run output bound by byte-exact SHA-256 to the campaign plan, exact target source commit and runtime build, resolved observed tuple/policy, start/end times, workload, raw artifact manifest, resource and thermal trends, and every planned trial and threshold evaluation. It preserves raw release, wake, compute, submit, poll, completion, slack, miss, temperature, clock, power, memory, queue, error, and recovery artifact references where applicable; missing, duplicate, unsafe, unlisted, symlinked, oversized, digest-mismatched, non-finite, out-of-range, or plan-divergent data rejects the record rather than being defaulted or summarized away.
  - The existing M12 `evidence_only` CUDA/XDMA JSON and source-bound artifact manifests remain valid raw inputs but never become a qualification record or passing threshold evaluation by themselves. The new validator accepts them only as retained artifacts referenced by a complete M18 record and never changes their schema, workflow, sample, meaning, or claim label.
  - A promotion review is a separate byte-digest-bound decision naming the exact plan, record, raw-evidence manifest, qualification scope and tuple ID, reviewer identifier, review time, decision, rationale, and exceptions. A passing review requires a passing record, no unresolved exception, every applicable mandatory trial and predeclared threshold to pass, and exact digest agreement. The reviewer field is attribution metadata, not authentication or a signature; signing and identity assurance remain M20/manual governance.
  - The `tools/qualification.py` implementation uses only the Python 3.11 standard library and bounded file/collection limits. Its validation command checks schema version/shape and all cross-document semantics, verifies every retained artifact as a regular in-tree file by exact relative path, byte count, and SHA-256, rejects JSON duplicate keys and `NaN`/infinity, reports all deterministic validation errors without exposing artifact contents, and returns nonzero without a partial output on any failure.
  - The proposal command consumes only a fully validated plan, record, artifact directory, and explicit passing review and writes a new deterministic canonical proposal to an explicit nonexisting output path. The proposal contains exact tuple/claim scope plus plan, record, review, source, build, workload, evidence-manifest, and artifact digests and is labeled `proposal_only` and `human_matrix_change_required`; repeated inputs produce byte-identical output. It never edits a support matrix, release contract, qualification record, source artifact, Git state, remote service, or production setting and does not authenticate the reviewer.
  - Validation proves threshold integrity only by binding the run and review to a separately retained plan digest. Untrusted timestamps or a validator pass cannot prove that the plan existed before measurement; promotion remains blocked unless a human reviewer verifies the plan's externally retained pre-run provenance. The tool rejects plan/record threshold drift and post-run threshold additions but never claims cryptographic chronology.
  - Synthetic fixtures cover one minimal valid plan/record/review/proposal for every scope plus negative mutations for every required field group, scope mismatch, plan/record/review digest mismatch, changed thresholds, missing trials, failed resource trend, unstable resource growth, unhealthy/lost device, malformed recovery, unsafe paths, symlinks, unlisted artifacts, duplicate JSON keys, non-finite numbers, size/count limits, failed review, unresolved exceptions, existing output, and attempted in-place matrix mutation. Fixture output is explicitly `synthetic_fixture` and cannot be copied into a support matrix.
  - Documentation and deterministic contract checks define schema evolution, artifact layout, canonical digest rules, review and rollback procedure, the M17-05 prerequisite boundary for later combined work, and the exact distinction among fixture, portable CI, raw hardware evidence, reviewed qualification, and support promotion. No document claims that M18-01 qualifies NVIDIA, XDMA, combined, RT1, or RT2 behavior.
  - Stable C ABI v8 with exactly 70 exports and frozen fingerprint, SONAME 8, device ABI v1, HAL core v2, memory/topology extension v1, command/timeline extension v1, Runtime statuses, runtime-profile schema 7/25 keys, observability/rate/checkpoint/input-log schemas and IDs, installed targets/headers and aliases, release 1.2.1, all three existing support matrices and claims, qualification workflows/samples, and Apache-2.0 remain unchanged.
  - Focused qualification-tool tests, complete deterministic local verification, mandatory GitHub CI, and human schema, security, promotion, compatibility, and claim-boundary review pass before merge. M18/CAP-M18 remain incomplete and no tuple is promoted by this batch.
validation:
  local:
    - ./scripts/agent-verify.sh contract
    - python3 tests/test_release_tools.py
    - python3 tools/qualification.py validate --plan tests/qualification_fixtures/valid-campaign-plan.json --record tests/qualification_fixtures/valid-qualification-record.json --review tests/qualification_fixtures/valid-promotion-review.json --artifact-dir tests/qualification_fixtures/artifacts
    - proposal_dir=$(mktemp -d /tmp/rtfw-m18-01.XXXXXX) && python3 tools/qualification.py propose --plan tests/qualification_fixtures/valid-campaign-plan.json --record tests/qualification_fixtures/valid-qualification-record.json --review tests/qualification_fixtures/valid-promotion-review.json --artifact-dir tests/qualification_fixtures/artifacts --output "$proposal_dir/promotion-proposal.json" && python3 tools/qualification.py verify-proposal --proposal "$proposal_dir/promotion-proposal.json" --plan tests/qualification_fixtures/valid-campaign-plan.json --record tests/qualification_fixtures/valid-qualification-record.json --review tests/qualification_fixtures/valid-promotion-review.json
    - ./scripts/agent-verify.sh quick
    - ./scripts/agent-verify.sh full
    - python3 tools/check_c_abi.py --library build/agent-full/librtfw.so
    - readelf -d build/agent-full/librtfw.so | rg 'SONAME.*librtfw.so.8'
  focused_tests_to_add:
    - exact draft/version/closed-object/schema consistency and deterministic valid-fixture validation for NVIDIA, XDMA, combined, RT1, and RT2 plans, records, reviews, and proposals
    - scope-specific complete tuple, workload, topology, resolved-policy, required-trial, raw-population, resource-trend, thermal, recovery, and shutdown field validation at zero, boundary, maximum valid, and overflow/count limits
    - byte-exact plan and record digest binding, threshold set equality, source/build/workload/tuple equality, predeclared comparison evaluation, pass/fail propagation, and rejection of record or review substitution
    - safe artifact-manifest verification for regular files, canonical relative paths, ordering, uniqueness, byte lengths, SHA-256 values, no symlink or directory escape, bounded aggregate bytes, and no unlisted artifact
    - duplicate-key, invalid UTF-8, non-object, trailing-data, `NaN`/infinity, malformed enum/boolean/integer/string/time/digest/path, unknown property, and excessive nesting or collection rejection without partial output
    - required long-duration, thermal, saturation, device-loss, reset-rebind, shutdown, latency/deadline, and resource-stability trial applicability plus explicit failure and unsupported/not-applicable handling by scope
    - failed or exception-bearing review rejection, no authenticated-review claim, deterministic proposal bytes, existing-output refusal, and proof that no tracked matrix, release contract, source artifact, or Git state is mutated
    - preservation of the existing CUDA/XDMA `evidence_only` validator behavior and explicit rejection of a raw M12 artifact as a complete M18 qualification or promotion input
    - release-contract and documentation checks requiring all schema/tool paths and truthful qualification wording while retaining every permanent M14.1/M15/M16/M17 gate
  required_ci:
    - Documentation contract workflow on pinned Python 3.11 validating schemas, qualification/release tooling, negative fixtures, release digests, support-matrix nonmutation, and truthful claim language
    - Linux GCC 11 and Clang 14 Debug/RelWithDebInfo FMA on/off jobs with all existing AddressSanitizer, UndefinedBehaviorSanitizer, determinism, M15/M16/M17, no-allocation, and package gates unchanged
    - Windows Server 2022 MSVC v143 Debug/RelWithDebInfo jobs proving the repository and Python qualification fixtures remain path-portable and do not add a runtime/build dependency
    - Unified executor GCC ThreadSanitizer, snapshot fuzz smoke, determinism artifact exchange, C/C++ embedding, add_subdirectory, relocated package/archive, exact SDK inventory, frozen C ABI/SONAME, dependency review, SBOM, autotune, and scaling jobs remain mandatory and unchanged
    - Existing CUDA-toolkit compile/package and node-free XDMA compile/package jobs remain M17 portable build evidence only; no self-hosted CUDA/XDMA qualification workflow or physical hardware run is required or sufficient for M18-01
  manual:
    - Human schema and security review must approve scope-specific required facts, bounds, duplicate-key/non-finite/path handling, digest and canonicalization rules, threshold equality/evaluation, resource-stability semantics, schema-evolution policy, and parser failure behavior.
    - Human qualification and claim review must confirm that proposal generation cannot mutate a support matrix, that reviewer attribution is not authentication, that plan timestamps do not prove preselection, and that later promotion requires externally verified pre-run plan provenance plus named raw hardware/RT evidence.
    - Human compatibility review must confirm that no runtime, C/device ABI, installed package, release version, support matrix, hardware workflow/sample, or prior retained evidence changed.
risk:
  class: high
  hazards:
    - a syntactically valid but incomplete tuple can omit BIOS, kernel, driver, bitstream, topology, policy, workload, or build facts and be mistaken for reproducible qualification
    - a record can substitute thresholds after measurement, omit failing samples or trials, summarize away misses/resource growth, or bind the wrong plan, source commit, workload, or raw artifact
    - timestamps and reviewer names are untrusted text and can be misrepresented as cryptographic chronology, authenticated approval, signature, or provenance
    - unsafe paths, symlinks, duplicate JSON keys, enormous collections, non-finite numbers, or digest confusion can bypass validation, escape the artifact root, exhaust resources, or make reviewers inspect different bytes
    - a proposal generator can accidentally modify a tracked support matrix, overwrite an input, accept a failed review, or emit nondeterministic bytes that cannot be audited
    - one generic schema can conflate NVIDIA, XDMA, combined, RT1, and RT2 requirements or allow `not_applicable` to erase a mandatory failure/recovery trial
    - existing `evidence_only` samples, fake drivers, fixtures, hosted CI, preflight, benchmarks, or documentation can be relabeled as reviewed hardware, HIL, field, latency, RT1, or RT2 evidence
    - the blocked M17-05 native combined path can be overlooked and a combined proposal can be generated for behavior the baseline cannot execute
    - release digest or documentation checker edits can weaken a frozen ABI, package, workflow, support, or claim boundary while tooling tests remain green
  stop_conditions:
    - the exact baseline is unavailable, dirty, lacks M17-04 ancestry, lacks any retained M15/M16/M17 evidence record, or no longer records the actual M17-05 blocker truthfully
    - target contracts require M18-01 to repair or complete M17-05, execute the combined sample, or qualify behavior absent from the exact baseline
    - implementation requires changing runtime/library/sample/build code, stable C ABI v8 or SONAME 8, device ABI v1, HAL/runtime status or schema surfaces, installed package inventory, release version, license, a support matrix, or a hardware/release workflow
    - a complete bounded offline representation of any approved scope requires guessing a tuple fact, accepting a partial raw population, treating an untrusted timestamp as proof of preselection, or authenticating a reviewer without a separately approved signing/identity design
    - the tool cannot verify all referenced artifacts inside one explicit root without following symlinks, accepting unsafe paths, unbounded memory/input, non-finite values, duplicate keys, or ambiguous canonicalization
    - proposal generation cannot be made output-only, deterministic, atomic, non-overwriting, and incapable of modifying support matrices, source evidence, Git, remote systems, or production state
    - a passing proposal would require allowing a failed threshold, unresolved resource trend, missing applicable loss/reset-rebind/shutdown trial, failed review, unresolved exception, or absent M17-05 combined prerequisite
    - deterministic tests require physical GPU/FPGA/XDMA hardware, PREEMPT_RT, root privilege, destructive MMIO, firmware/bitstream loading, a controlled timing host, secrets, signing, network access, release, deployment, or production access
    - mandatory contract, full verification, CI, or human review would need to be skipped, weakened, or relabeled successful
    - a required schema, tool, fixture, documentation, governance, checker, release-digest, or evidence change falls outside allowed paths or enters a forbidden path
rollback:
  strategy: Revert the four version-1 qualification schemas, offline validator/proposal tool, synthetic fixtures and tests, qualification documentation/governance, release-contract digests, and retained M18-01 evidence as one batch. The batch creates no runtime state, hardware mutation, data migration, support-matrix entry, release, or deployment. If any external draft record was created against schema version 1 before rollback, retain the schema/tool revision needed to read it or explicitly archive that record as non-promotable; never rewrite raw evidence or remove a previously reviewed tuple through this rollback.
  data_migration: none for repository or runtime data; synthetic fixture outputs under build/ are disposable
  release_action: Do not publish a release, change any support matrix, promote a tuple, sign an artifact, deploy, or mark M18/CAP-M18 complete from this batch.
evidence:
  output:
    - docs/evidence/M18-01-<date>.md
    - exact baseline/M17-04 ancestry, clean initial state, M17-05 blocker reconciliation, changed-file allowlist, commands, exit codes, test counts, required CI run/check identifiers, and human review result
    - schema identifiers/versions/digests plus complete field, scope, bound, trial-applicability, threshold, canonicalization, and evolution tables
    - valid synthetic NVIDIA, XDMA, combined, RT1, and RT2 fixture results plus every malformed, substituted, incomplete, failed, unsafe-path, oversized, duplicate-key, non-finite, digest, threshold-drift, resource-instability, review, and output-mutation rejection
    - artifact manifest paths, sizes, SHA-256 results, aggregate bounds, plan/record/review/proposal digest chain, normalized proposal bytes, and repeatability comparison for synthetic fixtures only
    - proof that existing M12 raw evidence remains `evidence_only`, all support matrices and hardware workflows/samples are byte unchanged, and no matrix, Git, remote, hardware, release, or deployment mutation occurred
    - C ABI/device ABI/HAL/status/schema/package/release/license compatibility status, changed and preserved invariants, rollback result, residual risks, and every unperformed validation
    - explicit record that reviewer attribution and timestamps were not authenticated and that no external pre-run plan chronology, physical run, tuple review, or support promotion occurred
  claim_boundary: Evidence may establish static schema structure, bounded offline parsing, digest/path verification, deterministic synthetic threshold evaluation, negative mutation handling, proposal nonmutation, release/package compatibility, and portable RT0 tooling behavior only. Synthetic fixtures, existing `evidence_only` files, mocks, fake drivers, hosted CI, preflight, benchmarks, documents, digests, reviewer strings, timestamps, and proposal generation do not establish pre-run chronology, authenticated approval, physical NVIDIA/XDMA/combined behavior, hardware, HIL, field performance, latency, thermal/endurance behavior, RT1, RT2, support promotion, signing, release, deployment, or production readiness. Those claims require later named retained evidence and explicit human approval.
