batch:
  id: M21-05
  title: Close mixed-rate overload, replay, telemetry, watchdog, and conformance
  goal: Add a bounded additive C++ mixed-rate action and replay closure over the merged M21-01 through M21-04 device-rate, payload, sampled-I/O, and loopback path. Integrate optional-device shedding/recovery, terminal device and sampled actions, watchdog/degradation identity, quiescent checkpoint state, deterministic active replay for explicitly deterministic mock/loopback backends, and a reusable three-rate conformance suite while preserving all existing artifact schemas, stable ABIs, physical-I/O boundaries, and portable RT0 claims.
