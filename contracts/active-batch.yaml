    - cmake --build build/agent-full --parallel 2
    - ./build/agent-full/tests/simcore_tests --gtest_filter='LiveControlSdk.*:LiveControlStress.*:LiveControlMailbox.*:LiveControlActions.*:LiveControlReplay.*:MultipleInstances.*LiveControl*:TraceNoAlloc.*LiveControl*:PeriodicRuntime.*LiveControl*'
    - ctest --test-dir build/agent-full --output-on-failure -R 'm22_live_control|sample_live_control_typed|package_consumer'
