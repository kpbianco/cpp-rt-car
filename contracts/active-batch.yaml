schema_version: 1
batch:
  id: M22-04
  title: Close the typed live-control SDK and stress surface
  goal: >-
    Complete the portable M22 software milestone over the merged M22-03
    transactional live-control path. Add one optional header-only C++ SDK layer
    for fixed, canonical, typed application payloads without changing or hiding
    the raw Runtime API; ship compiling scenario-parameter, controller-gain,
    sensor-calibration, and fault-injection examples; and close capacity,
    producer-concurrency, repeated-lifecycle, watchdog/rollback, replay,
    package-relocation, and multiple-Runtime stress evidence. Preserve every
    stable ABI and existing Runtime/artifact/telemetry schema, keep semantic
    validation and variable-length parsing off RT lanes, and make no executable
    hot-reload, physical-control, HIL, RT, release, deployment, or production
    claim.
