acceptance:
  - The implementation begins from an initially clean target at exact default-branch commit `ff143eede097885c1535ed7b335b709e1cec44bd`, the merged M21-02 pull request 243. Retained M15 through M21-02 evidence is present and unchanged, and governance records M21-02 as merged without inventing sampled-I/O, replay, physical, RT, Unreal, signing, release, publication, deployment, or production results.
  - Cross-rate registration remains copied and frozen at finalization. An additive source-compatible device-endpoint selector explicitly identifies the ordered copied M21-01 payload-reference ordinal and positive slot stride for each device producer or consumer; CPU endpoints retain the existing invalid/default selector. Device-to-device channels, implicit first-match selection, raw addresses, unregistered memory, and arbitrary completion-owned bytes are rejected in M21-03.
  - >-
    A device endpoint is accepted only when it is an admitted M21-01 HAL-v2 command-batch phase, its selected reference belongs to that exact phase/backend/declaration, its copied role permits the direction, and its access and heterogeneous-memory properties make it CPU-readable for device production or CPU-writable for device consumption. The copied reference is an immutable envelope: checked `maximum_in_flight`, stride, alignment, and payload-size arithmetic must partition it into one disjoint exact-size subrange per M21-02 execution slot. Foreign, stale, ambiguous, inaccessible, incoherent, undersized, overlapping, zero-size, out-of-range, or declaration-mismatched endpoints fail transactionally before start.
  - Finalization compiles immutable per-channel device-endpoint records, producer and consumer release selections, fixed store/slot ownership, staging offsets, and direct phase-to-channel slices. It derives every backend, buffer, range, access, timestamp-domain, phase, rate-domain, and capacity identity from the existing copied M17/M21 declarations and does not scan all channels, phases, buffers, commands, or graph edges on each release or completion.
  - CPU-to-device publication uses the existing CPU producer `RateReleaseView::publish` operation and exact produced generation. Before invoking the due device command provider, Runtime selects the immutable first-cycle or repeating-cycle source record, claims the M21-02 execution slot and its derived input subrange, copies the exact generation once, and supplies the provider only after the copy is committed. A failed, stale, not-ready, size-mismatched, foreign, or capacity-exceeded selection cannot dispatch the device release.
  - The provider continues to materialize a batch matching its copied declaration. After provider validation and before queue publication, Runtime alone substitutes the selected payload reference's buffer offset and byte count with the precompiled execution-slot subrange; buffer token, access, command/reference identity, and every non-payload reference remain exact. Provider-selected offsets or ranges are rejected, ordinary M17 and channel-free M21-02 batches retain exact-reference behavior, and the backend receives only the Runtime-owned bounded materialization.
  - Device-to-CPU publication occurs only after M21-02 correlates the exact device release and execution slot to one terminal successful completion, including backend, phase, rate domain, supercycle cycle, release sequence, substep, batch generation, signal set, status, and completion timestamp-domain identity. Runtime then copies that slot's pre-registered host-visible output subrange into the channel's preallocated store and publishes exactly one generation before any dependent CPU consumer becomes runnable.
  - Submission acceptance, synchronous early completion, asynchronous completion, dependency-frontier release, and device-output publication have one deterministic order. Backend submit success alone never publishes output; timeout, cancel, submission rejection, completion error, malformed completion, device loss, quarantined late completion, skipped/shed release, or provider failure publishes no produced generation and cannot overwrite the channel's last committed sample.
  - Every produced payload result exposes exact channel generation, producer release sequence and substep, producer completion status, producer timestamp-domain identity, producer timestamp, selection age, provenance, freshness, and held state through additive fixed-size C++ inspection/read metadata. CPU-produced values use the Runtime logical release timestamp domain; device-produced values use the copied completion timestamp domain and correlated completion timestamp. Unsupported or uncorrelatable domains fail closed rather than fabricating an age.
  - Sample-and-hold selection is computed from immutable integer release/completion identity, never callback or thread arrival order. First-cycle initial data remains distinct from a produced generation; repeating-cycle wrap selects the exact prior-cycle generation; equal-time ties, maximum-age inclusivity, stale classification, held status, skipped producers, and generation exhaustion have one documented deterministic rule.
  - Store slots preserve exact single-producer/single-consumer ownership for each CPU-to-device or device-to-CPU channel. A store slot cannot be overwritten while its selected device release or CPU consumer can still read it, device completion cannot publish into a newer generation, and retirement/reuse occurs only after the one compiled consumer reference for that generation is settled. M21-03 adds no implicit shared-store fan-in or fan-out; applications may retain the existing explicit separate-channel pattern.
  - Potentially overlapping device releases map the M21-02 generation-safe execution-slot ordinal to disjoint precompiled buffer subranges. A later generation cannot overwrite input or output bytes still owned by an earlier submitted release, and a slot is not recycled until terminal ownership plus payload capture/consumption has settled. M21-03 adds no hidden copy thread and no vendor call on the executor or host-step lane.
  - CPU consumer `RateReleaseView::copy`, CPU producer `publish`, device input materialization, and device output capture preserve the existing exact-size caller contract and perform at most one bounded slot claim and one bounded payload copy. They allocate no ordinary heap, take no blocking mutex, perform no file/network I/O, start no thread, wait for no vendor operation, and do not retry or scan for a substitute generation.
  - Failed finalization publishes no partial compiled channel plan or memory accounting and preserves copied registration for correction through the existing replacement API. Successful finalization includes device-channel metadata, controls, staging bytes, and retention state exactly once in `cross_rate_*`, `rate_plan_bytes`, `runtime_control_bytes`, and `planned_bytes` reconciliation without counting borrowed registered-buffer bytes as Runtime-owned payload storage.
  - Graph/config identity includes the additive device endpoint selector, slot stride, derived subrange layout, and every copied semantic identity that can change publication or selection, but excludes raw pointer values, addresses, payload contents after configuration, wall-clock measurements, provider callback addresses, and completion arrival order. Equivalent registration order canonicalizes to the same identity; changing direction, reference ordinal, stride/range identity, timestamp domain, maximum age, or initial bytes changes identity.
  - Existing CPU-to-CPU M16 channels, CPU-only active execution, ordinary M17 command batches, M21-02 release/completion behavior without channels, checkpoint schema-1 artifacts, replay inputs, rate-action schema, observability schema, package consumers, two Runtime instances, and start/stop/restart retain their prior behavior. M21-03 does not retrofit device payload bytes into existing checkpoint or replay artifacts; M21-05 owns replay and conformance closure.
  - M21-03 adds CPU/device payload transport only. It does not add sampled-channel descriptors, sample rate, sample format, units, calibration identity, external clock or trigger identity, ring-buffer overrun/underrun, startup/shutdown safe output, a loopback backend, vendor DAC/DAQ/CAN/IIO adapters, overload/replay integration, benchmarks, CUDA physics, a golden demo, or configuration/code/Unreal hot reload.
  - Stable C ABI v8 with exactly 70 exports and frozen fingerprint `0xd0e7a5a14bf35f97`, SONAME 8, device ABI v1, extension ABI v1, HAL core v2 and extension v1 contracts, runtime-profile schema 7 and 25 keys, observability/checkpoint/input-log/rate-action schemas, Runtime status values, installed target/header/alias inventory, release 1.2.1, support matrices, qualification state, and Apache-2.0 remain unchanged.
  - Target governance, current state, handoff, component contracts, release digest ledger, and retained `docs/evidence/M21-03-<date>.md` state the exact portable RT0 CPU/device payload boundary. Focused and full local verification, mandatory hosted CI, and human ownership, ordering, accessibility/coherency, generation, allocation, compatibility, and claim review pass before merge. M21 and CAP-M21 remain incomplete after this batch.
