batch:
  id: M15-03
  title: Add memory providers and resident regions
  goal: Add an additive bounded C++ host memory-provider contract and use it to create, apply, verify, report, and reverse policy for the runtime-owned phase-scratch, task-scratch, and trace backing regions, while preserving truthful unsupported or verify-only results for fragmented control storage, stacks, borrowed memory, and backend-owned memory pending M15-04 closure.
