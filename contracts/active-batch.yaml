acceptance:
  - Public C++ types cover frame, executor-worker, watchdog, device-service, and XDMA-I/O roles, plus CPU set, scheduling class/priority, NUMA node, wait strategy, stack/guard, and bounded name requests.
  - Memory policy types cover provider ownership, alignment, page rounding, guards, prefault, locking, pinning, huge-page preference/fallback, NUMA placement, first touch, residency verification, and rollback intent.
  - Finalization rejects malformed, contradictory, unsupported-strict, duplicate-role, overflow, and capacity-invalid policy inputs before start.
  - Portable defaults resolve to the current 1.2.1 behavior and do not call native mutation APIs.
  - Requested and resolved reports inventory every current runtime-owned thread role and runtime memory category with stable identifiers and exact-once accounting keys.
  - Host-adapter and vendor-owned threads are represented as externally owned and verify-only.
  - No runtime callback or steady-state behavior changes in this batch.
  - Stable C ABI v8, SONAME 8, device ABI v1, SDK header inventory, package targets, compatibility aliases, schemas unrelated to this additive C++ contract, and Apache-2.0 remain unchanged.
  - Documentation states that policy configuration and portable tests do not establish RT1 or RT2.
  - Focused tests, full local verification, and required GitHub CI pass.
validation:
  local:
    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - ./scripts/agent-verify.sh full
  focused_tests_to_add:
    - policy default and boundary validation
    - duplicate and contradictory request rejection
    - exact thread-role and memory-category inventory
    - external ownership and verify-only representation
    - checked arithmetic and capacity rejection
    - two-runtime isolation
  required_ci:
    - Linux GCC and Clang Debug/RelWithDebInfo
    - Windows MSVC Debug/RelWithDebInfo
    - ThreadSanitizer
    - determinism artifact exchange
    - installed package and compatibility consumers
    - documentation and release contracts
  manual:
    - Review the public C++ source-compatibility shape before implementation merge.
risk:
  class: high
  hazards:
    - public C++ surface churn before native behavior exists
    - incomplete resource inventory that forces incompatible redesign
    - accidental ABI, package, or release-contract drift
    - conflating requested/resolved data with applied or qualified state
  stop_conditions:
    - a stable C ABI or device ABI change becomes necessary
    - a required thread or memory owner cannot be represented without a product decision
    - native policy mutation is required to satisfy this batch
    - source changes outside allowed paths are required
    - current repository contracts contradict the control-plane batch
rollback:
  strategy: Revert the batch commit; portable runtime behavior and ABI remain unchanged.
  data_migration: none
  release_action: Do not publish a release from this batch unless separately approved.
evidence:
  output:
    - docs/evidence/M15-01-<date>.md
    - exact commands and exit results
    - acceptance mapping
    - changed invariants
    - residual risks
    - unperformed native and hardware validation
  claim_boundary: Evidence is static, unit, simulated, package, and portable RT0 only.
