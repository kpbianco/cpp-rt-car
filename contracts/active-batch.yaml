acceptance:
  - The exact clean baseline is `bdc97d0122effbad07dbf6d4981e1bf0de729437`, the merged M17-04 pull request 221. It contains M17-04 commit ancestry and `docs/evidence/M17-04-2026-08-12.md`; target history, governance, current-state, handoff, and roadmap are reconciled to that fact without rewriting retained evidence or inventing a hosted-CI run, check count, successful local ThreadSanitizer result, or human-review object.
  - A top-level default build adds exactly one non-installed `sample_cpu_gpu_fpga_cpu` executable using only existing installed/public Runtime, CUDA-candidate, and XDMA-candidate C++ headers and existing `rtfw_runtime`, `rtfw_cuda_backend`, and `rtfw_xdma_backend` targets. It builds and runs without a CUDA toolkit, GPU, XDMA device node, kernel driver, root privilege, firmware, bitstream, network access, or secrets.
  - The sample constructs the actual `CudaDeviceBackend` and `XdmaDeviceBackend` candidate classes with bounded injected version-2 driver tables, registers both through their existing native `hal_v2_registration()` paths in one `rt::Runtime`, and uses fixed capacities and caller-owned fixed storage. It does not reimplement a generic substitute HAL backend, call either device-ABI-v1 `api()` path, or add/change any Runtime, HAL, CUDA, XDMA, ABI, schema, package, support, or release API.
  - "The compiled graph is an explicit dependency chain: CPU preparation; one CUDA batch; one CPU host-staging handoff; one XDMA batch; and CPU validation. The CUDA and XDMA phases each use a backend-local timeline only for their own accepted/completed value. Cross-backend order comes solely from the ordinary compiled-graph dependency and the completed host-staging copy; no timeline handle crosses a backend and no direct GPU-to-FPGA peer path is declared or implied."
  - CPU preparation writes a fixed deterministic input to a CUDA staging object discovered and registered through the existing staged-memory contract. The CUDA batch declaration and provider issue exactly one `copy_to_device`, one stable-ID caller-owned pre-registered Graph dispatch, and one `copy_from_device`, in that order, with exact logical range/access bindings, one finite timeout, and one same-backend signal. The injected CUDA driver models opaque device storage and a deterministic transform but remains fake protocol evidence.
  - After the CUDA batch is wholly complete, a bounded CPU callback copies the exact downloaded result from the CUDA-owned host region into a disjoint XDMA-owned borrowed-host staging region. The regions do not overlap, are not registered to both backends, and the bridge performs no allocation, vendor call, hidden synchronization, pointer-derived identity, or peer-memory claim.
  - The XDMA batch then issues explicit H2C, bounded 32-bit little-endian control-write trigger, finite user-event wait, and C2H commands in declared order using stable existing opcodes, exact logical references, one finite timeout, and one same-backend signal. Its injected driver owns fixed simulated card/control/event state and deterministically transforms the staged payload; it does not access a user BAR, event node, PCI function, driver, firmware, bitstream, or physical FPGA.
  - The final CPU callback verifies every output byte/value, the expected event value, exact phase and injected-driver call order, one Graph launch, one XDMA trigger/event, and absence of executor-worker vendor entry. After each successful step, the host inspects both completed backend-local timeline values. The executable returns nonzero on any mismatch and on success prints a stable concise result that explicitly identifies `evidence=simulated_protocol`, `physical_hardware=false`, and `direct_peer_dma=false`.
  - The sample performs at least two complete frames with deterministic input/output and monotonically increasing backend-local signal values, retains one accepted-before-complete result per device phase per frame, and observes no ordinary heap allocation during the measured post-start `Runtime::step()` interval. A second independent sample fixture proves that backend state, graph IDs, card storage, timelines, buffers, call logs, and cleanup ownership are not shared across Runtime instances.
  - Failure-focused coverage injects at least CUDA Graph failure and XDMA event/transfer failure after valid prior work and proves that the dependent CPU bridge/validation phase does not run, no later backend is submitted after an upstream failure, checked stop retains and resolves the existing quarantine/ownership state, and a fresh independent sample run succeeds. It does not weaken timeouts, use timing-only assertions, fabricate completion, or require physical hardware.
  - Startup, success, injected failure, and checked stop preserve M17-01 through M17-04 exception containment, fixed capacity, accepted-before-complete causality, whole-completion publication, first-error retention, reverse cleanup, unresolved-only retry, caller-owned Graph/buffer lifetime, and no detached work. The sample adds no runtime-owned or backend-owned lane, queue, MemoryPlan row, provider region, status, schema, exported symbol, installed header/target, or support record.
  - Stable C ABI v8 with exactly 70 exports and frozen fingerprint, SONAME 8, every device-ABI-v1 declaration/layout/value and candidate behavior, HAL core v2, memory/topology extension v1, command/timeline extension v1, Runtime status values, runtime-profile schema 7/25 keys, observability/rate/checkpoint/input-log schemas and IDs, package inventory and aliases, release 1.2.1, support matrices, and Apache-2.0 remain unchanged.
  - Target governance, current state, handoff, roadmap, architecture/device/vendor/testing/readiness contracts, README, release digest ledger, and retained M17-05 evidence describe the sample as portable simulated RT0 protocol evidence. After focused, full local, mandatory CI, and human gates pass, M17/CAP-M17 may be marked functionally complete, while every physical CUDA/XDMA/combined, hardware, HIL, field, latency, RT1/RT2, signing, release, deployment, and production claim remains M18 or later work.
validation:
  local:
    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - cmake -S . -B build/agent-full -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_TESTS=ON -DRTFW_BUILD_EXPERIMENTAL=ON -DENABLE_RAPIDCHECK=ON -DSIM_SANITIZERS= -DSIM_WERROR=ON
    - cmake --build build/agent-full --parallel 2
    - ./build/agent-full/samples/sample_cpu_gpu_fpga_cpu
    - ctest --test-dir build/agent-full --output-on-failure -R 'm17_cpu_gpu_fpga_cpu_sample|m17_cuda_graph|m17_xdma_control|m17_command_batch_timeline|m17_heterogeneous_memory_topology|m17_hal_v2_compatibility|m15_accounting_closure|m15_stack_lifecycle|m15_cross_category_rollback|m16_rate_timeline|m16_rate_dispatch|m16_shedding_telemetry|m16_cross_rate_data'
    - cmake -S . -B build/m17-05-package -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTS=OFF -DRTFW_BUILD_EXPERIMENTAL=OFF -DRTFW_BUILD_EXAMPLES=OFF -DRTFW_BUILD_RUNTIME_DEMO=OFF -DSIM_WERROR=ON
    - cmake --build build/m17-05-package --parallel 2
    - cmake --install build/m17-05-package --prefix "$PWD/build/m17-05-install"
    - cmake -S tests/package_consumer -B build/m17-05-package-consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/build/m17-05-install"
    - cmake --build build/m17-05-package-consumer --parallel 2
    - ctest --test-dir build/m17-05-package-consumer --output-on-failure
    - ./scripts/agent-verify.sh full
    - python3 tools/check_c_abi.py --library build/agent-full/librtfw.so
    - readelf -d build/agent-full/librtfw.so | rg 'SONAME.*librtfw.so.8'
  focused_tests_to_add:
    - default portable build and CTest execution of the sample on a host with no CUDA toolkit, GPU, XDMA node, firmware, bitstream, or privilege
    - exact CPU-prepare, CUDA upload/Graph/download, CPU host bridge, XDMA H2C/control/event/C2H, and CPU-validate dependency and injected-call order with deterministic final bytes
    - backend-local timeline ownership and monotonic values across at least two frames, with explicit rejection or construction-time proof that no CUDA handle appears in an XDMA wait/signal or vice versa
    - disjoint CUDA and XDMA host registrations, explicit bounded bridge copy, stable Graph/control/event opcodes, and no peer-memory, cross-backend-timeline, implicit synchronization, or shared dual-backend registration
    - executor/provider versus Runtime submission/service and XDMA fixed-worker thread identity, proving no injected vendor callback runs on an executor worker
    - measured post-start complete-frame no-allocation, fixed callback counts, queue/timeline bounds, and deterministic repeated output
    - two independent Runtime/backend/sample fixtures with isolated graph IDs, device/card state, buffers, timelines, call traces, stop state, and successful reverse cleanup
    - CUDA Graph and XDMA event/transfer injected failures with downstream callback suppression, no later-backend submit after upstream failure, exact terminal status, checked stop/quarantine cleanup, and successful fresh-run recovery
    - stable success output and evidence labels that state simulated protocol, no physical hardware, and no direct peer DMA
    - permanent M14.1/M15/M16/M17-01 through M17-04 lifecycle, compatibility, accounting, no-allocation, sanitizer, determinism, package, and claim-boundary regressions
  required_ci:
    - Documentation contract workflow covering the sample topology, host-staging boundary, simulated-evidence labels, quick start, release contract, frozen C/device ABI, exact SDK inventory, and all permanent M15/M16/M17 gates
    - Linux GCC 11 and Clang 14 Debug and RelWithDebInfo FMA on/off matrix building and running `m17_cpu_gpu_fpga_cpu_sample` with AddressSanitizer and UndefinedBehaviorSanitizer coverage of success, injected failure, two-runtime isolation, and cleanup
    - Windows Server 2022 MSVC v143 Debug and RelWithDebInfo matrix building and running the injected portable sample with identical graph order, stable opcodes, outputs, evidence labels, source compatibility, and no Linux/CUDA-toolkit/device-node leakage
    - Unified executor GCC ThreadSanitizer job running the sample success/failure/isolation cases plus complete VendorHalV2, CUDA Graph/fake-driver, XDMA control/event, CommandBatch, HeterogeneousMemory, HAL-v2/v1-adapter, blocked-stop, and permanent M15/M16 processes without weaker exclusions or timeouts
    - Determinism GCC and Clang FMA-on/FMA-off jobs and artifact exchange remain byte exact for existing fixtures; the sample must produce the same integer result and declared stage order on each portable compiler tuple without being promoted to D2/D3 evidence
    - C and C++ embedding smoke builds and runs `sample_cpu_gpu_fpga_cpu` beside existing samples on GCC and Clang without a CUDA toolkit or XDMA node
    - C/C++ embedding, add_subdirectory, installed package, archive relocation, SDK header self-containment, compatibility aliases, exact 70-export C ABI, dependency review, SBOM, autotune, and scaling gates prove the sample did not change the installed product surface
    - Existing node-free XDMA and CUDA-toolkit compile/install/consumer gates remain mandatory M17-04 build/package evidence only and do not execute or qualify hardware
    - Existing no-allocation, bounded-memory/control-ledger, M14.1 recovery, M15 rollback, M16 timeline/data/dispatch/shedding/telemetry, all M17 core/memory/command/vendor compatibility, sanitizer, fuzz-smoke, observability-schema, release-contract, package, CUDA fake-driver, and XDMA portable gates
  manual:
    - Human API, architecture, and compatibility review must confirm that the sample uses only existing public C++ surfaces, adds no installed API/target or runtime capability, preserves every ABI/schema/release/support boundary, and is the smallest host-staged graph that satisfies CAP-M17.
    - Human concurrency, lifetime, and safety review must confirm exact graph dependency order, disjoint host ownership, bounded bridge copy, backend-local timelines, vendor-call thread identities, accepted-before-complete publication, fixed storage, failure suppression, quarantine, reverse retryable cleanup, no detached work, and no post-start frame allocation.
    - Human claim review must confirm that names such as GPU and FPGA describe injected protocol roles only; the executable, README, docs, and evidence must not imply physical Graph execution, MMIO, interrupts, DMA, HIL, field, latency, RT1/RT2, support, release, deployment, or production readiness.
    - Physical combined execution is not required or authorized by M17-05. Any later physical run requires a named M18 tuple, reviewed GPU/FPGA/driver/firmware/bitstream/BDF/topology/workload plan, preselected thresholds where timing is measured, and separate human promotion approval.
risk:
  class: high
  hazards:
    - an ordinary graph dependency can be mistaken for a cross-backend hardware fence even though correctness depends on complete CUDA download, CPU bridge completion, and later XDMA upload
    - overlapping or dual-registered host storage can obscure ownership, race two backends, or imply a peer/coherent path that the Runtime explicitly does not provide
    - a fake CUDA Graph or XDMA control/event driver can mutate data synchronously in a way that hides missing accepted-before-complete, staging, timeout, quarantine, or thread-isolation behavior
    - sample callback or driver state can allocate after start, use dynamic logs, race submission/service/backend workers, leak between Runtime instances, or outlive checked cleanup
    - timeline handles or mutable values can accidentally cross backend boundaries or enter declarations inconsistently, causing invalid identity or a false cross-device synchronization story
    - an upstream failure can still allow the host bridge, XDMA phase, or final validator to run if graph-token release and cancellation are asserted only by final output
    - adding a default-built sample can leak toolkit, Linux-driver, warning, feature-macro, dependency, installed-target, or package requirements into otherwise portable builds
    - success wording, GPU/FPGA naming, deterministic output, hosted CI, or benchmarks can be overstated as physical combined execution, peer DMA, hardware, HIL, bounded latency, RT1, or RT2 qualification
  stop_conditions:
    - the exact baseline is unavailable, dirty, lacks merged M17-04 commit `bdc97d0122effbad07dbf6d4981e1bf0de729437`, or lacks any retained M15/M16/M17-01 through M17-04 evidence record
    - actual baseline code or target contracts show that the existing public Runtime and native CUDA/XDMA candidate surfaces cannot express the graph with a bounded CPU host-staging bridge and backend-local timelines
    - satisfying the sample requires changing any file under `rt/include/rt/` or `rt/src/`, adding a Runtime/HAL/vendor operation, changing a protected ABI/schema/status/package surface, or weakening M17-01 through M17-04 validation or lifecycle behavior
    - correctness requires overlapping/dual-registered host regions, a cross-backend timeline or fence, direct GPU-to-FPGA peer DMA, device-rate dispatch, hidden synchronization, a new lane, unbounded retry, detached work, or allocation on the measured post-start frame path
    - the sample cannot prove that the CPU bridge runs only after complete CUDA download or that XDMA submission and final validation are suppressed after an upstream failure
    - a portable deterministic test requires timing sleeps/tolerances, a CUDA toolkit, physical GPU/FPGA, XDMA nodes, root privilege, a fixed PCI/IRQ/IOMMU topology, destructive MMIO, firmware/bitstream access, secrets, signing, release, deployment, or production access
    - mandatory sanitizer, package, compatibility, no-allocation, full verification, or human review would need to be skipped, weakened, or relabeled successful
    - a required source, sample, test, workflow, documentation, governance, or evidence change falls outside allowed paths or enters a forbidden path
rollback:
  strategy: Revert the portable combined sample source, its focused CTest/build/CI wiring, documentation/governance updates, release digest changes, and retained M17-05 evidence as one batch. Before discarding an executing sample, stop new frames, let each accepted CUDA/XDMA batch complete or remain quarantined under existing ownership, join Runtime submission/service and XDMA worker lanes through checked stop, and retain every caller-owned Graph, buffer, fake-driver, and backend object until cleanup succeeds. The exact M17-04 baseline and separate CUDA/XDMA native candidate examples remain the fallback; no data migration, device reset, host setting, support-matrix change, release, or deployment rollback is authorized.
  data_migration: none
  release_action: Do not publish a release, promote CUDA/XDMA/combined/peer/RT support, alter qualification records, execute physical MMIO, or mark M17/CAP-M17 complete until every focused, full local, mandatory CI, and human gate passes and retained evidence supports only the approved functional claim.
evidence:
  output:
    - docs/evidence/M17-05-<date>.md
    - exact baseline/M17-04 ancestry, clean initial state, changed-file allowlist, commands, exit codes, sample/CTest/package/full counts, required CI run/check identifiers, and human review result
    - complete graph declaration and compiled order for CPU preparation, CUDA batch, CPU host bridge, XDMA batch, and CPU validation, including every dependency and backend-local timeline owner/value
    - fixed input, CUDA staged memory declaration, Graph ID/bindings, upload/Graph/download commands, CPU bridge bytes, XDMA H2C/control/event/C2H commands, final output, and normalized injected-driver call trace for every frame
    - proof of disjoint host spans, no cross-backend timeline handle, no dual registration, no peer-memory/direct-DMA path, no implicit synchronization, no toolkit/device-node access, and stable simulated-evidence output labels
    - provider/executor, Runtime submission/service, and XDMA worker thread identities plus accepted-before-complete, whole-completion, downstream suppression, failure status, quarantine, checked-stop, fresh-run recovery, and two-runtime isolation results
    - exact fixed sample/backend storage and existing Runtime/backend-private accounting boundary, measured post-start allocation result, sanitizer/ThreadSanitizer results, callback and vendor-call counts, and reverse cleanup state
    - proof that C ABI/device ABI/HAL versions, Runtime statuses, schemas/IDs, installed headers/targets, package aliases, release version, support matrices, license, and all M17-04 device-ABI-v1/native-v2 behavior remain unchanged
    - changed and preserved invariants, rollback result, residual risks, and all unperformed physical Graph, device memory/pinning/coherency/topology/timestamp, XDMA DMA/MMIO/interrupt/firmware/bitstream/BDF, combined-hardware, HIL, field, controlled-performance, latency, thermal, endurance, RT1, RT2, signing, release, staging, deployment, and production validation
  claim_boundary: Evidence may establish static, sample, unit, malformed/failure-injected, fake CUDA Graph, simulated XDMA transfer/control/event, sanitizer, package, fixed-storage/no-allocation, lifecycle-recovery, concurrency, cross-instance, and portable RT0 functional composition only. The combined graph demonstrates an explicit host-staged software protocol; it is not physical GPU or FPGA execution, a hardware fence, direct peer DMA, device coherence, safe MMIO, an interrupt/cancellation guarantee, bounded vendor latency, HIL, field, RT1, RT2, support promotion, signing, release, deployment, or production readiness. Those claims require named retained M18-or-later evidence and human approval.
