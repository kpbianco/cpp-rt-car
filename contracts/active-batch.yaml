    - ./scripts/verify-portable-assurance.sh --build-dir build/portable-assurance --source-commit "$(git rev-parse HEAD)" all
    - python3 tools/check_c_abi.py --library build/agent-full/librtfw.so
    - readelf -d build/agent-full/librtfw.so | rg 'SONAME.*librtfw.so.8'
    - git diff --check
    - git diff --name-only 0bf54966be63817969468c69c5cd183ad66ab358
  focused_tests_to_add:
    - exact typed-envelope layout, canonical little-endian bytes, type/schema/kind/extent/reserved-field validation, malformed/truncated/trailing/digest mutations, caller-output transactionality, and custom-type compile-time rejection
    - host-frame and exact compiled-rate typed record construction with complete handle/sequence/target/alignment/flags/digest fields, invalid target/sequence/codec failures, unchanged raw admission results, and no implicit retry or retarget
    - scenario, controller, calibration, fault, and clear-fault sample codecs with semantic prevalidation, fixed callback decode/copy, whole-generation visibility, replacement, commit, rollback, action correlation, and checked stop
    - policy and declaration absolute-boundary validation for 64 mailboxes, 256 producers, 65,536 records, 65,536 payload bytes per record, 1 GiB checked total storage without forced physical commitment, and exact one-over/overflow/correction behavior
    - representative full-occupancy and reclamation stress across multiple producers and update kinds with deterministic canonical order, no torn payload, no early source-slot reuse, exact counters, and finite operation counts
    - concurrent producer admission against host/rate boundary close, action readers, checkpoint claims, stop, and callback-failure rollback under ThreadSanitizer without data races, timing-based acceptance, or payload exposure
    - action and retained-generation capacity zero/exact/one-over behavior, explicit loss/gap/overwrite, replay disqualification, and unchanged successful execution when observational storage is exhausted
    - fresh-Runtime repeated lifecycle and concurrent multiple-Runtime isolation covering handles, producer/mailbox/action sequences, generations, payloads, checkpoints, replay artifacts, watchdog/degradation state, and complete checked teardown
    - default/source/add-subdirectory/installed/archive-relocated package consumers, standalone public-header compilation, exact installed inventory, and raw API compatibility beside the typed helpers
    - steady-state no-allocation instrumentation for typed construction/decode plus retained M22 admission/publication/settlement/checkpoint/replay paths, with no hidden thread, I/O, blocking, callback, vendor, or destructor control operation
    - exact 70-export C ABI/fingerprint/SONAME, device and extension ABI, Runtime/live-control numeric values, existing artifact fixtures, MemoryPlan rows, support matrices, release contract, sanitizer, determinism, and prior-evidence preservation
  required_ci:
    - Documentation contract workflow checking exact data-only typed-SDK claims, off-lane semantic validation, bounded callback decode, unchanged raw API and versioned schemas, no executable/Unreal reload implication, exact installed header delta, release digests, and prior evidence
    - Linux GCC 11 and Clang 14 Debug and RelWithDebInfo matrix with AddressSanitizer and UndefinedBehaviorSanitizer coverage of typed codecs, host/rate construction, malformed inputs, stress, rollback, lifecycle, replay, and existing M22 regressions
    - Windows Server 2022 MSVC v143 Debug and RelWithDebInfo matrix proving identical canonical bytes, source compatibility, fixed helper behavior, sample/package results, and unchanged stable C ABI/export set
    - Unified executor GCC ThreadSanitizer job covering producer/boundary/action/checkpoint/stop races, typed callback reads, rollback, repeated lifecycle, action/journal loss, and concurrent Runtime isolation without timing-based assertions
    - Determinism GCC/Clang FMA-on/off and artifact exchange proving canonical typed payload bytes and unchanged prior checkpoint/input-log/mixed-rate/live-control replay artifacts and generation/action identities
    - C and C++ embedding, add-subdirectory, installed-package, archive relocation, standalone-header, compatibility-alias, exact 70-export C ABI, typed live-control sample, and raw live-control consumer coverage with the exact reviewed SDK inventory
    - Clang 14 portable static/fuzz/artifact assurance, blocking dependency review, candidate SBOM/provenance, autotune, scaling, package relocation, and every existing M7/M16/M17/M21/M22 sanitizer/no-allocation/release gate remain green
  manual:
    - Human SDK review must confirm the helper is optional, header-only, fixed-capacity, allocation-free, source-only, self-contained, and transparent about every raw target, sequence, digest, admission result, lifetime, and checked-stop obligation.
    - Human canonical-format and callback review must confirm semantic validation and variable-length parsing remain off RT lanes, callback work is bounded fixed-layout decode/copy only, malformed input cannot partially mutate output, and application-owned state or side-effect rollback is not attributed to Runtime.
    - Human concurrency, compatibility, privacy, and claim review must confirm stress uses finite deterministic assertions, multiple instances share no state, payload bytes remain absent from telemetry, the exact installed-header delta is intentional, every stable ABI/schema/support claim remains unchanged, and no portable result is described as executable hot reload, physical control, HIL, controlled latency, RT1, RT2, release, deployment, or production evidence.
risk:
  class: high
  hazards:
    - a convenience helper can silently hide producer sequence, target identity, admission failure, or checked-stop ownership and make a bounded raw API appear transactional beyond its actual contract
    - serializing a C++ object representation or host-endian value can make typed payloads compiler-, padding-, or endian-dependent and break replay/digest agreement
    - decoding or semantically validating variable-length configuration inside a Runtime callback can add allocation, unbounded work, exceptions, logging, or I/O to an RT lane
    - a sample that mutates application state before complete validation or treats Runtime-generation rollback as application rollback can demonstrate an unsafe integration pattern
    - stress tests that depend on sleeps, scheduler luck, large physical commitment, or weak counters can be flaky while missing ownership, ABA, or isolation defects
    - adding a default installed header without exact package/release updates can drift the supported SDK inventory or leak private dependencies and project policy
    - marking CAP-M22 complete from portable tests can be overstated as physical control, executable reload, HIL, timing, RT, release, deployment, or production readiness
  stop_conditions:
    - the exact target baseline is unavailable, dirty, lacks merged M22-03 and its retained evidence, or differs from merged pull request 249
    - implementation requires changing C ABI v8, SONAME 8, device ABI v1, extension ABI v1, HAL tables, Runtime status/live-control numeric values, an existing artifact/telemetry/profile schema, support matrix, release version, license, or prior evidence
    - the typed layer cannot remain optional, header-only, fixed-extent, allocation-free, exception-contained, self-contained on public headers, or transparent about raw status/sequence/target/lifecycle semantics
    - canonical payloads would depend on native object representation, padding, host endianness, unstable type information, raw addresses, dynamic strings/containers, implicit clocks, or borrowed lifetime beyond the immediate call
    - correct sample behavior requires Runtime-owned semantic parsing, authentication, application-state rollback, implicit backend transfer, a new lane/provider region/MemoryPlan row, or destructor-driven Runtime control
    - credible stress acceptance requires timing sleeps/tolerances, unbounded loops, forced 1 GiB physical allocation, physical CUDA/XDMA/DAC/DAQ/CAN/IIO hardware, privileged hosts, secrets, signing, release, deployment, or manufactured hardware/RT evidence
    - implementation requires M23 benchmarks, M24 CUDA physics, M25 general SDK/builders, M26 golden demo, executable/shared-library/Unreal hot reload, vendor integration, support promotion, or another product decision outside M22 closure
    - any required source, test, workflow, documentation, governance, or evidence change falls outside allowed paths or enters a forbidden path
    - focused, full, sanitizer, concurrency, determinism, package, ABI, release, or human review would need to be skipped, weakened, or relabeled successful
rollback:
  strategy: >-
    Revert the additive `rt/live_control.hpp` typed layer, its exact install and
    package-contract inventory entry, typed sample, focused/stress/package
    consumers, documentation/governance, release-digest updates, and retained
    M22-04 evidence as one coherent batch. Revert only any separately justified
    M22 raw-path defect repair proven by the new stress suite. The merged M22-01
    through M22-03 raw staging, boundary, rollback, action, checkpoint, replay,
    ABI, package, and evidence paths remain the rollback baseline.
  data_migration: none
  release_action: Do not publish a release, promote a hardware/RT/support tuple, sign an artifact, deploy, or alter repository settings from this batch.
evidence:
  output:
    - docs/evidence/M22-04-<date>.md
    - exact control and target baselines, initial worktree state, changed files, commands, exit codes, focused test/sample/package counts, required CI run/job identifiers, and human review results
    - typed envelope byte layout, type/schema/update-kind tables, fixed capacities, customization contract, canonical encode/decode mutation results, and caller-output transactionality
    - scenario/controller/calibration/fault/clear-fault example identities, exact host/rate targets, whole callback-visible values, admission/status/action/rollback results, and checked teardown
    - absolute configuration-bound checks, representative full-occupancy stress, concurrent producer/boundary/action/checkpoint/stop results, deterministic operation counts, loss/replay behavior, watchdog interaction, repeated lifecycle, and multiple-Runtime isolation
    - no-allocation/bounded-work evidence, standalone and relocated header/sample consumers, exact installed inventory and release digests, and unchanged raw M22 behavior
    - exact C ABI v8 70-export fingerprint/SONAME, device ABI v1, extension ABI v1, HAL/runtime numeric tables, existing artifact/telemetry/profile schemas, MemoryPlan, support/qualification state, release/license, and prior-evidence preservation
    - residual risks and every unperformed arbitrary application-state rollback, executable/shared-library/Unreal reload, physical control or vendor I/O, HIL, controlled timing/electrical/calibration, RT1, RT2, signing, publication, release, deployment, and production validation
  claim_boundary: >-
    Evidence may establish one optional fixed-capacity canonical typed C++
    payload layer, compiling data/configuration examples, deterministic portable
    stress closure, and CAP-M22 portable-software completion over the merged raw
    Runtime live-control path. It does not establish arbitrary application,
    backend, external-process, or physical side-effect rollback; executable or
    shared-library/Unreal hot reload; physical control; vendor integration;
    HIL; controlled latency; RT1; RT2; hardware/support promotion; signing;
    publication; release; deployment; or production readiness.
