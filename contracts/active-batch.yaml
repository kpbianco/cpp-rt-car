    - payload copy ownership, caller-mutation isolation, exact digest and zero-length rules, short/long destination inspection, unused-byte non-observability, and no retained caller address
    - independent bounded multi-producer stress at zero, one, exact, full, one-over, busy, producer, payload, total-byte, sequence, generation, and arithmetic capacities without partial publication or overwrite
    - exact accepted/invalid/full/busy/stale/stopped/exhausted results, monotonic mailbox and producer sequences, complete publication visibility, deterministic counters, and abandoned-reservation handling
    - failed-finalize correction/retry, stop during producer activity, restart generation invalidation/reset, repeated lifecycle, destruction, and two-runtime handle/storage/counter isolation under ThreadSanitizer
    - graph/config/replay identity sensitivity for frozen mailbox semantics with exclusion of staged payload/arrival/occupancy state and exact MemoryPlan/control-ledger reconciliation
    - proof that step, periodic, mixed-rate dispatch, device completion, sampled I/O, checkpoint, replay, telemetry, watchdog, and stop apply no staged update and produce no M22 action in this batch
    - full M16/M17/M21 execution, deterministic replay, package inventory, exact C ABI, artifact-schema, support-matrix, release-contract, and disabled-path regression coverage
