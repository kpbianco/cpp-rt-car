acceptance:
  - The existing inactive reference-only path and mandatory-only active M16-03 path remain exact defaults. Append-only C++ tails add one copied optional-work shedding policy to RateExecutionPolicy, including a nonzero host policy version, positive consecutive-late and consecutive-on-time thresholds, and a bounded rate-telemetry capacity; pre-M16-04 aggregate prefixes and plans with no optional domain retain their exact behavior and compatibility identity. Zero telemetry capacity is valid and counts every publication attempt as an explicit drop.
  - Active finalization may now accept bounded optional CPU D0 domains with the existing positive budget/deadline and same-domain ordinary-dependency rules. Conservative admission still simulates every mandatory reference record only and must reject an infeasible mandatory schedule even if every optional domain were shed. Optional budgets remain untrusted planning inputs and are neither admitted capacity nor measured WCET.
  - "Every optional domain starts active. Optional domains are ordered without host timing, pointer, or container iteration: lower criticality is shed first, ties shed later registration first, and recovery reverses that exact order. Mandatory domains are never shed. An optional domain is rejected if it is a producer or consumer of an M16-02 channel, so shedding cannot create an absent, newer, or ambiguously aged cross-rate generation in this batch."
  - One mandatory domain release is the only shedding-policy observation unit. A pre-dispatch late mandatory decision increments the consecutive-late count and resets the on-time count; an on-time mandatory decision does the reverse. Reaching the configured late threshold sheds exactly one currently active optional domain, and reaching the configured on-time threshold recovers exactly one shed optional domain; the triggering counter resets after a transition. A terminal fail action records its failure but causes no later shedding or recovery transition.
  - A shed or recovered state transition becomes effective immediately after the triggering mandatory release is settled and therefore affects the next release in the existing total order, including a later registration at the same logical timestamp. An active optional release retains its configured bounded M16-03 late action, but optional lateness never drives the global shedding or recovery streaks. A shed optional release is consumed without callback, cross-rate transfer, backlog, or degradation and is reported distinctly from skip and hold.
  - Large windows and aggregate skip/hold prefixes update late/on-time streaks, shed state, recovery state, transition counts, and due dispositions with checked arithmetic. Processing and telemetry attempts are bounded by the fixed domain count, configured thresholds, and existing dispatch cap rather than by every omitted supercycle; no policy loop, backlog, retry, allocation, spill, or helper lane scales without an explicit finite bound.
  - StepResult and periodic summary tails append exact optional-due, optional-executed, shed-release, shed-transition, recovery-transition, currently-shed-domain, and policy-version fields. Existing due/executed/late/skip/hold/degrade/fail meanings remain unchanged, rejected counts stay exact, and cursor advancement remains unambiguous on callback, capacity, telemetry-loss, or terminal-failure paths.
  - M16-04 adds a separate C++ rate-action telemetry schema version 1 rather than changing global observability schema 2. Fixed-size records and fixed numeric action/reason/counter IDs carry the host policy version, runtime identity, frame, domain and first release sequence, logical and nominal release, exact contiguous release count, reference-record count, optionality, late state, disposition, transition before/after state, status, and degradation level. A range record may represent consecutive identical omitted or shed decisions; expanding its count reconstructs each covered release exactly.
  - The rate-action stream uses finalization-time fixed-capacity runtime-owned storage, monotonic record sequences, one nonblocking publication attempt, explicit overwrite/contention/zero-capacity loss accounting, runtime-bound cursors, and cumulative fixed-schema counters and gauges. Emission never waits, allocates, calls host code, performs I/O, or changes dispatch because a reader is slow. Inspection is a non-RT host operation and rejects an active step or periodic loop.
  - "Schema-1 numeric tables are exact: action IDs 0-6 are execute_on_time, execute_catch_up, skip, hold, execute_degraded, fail, and optional_shed; transition IDs 0-2 are none, shed, and recover; reason IDs 0-7 are on_time, deadline_late, already_shed, late_threshold, on_time_threshold, callback_failure, dispatch_capacity, and arithmetic_failure. The record optional flag distinguishes mandatory from optional execution, while transition fields represent shedding or recovery caused by the same triggering record."
  - "Rate counter IDs 0-19 are due_domain_releases, executed_reference_records, late_domain_releases, caught_up_domain_releases, skipped_domain_releases, held_domain_releases, degraded_domain_releases, failed_domain_releases, optional_due_domain_releases, optional_executed_domain_releases, shed_domain_releases, shed_transitions, recovery_transitions, records_emitted, records_overwritten, records_dropped, currently_shed_domains, policy_version, rejected_reference_records, and stale_reads; IDs 16-17 are gauges and all others are counters. Policy-version, trace-schema, record-size, counter-count, capacity, emitted/overwritten/dropped totals, and runtime identity are present in metadata; malformed or foreign cursors fail without advancing, and gaps are reported exactly rather than hidden or relabeled as complete action history."
  - Shedding policy fields, optional ordering, and policy version participate in active graph/replay identity. The existing canonical active checkpoint record transactionally retains late/on-time streaks, the exact optional-domain shed bitset/order state, and policy version beside the M16-03 cursor/fault/channel state; corruption or mismatch rejects before any live state changes. Checkpoint schema 1 and its generic record codec remain unchanged. Rate telemetry history, counters, and caller cursors are process-local observation state, are not checkpointed, and never affect callback or policy decisions.
  - Active D1, schema-1 input-log export/replay, and action-aware replay remain explicitly unsupported because current input records cannot encode nominal-time decisions or rate actions. Rate telemetry is evidence and observability, not an authenticated replay log, and M16-04 must not place data in reserved artifact bytes or silently claim schedule-independent reproduction.
  - Shedding state, checkpoint bytes, telemetry slots, counters, cursors, and policy metadata are allocated during configuration/finalization and counted exactly once inside rate_plan_bytes, the M15 runtime-control logical extent, and the existing six-row MemoryPlan equation. Active dispatch, optional omission/execution, transition, record emission, counter update, inspection, stop, and two-runtime concurrency preserve zero ordinary heap allocation and bounded operations after successful start.
  - Stable C ABI v8 with exactly 70 exports and its frozen fingerprint, SONAME 8, device ABI v1, runtime-profile schema 7 and its 25 keys, global observability schema 2 with trace IDs 1-14 and metric IDs 0-31, checkpoint/input-log schema 1 and codecs, default installed header/target inventory, compatibility aliases, release 1.2.1, support matrices, and Apache-2.0 remain unchanged. The C ABI cannot configure or inspect active rates and retains exact legacy behavior.
  - Target governance, current-state, handoff, roadmap, component contracts, release digest ledger, and retained M16-04 evidence describe only portable RT0 functional optional-work and versioned rate-action results. After all focused, full local, mandatory CI, and human gates pass, the target may mark M16/CAP-M16 functionally complete, but no mock, fake clock, declared budget, hosted runner, preflight, or document is physical hardware, HIL, field, worst-case latency, RT1, RT2, signing, release, deployment, or production evidence.
validation:
  local:
    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - cmake -S . -B build/agent-full -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_TESTS=ON -DRTFW_BUILD_EXPERIMENTAL=ON -DENABLE_RAPIDCHECK=ON -DSIM_SANITIZERS= -DSIM_WERROR=ON
    - cmake --build build/agent-full --parallel 2
    - ./build/agent-full/tests/simcore_tests --gtest_filter='RateShedding.*:RateTelemetry.*:RateDispatch.*Optional*:RateDispatch.*Shedding*:RateTimeline.*Optional*:HostRuntime.*RateTelemetry*:PeriodicRuntime.*RateTelemetry*:MemoryPlan.*RateTelemetry*:DeterminismReplay.*RateTelemetry*:Observability.*Rate*:TraceNoAlloc.*RateTelemetry*'
    - ctest --test-dir build/agent-full --output-on-failure -R 'm16_shedding_telemetry|m16_rate_dispatch|m16_rate_timeline|m16_cross_rate_data'
    - ./scripts/agent-verify.sh full
  focused_tests_to_add:
    - append-only policy/default construction and preferred/compatibility installed consumers, including unchanged inactive and mandatory-only identity and behavior
    - optional-domain validation, mandatory-only admission oracle, infeasible mandatory rejection, stable criticality/registration shed order, reverse recovery order, and optional cross-rate endpoint rejection
    - exact threshold boundary, streak reset, one-transition-per-trigger, immediate next-release effect at the same timestamp, terminal-fail precedence, and active optional late-action behavior under a fake clock
    - arithmetic aggregate handling across many supercycles with bounded domain work, exact summaries, no backlog, and no iteration proportional to omitted releases
    - version-1 record and counter numeric IDs, record/range field completeness, every action/reason mapping, exact range expansion, policy-version identity, and malformed enum/version/capacity rejection
    - nonblocking telemetry publication, overwrite/contention/zero-capacity loss, cursor first-window/gap/runtime binding, failed-read cursor transactionality, two-runtime isolation, and host inspection rejection during active execution
    - optional shed/recovery state checkpoint round trip plus valid-checksum semantic corruption, policy-version, bitset/order, threshold, and identity mismatch rejection with unchanged destination state
    - exact shedding/telemetry/checkpoint storage reconciliation inside rate-plan/runtime-control bytes and the six-row MemoryPlan, capacity rejection before provider calls, and zero post-start allocation across optional execute, shed, recover, late actions, loss, inspection, and stop
    - ThreadSanitizer coverage for active dispatcher, policy counters, telemetry producer/readers, cursor isolation, stop, failure, and two runtime instances without weakening permanent M15/M16 gates
    - permanent M14.1/M15/M16-01/M16-02/M16-03 lifecycle, cleanup, reference, selection/store, admission, late-action, checkpoint, package, schema-2 observability, no-allocation, determinism, and compatibility regressions
  required_ci:
    - Documentation contract workflow including quick-start, release-contract, frozen C ABI, exact SDK inventory, permanent M16-01 through M16-03 gates, and truthful M16-04/M16 completion claims
    - Linux GCC 11 and Clang 14 Debug and RelWithDebInfo, FMA on/off matrix with AddressSanitizer and UndefinedBehaviorSanitizer coverage of optional validation, shedding/recovery, range arithmetic, rate telemetry, checkpoint restore, and lifecycle
    - Windows Server 2022 MSVC v143 Debug and RelWithDebInfo matrix covering identical integer policy order/results, fixed record layout, source compatibility, and installed consumers
    - Unified executor GCC ThreadSanitizer job executing complete RateShedding, RateTelemetry, RateDispatch, active CrossRateData, cursor/two-runtime/failure/stop suites and permanent M15/M16 fresh-process gates
    - Determinism GCC and Clang FMA-on and FMA-off jobs plus artifact exchange proving unchanged legacy/reference-only/mandatory-active fixtures and explicit active D1/action-replay rejection
    - C and C++ embedding, add_subdirectory, installed-package, archive relocation, SDK header self-containment, compatibility aliases, exact 70-export C ABI consumers, and existing autotune/scaling smoke jobs
    - Existing no-allocation, bounded-memory-plan/control-ledger, M14.1 recovery, M15 rollback, all M16 timeline/selection/store/admission/late-action, sanitizer, fuzz-smoke, global observability schema-2, documentation, release-contract, and package gates; no hosted timing or controlled-hardware claim is authorized
  manual:
    - Human review must approve the append-only C++ policy/summary/telemetry shape, mandatory-only admission boundary, exact shedding and recovery ordering/hysteresis, aggregate arithmetic, terminal-fail precedence, checkpoint state, active replay rejection, and preservation of C ABI v8/device ABI v1/global observability and artifact schemas.
    - Human concurrency and safety review must confirm bounded nonblocking telemetry publication/readback, exact loss and cursor semantics, no callback for shed work, no mandatory omission, no cross-rate optional endpoint, state/identity/accounting completeness, post-start allocation freedom, and checked lifecycle/rollback behavior.
    - Performance review is limited to deterministic counts and existing hosted smoke jobs. Any measured latency threshold, RT1/RT2 promotion, controlled-hardware regression, physical recovery, or support-matrix change requires a separately approved named tuple and retained raw evidence.
risk:
  class: high
  hazards:
    - ambiguous streak boundaries, same-time transition effect, or priority ties can make shedding and recovery depend on incidental execution order
    - optional work can accidentally enter mandatory admission, or an infeasible mandatory schedule can be hidden behind a policy that sheds everything
    - shedding a channel endpoint can expose a missing, old, newer, or falsely fresh generation to mandatory work
    - large elapsed windows can turn threshold processing or telemetry emission into unbounded per-release work or overflow counters and cursor state
    - telemetry loss can be mistaken for absence of an action, or a run-length record can encode a range that crosses a different disposition or transition
    - checkpoint restore can accept a different policy version/order or partially restore streak and shed state before rejecting malformed input
    - telemetry or counter atomics can race with dispatch, readers, stop, or another Runtime, or can introduce false sharing and post-start allocation
    - append-only C++ declarations or new logical storage can break source consumers, exact MemoryPlan accounting, package isolation, or M16-03 behavior while C ABI tests stay green
    - functional fake-clock shedding and versioned records can be overstated as measured overload recovery, latency, physical hardware, RT1, or RT2 evidence
  stop_conditions:
    - the exact baseline commit is unavailable, dirty, or lacks merged M16-03 commit 9c350ab5b66e37e90aef7e96939c71df04101b27 and all retained M15/M16 evidence
    - target contracts at the exact baseline contradict mandatory-only admission, CPU-only optional domains, criticality/registration ordering, threshold hysteresis, or a separate C++ rate-action telemetry schema and require a different product decision
    - implementation requires changing stable C ABI v8, SONAME 8, device ABI v1, runtime-profile schema 7/25 keys, global observability schema 2/IDs, checkpoint/input-log schema numbers or codecs, installed header/target inventory, support matrices, release version, or license
    - optional correctness requires a cross-rate optional endpoint, device phase, cross-domain ordinary dependency, callback preemption, or silent mandatory release omission in this batch
    - shedding/recovery cannot remain deterministic and bounded under aggregate elapsed windows without iteration proportional to unbounded omitted releases, unbounded backlog, retry, allocation, blocking, spill, or hidden threads
    - versioned rate-action records cannot represent every disposition and transition exactly, including loss and range boundaries, within a fixed-capacity nonblocking runtime-owned stream
    - policy/checkpoint state cannot be represented canonically and accounted exactly without changing schema-1 encoding or allowing partial restore
    - deterministic functional tests require timing sleeps/tolerances, root privilege, fixed topology, physical CUDA or FPGA/XDMA hardware, controlled timing hosts, secrets, signing, release, deployment, or production access
    - a required source, test, workflow, documentation, governance, or evidence change falls outside allowed paths or enters a forbidden path
rollback:
  strategy: Revert the append-only optional-work/shedding policy and summaries, deterministic policy state machine, versioned rate-action trace/counters, checkpoint and accounting integration, tests/CI, documentation/governance, release digests, and retained M16-04 evidence as one batch. Before discarding a running integration, require existing checked stop to quiesce callbacks and every device/lane/stack/memory owner. The exact M16-03 mandatory-only active path and M16-01/M16-02 reference-only path remain the fallback; no data migration, persistent host setting, support promotion, release, or deployment rollback is authorized.
  data_migration: none
  release_action: Do not publish a release, promote a support/qualification tuple, alter hardware or RT records, or mark M16/CAP-M16 complete until all required focused, full local, mandatory CI, and human gates pass and retained evidence supports that state.
evidence:
  output:
    - docs/evidence/M16-04-<date>.md
    - exact baseline, changed files, commands, exit codes, focused test counts, required CI run/check identifiers, and human review result
    - public optional-work/shedding policy with defaults, policy version, thresholds, bounds, ordering, source compatibility, identity, and every rejected configuration
    - mandatory-only admission inputs/results plus exact optional execute, late, shed, recovery, same-time, threshold, aggregate-window, terminal-fail, summary, and cursor outcomes
    - rate-action schema and fixed ID tables, normalized record/range and counter examples for every action/reason, loss/cursor behavior, policy-version metadata, and two-runtime isolation
    - checkpoint state layout and round trip/rejection evidence for streak, shed order/bitset, policy version, and unchanged checkpoint/input-log codecs plus explicit active D1/action-replay boundary
    - policy/telemetry/checkpoint storage reconciliation inside rate-plan/runtime-control bytes and MemoryPlan, post-start allocation proof, ThreadSanitizer results, and executor/lifecycle/cleanup behavior
    - C++ source, C ABI/device ABI/package/profile/global-observability/artifact/support/release/license compatibility status plus changed and preserved invariants
    - residual risks and all unperformed controlled performance, privileged native, physical shedding/recovery, CUDA, FPGA/XDMA, HIL, field, latency, thermal, endurance, RT1, RT2, signing, release, staging, deployment, and production validation
  claim_boundary: Evidence may establish static, unit, independent integer-policy, fake-clock shedding/recovery, synthetic fixed-stream concurrency/loss, sanitizer, checkpoint-state, package, bounded-memory/no-allocation, and portable RT0 functional telemetry behavior only. Declared budget/WCET values are untrusted inputs, not measurements or deadline guarantees; records observe runtime decisions but are not authenticated or an action-replay format; and mocks, fixtures, hosted CI, preflight, or documentation do not establish physical hardware, HIL, field performance, worst-case latency, RT1, RT2, signing, release, deployment, or production readiness.
