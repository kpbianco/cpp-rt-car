  focused_tests_to_add:
    - transactional descriptor validation for direction, channel, encoding, checked geometry, scale, units/calibration, rate, clock/trigger/timestamp domains, policies, initial/safe frames, exact payload endpoint, access/coherency, envelope, strides, capacity, overlap, and correction/retry
    - immutable direct channel/release/execution/ring slices, registration-order canonicalization, graph identity sensitivity, exact MemoryPlan accounting, and no active full-registry scans
    - sampled input terminal-success publication with exact sequence, release/batch generation, sample count/interval, status, timestamp, clock/trigger, calibration, checksum, and slot correlation
    - output selection and deterministic encoding for first-cycle, same-cycle, prior-cycle wrap, equal-time tie, inclusive maximum-age boundary, held/fresh/stale, skipped producer, and sequence/generation exhaustion
    - explicit stale, underrun, and overrun policies at zero, exact, and one-over capacity, proving no owned-slot overwrite and no publication after partial, malformed, rejected, failed, timed-out, canceled, lost, quarantined, skipped, shed, or late work
    - startup-safe acknowledgement before active output, normal stop and failure-safe ordering, duplicate safe requests, safe-work isolation, bounded cancellation/drain, unacknowledged safe state remaining unknown, and retryable checked cleanup
    - public loopback HAL-v2 lifecycle, exact paired-channel transfer, injected logical clock/trigger/completion identity, fixed storage, deterministic faults, reset/restart, multiple instances, and no post-start allocation or hidden thread
    - installed loopback consumer plant-to-sensor-to-controller-to-actuator flow across three rates with scaling/calibration, sample/hold, trigger, wrap, backpressure, safe output, faults, and ordered shutdown
    - ThreadSanitizer coverage of producer/backend/consumer, ring claim/retirement, safe output versus active completion, stop/cancel/late completion, and two Runtime instances
    - unchanged CPU-only M16, ordinary M17/HAL-v2, M21-02 channel-free, M21-03 non-sampled payload, checkpoint/replay/rate-action/observability schemas, CUDA/XDMA candidates, C ABI/package inventory, and prior evidence
  required_ci:
    - Documentation contract workflow including truthful M21-04 portable sampled-I/O/loopback-only claims, release contract, frozen C ABI, additive loopback header inventory, and unchanged support matrices
    - Portable static analysis source manifest includes every compiled runtime source, including sampled_io.cpp and loopback_backend.cpp, with no unreviewed compile-database entries
    - Linux GCC 11 and Clang 14 Debug and RelWithDebInfo, FMA on/off matrix with AddressSanitizer and UndefinedBehaviorSanitizer coverage of descriptor admission, frame publication, ring policies, safe-state ordering, loopback lifecycle, capacity, and compatibility
    - Windows Server 2022 MSVC v143 Debug and RelWithDebInfo matrix producing identical descriptor, frame, policy, safety, graph-identity, and accounting results and passing installed loopback consumers
    - Unified executor GCC ThreadSanitizer job covering sampled producer/backend/consumer ownership, ring retirement/reuse, safe-state work versus active completion, concurrent checked stop, late completion, and two Runtime instances without races
    - Determinism GCC/Clang FMA-on/off and artifact exchange proving unchanged prior fixtures plus equivalent sampled sequences, selected generation, status, clock/trigger/timestamp/calibration identity, freshness/held policy, safe transitions, and payload checksums for the loopback backend
    - C and C++ embedding, add_subdirectory, installed-package, archive relocation, SDK header self-containment, compatibility aliases, exact 70-export C ABI consumers, loopback consumer, and existing portable assurance/autotune/scaling smoke jobs
    - Existing M16 cross-rate/no-allocation/rate/replay gates, M17 memory/batch/timeline/vendor gates, and M21-01 through M21-03 gates; no M21-05 replay closure, physical-device, controlled-timing, electrical, or performance threshold is authorized
  manual:
    - Human review must confirm every sampled channel resolves one exact copied payload envelope, ring/execution slots cannot alias while owned, frame publication follows correlated terminal success, and each stale/under/overrun result follows the frozen policy rather than arrival order.
    - The reviewer must confirm startup/failure/shutdown safe frames are exact copied data, active admission cannot precede startup-safe acknowledgement, unacknowledged safe state remains unknown, the public loopback remains bounded and package-consumable, and fake loopback evidence is not described as physical DAC/DAQ/CAN/IIO/XDMA/CUDA, electrical, HIL, RT1, or RT2 evidence.
risk:
  class: high
  hazards:
    - an ambiguous format, stride, scale, units, calibration, clock, or trigger identity can reinterpret bytes or timestamps and drive the wrong logical actuator value
    - unchecked ring/execution-slot arithmetic or reuse can overwrite samples still owned by a backend or consumer
    - publishing at submit or partial capture can expose malformed, failed, stale, or wrong-generation sensor data
    - permissive hold/substitute behavior can silently mask stale input, underrun, overrun, or failed output
    - ordering safe output after backend stop, or treating enqueue as acknowledgement, can leave output state unknown while software reports success
    - callback, backend completion, consumer selection, safe-state work, stop, and slot retirement can race across generations
    - loopback success can be mislabeled as physical timing, trigger, electrical scaling, DAC/DAQ/CAN/IIO compatibility, HIL, or RT qualification
  stop_conditions:
    - the exact target baseline is unavailable, dirty, or lacks merged M21-03 evidence and device payload publication semantics
    - implementation requires changing C ABI v8, SONAME 8, device ABI v1, extension ABI v1, HAL version contracts, Runtime statuses, artifact/runtime schemas, support matrices, qualification state, release version, license, or prior evidence
    - a sampled channel cannot resolve to one exact copied pre-registered host-visible coherent M21-03 payload endpoint with checked format, geometry, ring, and execution-slot ownership
    - startup/failure/shutdown safe output cannot be distinguished from active work, dispatched through the existing backend lane, and correlated to terminal acknowledgement without unbounded wait or a false safety claim
    - stale, overrun, underrun, sequence, timestamp, clock/trigger, and calibration behavior cannot be deterministic without arrival-order dependence, implicit fallback, or unbounded history
    - implementation requires a vendor adapter, physical clock/trigger or electrical behavior, replay/checkpoint or telemetry schema changes, overload/watchdog closure, M21-05 behavior, benchmark thresholds, external-process transport, hot reload, CUDA physics, golden demo, or another unfixed product decision
    - credible validation requires timing sleeps/tolerances, a physical CUDA/XDMA/DAC/DAQ/CAN/IIO device, privileged or controlled host, Unreal, secrets, signing, release, deployment, or production access
    - any required source, test, workflow, documentation, governance, or evidence change falls outside allowed paths or enters a forbidden path
    - target contracts at the exact baseline contradict this sampled-I/O/loopback-only vertical or require weakening a deterministic, sanitizer, no-allocation, compatibility, or release gate
rollback:
  strategy: Revert the additive sampled descriptors/metadata and loopback header, compiled channel/release/ring/safety slices, initial/safe-frame storage, Runtime sampled capture/materialization and safe-state ordering, loopback backend, installed consumer, tests/CI, documentation, governance synchronization, release-contract digest updates, and M21-04 evidence as one batch. Restore the M21-03 CPU/device payload-only behavior while preserving active device dispatch/completion and ordinary HAL-v2 backends.
evidence:
  output:
    - docs/evidence/M21-04-<date>.md
    - exact control and target baselines, changed files, commands, exit codes, focused test counts, required CI run/check identifiers, and human review result
    - public sampled descriptor/frame/policy and loopback shapes, copied payload-envelope mapping, sample geometry, rate/clock/trigger/timestamp/calibration identities, fixed ring ownership, capacities, defaults, lifetime, and deferred replay/telemetry behavior
    - deterministic input capture, output selection/encoding, frame publication, ring retirement, stale/underrun/overrun decisions, safe startup, failure, shutdown, and acknowledgement order across wrap, overlap, malformed, timeout, cancellation, loss, and stop cases
    - sequence/release/batch/status/timestamp/clock/trigger/calibration/checksum/freshness proof for stale, duplicate, foreign, malformed, late, canceled, skipped, shed, failed, terminal, initial, held, and safe frames with exact publication results
    - no-allocation/direct-index/bounded-copy evidence, exact MemoryPlan reconciliation, pre-registered range ownership, public loopback package/relocation results, multiple-instance isolation, retryable cleanup, and unchanged prior execution
    - exact C ABI v8 70-export fingerprint/SONAME, device ABI v1, HAL/extension contracts, artifact/runtime schema, installed target/header/alias inventory, support/qualification, license, and prior-evidence preservation results
    - residual risks and every unperformed M21-05 overload/replay/telemetry/conformance, controlled performance, physical CUDA/XDMA/DAC/DAQ/CAN/IIO, trigger, clock, electrical, calibration, HIL, field, latency, thermal, endurance, RT1, RT2, hot reload, Unreal, signing, publication, release, deployment, and production validation
  claim_boundary: Evidence may establish bounded sampled-I/O descriptors, exact frame and ring ownership, deterministic stale/overrun/underrun and safe-output state transitions, package compatibility, and portable RT0 fake loopback static/unit/property/sanitizer behavior only. It does not establish physical sample-clock or trigger accuracy, electrical scaling or calibration correctness, DAC/DAQ/CAN/IIO/XDMA/CUDA compatibility, replay/telemetry closure, controlled latency, HIL, field evidence, RT1, RT2, Unreal integration, support promotion, signing, publication, release, deployment, or production readiness.
