    - Documentation contract workflow including truthful M22-01 staging-only claims, unchanged runtime/artifact schemas and stable ABIs, exact SDK inventory/support matrices, release contract, and static source manifest
    - Linux GCC 11 and Clang 14 Debug and RelWithDebInfo matrix with AddressSanitizer and UndefinedBehaviorSanitizer coverage of descriptors, structural validation, ownership, capacity, arithmetic, publication, lifecycle, identity, accounting, and compatibility
    - Windows Server 2022 MSVC v143 Debug and RelWithDebInfo matrix producing identical fixed record layout, validation, sequence, capacity, identity, and package-consumer results
    - Unified executor GCC ThreadSanitizer job covering concurrent registered producers, full/busy/stop races, publication visibility, stale handles, restart, and two Runtime instances without races
    - Determinism GCC/Clang FMA-on/off and artifact exchange proving unchanged existing fixtures, stable finalized M22 policy identity, and explicit exclusion of post-finalization arrival order and payload bytes
    - C and C++ embedding, add_subdirectory, installed-package, archive relocation, SDK header self-containment, compatibility aliases, exact 70-export C ABI consumers, and the new live-control installed consumer
    - Clang 14 portable static/fuzz/artifact assurance includes every compiled M22-01 source and malformed descriptor/extent mutations; blocking dependency review, SBOM/provenance, autotune, scaling, and package relocation remain green
    - Existing M7 replay/checkpoint, M16 rate, M17 HAL/device, M21 mixed-rate/payload/sampled/replay, no-allocation, sanitizer, and multiple-instance gates all pass; no update commit, hardware, controlled timing, Unreal, release, or deployment workflow is authorized
  manual:
    - Human review must confirm the additive public API has one copied canonical update envelope, exact per-Runtime ownership/generation, fixed payload storage, bounded producer admission, complete-before-visible publication, explicit contention/full/exhaustion results, and no callback, parsing, I/O, or hidden dynamic storage.
    - The reviewer must confirm M22-01 never applies, schedules, rolls back, checkpoints, replays, or emits telemetry for an update; does not reuse the filesystem helper or experimental seqlock; and does not describe staging, hosted concurrency, or deterministic inspection as exact-boundary commit, production hot reload, RT1/RT2, hardware, or Unreal evidence.
risk:
  class: high
  hazards:
    - a descriptor or payload published before its copy is complete can expose torn configuration bytes to the later boundary consumer
    - a stale producer handle or missing Runtime/configuration generation can apply an update to the wrong instance or restart generation
    - an unbounded retry loop, mutex, heap fallback, producer registry scan, or caller-owned payload can violate the RT-adjacent boundedness contract
    - concurrent reservation failure can leak a slot, create a sequence gap that looks accepted, or make mailbox fullness arrival-order dependent without an explicit result
    - ambiguous frame/rate-release target fields can force M22-02 to guess late, missed, replacement, or ordering semantics
    - including staged payload or arrival state in finalized graph identity can make compatibility depend on scheduling; excluding frozen policy can admit incompatible replay/checkpoint state later
    - reusing the existing filesystem hot-reload helper or SimCore seqlock can silently promote experimental, allocating, sleep-based, or repository-private behavior into the supported Runtime
    - schema/mailbox scaffolding can be mislabeled as transactional apply, rollback, replay, production live control, executable hot reload, or safety/RT qualification
  stop_conditions:
    - the exact target baseline is unavailable, dirty, or lacks merged M21-05 retained evidence and stable portable mixed-rate closure
    - implementation requires changing C ABI v8, SONAME 8, device ABI v1, extension ABI v1, HAL tables, Runtime status values, runtime-profile schema, existing artifact/telemetry schemas, installed inventory, support matrices, qualification state, release version, license, or prior evidence
    - one fixed canonical envelope cannot represent exact runtime/configuration generation, frame or rate-release target, update kind, producer sequence, payload extent, and digest without a pointer, dynamic string, or unbounded payload
    - concurrent producer admission cannot remain fixed-capacity, complete-before-visible, nonblocking with bounded attempts, generation safe, exactly accounted, and isolated per Runtime
    - target validation would require parsing application payloads, invoking user/authentication callbacks, reading files/network, loading executable code, consulting wall-clock timing, or mutating running state
    - implementation requires M22-02 boundary commit/late/replacement behavior, M22-03 rollback/checkpoint/replay/telemetry, M22-04 typed examples/stress closure, M23 benchmarks, M24 CUDA physics, M25 SDK work, M26 golden demo, Unreal, signing, publication, release, deployment, or production access
    - credible validation requires timing sleeps/tolerances, physical CUDA/XDMA/DAC/DAQ/CAN/IIO hardware, privileged or controlled hosts, secrets, signing keys, or a support/qualification/promotion decision
    - any required source, test, workflow, documentation, governance, or evidence change falls outside allowed paths or enters a forbidden path
    - target contracts at the exact baseline contradict the schema/mailbox-only vertical or repair would require weakening deterministic, sanitizer, no-allocation, compatibility, parser, package, or release gates
rollback:
  strategy: Revert the additive live-control policy, descriptors, producer/mailbox handles, Runtime-owned fixed slots and payload storage, structural validator and inspection API, identity/accounting integration, tests/CI, documentation, governance synchronization, release-contract digest updates, and M22-01 evidence as one batch. Restore the exact merged M21-05 behavior; no update was ever applied, no checkpoint/replay/telemetry schema or persistent data was migrated, and no physical, support, release, or deployment state was created.
  data_migration: none
  release_action: Do not publish a release, promote a support or qualification tuple, alter hardware/RT records, or mark M22/CAP-M22 complete from this batch.
evidence:
  output:
    - docs/evidence/M22-01-<date>.md
    - exact control and target baselines, changed files, commands, exit codes, focused test counts, required CI run/check identifiers, and human review result
    - public policy/descriptor/handle shapes with fixed sizes, closed tables, defaults, capacities, target identity, generation, payload extent/digest, reserved fields, and deferred behavior
    - producer/mailbox ownership, reservation/publication state machine, exact accepted/rejected sequences and counters, capacity/contention/exhaustion results, copied payload ownership, and lifecycle/reset behavior
    - structural validation matrix for every malformed, foreign, stale, wrong-kind, noncanonical, overflowed, contradictory, and out-of-plan descriptor/payload combination
    - identity comparisons and MemoryPlan/control-ledger reconciliation for every frozen semantic field, plus exclusion of staged payload/arrival/occupancy state and unchanged disabled-path identities
    - proof of zero update application, callback/parser/authentication/file/network/vendor action, unchanged step/periodic/mixed-rate/checkpoint/replay/telemetry behavior, two-runtime isolation, retryable failure, and post-start no-allocation results
    - exact C ABI v8 70-export fingerprint/SONAME, device ABI v1, HAL/extension contracts, existing artifact/runtime schemas, installed package/header/alias inventory, support/qualification, license, and prior-evidence preservation results
    - residual risks and every unperformed M22-02 commit, M22-03 rollback/replay/checkpoint/telemetry, M22-04 SDK/stress, executable/Unreal hot reload, physical hardware, controlled timing, HIL, RT1, RT2, signing, publication, release, deployment, and production validation
  claim_boundary: Evidence may establish additive C++ live-control schemas, fixed-capacity per-Runtime producer/mailbox ownership, canonical copied payload staging, generation-safe bounded nonblocking admission, deterministic inspection, exact identity/accounting, package compatibility, and portable RT0 static/unit/property/sanitizer behavior only. It does not establish exact-boundary update application, late/missed/replacement semantics, rollback, checkpoint/replay/telemetry integration, executable or Unreal hot reload, physical control, HIL, controlled latency, RT1, RT2, support promotion, signing, publication, release, deployment, or production readiness.
