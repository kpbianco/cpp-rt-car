    - exact baseline, changed files, commands, exit codes, focused test counts, required CI run/check identifiers, and human review result
    - public extension, command, batch, timeline, completion, Runtime phase, and thread-role definitions with exact versions, sizes, defaults, enum values, capacities, ownership, source compatibility, exception behavior, and rejected-input rules
    - batch validation tables for dispatch/copy/flush/invalidate order, logical-memory translation, required synchronization discharge, timeline wait/signal acceptance, queue ownership, early completion, cancellation, timeout, loss/reset, and whole-completion publication
    - per-backend submission-lane creation, startup barrier, policy apply/readback, backend-call thread identity, bounded enqueue/dequeue counts, blocked-stop release, reverse join, failure rollback, retryable cleanup, and two-runtime isolation evidence
    - exact command/timeline/queue/lane storage and runtime-stack reconciliation inside device control, the M15 logical ledger, and the unchanged six-row MemoryPlan, including backend-private exclusions and post-start no-allocation/ThreadSanitizer results
    - proof that adapted-v1, core-only-v2, and memory-only-v2 backends retain exact M17-02 behavior, identity, thread inventory, and no invented capability, plus unchanged mock/CUDA/XDMA-v1 regression results
