  focused_tests_to_add:
    - exact vendor table versions, preserved version-1 aggregate prefixes, new defaults/reserved tails, stable opcode encodings, capacity boundaries, LP64/LLP64 layout diagnostics, and installed old-source consumers
    - native-v2 registration table ownership, copied Runtime discovery, duplicate-object/path rejection, device-ABI-v1 versus native-v2 selection, freeze, correction after transactional failure, and two-Runtime isolation
    - CUDA staged-domain discovery and registration, host/device mirror and pre-bound address handling, explicit copy ordering, name/token/access/range mismatch, uncertain host-registration or device-allocation cleanup, and no physical pinning/coherency inference
    - CUDA graph registry capacity, unique stable identifiers, up to eight copied bindings, caller-owned lifetime, configuration freeze, unknown graph/buffer rejection, and proof that Runtime never creates, updates, or destroys a graph
    - ordered CUDA copy-graph-copy and kernel/graph batches on one command stream, same-backend signal order, one event per accepted batch, early completion, saturation, timeout quarantine, launch/event failure, context loss, reset refusal, drain, reverse shutdown retry, and exact-once completion
    - XDMA control opcode construction and rejection for unaligned/overflowed/out-of-aperture offsets, malformed four-byte reads/writes, unknown operations, wrong access or host result spans, and proof that no control driver call occurs before full validation
    - XDMA user-event index/capacity, finite remaining-time conversion, not-ready/timeout/success/error/loss results, event/read races, stop wakeup, close/reopen failure, queued versus running cancellation, and no invented interrupt-latency or cancel guarantee
    - Linux XDMA path copying and bounded open/close ownership for H2C, C2H, optional user BAR, up to 16 event nodes, and stop-wakeup resources, with short I/O, EINTR, poll wake, partial initialization, first-error retention, and retryable cleanup
    - complete native CUDA/XDMA frames, queue saturation, concurrent submit/poll/stop, two-runtime isolation, fixed call counts, backend-call thread identity, and allocation instrumentation after successful start
    - exact Runtime-owned versus backend-private control/queue/event/graph/worker byte accounting, unchanged six-row MemoryPlan and runtime-stack inventory, and truthful existing external XDMA worker declarations
    - conditional identity separation for native vendor capabilities and stable graph/control/event opcodes plus byte-exact M17-03 adapted-v1 behavior and identity when native registration is unused
    - preferred/compatibility default consumers plus opt-in CUDA Driver API and Linux XDMA consumers, exact SDK inventory, C/C++ shared/static consumers, frozen C/device ABI, warning isolation, and pure C
  required_ci:
    - Documentation contract workflow covering exact native-v2 CUDA/XDMA capability and ownership boundaries, stable vendor opcodes, Graph/MMIO/event safety, quick start, release contract, frozen C/device ABI, SDK inventory, and all permanent M15/M16/M17 gates
    - Linux GCC 11 and Clang 14 Debug and RelWithDebInfo FMA on/off matrix with AddressSanitizer and UndefinedBehaviorSanitizer coverage of both native vendor registrations, malformed tables/commands, graph bindings, staged copies, MMIO/events, saturation, stop/reset/loss, identity, accounting, and cleanup retry
    - Windows Server 2022 MSVC v143 Debug and RelWithDebInfo matrix covering portable fake CUDA/XDMA native-v2 tables, exact opcode/layout/default diagnostics, source compatibility, no Linux-path leakage, and default installed consumers
    - Unified executor GCC ThreadSanitizer job executing complete VendorHalV2, CUDA Graph/fake-driver, XDMA transfer/control/event, CommandBatch, HeterogeneousMemory, HAL-v2/v1-adapter, submission/completion-lane, blocked-stop, two-runtime, and permanent M15/M16 processes without weaker exclusions or timeouts
    - Determinism GCC and Clang FMA-on/FMA-off jobs plus artifact exchange proving byte-exact M17-03 device-ABI-v1 identity when native vendor paths are unused and deterministic separation for declared graph/control/event commands
    - C and C++ embedding, add_subdirectory, default installed package, archive relocation, SDK header self-containment, compatibility aliases, exact 70-export C ABI consumers, dependency review, SBOM, and autotune/scaling smoke gates
    - Node-free Linux `RTFW_ENABLE_XDMA=ON` compile/install/consumer validation for the user-BAR/event adapter and a CUDA-toolkit compile/install/consumer gate for the production `cuGraphLaunch` adapter; these are build/package checks and must not access a device or be reported as hardware evidence
    - Existing CUDA and XDMA qualification workflows remain manually dispatched evidence-only workflows. Any workflow edits must preserve explicit inputs, self-hosted labels, raw-evidence validation, source binding, no support-matrix mutation, and no claim that a schema/build/package pass qualifies hardware
    - Existing no-allocation, bounded-memory/control-ledger, M14.1 recovery, M15 rollback, M16 timeline/data/dispatch/shedding/telemetry, M17 core/memory/command compatibility, sanitizer, fuzz-smoke, observability-schema, release-contract, package, CUDA fake-driver, and XDMA portable gates
  manual:
    - Human public-API and compatibility review must approve the additive vendor table/version strategy, exact aggregate prefixes/opcodes/records/capacities, installed-package shape, conditional identity, and preservation of C ABI v8, device ABI v1, all three HAL extension versions, Runtime statuses, schemas, release, support, and license boundaries.
    - Human CUDA/XDMA concurrency, lifetime, and safety review must confirm graph/stream/event/buffer ownership, staged-copy order, accepted-before-complete publication, MMIO aperture and access validation, event-stop wakeup, no executor-worker vendor calls, fixed storage, quarantine, reverse retryable cleanup, and no detached work or false release.
    - A maintainer must review every physical XDMA control write or event-node test plan before it is run because the user BAR may contain destructive design-specific registers. Such a run is not required for this software batch and cannot promote a support tuple.
    - Promotion review is deferred. M17-05 owns the combined staged sample; M18 owns named CUDA/XDMA/combined hardware and RT qualification. Cross-backend timelines, direct peer DMA, device-rate execution, support-matrix changes, release, and deployment require separate approval.
risk:
  class: high
  hazards:
    - a caller-owned graph executable, context, stream, module, device allocation, or bound host span can be destroyed while an accepted batch or quarantined CUDA operation still references it
    - a graph identifier or buffer binding can be omitted from compatibility identity, allowing a different graph or allocation contract to consume an otherwise compatible artifact
    - multi-stream or out-of-order submission can satisfy a Runtime timeline before the CUDA event that physically protects its graph and staged memory has completed
    - a CUDA call or XDMA character-device call can block beyond its declared timeout, making stop wait while ownership must remain retained
    - an error after partial CUDA command enqueue can publish a false batch completion, reuse an event, or release a staged buffer before the stream is drained
    - an unchecked XDMA user-BAR write can corrupt device state, trigger destructive hardware behavior, or target the wrong PCI function/bitstream
    - event-index, timeout conversion, poll wakeup, short-read, EINTR, close, or re-open races can lose an event, hang shutdown, leak a descriptor, or fabricate cancellation
    - extending vendor callback/config records can break positional source consumers or route version-1 drivers into unavailable Graph/control callbacks
    - backend-private graph/queue/event/worker bytes can be counted as Runtime-owned, omitted from declarations, allocated after start, or shared across Runtime instances
    - fake CUDA Graph and XDMA MMIO/event drivers, compile-only toolkit checks, hosted CI, or documentation can be overstated as physical control, interrupt, latency, HIL, or RT evidence
  stop_conditions:
    - the exact baseline commit is unavailable, dirty, or lacks merged M17-03 commit `0d1c95a4e859c9136b28b912735610cd58016e95` and every retained M15/M16/M17-01/M17-02/M17-03 evidence record
    - target contracts or actual M17-03 code contradict the vendor-only native-v2 adapter, pre-instantiated CUDA Graph, stable opcode, bounded XDMA control/event, ownership, or isolated-lane model and require a new product/architecture decision
    - implementation requires changing stable C ABI v8, SONAME 8, any device-ABI-v1 declaration/layout/value, HAL core v2, memory/topology extension v1, command/timeline extension v1, Runtime status values, runtime-profile schema 7/25 keys, observability/rate/artifact schemas or IDs, installed header/target inventory, support matrices, release version, or license
    - correct implementation requires modifying the generic HAL, Runtime, device manager, command validator, heterogeneous-memory, executor, policy, accounting, or telemetry implementation instead of fitting the accepted M17-01 through M17-03 extension contracts
    - CUDA Graph capture, instantiate, update, clone, upload, destruction, dynamic allocation, an unbounded registry, pointer-derived identity, or Runtime ownership is required rather than configuration-time registration of a caller-owned executable
    - graph selection, XDMA control offset/access, or event index cannot be represented by stable declaration-visible opcodes without changing the protected generic command/timeline contract or hashing mutable native values
    - a vendor callback can execute on an executor worker, or a blocked submission/event wait cannot retain ownership and respond to checked stop without detaching work, inventing completion, clearing a live handle, or weakening the finite timeout/stop contract
    - XDMA MMIO cannot be bounded to an explicit configured aperture and exact access/width, or physical execution is required to make portable malformed/failure-injected tests pass
    - existing device-ABI-v1 CUDA/XDMA behavior, identity, package consumers, worker topology, timeout quarantine, or cleanup retry cannot remain exact when the native-v2 accessors are unused
    - the combined CPU-GPU-FPGA-CPU sample, cross-backend timeline, device-rate dispatch, direct peer DMA, plugin/factory loading, support-matrix promotion, hardware qualification, signing, release, deployment, or production access becomes necessary to satisfy acceptance
    - deterministic validation requires fixed physical CUDA/FPGA hardware, device nodes, root privilege, a particular PCI/IRQ/IOMMU topology, destructive MMIO, secrets, timing tolerances, controlled hardware, or post-selected thresholds
    - a required source, test, workflow, documentation, governance, or evidence change falls outside allowed paths or enters a forbidden path
rollback:
