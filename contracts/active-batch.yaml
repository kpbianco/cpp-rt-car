    - git status --short --branch
    - test "$(git rev-parse HEAD)" = "201decf9384220d713ff90f7eb12ac3ecc4ebc49"
    - git merge-base --is-ancestor 201decf9384220d713ff90f7eb12ac3ecc4ebc49 HEAD
    - test -f docs/evidence/M22-01-2026-09-01.md
    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
