schema_version: 1
batch:
  id: M15-04
  title: Close exact memory accounting and compatibility gates
  goal: Add an inspectable exact-once C++ accounting snapshot over the existing M15 inventory and live policy reports, reconcile provider commitments, runtime-owned stacks, backend storage, registered spans, residency, lock, pin, and fallback without changing the M4 budget equation or stable ABIs, and close the M15 compatibility and validation boundary.
