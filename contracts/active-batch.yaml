schema_version: 1
batch:
  id: M15-02
  title: Apply, verify, and roll back runtime thread policy transactionally
  goal: Apply and verify supported thread policy for the frame lane and every runtime-owned executor, watchdog, and device-service thread before callbacks can execute, retain truthful portable and externally owned reports, and roll back partial startup without adding memory-provider behavior or changing stable ABIs.
