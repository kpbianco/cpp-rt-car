name: XDMA qualification

on:
  workflow_dispatch:
    inputs:
      pci_bdf:
        description: PCI BDF for the declared XDMA function
        required: true
        type: string
      driver_id:
        description: Exact dma_ip_drivers revision and module build identifier
        required: true
        type: string
      bitstream_id:
        description: Immutable bitstream identifier or SHA-256
        required: true
        type: string
      h2c_path:
        description: H2C AXI-MM character device
        required: true
        default: /dev/xdma0_h2c_0
        type: string
      c2h_path:
        description: C2H AXI-MM character device
        required: true
        default: /dev/xdma0_c2h_0
        type: string
      device_offset:
        description: Decimal AXI-MM byte address
        required: true
        default: "0"
        type: string
      bytes:
        description: Page-multiple transfer size
        required: true
        default: "4096"
        type: string
      warmup:
        description: Round trips discarded before measurement
        required: true
        default: "1000"
        type: string
      iterations:
        description: Measured round trips
        required: true
        default: "10000"
        type: string

permissions:
  contents: read

jobs:
  xdma-linux:
    name: XDMA hardware evidence
    runs-on: [self-hosted, linux, x64, xdma]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Configure XDMA candidate
        run: |
          cmake -S . -B build-xdma \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_TESTS=ON \
            -DRTFW_BUILD_EXPERIMENTAL=OFF \
            -DRTFW_ENABLE_XDMA=ON \
            -DSIM_WERROR=ON
      - name: Build portable gate and qualification tool
        run: |
          cmake --build build-xdma \
            --config RelWithDebInfo \
            --target rtfw_xdma_backend_tests sample_xdma_qualification \
            --parallel 2
      - name: Run portable XDMA state-machine gate
        run: |
          ctest --test-dir build-xdma \
            -C RelWithDebInfo \
            --output-on-failure \
            -R xdma_backend
      - name: Install and consume the XDMA package component
        run: |
          cmake --build build-xdma \
            --config RelWithDebInfo \
            --parallel 2
          cmake --install build-xdma \
            --config RelWithDebInfo \
            --prefix "${RUNNER_TEMP}/rtfw-xdma"
          cmake \
            -S tests/package_consumer \
            -B build-xdma-consumer \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/rtfw-xdma" \
            -DRTFW_TEST_XDMA_LINUX=ON
          cmake --build build-xdma-consumer \
            --config RelWithDebInfo \
            --parallel 2
          ctest --test-dir build-xdma-consumer \
            -C RelWithDebInfo \
            --output-on-failure \
            -R installed_xdma_linux
      - name: Capture deployment identity
        env:
          RTFW_XDMA_PCI_BDF: ${{ inputs.pci_bdf }}
          RTFW_XDMA_H2C_PATH: ${{ inputs.h2c_path }}
          RTFW_XDMA_C2H_PATH: ${{ inputs.c2h_path }}
        run: |
          mkdir -p xdma-evidence
          {
            uname -a
            "${CXX:-c++}" --version
            modinfo xdma
            lspci -s "$RTFW_XDMA_PCI_BDF" -vv
            stat "$RTFW_XDMA_H2C_PATH" "$RTFW_XDMA_C2H_PATH"
          } > xdma-evidence/system.txt 2>&1
      - name: Capture raw functional and latency evidence
        env:
          RTFW_XDMA_PCI_BDF: ${{ inputs.pci_bdf }}
          RTFW_XDMA_DRIVER_ID: ${{ inputs.driver_id }}
          RTFW_XDMA_BITSTREAM_ID: ${{ inputs.bitstream_id }}
          RTFW_XDMA_H2C_PATH: ${{ inputs.h2c_path }}
          RTFW_XDMA_C2H_PATH: ${{ inputs.c2h_path }}
          RTFW_XDMA_DEVICE_OFFSET: ${{ inputs.device_offset }}
          RTFW_XDMA_BYTES: ${{ inputs.bytes }}
          RTFW_XDMA_WARMUP: ${{ inputs.warmup }}
          RTFW_XDMA_ITERATIONS: ${{ inputs.iterations }}
        run: |
          ./build-xdma/samples/sample_xdma_qualification \
            --pci-bdf "$RTFW_XDMA_PCI_BDF" \
            --driver-id "$RTFW_XDMA_DRIVER_ID" \
            --bitstream-id "$RTFW_XDMA_BITSTREAM_ID" \
            --h2c "$RTFW_XDMA_H2C_PATH" \
            --c2h "$RTFW_XDMA_C2H_PATH" \
            --device-offset "$RTFW_XDMA_DEVICE_OFFSET" \
            --bytes "$RTFW_XDMA_BYTES" \
            --warmup "$RTFW_XDMA_WARMUP" \
            --iterations "$RTFW_XDMA_ITERATIONS" \
            > xdma-evidence/xdma-qualification.json
      - name: Validate and bind raw evidence to source
        run: |
          python3 tools/check_hardware_evidence.py \
            --backend xdma \
            --evidence xdma-evidence/xdma-qualification.json \
            --version-file VERSION.txt
          python3 tools/release_manifest.py create \
            --artifact-dir xdma-evidence \
            --output xdma-evidence/evidence-manifest.json \
            --version-file VERSION.txt \
            --source-commit "${{ github.sha }}"
          python3 tools/release_manifest.py verify \
            --artifact-dir xdma-evidence \
            --manifest xdma-evidence/evidence-manifest.json \
            --version-file VERSION.txt
      - name: Upload raw evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xdma-qualification-${{ github.sha }}
          path: xdma-evidence/
          if-no-files-found: error
