name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  determinism-linux:
    name: Determinism (${{ matrix.compiler }}, FMA=${{ matrix.fma }})
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    env:
      BUILD_TYPE: RelWithDebInfo
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        fma: [ON, OFF]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Real-time hardening
        run: tools/rt_harden.sh
      - name: Set up compiler
        run: |
          if [ "${{matrix.compiler}}" = "clang" ]; then
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          else
            echo "CC=gcc" >> $GITHUB_ENV
            echo "CXX=g++" >> $GITHUB_ENV
          fi
      - name: Configure determinism tests
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DENABLE_TESTS=ON \
            -DENABLE_RAPIDCHECK=ON \
            -DSIM_ENABLE_AVX2=${{ matrix.fma }} \
            -DSIM_SANITIZERS= \
            -DSIM_WERROR=ON
      - name: Build determinism tests
        run: cmake --build build --config ${BUILD_TYPE} --target simcore_tests rtfw_determinism_artifact -- -j2
      - name: Run determinism tests
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          GTEST_DEATH_TEST_STYLE: threadsafe
          GTEST_FILTER: DeterminismIntegration.*:DeterminismReplay.*
        run: ctest --test-dir build -C ${BUILD_TYPE} --output-on-failure -R simcore_all
      - name: Produce M7 checkpoint artifact
        run: |
          build/tests/rtfw_determinism_artifact \
            "m7-${{ matrix.compiler }}-fma-${{ matrix.fma }}.rtcp"
      - name: Upload M7 checkpoint artifact
        uses: actions/upload-artifact@v4
        with:
          name: m7-checkpoint-${{ matrix.compiler }}-${{ matrix.fma }}
          path: m7-${{ matrix.compiler }}-fma-${{ matrix.fma }}.rtcp
          if-no-files-found: error

  determinism-artifact-exchange:
    name: Determinism artifact exchange
    needs: determinism-linux
    runs-on: ubuntu-22.04
    steps:
      - name: Download compiler artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: m7-checkpoint-*
          path: artifacts
          merge-multiple: true
      - name: Compare GCC, Clang, FMA-on, and FMA-off artifacts
        shell: bash
        run: |
          mapfile -t files < <(find artifacts -type f -name '*.rtcp' | sort)
          test "${#files[@]}" -eq 4
          baseline="${files[0]}"
          for artifact in "${files[@]:1}"; do
            cmp "$baseline" "$artifact"
          done
          sha256sum "${files[@]}"

  snapshot-fuzz-linux:
    name: Snapshot parser fuzz smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure snapshot fuzzer
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-fuzz \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_TESTS=ON \
            -DENABLE_RAPIDCHECK=OFF \
            -DSIM_BUILD_FUZZERS=ON \
            -DSIM_SANITIZERS= \
            -DSIM_WERROR=ON
      - name: Build snapshot fuzzer
        run: cmake --build build-fuzz --target snapshot_fuzz -- -j2
      - name: Run bounded snapshot fuzz corpus
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: build-fuzz/tests/snapshot_fuzz -runs=20000 -max_len=65536 -timeout=5

  build-linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, RelWithDebInfo]
        fma: [ON, OFF]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Real-time hardening
        run: tools/rt_harden.sh
      - name: Set up compiler
        run: |
          if [ "${{matrix.compiler}}" = "clang" ]; then
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          else
            echo "CC=gcc" >> $GITHUB_ENV
            echo "CXX=g++" >> $GITHUB_ENV
          fi
      - name: Configure
        run: |
          SANITIZERS=""
          if [ "${{ matrix.build_type }}" = "Debug" ]; then
            SANITIZERS="address;undefined"
          fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DENABLE_TESTS=ON \
            -DENABLE_RAPIDCHECK=ON \
            -DSIM_SANITIZERS="$SANITIZERS" \
            -DSIM_ENABLE_AVX2=${{ matrix.fma }} \
            -DSIM_WERROR=ON
      - name: Build
        run: cmake --build build --config ${{matrix.build_type}} -- -j2
      - name: Metrics schema check
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          GTEST_DEATH_TEST_STYLE: threadsafe
          GTEST_FILTER: MetricsJson.*
        run: ctest --test-dir build -C ${{matrix.build_type}} --output-on-failure -R simcore_all
      - name: Test
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          GTEST_DEATH_TEST_STYLE: threadsafe
        run: ctest --test-dir build -C ${{matrix.build_type}} --output-on-failure
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom-${{matrix.compiler}}-${{matrix.build_type}}-${{matrix.fma}}.spdx.json
          artifact-name: sbom-${{matrix.compiler}}-${{matrix.build_type}}-${{matrix.fma}}
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
        continue-on-error: true

  executor-tsan:
    name: Unified executor (GCC ThreadSanitizer)
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure executor ThreadSanitizer gate
        env:
          CC: gcc
          CXX: g++
        run: |
          cmake -S . -B build-tsan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_TESTS=ON \
            -DENABLE_RAPIDCHECK=OFF \
            -DSIM_SANITIZERS=thread \
            -DSIM_WERROR=ON
      - name: Build executor ThreadSanitizer gate
        run: cmake --build build-tsan --target simcore_tests -- -j2
      - name: Run executor ThreadSanitizer gate
        env:
          GTEST_FILTER: UnifiedExecutor.*:MemoryPlan.*:PeriodicRuntime.*:PlatformPreflight.*:Observability.*:DeterminismReplay.*
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-tsan --output-on-failure -R simcore_all

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: [Debug, RelWithDebInfo]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Real-time hardening
        run: powershell -ExecutionPolicy Bypass -File tools/rt_harden.ps1
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{matrix.build_type}} -DENABLE_TESTS=ON -DSIM_WERROR=ON
      - name: Build
        run: cmake --build build --config ${{matrix.build_type}} -- /m
      - name: Test
        run: ctest --test-dir build -C ${{matrix.build_type}} --output-on-failure
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom-windows-${{matrix.build_type}}.spdx.json
          artifact-name: sbom-windows-${{matrix.build_type}}
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
        continue-on-error: true

  embedding-release:
    name: C/C++ embedding smoke (${{ matrix.compiler }})
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Real-time hardening
        run: tools/rt_harden.sh
      - name: Set up compiler
        run: |
          if [ "${{matrix.compiler}}" = "clang" ]; then
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          else
            echo "CC=gcc" >> $GITHUB_ENV
            echo "CXX=g++" >> $GITHUB_ENV
          fi
      - name: Configure Release embedding sample
        run: |
          cmake -S . -B build-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTS=OFF \
            -DSIM_WERROR=ON
      - name: Build embedding samples
        run: cmake --build build-release --config Release --target sample_embed_c sample_embed_c_static sample_embed_cpp -- -j2
      - name: Run embedding samples
        working-directory: build-release
        run: |
          ./samples/sample_embed_c
          ./samples/sample_embed_c_static
          ./samples/sample_embed_cpp
