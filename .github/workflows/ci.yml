name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  determinism-linux:
    name: Determinism (${{ matrix.compiler }}, FMA=${{ matrix.fma }})
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    env:
      BUILD_TYPE: RelWithDebInfo
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        fma: [ON, OFF]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Real-time hardening
        run: tools/rt_harden.sh
      - name: Set up compiler
        run: |
          if [ "${{matrix.compiler}}" = "clang" ]; then
            echo "CC=clang-14" >> "$GITHUB_ENV"
            echo "CXX=clang++-14" >> "$GITHUB_ENV"
            clang++-14 --version
          else
            echo "CC=gcc-11" >> "$GITHUB_ENV"
            echo "CXX=g++-11" >> "$GITHUB_ENV"
            g++-11 --version
          fi
      - name: Configure determinism tests
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DENABLE_TESTS=ON \
            -DRTFW_BUILD_EXPERIMENTAL=ON \
            -DENABLE_RAPIDCHECK=ON \
            -DSIM_ENABLE_AVX2=${{ matrix.fma }} \
            -DSIM_SANITIZERS= \
            -DSIM_WERROR=ON
      - name: Build determinism tests
        run: cmake --build build --config ${BUILD_TYPE} --target simcore_tests rtfw_determinism_artifact -- -j2
      - name: Run determinism tests
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          GTEST_DEATH_TEST_STYLE: threadsafe
          GTEST_FILTER: DeterminismIntegration.*:DeterminismReplay.*
        run: ctest --test-dir build -C ${BUILD_TYPE} --output-on-failure -R simcore_all
      - name: Produce M7 checkpoint artifact
        run: |
          build/tests/rtfw_determinism_artifact \
            "m7-${{ matrix.compiler }}-fma-${{ matrix.fma }}.rtcp"
      - name: Upload M7 checkpoint artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m7-checkpoint-${{ matrix.compiler }}-${{ matrix.fma }}
          path: m7-${{ matrix.compiler }}-fma-${{ matrix.fma }}.rtcp
          if-no-files-found: error

  determinism-artifact-exchange:
    name: Determinism artifact exchange
    needs: determinism-linux
    runs-on: ubuntu-22.04
    steps:
      - name: Download compiler artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: m7-checkpoint-*
          path: artifacts
          merge-multiple: true
      - name: Compare GCC, Clang, FMA-on, and FMA-off artifacts
        shell: bash
        run: |
          mapfile -t files < <(find artifacts -type f -name '*.rtcp' | sort)
          test "${#files[@]}" -eq 4
          baseline="${files[0]}"
          for artifact in "${files[@]:1}"; do
            cmp "$baseline" "$artifact"
          done
          sha256sum "${files[@]}"

  snapshot-fuzz-linux:
    name: Snapshot parser fuzz smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Configure snapshot fuzzer
        env:
          CC: clang-14
          CXX: clang++-14
        run: |
          cmake -S . -B build-fuzz \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_TESTS=ON \
            -DRTFW_BUILD_EXPERIMENTAL=ON \
            -DENABLE_RAPIDCHECK=OFF \
            -DSIM_BUILD_FUZZERS=ON \
            -DSIM_SANITIZERS= \
            -DSIM_WERROR=ON
      - name: Build snapshot fuzzer
        run: cmake --build build-fuzz --target snapshot_fuzz -- -j2
      - name: Run bounded snapshot fuzz corpus
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: build-fuzz/tests/snapshot_fuzz -runs=20000 -max_len=65536 -timeout=5

  build-linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, RelWithDebInfo]
        fma: [ON, OFF]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Real-time hardening
        run: tools/rt_harden.sh
      - name: Set up compiler
        run: |
          if [ "${{matrix.compiler}}" = "clang" ]; then
            echo "CC=clang-14" >> "$GITHUB_ENV"
            echo "CXX=clang++-14" >> "$GITHUB_ENV"
            clang++-14 --version
          else
            echo "CC=gcc-11" >> "$GITHUB_ENV"
            echo "CXX=g++-11" >> "$GITHUB_ENV"
            g++-11 --version
          fi
      - name: Configure
        run: |
          SANITIZERS=""
          if [ "${{ matrix.build_type }}" = "Debug" ]; then
            SANITIZERS="address;undefined"
          fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DENABLE_TESTS=ON \
            -DRTFW_BUILD_EXPERIMENTAL=ON \
            -DENABLE_RAPIDCHECK=ON \
            -DSIM_SANITIZERS="$SANITIZERS" \
            -DSIM_ENABLE_AVX2=${{ matrix.fma }} \
            -DSIM_WERROR=ON
      - name: Build
        run: cmake --build build --config ${{matrix.build_type}} -- -j2
      - name: Metrics schema check
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          GTEST_DEATH_TEST_STYLE: threadsafe
          GTEST_FILTER: MetricsJson.*
        run: ctest --test-dir build -C ${{matrix.build_type}} --output-on-failure -R simcore_all
      - name: CrossInstanceDeviceStateIsIsolated
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          GTEST_DEATH_TEST_STYLE: threadsafe
          GTEST_FILTER: DeviceRuntime.CrossInstanceDeviceStateIsIsolated
        run: ctest --test-dir build -C ${{matrix.build_type}} --output-on-failure -R simcore_all
      - name: Test
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          GTEST_DEATH_TEST_STYLE: threadsafe
        run: ctest --test-dir build -C ${{matrix.build_type}} --output-on-failure
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: sbom-${{matrix.compiler}}-${{matrix.build_type}}-${{matrix.fma}}.spdx.json
          artifact-name: sbom-${{matrix.compiler}}-${{matrix.build_type}}-${{matrix.fma}}
      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        if: github.event_name == 'pull_request'
        continue-on-error: true

  executor-tsan:
    name: Unified executor (GCC ThreadSanitizer)
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Configure executor ThreadSanitizer gate
        env:
          CC: gcc-11
          CXX: g++-11
        run: |
          cmake -S . -B build-tsan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_TESTS=ON \
            -DRTFW_BUILD_EXPERIMENTAL=ON \
            -DENABLE_RAPIDCHECK=OFF \
            -DSIM_SANITIZERS=thread \
            -DSIM_WERROR=ON
      - name: Build executor ThreadSanitizer gate
        run: |
          cmake --build build-tsan \
            --target simcore_tests rtfw_thread_policy_rollback_test \
                     rtfw_host_adapter_tests \
                     rtfw_xdma_backend_tests \
            -- -j2
      - name: Run executor ThreadSanitizer gate
        env:
          GTEST_FILTER: UnifiedExecutor.*:CrossRateData.*:RateTimeline.*:RateDispatch.*:RateShedding.*:RateTelemetry.*:CompiledGraph.*Rate*:HostRuntime.*Rate*:TraceNoAlloc.*Rate*:MemoryPolicy.*:ThreadPolicy.*:CpuMemoryPolicy.*:MemoryPlan.*:PeriodicRuntime.*:PlatformPreflight.*:Observability.*:DeterminismReplay.*:HalV2.*:DeviceRuntime.*:DeviceMock.*:CudaBackend.*-ThreadPolicy.StrictFailuresRollbackWithoutCallbacksAndCanRecover:ThreadPolicy.LinuxAppliesAndReadsBackAvailableNativeFields
          TSAN_OPTIONS: halt_on_error=1
        run: |
          ctest --test-dir build-tsan \
            --output-on-failure \
            -R 'simcore_all|m15_accounting_closure|m15_stack_lifecycle|m15_cross_category_rollback|m16_rate_timeline|m16_rate_dispatch|m16_shedding_telemetry|m16_cross_rate_data|m17_hal_v2_compatibility|thread_policy_rollback|thread_policy_recovery|host_adapter|xdma_backend'

  build-windows:
    runs-on: windows-2022
    strategy:
      matrix:
        build_type: [Debug, RelWithDebInfo]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Real-time hardening
        run: powershell -ExecutionPolicy Bypass -File tools/rt_harden.ps1
      - name: Configure
        run: cmake -S . -B build -A x64 -T v143 -DCMAKE_BUILD_TYPE=${{matrix.build_type}} -DENABLE_TESTS=ON -DRTFW_BUILD_EXPERIMENTAL=ON -DSIM_WERROR=ON
      - name: Build
        run: cmake --build build --config ${{matrix.build_type}} -- /m
      - name: Test
        run: ctest --test-dir build -C ${{matrix.build_type}} --output-on-failure
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: sbom-windows-${{matrix.build_type}}.spdx.json
          artifact-name: sbom-windows-${{matrix.build_type}}
      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        if: github.event_name == 'pull_request'
        continue-on-error: true

  embedding-release:
    name: C/C++ embedding smoke (${{ matrix.compiler }})
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Real-time hardening
        run: tools/rt_harden.sh
      - name: Set up compiler
        run: |
          if [ "${{matrix.compiler}}" = "clang" ]; then
            echo "CC=clang-14" >> "$GITHUB_ENV"
            echo "CXX=clang++-14" >> "$GITHUB_ENV"
            clang++-14 --version
          else
            echo "CC=gcc-11" >> "$GITHUB_ENV"
            echo "CXX=g++-11" >> "$GITHUB_ENV"
            g++-11 --version
          fi
      - name: Configure Release embedding sample
        run: |
          cmake -S . -B build-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTS=OFF \
            -DRTFW_BUILD_EXPERIMENTAL=OFF \
            -DSIM_WERROR=ON
      - name: Build embedding samples
        run: cmake --build build-release --config Release --target sample_embed_c sample_embed_c_static sample_embed_cpp -- -j2
      - name: Run embedding samples
        working-directory: build-release
        run: |
          ./samples/sample_embed_c
          ./samples/sample_embed_c_static
          ./samples/sample_embed_cpp
      - name: Configure add_subdirectory consumer
        run: >
          cmake
          -S tests/add_subdirectory_consumer
          -B build-add-subdirectory
          -DCMAKE_BUILD_TYPE=Release
          -DRTFW_SOURCE_DIR="${GITHUB_WORKSPACE}"
      - name: Build and run add_subdirectory consumer
        run: |
          cmake --build build-add-subdirectory --parallel 2
          ./build-add-subdirectory/rtfw_add_subdirectory_consumer
      - name: Configure explicit add_subdirectory test opt-in
        run: >
          cmake
          -S tests/add_subdirectory_consumer
          -B build-add-subdirectory-tests
          -DCMAKE_BUILD_TYPE=Release
          -DRTFW_SOURCE_DIR="${GITHUB_WORKSPACE}"
          -DRTFW_BUILD_TESTS=ON
          -DRTFW_EXPECT_TESTS=ON
          -DSIM_DOWNLOAD_GTEST=OFF
      - name: Build and run embedded non-GTest suite
        run: |
          cmake \
            --build build-add-subdirectory-tests \
            --target \
              rtfw_add_subdirectory_consumer \
              test_cabi_dlopen \
              rtfw_host_adapter_tests \
              rtfw_runtime_profile_tests \
              rtfw_xdma_backend_tests \
            --parallel 2
          ctest \
            --test-dir build-add-subdirectory-tests/rtfw-build \
            --output-on-failure \
            -R '^(cabi_dlopen|host_adapter|runtime_profile|xdma_backend)$'

  installed-package:
    name: Relocated package consumer (${{ matrix.tuple }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            tuple: ubuntu-22.04-x86_64-gcc-11
            cc: gcc-11
            cxx: g++-11
            cmake_args: ""
            generator: TGZ
          - os: ubuntu-22.04
            tuple: ubuntu-22.04-x86_64-clang-14
            cc: clang-14
            cxx: clang++-14
            cmake_args: ""
            generator: TGZ
          - os: windows-2022
            tuple: windows-server-2022-x86_64-msvc-v143
            cmake_args: "-A x64 -T v143"
            generator: ZIP
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Select declared Linux compiler
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"
          "${{ matrix.cxx }}" --version
      - name: Verify portable release contract
        run: python tools/check_release_contract.py
      - name: Verify frozen C ABI manifest
        run: python tools/check_c_abi.py
      - name: Configure package build
        run: >
          cmake -S . -B build-package
          -DCMAKE_BUILD_TYPE=Release
          -DENABLE_TESTS=OFF
          -DRTFW_BUILD_EXPERIMENTAL=OFF
          -DSIM_WERROR=ON
          ${{ matrix.cmake_args }}
      - name: Build package
        run: cmake --build build-package --config Release --parallel 2
      - name: Build release archive
        run: >
          cpack --config build-package/CPackConfig.cmake
          -C Release
          -G ${{ matrix.generator }}
          -B cpack-output
      - name: Stage verified release archive
        run: >
          python tools/stage_release_artifacts.py
          --cpack-dir cpack-output
          --artifact-dir release-artifacts
          --generator ${{ matrix.generator }}
          --version-file VERSION.txt
      - name: Create release manifest
        run: >
          python tools/release_manifest.py create
          --artifact-dir release-artifacts
          --output release-artifacts/rtfw-release-manifest.json
          --version-file VERSION.txt
          --source-commit "${{ github.sha }}"
      - name: Verify release manifest
        run: >
          python tools/release_manifest.py verify
          --artifact-dir release-artifacts
          --manifest release-artifacts/rtfw-release-manifest.json
          --version-file VERSION.txt
      - name: Verify shared-library exports
        if: runner.os == 'Linux'
        run: python tools/check_c_abi.py --library build-package/librtfw.so
      - name: Extract verified archive to relocated prefix
        run: >
          python tools/extract_release_archive.py
          --artifact-dir release-artifacts
          --destination "${{ runner.temp }}/rtfw-relocated"
      - name: Configure clean external consumer
        run: >
          cmake -S tests/package_consumer -B build-consumer
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ runner.temp }}/rtfw-relocated"
          ${{ matrix.cmake_args }}
      - name: Build clean external consumer
        run: cmake --build build-consumer --config Release --parallel 2
      - name: Run clean external consumer
        run: >
          ctest --test-dir build-consumer
          -C Release
          --output-on-failure
      - name: Configure package with a non-default include directory
        if: runner.os == 'Linux'
        run: >
          cmake -S . -B build-custom-layout
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/rtfw-custom-layout"
          -DCMAKE_INSTALL_INCLUDEDIR=sdk/include
          -DCMAKE_INSTALL_DATADIR=sdk/data
          -DENABLE_TESTS=OFF
          -DRTFW_BUILD_EXPERIMENTAL=OFF
          -DRTFW_BUILD_EXAMPLES=OFF
          -DRTFW_BUILD_RUNTIME_DEMO=OFF
          -DSIM_WERROR=ON
      - name: Install package with a non-default include directory
        if: runner.os == 'Linux'
        run: >
          cmake --build build-custom-layout
          --config Release
          --target install
          --parallel 2
      - name: Consume package with a non-default include directory
        if: runner.os == 'Linux'
        run: |
          cmake \
            -S tests/package_consumer \
            -B build-custom-layout-consumer \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ runner.temp }}/rtfw-custom-layout"
          cmake --build build-custom-layout-consumer --config Release --parallel 2
          ctest \
            --test-dir build-custom-layout-consumer \
            -C Release \
            --output-on-failure
