name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  determinism-linux:
    name: Determinism (${{ matrix.compiler }}, FMA=${{ matrix.fma }})
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    env:
      BUILD_TYPE: RelWithDebInfo
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        fma: [ON, OFF]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Real-time hardening
        run: tools/rt_harden.sh
      - name: Set up compiler
        run: |
          if [ "${{matrix.compiler}}" = "clang" ]; then
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          else
            echo "CC=gcc" >> $GITHUB_ENV
            echo "CXX=g++" >> $GITHUB_ENV
          fi
      - name: Configure determinism tests
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DENABLE_TESTS=ON \
            -DENABLE_RAPIDCHECK=ON \
            -DSIM_ENABLE_AVX2=${{ matrix.fma }} \
            -DSIM_SANITIZERS= \
            -DSIM_WERROR=ON
      - name: Build determinism tests
        run: cmake --build build --config ${BUILD_TYPE} --target simcore_tests -- -j2
      - name: Run determinism tests
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          GTEST_DEATH_TEST_STYLE: threadsafe
          GTEST_FILTER: DeterminismIntegration.*
        run: ctest --test-dir build -C ${BUILD_TYPE} --output-on-failure -R simcore_all

  build-linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, RelWithDebInfo]
        fma: [ON, OFF]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Real-time hardening
        run: tools/rt_harden.sh
      - name: Set up compiler
        run: |
          if [ "${{matrix.compiler}}" = "clang" ]; then
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          else
            echo "CC=gcc" >> $GITHUB_ENV
            echo "CXX=g++" >> $GITHUB_ENV
          fi
      - name: Configure
        run: |
          SANITIZERS=""
          if [ "${{ matrix.build_type }}" = "Debug" ]; then
            SANITIZERS="address;undefined"
          fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DENABLE_TESTS=ON \
            -DENABLE_RAPIDCHECK=ON \
            -DSIM_SANITIZERS="$SANITIZERS" \
            -DSIM_ENABLE_AVX2=${{ matrix.fma }} \
            -DSIM_WERROR=ON
      - name: Build
        run: cmake --build build --config ${{matrix.build_type}} -- -j2
      - name: Metrics schema check
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          GTEST_DEATH_TEST_STYLE: threadsafe
          GTEST_FILTER: MetricsJson.*
        run: ctest --test-dir build -C ${{matrix.build_type}} --output-on-failure -R simcore_all
      - name: Test
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          GTEST_DEATH_TEST_STYLE: threadsafe
        run: ctest --test-dir build -C ${{matrix.build_type}} --output-on-failure
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom-${{matrix.compiler}}-${{matrix.build_type}}-${{matrix.fma}}.spdx.json
          artifact-name: sbom-${{matrix.compiler}}-${{matrix.build_type}}-${{matrix.fma}}
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
        continue-on-error: true

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: [Debug, RelWithDebInfo]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Real-time hardening
        run: powershell -ExecutionPolicy Bypass -File tools/rt_harden.ps1
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{matrix.build_type}} -DENABLE_TESTS=ON -DSIM_WERROR=ON
      - name: Build
        run: cmake --build build --config ${{matrix.build_type}} -- /m
      - name: Test
        run: ctest --test-dir build -C ${{matrix.build_type}} --output-on-failure
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom-windows-${{matrix.build_type}}.spdx.json
          artifact-name: sbom-windows-${{matrix.build_type}}
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
        continue-on-error: true

  cabi-release:
    name: C ABI smoke (${{ matrix.compiler }})
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Real-time hardening
        run: tools/rt_harden.sh
      - name: Set up compiler
        run: |
          if [ "${{matrix.compiler}}" = "clang" ]; then
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          else
            echo "CC=gcc" >> $GITHUB_ENV
            echo "CXX=g++" >> $GITHUB_ENV
          fi
      - name: Configure Release embedding sample
        run: |
          cmake -S . -B build-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTS=OFF \
            -DSIM_WERROR=ON
      - name: Build embedding sample
        run: cmake --build build-release --config Release --target sample_embed_c -- -j2
      - name: Run embedding sample
        working-directory: build-release
        run: ./samples/sample_embed_c

  defaults-smoke:
    name: Default profiles smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Real-time hardening
        run: tools/rt_harden.sh
      - name: Configure demo
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_TESTS=OFF \
            -DSIM_WERROR=ON
      - name: Build demo
        run: cmake --build build --config RelWithDebInfo --target simcore_app -- -j2
      - name: Validate default profiles
        run: python3 tools/ci/check_defaults.py
