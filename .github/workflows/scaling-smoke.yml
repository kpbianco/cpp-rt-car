name: Scaling smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scaling-smoke:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSIM_WERROR=ON \
            -DENABLE_TESTS=OFF \
            -DRTFW_BUILD_EXPERIMENTAL=ON \
            -DSIM_DOWNLOAD_GTEST=OFF
      - name: Build rtfw_demo
        run: cmake --build build --config RelWithDebInfo --target simcore_app -- -j2
      - name: Run scaling smoke
        run: |
          python tools/scaling/run_scaling.py \
            --threads 1,2 \
            --smt off \
            --out-dir out/scaling_smoke
      - name: Validate scaling artifacts
        run: python tools/scaling/validate_scaling_artifacts.py --in out/scaling_smoke
      - name: Upload scaling artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scaling-smoke
          path: out/scaling_smoke
