name: Documentation contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs-contract:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Validate static contract
        run: python3 tools/check_docs_contract.py
      - name: Validate portable release contract
        run: python3 tools/check_release_contract.py
      - name: Test release tooling
        run: python3 tests/test_release_tools.py
      - name: Run README quick start
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_TESTS=ON -DSIM_WERROR=OFF
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          ./build/rtfw_demo --threads 2 --metrics-json
          ./build/rtfw_runtime_demo --config configs/default_safe.json --run 20ms --rt --metrics-json-interval
      - name: Validate demo CLI
        run: |
          test "$(./build/rtfw_demo --version)" = "$(cat VERSION.txt)"
          if ./build/rtfw_demo --definitely-not-an-option; then
            echo "unknown option was accepted" >&2
            exit 1
          fi
          test "$(./build/rtfw_runtime_demo --version)" = "$(cat VERSION.txt)"
          if ./build/rtfw_runtime_demo --definitely-not-an-option; then
            echo "runtime demo accepted an unknown option" >&2
            exit 1
          fi
