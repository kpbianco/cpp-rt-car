name: Portable source snapshot

on:
  push:
    branches: [agent/portable-software-completion]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Record exact source and dependency identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rtfw-source-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/rtfw-source-evidence/source-commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/rtfw-source-evidence/source-tree.txt"
          git submodule status --recursive > "$RUNNER_TEMP/rtfw-source-evidence/submodules.txt"
          # No .git directories, credentials, build products, or runner state.
          tar --exclude=.git -czf "$RUNNER_TEMP/rtfw-source-evidence/source.tar.gz" .
          cd "$RUNNER_TEMP/rtfw-source-evidence"
          sha256sum source.tar.gz > source.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-source-${{ github.sha }}
          path: ${{ runner.temp }}/rtfw-source-evidence/
          if-no-files-found: error
          retention-days: 7
