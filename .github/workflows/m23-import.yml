name: M23 exact source import
on:
  push:
    branches: [agent/m23-01-delivery-remediation]
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Import pinned source tree and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/agent/m23-01-delivery-remediation
          python3 - <<'PYIMPORT'
          import hashlib,json,lzma,os,pathlib,subprocess
          BASE='290397e86b65136c5479f7b1d69c961f73f8ac14'
          TREE='1467491d8d0baae343064035e5fd86250bba0ebc'
          DIGEST='09d47c89074219cd1d135ae0bb957d7bcd559dad24c50465ecd4fd8551f53ac7'
          HELPERS=['.github/workflows/m23-import.yml']+[f'.m23-import/part{i}.xz' for i in range(1,5)]
          def git(*a): return subprocess.check_output(['git',*a])
          assert git('rev-parse','HEAD^').decode().strip()==BASE
          assert set(git('diff','--name-only',BASE,'HEAD').decode().splitlines())==set(HELPERS)
          packed=b''.join(pathlib.Path(p).read_bytes() for p in HELPERS[1:])
          assert len(packed)==40968 and hashlib.sha256(packed).hexdigest()==DIGEST
          z=lzma.LZMADecompressor(format=lzma.FORMAT_XZ,memlimit=256*1024*1024)
          raw=z.decompress(packed,max_length=1024*1024)
          assert z.eof and not z.unused_data and len(raw)==169275
          manifest=json.loads(raw)
          assert set(manifest)=={'base','tree','records'} and manifest['base']==BASE and manifest['tree']==TREE
          assert type(manifest['records']) is list and len(manifest['records'])==39
          seen=set()
          for record in manifest['records']:
              assert set(record)=={'path','mode','edits'}
              name=record['path']; p=pathlib.PurePosixPath(name)
              assert isinstance(name,str) and 0<len(name)<256 and name==str(p) and not p.is_absolute()
              assert not set(p.parts)&{'.','..','.git','.m23-import'} and name not in HELPERS and name not in seen
              assert record['mode'] in ('100644','100755')
              seen.add(name)
              # Read only the pinned baseline; no fetched code or payload is executed.
              result=subprocess.run(['git','show',BASE+':'+name],capture_output=True)
              if result.returncode:
                  assert not pathlib.Path(name).exists()
                  before=[]
              else:
                  before=result.stdout.decode('utf-8').splitlines(keepends=True)
              out=[];cursor=0
              assert type(record['edits']) is list and len(record['edits'])<=1000
              for edit in record['edits']:
                  assert type(edit) is list and len(edit)==3
                  start,end,text=edit
                  assert type(start) is int and type(end) is int and cursor<=start<=end<=len(before)
                  assert isinstance(text,str) and len(text)<=1024*1024
                  out.extend(before[cursor:start]);out.append(text);cursor=end
              out.extend(before[cursor:])
              destination=pathlib.Path(name)
              assert not destination.is_symlink() and not any(parent.is_symlink() for parent in destination.parents)
              destination.parent.mkdir(parents=True,exist_ok=True)
              destination.write_bytes(''.join(out).encode('utf-8'))
              destination.chmod(0o755 if record['mode']=='100755' else 0o644)
          subprocess.run(['git','add','--',*sorted(seen)],check=True)
          subprocess.run(['git','rm','--',*HELPERS],check=True)
          actual=git('write-tree').decode().strip()
          assert actual==TREE,(actual,TREE)
          assert set(git('diff','--cached','--name-only',BASE).decode().splitlines())==seen
          print('Verified 39-file source tree:',actual)
          PYIMPORT
          git config user.name 'Kian Bianco'
          git config user.email '52121367+kpbianco@users.noreply.github.com'
          git commit -m 'M23-01: restore tested benchmark implementation and integration'
          test "$(git ls-remote origin refs/heads/agent/m23-01-delivery-remediation | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/agent/m23-01-delivery-remediation
