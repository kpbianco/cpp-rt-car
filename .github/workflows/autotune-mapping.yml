name: AT-MAP5

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  autotune-mapping:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'

      - name: Run autotune mapping self-test
        run: |
          python tools/autotune/make_config.py --self-test
          python tools/autotune/mapping_smoke.py

      - name: Build profile-driven runtime demo
        run: |
          cmake -S . -B build -DENABLE_TESTS=OFF -DRTFW_BUILD_EXPERIMENTAL=OFF -DSIM_WERROR=ON
          cmake --build build --parallel 2 --target rtfw_runtime_demo

      - name: Exercise generated profile through the C++ loader
        run: python tools/autotune/mapping_smoke.py --demo build/rtfw_runtime_demo
