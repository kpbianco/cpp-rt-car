# Production profile search space. Every factor below maps to a supported,
# public rt::RuntimeConfig field and is consumed by rtfw_runtime_demo.
app:
  path: "../../build/rtfw_runtime_demo"
  warmup_sec: 2
  run_sec: 5
  frame_budget_ms: 1.0
  extra_args:
    - "--rt"

scenarios:
  - name: "base"
    description: "Four independent CPU physics systems followed by a dependency barrier."

robustness:
  seeds:
    - 101
    - 202
    - 303
  scenarios:
    - "base"
  seed_arg: "--seed"

metrics:
  hard_constraints:
    missed_frames: "== 0"
    watchdog_trips: "== 0"
    trace_events_dropped: "== 0"
  objective:
    expr: "p99_frame_ms / frame_budget_ms"
    tiebreakers:
      - "p95_frame_ms / frame_budget_ms"
      - "stdev_frame_ms"
      - "queue_rejections"
    maximize: false

params:
  worker_count:
    type: "int"
    values:
      - 1
      - 2
      - 4
  executor_policy:
    type: "categorical"
    values:
      - "static_deterministic"
      - "bounded_throughput"
  executor_queue_capacity:
    type: "int"
    values:
      - 128
      - 512
      - 1024
